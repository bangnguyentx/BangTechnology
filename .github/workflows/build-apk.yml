                      val contentBox = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(13), dp(12), dp(13), dp(13))
                      }

                      // 1. Tiêu đề: ✨ MAGIC GAME SPACE + Nút ✕ (Giống hệt ảnh)
