              </button>
            </header>

            <!-- ================= TAB 0: HỆ THỐNG & LÁ CHẮN ANTI-OTG ================= -->
            <main id="tab-0" class="tab-view active">
              <!-- Khối Telemetry Workbench phẳng (Thay thế hoàn toàn thẻ màu cam cũ) -->
              <section class="obsidian-glass">
                <div class="section-head-row">
                  <div>
                    <div class="section-title">Trạng thái phần cứng thời gian thực</div>
                    <div class="section-caption" id="cardAdbSub">Chạm Ghép nối 6 số để mở quyền UID 2000</div>
                  </div>
                  <button class="spec-badge press-phys" style="background:rgba(56,189,248,0.16); border-color:rgba(56,189,248,0.4); color:#38BDF8; padding:5px 10px;" onclick="cleanRamNow()">
                    Dọn RAM ngay
                  </button>
