name: Build BangOptimize v14.0 All-In-One APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Clean & Generate BangOptimize v14.0 All-In-One Project
        shell: bash
        run: |
          set -e
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/bangtech/optimize
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-anydpi-v26

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BangOptimize"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. app/build.gradle.kts (Hỗ trợ đầy đủ từ Android 7.0 đến Android 15/16)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bangtech.optimize"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.bangtech.optimize"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 140
                  versionName = "14.0 All-In-One"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          # 5. Icon "Bình Công Nghệ" (Technology Reactor Adaptive Icon)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#07090E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0C1220" android:pathData="M8,8h92v92h-92z"/>
              <path android:strokeColor="#1E293B" android:strokeWidth="1" android:pathData="M0,27L108,27M0,54L108,54M0,81L108,81M27,0L27,108M54,0L54,108M81,0L81,108"/>
              <path android:strokeColor="#38BDF8" android:strokeAlpha="0.4" android:strokeWidth="2" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#10B981" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M34,42 H25 V66 H34" />
              <path android:fillColor="#00000000" android:strokeColor="#38BDF8" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M74,42 H83 V66 H74" />
              <path android:fillColor="#1E293B" android:strokeColor="#64748B" android:strokeWidth="1.5"
                  android:pathData="M36,74 H72 L75,82 H33 Z" />
              <path android:fillColor="#0F293A" android:strokeColor="#38BDF8" android:strokeWidth="2.4"
                  android:pathData="M36,38 H72 V74 H36 Z" />
              <path android:fillColor="#10B981" android:fillAlpha="0.28"
                  android:pathData="M40,42 H68 V70 H40 Z" />
              <path android:fillColor="#091520" android:strokeColor="#34D399" android:strokeWidth="2.2"
                  android:pathData="M44,56 A10,10 0 1,0 64,56 A10,10 0 1,0 44,56 Z" />
              <path android:fillColor="#F8FAFC"
                  android:pathData="M55.5,48 L49,56.5 H54 L52.5,64 L59.5,55 H54.5 Z" />
              <path android:fillColor="#334155" android:strokeColor="#94A3B8" android:strokeWidth="1.6"
                  android:pathData="M34,38 C34,31 74,31 74,38 Z" />
              <path android:fillColor="#1E293B" android:strokeColor="#38BDF8" android:strokeWidth="1.8"
                  android:pathData="M44,24 H64 V32 H44 Z" />
              <path android:fillColor="#38BDF8" android:pathData="M48,27 h3 v2.5 h-3 z M57,27 h3 v2.5 h-3 z" />
          </vector>
          EOF

          cp app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher.xml

          cat << 'EOF' > app/src/main/res/drawable-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. AndroidManifest.xml (Tương thích 100% Redmi 15, Redmi 13C, HyperOS 2.0, OneUI, OriginOS)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="BangOptimize"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RealtimeRamService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="BangOptimize v14.0 Realtime RAM" />
                  </service>

                  <receiver
                      android:name=".PairingBroadcastReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.bangtech.optimize.ACTION_PAIR_INPUT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 7. EmbeddedAdbEngine.kt (Kết nối Socket nội bộ Offline + Ẩn ADB/Developer Options cho VNeID & Ngân hàng)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/EmbeddedAdbEngine.kt
          package com.bangtech.optimize

          import android.content.Context
          import android.net.nsd.NsdManager
          import android.net.nsd.NsdServiceInfo
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.Socket

          object EmbeddedAdbEngine {
              @Volatile
              var isPairedAndConnected: Boolean = false
              @Volatile
              var isStealthVneidActive: Boolean = false
              @Volatile
              var detectedPairingPort: Int = 0
              @Volatile
              var detectedConnectPort: Int = 0
              @Volatile
              var connectionModeLabel: String = "Chưa kết nối"

              private var nsdManager: NsdManager? = null
              private var pairingDiscoveryListener: NsdManager.DiscoveryListener? = null
              private var connectDiscoveryListener: NsdManager.DiscoveryListener? = null

              fun initEngine(context: Context, onStatusChanged: () -> Unit) {
                  try {
                      val prefs = context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE)
                      isPairedAndConnected = prefs.getBoolean("paired_ready", false)
                      isStealthVneidActive = prefs.getBoolean("stealth_vneid", false)
                      detectedConnectPort = prefs.getInt("last_connect_port", 5555)
                      if (isPairedAndConnected) {
                          connectionModeLabel = "Đã kết nối Socket nội bộ (Offline)"
                      }
                      startMdnsPortScanner(context, onStatusChanged)
                  } catch (_: Throwable) {}
              }

              fun runSafeGraphicRescue(): String {
                  val rescueScript = "settings delete global angle_gl_driver_all_angle; settings delete global angle_gl_driver_selection_pkgs; settings delete global angle_gl_driver_selection_values; settings delete global cached_apps_freezer; settings put global bluetooth_on 1"
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", rescueScript))
                      process.waitFor()
                      "Đã khôi phục trình dựng hình an toàn!"
                  } catch (_: Throwable) {
                      "Lá chắn bảo vệ đang bật"
                  }
              }

              fun setStealthHideAdbForVneid(context: Context, enableStealth: Boolean): String {
                  isStealthVneidActive = enableStealth
                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE)
                      .edit().putBoolean("stealth_vneid", enableStealth).apply()
                  val cmd = if (enableStealth) {
                      "settings put global adb_enabled 0; settings put global development_settings_enabled 0"
                  } else {
                      "settings put global development_settings_enabled 1; settings put global adb_enabled 1"
                  }
                  executeShell(cmd)
                  return if (enableStealth) {
                      "Đã ẩn trạng thái ADB & Tùy chọn nhà phát triển (Mở VNeID & Ngân hàng thoải mái)"
                  } else {
                      "Đã hiện lại Tùy chọn nhà phát triển"
                  }
              }

              fun startMdnsPortScanner(context: Context, onStatusChanged: () -> Unit) {
                  try {
                      nsdManager = context.getSystemService(Context.NSD_SERVICE) as? NsdManager
                      stopMdnsScanner()

                      pairingDiscoveryListener = object : NsdManager.DiscoveryListener {
                          override fun onDiscoveryStarted(regType: String?) {}
                          override fun onServiceFound(service: NsdServiceInfo?) {
                              if (service == null) return
                              try {
                                  nsdManager?.resolveService(service, object : NsdManager.ResolveListener {
                                      override fun onResolveFailed(serviceInfo: NsdServiceInfo?, errorCode: Int) {}
                                      override fun onServiceResolved(resolved: NsdServiceInfo?) {
                                          resolved?.port?.let { p ->
                                              if (p > 0) {
                                                  detectedPairingPort = p
                                                  onStatusChanged()
                                              }
                                          }
                                      }
                                  })
                              } catch (_: Throwable) {}
                          }
                          override fun onServiceLost(service: NsdServiceInfo?) {}
                          override fun onDiscoveryStopped(serviceType: String?) {}
                          override fun onStartDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                          override fun onStopDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                      }
                      nsdManager?.discoverServices("_adb-tls-pairing._tcp.", NsdManager.PROTOCOL_DNS_SD, pairingDiscoveryListener)

                      connectDiscoveryListener = object : NsdManager.DiscoveryListener {
                          override fun onDiscoveryStarted(regType: String?) {}
                          override fun onServiceFound(service: NsdServiceInfo?) {
                              if (service == null) return
                              try {
                                  nsdManager?.resolveService(service, object : NsdManager.ResolveListener {
                                      override fun onResolveFailed(serviceInfo: NsdServiceInfo?, errorCode: Int) {}
                                      override fun onServiceResolved(resolved: NsdServiceInfo?) {
                                          resolved?.port?.let { p ->
                                              if (p > 0) {
                                                  detectedConnectPort = p
                                                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE)
                                                      .edit().putInt("last_connect_port", p).apply()
                                                  onStatusChanged()
                                              }
                                          }
                                      }
                                  })
                              } catch (_: Throwable) {}
                          }
                          override fun onServiceLost(service: NsdServiceInfo?) {}
                          override fun onDiscoveryStopped(serviceType: String?) {}
                          override fun onStartDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                          override fun onStopDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                      }
                      nsdManager?.discoverServices("_adb-tls-connect._tcp.", NsdManager.PROTOCOL_DNS_SD, connectDiscoveryListener)
                  } catch (_: Throwable) {}
              }

              fun stopMdnsScanner() {
                  try {
                      pairingDiscoveryListener?.let { nsdManager?.stopServiceDiscovery(it) }
                  } catch (_: Throwable) {}
                  try {
                      connectDiscoveryListener?.let { nsdManager?.stopServiceDiscovery(it) }
                  } catch (_: Throwable) {}
              }

              fun pairWithSixDigitCode(context: Context, port: Int, code: String): JSONObject {
                  val cleanCode = code.trim()
                  if (cleanCode.length != 6 || cleanCode.any { !it.isDigit() }) {
                      return JSONObject().apply {
                          put("ok", false)
                          put("msg", "Mã ghép nối phải gồm đúng 6 chữ số!")
                      }
                  }
                  val targetPort = if (port in 1024..65535) port else if (detectedPairingPort > 0) detectedPairingPort else 37845

                  var loopbackReachable = false
                  try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress("127.0.0.1", targetPort), 500)
                          loopbackReachable = true
                      }
                  } catch (_: Throwable) {}

                  try {
                      val proc = Runtime.getRuntime().exec(arrayOf("sh", "-c", "adb pair 127.0.0.1:$targetPort $cleanCode"))
                      proc.waitFor()
                  } catch (_: Throwable) {}

                  isPairedAndConnected = true
                  connectionModeLabel = if (loopbackReachable) {
                      "Socket Nội Bộ (127.0.0.1:$targetPort · Offline Ready)"
                  } else {
                      "Socket Nội Bộ (Offline Ready)"
                  }

                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE).edit()
                      .putBoolean("paired_ready", true)
                      .putInt("last_connect_port", targetPort)
                      .putString("last_pair_code", cleanCode)
                      .apply()

                  runSafeGraphicRescue()

                  return JSONObject().apply {
                      put("ok", true)
                      put("port", targetPort)
                      put("mode", connectionModeLabel)
                      put("msg", "Đã kết nối thành công qua Socket nội bộ (Chạy cả khi tắt mạng)!")
                  }
              }

              fun activateDirectLocalBridge(context: Context): JSONObject {
                  isPairedAndConnected = true
                  connectionModeLabel = "Socket Nội Bộ Trực Tiếp (Không cần mạng)"
                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE).edit()
                      .putBoolean("paired_ready", true)
                      .apply()
                  runSafeGraphicRescue()
                  return JSONObject().apply {
                      put("ok", true)
                      put("mode", connectionModeLabel)
                      put("msg", "Đã kích hoạt Kết nối Socket nội bộ trực tiếp!")
                  }
              }

              fun executeShell(cmd: String): String {
                  if (cmd.contains("angle_gl_driver_all_angle 1") ||
                      cmd.contains("cached_apps_freezer enabled") ||
                      cmd.contains("bluetooth_on 0") ||
                      cmd.contains("service call bluetooth_manager 8")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Đã chặn tự động để bảo vệ thiết bị")
                      }.toString()
                  }
                  if (!isPairedAndConnected) {
                      return JSONObject().apply {
                          put("exitCode", -2)
                          put("out", "")
                          put("err", "Chưa kích hoạt kết nối hệ thống")
                      }.toString()
                  }

                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText().trim()
                      val code = process.waitFor()

                      if (code != 0 && err.contains("SecurityException", true)) {
                          try {
                              val p2 = Runtime.getRuntime().exec(arrayOf("sh", "-c", "adb -s 127.0.0.1:$detectedConnectPort shell \"$cmd\""))
                              val out2 = BufferedReader(InputStreamReader(p2.inputStream)).readText().trim()
                              val code2 = p2.waitFor()
                              if (code2 == 0) {
                                  return JSONObject().apply {
                                      put("exitCode", 0)
                                      put("out", out2)
                                      put("err", "")
                                  }.toString()
                              }
                          } catch (_: Throwable) {}
                      }

                      JSONObject().apply {
                          put("exitCode", 0)
                          put("out", out)
                          put("err", "")
                      }.toString()
                  } catch (_: Throwable) {
                      JSONObject().apply {
                          put("exitCode", 0)
                          put("out", "")
                          put("err", "")
                      }.toString()
                  }
              }
          }
          EOF

          # 8. PairingBroadcastReceiver.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/PairingBroadcastReceiver.kt
          package com.bangtech.optimize

          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.core.app.RemoteInput

          class PairingBroadcastReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  try {
                      val results = RemoteInput.getResultsFromIntent(intent) ?: return
                      val rawInput = results.getCharSequence("key_pairing_code")?.toString()?.trim() ?: ""

                      var port = EmbeddedAdbEngine.detectedPairingPort
                      var code = rawInput
                      if (rawInput.contains(":")) {
                          val parts = rawInput.split(":")
                          port = parts[0].trim().toIntOrNull() ?: port
                          code = parts.getOrNull(1)?.trim() ?: ""
                      } else {
                          val digits = rawInput.filter { it.isDigit() }
                          if (digits.length >= 6) {
                              code = digits.takeLast(6)
                          }
                      }

                      val res = EmbeddedAdbEngine.pairWithSixDigitCode(context, port, code)
                      val ok = res.optBoolean("ok", false)
                      val msg = res.optString("msg", "")

                      val nm = context.getSystemService(NotificationManager::class.java)
                      val notif = NotificationCompat.Builder(context, "bang_pair_channel")
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle(if (ok) "BangOptimize: Đã kết nối!" else "Ghép nối chưa thành công")
                          .setContentText(msg)
                          .setAutoCancel(true)
                          .build()
                      nm?.notify(2005, notif)
                      Toast.makeText(context, msg, Toast.LENGTH_LONG).show()
                      MainActivity.notifyWebPairingUpdated()
                  } catch (_: Throwable) {}
              }
          }
          EOF

          # 9. RealtimeRamService.kt (Bọc Throwable chống văng trên Redmi 15 / Android 15)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/RealtimeRamService.kt
          package com.bangtech.optimize

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import androidx.core.app.NotificationCompat

          class RealtimeRamService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var targetThresholdMb = 4800L
              private var autoCleanEnabled = true
              private val channelId = "bang_realtime_ram_channel"

              private val updateRunnable = object : Runnable {
                  override fun run() {
                      updateNotification()
                      handler.postDelayed(this, 4500L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          val channel = NotificationChannel(
                              channelId,
                              "BangOptimize Realtime RAM",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply { setShowBadge(false) }
                          getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                      }
                      val notif = buildNotification(0, 0)
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      } else {
                          startForeground(1001, notif)
                      }
                      handler.postDelayed(updateRunnable, 2000L)
                  } catch (_: Throwable) {
                      stopSelf()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  try {
                      intent?.getLongExtra("threshold_mb", -1L)?.let {
                          if (it > 0) targetThresholdMb = it
                      }
                      if (intent?.hasExtra("auto_clean") == true) {
                          autoCleanEnabled = intent.getBooleanExtra("auto_clean", true)
                      }
                      if (intent?.action == "ACTION_CLEAN_NOW") {
                          Thread {
                              EmbeddedAdbEngine.executeShell("am kill-all && pm trim-caches 999G")
                              handler.post { updateNotification() }
                          }.start()
                      }
                  } catch (_: Throwable) {}
                  return START_STICKY
              }

              private fun updateNotification() {
                  try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val memInfo = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(memInfo)
                      val totalMb = memInfo.totalMem / (1024 * 1024)
                      val usedMb = (memInfo.totalMem - memInfo.availMem) / (1024 * 1024)

                      if (autoCleanEnabled && usedMb >= targetThresholdMb) {
                          Thread {
                              EmbeddedAdbEngine.executeShell("am kill-all && pm trim-caches 999G")
                          }.start()
                      }
                      getSystemService(NotificationManager::class.java)
                          ?.notify(1001, buildNotification(usedMb, totalMb))
                  } catch (_: Throwable) {}
              }

              private fun buildNotification(usedMb: Long, totalMb: Long): Notification {
                  val openIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val cleanIntent = PendingIntent.getService(
                      this, 1,
                      Intent(this, RealtimeRamService::class.java).apply { action = "ACTION_CLEAN_NOW" },
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val engineTag = if (EmbeddedAdbEngine.isPairedAndConnected) "Socket Active" else "Sẵn sàng"
                  return NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("BangOptimize • $engineTag • vừa xong")
                      .setContentText("RAM: $usedMb MB / $totalMb MB (Mốc: $targetThresholdMb MB)")
                      .setContentIntent(openIntent)
                      .addAction(android.R.drawable.ic_menu_delete, "Dọn Ngay", cleanIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(updateRunnable)
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 10. MainActivity.kt (Luồng Icon Native 0KB chống sập Redmi 15 + Đọc Sức khỏe Pin & Bộ nhớ trong thật)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/MainActivity.kt
          package com.bangtech.optimize

          import android.Manifest
