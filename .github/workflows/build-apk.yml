            // Nhận dữ liệu phần cứng thật từ máy (Redmi 15, Redmi 13C, Redmi Note 13, Vivo, OPPO, Samsung...)
            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              const totalMb = data.totalRamMb || 5606;
              const usedMb = data.usedRamMb || 3200;
              const ramPct = Math.round((usedMb / Math.max(1, totalMb)) * 100);
              const stoPct = data.usedStoragePct || 63;
              const batPct = data.battery || 78;

              setRingProgress('ringCircleBat', 'ringTextBat', batPct);
              setRingProgress('ringCircleRam', 'ringTextRam', ramPct);
              setRingProgress('ringCircleSto', 'ringTextSto', stoPct);

              document.getElementById('headerDeviceTitle').textContent = data.rawModel || data.model || 'Thiết bị Android';
              document.getElementById('headerOsSub').textContent = `${data.model} · ${data.android} · Max ${data.maxHz || 120}Hz`;
              document.getElementById('profModelVal').textContent = `${data.rawModel || data.model} (${data.deviceCode || 'Device'})`;
              document.getElementById('profSocVal').textContent = `${data.soc || 'SoC'} · ${(totalMb / 1024).toFixed(0)}GB RAM`;
              document.getElementById('detectedHzTag').textContent = `Màn ${data.hz || 60}Hz / Max ${data.maxHz || 120}Hz`;
              document.getElementById('autoProfileDesc').textContent = `Đã tự động nhận diện ${data.model} (${data.soc || 'Chipset'}) — Mở khóa đầy đủ gói tối ưu tương thích.`;

              // Sức khỏe pin
              const dMah = data.designMah || 5000;
              const aMah = data.actualMah || 4550;
              const healthPct = Math.min(100, Math.max(60, Math.round((aMah / Math.max(1000, dMah)) * 100)));
              document.getElementById('batDesignMah').textContent = `${dMah.toLocaleString('vi-VN')} mAh`;
              document.getElementById('batActualMah').textContent = `${aMah.toLocaleString('vi-VN')} mAh`;
              document.getElementById('batHealthPct').textContent = `${healthPct}%`;

              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              if (data.pairingPort && data.pairingPort > 0) {
                document.getElementById('inpPairPort').value = data.pairingPort;
                document.getElementById('mdnsStatusText').textContent = `Đã tự dò thấy Cổng nội bộ: ${data.pairingPort}`;
              }

              const mfr = (data.manufacturer || '').toUpperCase();
              if (mfr.includes('VIVO') || mfr.includes('IQOO')) selectOemBrand('VIVO');
              else if (mfr.includes('OPPO') || mfr.includes('REALME') || mfr.includes('ONEPLUS')) selectOemBrand('OPPO');
              else if (mfr.includes('SAMSUNG')) selectOemBrand('SAMSUNG');
              else selectOemBrand('REDMI');

              updateAdbStatusUI(!!data.adbPaired, data.adbMode);

              if (data.isColdStart) {
                // Trì hoãn nhẹ 400ms sau khi màn hình chính đã hiện lên hoàn tất rồi mới quét danh sách Game
                setTimeout(() => rescanDeviceGamesNow(), 400);
              }
            };

            renderGameHubList();
            selectOemBrand('REDMI');
            renderWhitelistApps();
            updateRealtimeBatteryOscilloscope();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize v14.0 All-In-One APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v14.0-All-In-One
          path: app/build/outputs/apk/debug/app-debug.apk

                           
