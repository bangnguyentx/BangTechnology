                              GradientDrawable.Orientation.TOP_BOTTOM,
                              intArrayOf(
                                  Color.parseColor("#40FFFFFF"),
                                  Color.TRANSPARENT
                              )
                          ).apply {
                              cornerRadii = floatArrayOf(
