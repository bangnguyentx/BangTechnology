          <body>

          <div id="toastPill" class="liquid-glass-v2">BangOptimize v13.5 Masterpiece sẵn sàng</div>

          <!-- MODAL 1: THÊM GAME MỚI (CHỌN TỪ APP TRONG MÁY HOẶC NHẬP TÊN) -->
          <div id="addGameModal" class="modal-backdrop" onclick="closeAddGameModal()">
            <div class="modal-sheet-box liquid-glass-v2" onclick="event.stopPropagation()">
              <div class="sec-row">
                <div>
