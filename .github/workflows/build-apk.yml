            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              const totalMb = data.totalRamMb || 5606;
              const usedMb = data.usedRamMb || 3410;
              const availMb = data.availRamMb || (totalMb - usedMb);
              const ramPct = Math.round((usedMb / Math.max(1, totalMb)) * 100);
              const stoPct = data.usedStoragePct || 65;
              const batPct = data.battery || 78;

              setRingProgress('ringCircleBat', 'ringTextBat', batPct);
              setRingProgress('ringCircleRam', 'ringTextRam', ramPct);
              setRingProgress('ringCircleSto', 'ringTextSto', stoPct);

              const gsRam = document.getElementById('gsPrevRam');
              if (gsRam) gsRam.textContent = `${ramPct}%`;

              document.getElementById('ringSubRam').textContent = `Trống ${availMb.toLocaleString('en-US')} MB`;
              document.getElementById('ringSubSto').textContent = `Trống ${data.freeStorageGb || '12.5'} / ${data.totalStorageGb || 128} GB`;

              const rawM = (data.rawModel || '').trim();
              const devCode = (data.deviceCode || '').trim();
              const commName = deviceCommercialMap[rawM] || deviceCommercialMap[devCode] || data.model || rawM;
              const rawSoc = (data.soc || '').trim().toUpperCase();
              const commSoc = socCommercialMap[rawSoc] || rawSoc || 'Octa-Core SoC';
              const gpuInfo = detectHardwareGpu();

              document.getElementById('headerDeviceTitle').textContent = commName;
              document.getElementById('hwCommName').textContent = commName;
              document.getElementById('hwRawModelCode').textContent = `Mã: ${rawM} · Board: ${devCode || data.board || 'arm64'}`;
              document.getElementById('hwSocFull').textContent = commSoc;
              document.getElementById('hwSocSub').textContent = `Mã SoC: ${rawSoc} · ${data.cores || 8} nhân xử lý`;
              document.getElementById('hwGpuRenderer').textContent = gpuInfo.renderer;
              document.getElementById('hwGpuVendor').textContent = `${gpuInfo.vendor} · Phần cứng thật`;
              document.getElementById('hwCustomOs').textContent = data.customOs || 'Android OS';
              document.getElementById('hwAndroidApi').textContent = `${data.android} · ${data.arch || 'arm64-v8a'}`;
              document.getElementById('hwScreenSpec').textContent = `${nativeWidth}x${nativeHeight} · ${nativeDpi} DPI`;
              document.getElementById('hwRefreshSpec').textContent = `Đang chạy ${data.hz || 90}Hz / Tối đa ${data.maxHz || 120}Hz`;
              document.getElementById('hwRamDetail').textContent = `${usedMb} / ${totalMb} MB (${ramPct}%)`;
              document.getElementById('hwStoDetail').textContent = `Đã dùng ${data.usedStorageGb || '--'} / ${data.totalStorageGb || '--'} GB (Trống ${data.freeStorageGb || '--'} GB)`;
              document.getElementById('detectedHzTag').textContent = `${data.hz || 90}Hz / Max ${data.maxHz || 120}Hz`;

              if (data.batteryGauge) {
                const bg = data.batteryGauge;
                const dMah = bg.designMah || 5000;
                const cMah = bg.currentChargedMah || 0;
                const fMah = bg.estimatedFullMah || 0;

                document.getElementById('batDesignMahSub').textContent = `Thiết kế NSX: ${dMah.toLocaleString('vi-VN')} mAh`;
                document.getElementById('batHwHealthBadge').textContent = bg.hwHealthStatus || 'Tốt (Good)';
                document.getElementById('batGaugeSourceText').textContent = `Nguồn đo: ${bg.gaugeSource || 'IC Fuel Gauge'} (Thực tế 100%)`;

                if (cMah > 100) {
                  document.getElementById('batChargedNowMah').textContent = `${cMah.toLocaleString('vi-VN')} mAh (${batPct}%)`;
                } else {
                  const calcNow = Math.round((batPct / 100) * dMah);
                  document.getElementById('batChargedNowMah').textContent = `~${calcNow.toLocaleString('vi-VN')} mAh (${batPct}%)`;
                }

                if (fMah > 1000) {
                  const realRatio = Math.min(100, Math.round((fMah / dMah) * 100));
                  document.getElementById('batEstimatedFullMah').textContent = `${fMah.toLocaleString('vi-VN')} mAh (~${realRatio}%)`;
                  document.getElementById('batHealthRealNote').textContent = bg.cycleCount > 0
                    ? `Chu kỳ sạc: ${bg.cycleCount} lần · Đo từ IC nguồn`
                    : `Ước tính từ lượng điện nạp thực tế của IC nguồn`;
                } else {
                  document.getElementById('batEstimatedFullMah').textContent = `Cần sạc > 20% để IC chốt số mAh`;
                }
              }

              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              const swGs = document.getElementById('swFloatingSidebar');
              const stGs = document.getElementById('gameSpaceStatusLine');
              if (swGs) {
                swGs.classList.toggle('on', !!data.gameWatcherActive);
                if (stGs && data.gameWatcherActive) {
                  stGs.className = 'tweak-status-line ok';
                  stGs.textContent = '✓ Đang canh gác ngầm! Logo Tròn Nhỏ sẽ tự hiện lên khi bạn vào Game.';
                }
              }

              const mfr = (data.manufacturer || '').toUpperCase();
              if (mfr.includes('VIVO') || mfr.includes('IQOO')) currentSelectedBrand = 'ORIGINOS';
              else if (mfr.includes('OPPO') || mfr.includes('REALME') || mfr.includes('ONEPLUS')) currentSelectedBrand = 'COLOROS';
              else if (mfr.includes('SAMSUNG')) currentSelectedBrand = 'ONEUI';
              else currentSelectedBrand = 'HYPEROS';

              updateShizukuStatusUI(!!data.shizukuReady, !!data.shizukuRunning, !!data.shizukuAuthorized, data.shizukuLabel);

              if (data.scannedStates) {
                syncScannedStatesFromDevice(data.scannedStates);
              } else {
                renderAllTweakLists(currentSelectedBrand);
              }

              if (data.isColdStart) {
                setTimeout(() => rescanDeviceGamesNow(), 350);
              }
            };

            (function initStartup() {
              const g = detectHardwareGpu();
              document.getElementById('hwGpuRenderer').textContent = g.renderer;
              document.getElementById('hwGpuVendor').textContent = `${g.vendor} · Đọc trực tiếp phần cứng`;
              const slider = document.getElementById('ramSlider');
              if (slider) {
                slider.value = savedRamThreshold;
                onRamSliderChange(savedRamThreshold);
              }
              renderAllTweakLists('HYPEROS');
              renderDnsGrid();
              renderGameHubList();
              renderWhitelistApps();
              renderSavedLogsToBox();
              updateRealtimeBatteryOscilloscope();
            })();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize v18.5 MagicOS11 Orb APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v18.5-MagicOS11-Orb
          path: app/build/outputs/apk/debug/app-debug.apk
