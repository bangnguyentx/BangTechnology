                  @JavascriptInterface
                  fun scanAppsAndGamesAsync() {
                      bgExecutor.execute {
                          val gamesArr = JSONArray()
                          val appsArr = JSONArray()
                          try {
                              val pm = packageManager
                              val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                              val runningSet = HashSet<String>()
                              am.runningAppProcesses?.forEach { proc ->
                                  proc.pkgList?.forEach { runningSet.add(it) }
                              }
                              val installed = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                              for (app in installed) {
                                  val pkg = app.packageName
                                  val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                                  val hasLauncher = pm.getLaunchIntentForPackage(pkg) != null
                                  if (isSystem && !hasLauncher && !pkg.contains("miui") && !pkg.contains("xiaomi")) continue

                                  val label = pm.getApplicationLabel(app).toString()
                                  val isGame = isAppGame(app, label)
                                  val isRunning = runningSet.contains(pkg)
                                  val iconUrl = "https://bangoptimize.local/app-icon/$pkg"

                                  val itemObj = JSONObject().apply {
                                      put("name", label)
                                      put("pkg", pkg)
                                      put("running", isRunning)
                                      put("system", isSystem)
                                      put("isGame", isGame)
                                      put("icon", iconUrl)
                                  }
                                  if (isGame) {
                                      gamesArr.put(itemObj)
                                  }
