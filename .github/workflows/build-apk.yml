name: Build BangOptimize v18.5 MagicOS11 Orb APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Clean & Generate BangOptimize v18.5 MagicOS 11 Floating Orb Project
        shell: bash
        run: |
          set -e
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/aidl/com/bangtech/optimize
          mkdir -p app/src/main/java/com/bangtech/optimize
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-anydpi-v26

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "BangOptimize"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bangtech.optimize"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bangtech.optimize"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 185
                  versionName = "18.5 MagicOS11 Orb"
              }

              buildFeatures {
                  aidl = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          # 5. Icon "Bình Công Nghệ"
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#06080E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0B111E" android:pathData="M8,8h92v92h-92z"/>
              <path android:strokeColor="#1E293B" android:strokeWidth="1" android:pathData="M0,27L108,27M0,54L108,54M0,81L108,81M27,0L27,108M54,0L54,108M81,0L81,108"/>
              <path android:strokeColor="#38BDF8" android:strokeAlpha="0.4" android:strokeWidth="2" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#10B981" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M34,42 H25 V66 H34" />
              <path android:fillColor="#00000000" android:strokeColor="#38BDF8" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M74,42 H83 V66 H74" />
              <path android:fillColor="#1E293B" android:strokeColor="#64748B" android:strokeWidth="1.5"
                  android:pathData="M36,74 H72 L75,82 H33 Z" />
              <path android:fillColor="#0F293A" android:strokeColor="#38BDF8" android:strokeWidth="2.4"
                  android:pathData="M36,38 H72 V74 H36 Z" />
              <path android:fillColor="#10B981" android:fillAlpha="0.28"
                  android:pathData="M40,42 H68 V70 H40 Z" />
              <path android:fillColor="#091520" android:strokeColor="#34D399" android:strokeWidth="2.2"
                  android:pathData="M44,56 A10,10 0 1,0 64,56 A10,10 0 1,0 44,56 Z" />
              <path android:fillColor="#F8FAFC"
                  android:pathData="M55.5,48 L49,56.5 H54 L52.5,64 L59.5,55 H54.5 Z" />
              <path android:fillColor="#334155" android:strokeColor="#94A3B8" android:strokeWidth="1.6"
                  android:pathData="M34,38 C34,31 74,31 74,38 Z" />
              <path android:fillColor="#1E293B" android:strokeColor="#38BDF8" android:strokeWidth="1.8"
                  android:pathData="M44,24 H64 V32 H44 Z" />
              <path android:fillColor="#38BDF8" android:pathData="M48,27 h3 v2.5 h-3 z M57,27 h3 v2.5 h-3 z" />
          </vector>
          EOF

          cp app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher.xml

          cat << 'EOF' > app/src/main/res/drawable-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="BangOptimize"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BangGameSidebarService"
                      android:exported="false" />

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # 7. IShellService.aidl
          cat << 'EOF' > app/src/main/aidl/com/bangtech/optimize/IShellService.aidl
          package com.bangtech.optimize;

          interface IShellService {
              void destroy();
              String runCommand(String cmd);
          }
          EOF

          # 8. ShellUserService.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/ShellUserService.kt
          package com.bangtech.optimize

          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit
          import kotlin.system.exitProcess

          class ShellUserService : IShellService.Stub() {
              override fun destroy() {
                  exitProcess(0)
              }

              override fun runCommand(cmd: String): String {
                  if (cmd.contains("angle_gl_driver_all_angle 1") ||
                      cmd.contains("cached_apps_freezer enabled") ||
                      cmd.contains("bluetooth_on 0") ||
                      cmd.contains("service call bluetooth_manager 8")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Đã chặn tự động bởi Lá chắn Anti-OTG & Bảo vệ Bluetooth")
                      }.toString()
                  }
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      process.waitFor(3000, TimeUnit.MILLISECONDS)
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText().trim()
                      val code = try { process.exitValue() } catch (_: Throwable) { 0 }
                      JSONObject().apply {
                          put("exitCode", code)
                          put("out", out)
                          put("err", err)
                      }.toString()
                  } catch (e: Throwable) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", e.message ?: "Unknown Shizuku error")
                      }.toString()
                  }
              }
          }
          EOF

          # 9. ShizukuEngine.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/ShizukuEngine.kt
          package com.bangtech.optimize

          import android.content.ComponentName
          import android.content.Context
          import android.content.ServiceConnection
          import android.content.pm.PackageManager
          import android.os.IBinder
          import android.os.SystemClock
          import android.provider.Settings
          import org.json.JSONObject
          import rikka.shizuku.Shizuku

          object ShizukuEngine {
              @Volatile
              var shellService: IShellService? = null
              @Volatile
              var isStealthVneidActive: Boolean = false

              private val userServiceArgs = Shizuku.UserServiceArgs(
                  ComponentName("com.bangtech.optimize", ShellUserService::class.java.name)
              ).daemon(false).processNameSuffix("bang_shizuku_shell").debuggable(false).version(185)

              private val serviceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      shellService = IShellService.Stub.asInterface(binder)
                      MainActivity.notifyShizukuUpdated()
                  }

                  override fun onServiceDisconnected(name: ComponentName?) {
                      shellService = null
                      MainActivity.notifyShizukuUpdated()
                  }
              }

              fun isShizukuRunning(): Boolean {
                  return try { Shizuku.pingBinder() } catch (_: Throwable) { false }
              }

              fun isShizukuAuthorized(): Boolean {
                  return try {
                      isShizukuRunning() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (_: Throwable) { false }
              }

              fun isReady(): Boolean = isShizukuAuthorized() && shellService != null

              fun statusLabel(): String {
                  return when {
                      !isShizukuRunning() -> "Shizuku chưa chạy"
                      !isShizukuAuthorized() -> "Chưa cấp quyền Shizuku"
                      shellService != null -> "Đã kết nối Shizuku (UID 2000)"
                      else -> "Đang kết nối Shizuku..."
                  }
              }

              fun bindServiceIfPossible() {
                  try {
                      if (isShizukuAuthorized() && shellService == null) {
                          Shizuku.bindUserService(userServiceArgs, serviceConnection)
                      }
                  } catch (_: Throwable) {}
              }

              fun readSettingFromOs(context: Context, namespace: String, key: String): String {
                  try {
                      val cr = context.contentResolver
                      val v = when (namespace.lowercase()) {
                          "system" -> Settings.System.getString(cr, key)
                          "secure" -> Settings.Secure.getString(cr, key)
                          "global" -> Settings.Global.getString(cr, key)
                          else -> null
                      }
                      if (!v.isNullOrEmpty() && v != "null") return v.trim()
                  } catch (_: Throwable) {}

                  if (shellService != null) {
                      try {
                          val raw = shellService?.runCommand("settings get $namespace $key") ?: ""
                          val j = JSONObject(raw)
                          val out = j.optString("out", "").trim()
                          if (out.isNotEmpty() && out != "null") return out
                      } catch (_: Throwable) {}
                  }
                  return ""
              }

              fun saveOriginalValueIfAbsent(context: Context, stateKey: String, currentVal: String) {
                  if (stateKey.isEmpty()) return
                  val prefs = context.getSharedPreferences("bang_orig_backup_v18", Context.MODE_PRIVATE)
                  if (!prefs.contains(stateKey) && currentVal.isNotEmpty()) {
                      prefs.edit().putString(stateKey, currentVal).apply()
                  }
              }

              fun getBackedUpOriginalValue(context: Context, stateKey: String, defaultFallback: String): String {
                  if (stateKey.isEmpty()) return defaultFallback
                  val prefs = context.getSharedPreferences("bang_orig_backup_v18", Context.MODE_PRIVATE)
                  return prefs.getString(stateKey, defaultFallback) ?: defaultFallback
              }

              fun saveToggleMemory(context: Context, itemId: String, isOn: Boolean) {
                  context.getSharedPreferences("bang_toggle_mem_v18", Context.MODE_PRIVATE)
                      .edit().putBoolean(itemId, isOn).apply()
              }

              fun getToggleMemory(context: Context, itemId: String, defVal: Boolean = false): Boolean {
                  return context.getSharedPreferences("bang_toggle_mem_v18", Context.MODE_PRIVATE)
                      .getBoolean(itemId, defVal)
              }

              fun executeShizukuStrict(cmd: String): JSONObject {
                  if (!isShizukuRunning()) {
                      return JSONObject().apply {
                          put("exitCode", -2)
                          put("out", "")
                          put("err", "Ứng dụng Shizuku chưa chạy! Hãy mở Shizuku và bấm Start trước.")
                          put("needShizuku", true)
                      }
                  }
                  if (!isShizukuAuthorized()) {
                      return JSONObject().apply {
                          put("exitCode", -3)
                          put("out", "")
                          put("err", "Chưa cấp quyền Shizuku cho BangOptimize! Hãy bấm 'Cấp quyền Shizuku'.")
                          put("needShizuku", true)
                      }
                  }
                  if (shellService == null) {
                      bindServiceIfPossible()
                      SystemClock.sleep(280)
                      if (shellService == null) {
                          return JSONObject().apply {
                              put("exitCode", -4)
                              put("out", "")
                              put("err", "Đang khởi tạo tiến trình Shizuku UID 2000, hãy bấm lại sau 1 giây!")
                          }
                      }
                  }

                  return try {
                      val rawStr = shellService?.runCommand(cmd) ?: """{"exitCode":-1,"out":"","err":"Null binder"}"""
                      val j = JSONObject(rawStr)
                      val code = j.optInt("exitCode", -1)
                      val out = j.optString("out", "")
                      val err = j.optString("err", "")

                      val hasPermError = code != 0 ||
                              err.contains("SecurityException", true) ||
                              err.contains("Permission denial", true) ||
                              err.contains("does not have permission", true) ||
                              err.contains("Failure", true) ||
                              out.contains("SecurityException", true)

                      if (hasPermError) {
                          val cleanReason = when {
                              err.contains("WRITE_SECURE_SETTINGS", true) || err.contains("SecurityException", true) ->
                                  "ROM chặn quyền ghi! Trên máy Xiaomi/Redmi hãy bật thêm 'Gỡ lỗi USB (Cài đặt bảo mật)' trong Tùy chọn nhà phát triển."
                              err.contains("Unknown package", true) || err.contains("not found", true) ->
                                  "Dòng máy này không có gói dịch vụ trên (Không hỗ trợ)."
                              err.isNotEmpty() ->
                                  "Hệ thống từ chối: " + err.lines().firstOrNull()?.take(90)
                              else ->
                                  "Không thể ghi vào hệ thống (Mã trả về: $code)"
                          }
                          JSONObject().apply {
                              put("exitCode", if (code == 0) -1 else code)
                              put("out", out)
                              put("err", cleanReason)
                          }
                      } else {
                          JSONObject().apply {
                              put("exitCode", 0)
                              put("out", out)
                              put("err", "")
                          }
                      }
                  } catch (e: Throwable) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", "Lỗi Shizuku IPC: ${e.message}")
                      }
                  }
              }

              fun scanFullDeviceStateJson(context: Context): JSONObject {
                  val states = JSONObject()
                  val keysToScan = listOf(
                      "global:window_animation_scale",
                      "global:transition_animation_scale",
                      "global:animator_duration_scale",
                      "system:peak_refresh_rate",
                      "system:min_refresh_rate",
                      "secure:long_press_timeout",
                      "secure:multi_press_timeout",
                      "system:pointer_speed",
                      "global:heads_up_notifications_enabled",
                      "system:screen_brightness_mode",
                      "system:three_gesture_screenshot",
                      "system:sound_effects_enabled",
                      "system:haptic_feedback_enabled",
                      "system:lockscreen_sounds_enabled",
                      "system:accelerometer_rotation",
                      "system:screen_off_timeout",
                      "system:status_bar_show_battery_percent",
                      "system:deviceLevelList",
                      "system:POWER_PERFORMANCE_MODE_OPEN",
                      "secure:speed_mode",
                      "system:monster_mode",
                      "system:pem_performance_mode",
                      "global:vivo_screen_refresh_rate_mode",
                      "system:high_performance_mode_on",
                      "secure:game_auto_temperature_control",
                      "global:sem_enhanced_cpu_responsiveness",
                      "global:restricted_device_performance",
                      "global:private_dns_mode",
                      "global:private_dns_specifier",
                      "secure:location_mode",
                      "global:wifi_scan_always_enabled",
                      "global:ble_scan_always_enabled",
                      "global:wifi_sleep_policy",
                      "global:mobile_data_always_on",
                      "secure:wake_gesture_enabled",
                      "secure:doze_enabled",
                      "secure:doze_always_on",
                      "global:send_action_app_error",
                      "global:power_button_long_press",
                      "global:ota_disable_automatic_update",
                      "global:disable_window_blurs",
                      "global:low_power",
                      "global:cached_apps_freezer",
                      "global:adb_enabled",
                      "secure:double_tap_to_wake",
                      "secure:contrast_level",
                      "system:vibrate_when_ringing",
                      "global:wifi_wakeup_available",
                      "global:adb_allowed_connection_time",
                      "global:charging_sounds_enabled",
                      "global:charging_vibration_enabled",
                      "secure:accessibility_display_magnification_enabled",
                      "system:dtmf_tone",
                      "global:emergency_tone",
                      "global:stay_on_while_plugged_in",
                      "system:font_scale",
                      "secure:notification_badging",
                      "secure:spell_checker_enabled",
                      "secure:autofill_service",
                      "global:wifi_watchdog_poor_network_test_enabled",
                      "global:wifi_networks_available_notification_on",
                      "global:assisted_gps_enabled",
                      "secure:anr_show_background",
                      "global:always_finish_activities"
                  )
                  for (entry in keysToScan) {
                      val parts = entry.split(":")
                      if (parts.size == 2) {
                          val v = readSettingFromOs(context, parts[0], parts[1])
                          states.put(entry, v)
                      }
                  }

                  val memObj = JSONObject()
                  val memPrefs = context.getSharedPreferences("bang_toggle_mem_v18", Context.MODE_PRIVATE)
                  for ((k, v) in memPrefs.all) {
                      if (v is Boolean) memObj.put(k, v)
                  }
                  states.put("_savedMemory", memObj)
                  return states
              }

              fun runSafeGraphicRescue(): String {
                  val rescueScript = "settings delete global angle_gl_driver_all_angle; settings delete global angle_gl_driver_selection_pkgs; settings delete global angle_gl_driver_selection_values; settings put global cached_apps_freezer disabled; settings put global bluetooth_on 1; wm size reset; wm density reset"
                  executeShizukuStrict(rescueScript)
                  return "Đã gỡ sạch lệnh gây treo & khôi phục màn hình gốc qua Shizuku!"
              }

              fun setStealthHideAdbForVneid(context: Context, enableStealth: Boolean): JSONObject {
                  val cmd = if (enableStealth) "settings put global adb_enabled 0" else "settings put global adb_enabled 1"
                  val res = executeShizukuStrict(cmd)
                  val actualAfter = readSettingFromOs(context, "global", "adb_enabled")
                  val targetVal = if (enableStealth) "0" else "1"

                  return if (res.optInt("exitCode", -1) == 0 && (actualAfter == targetVal || actualAfter.isEmpty())) {
                      isStealthVneidActive = enableStealth
                      JSONObject().apply {
                          put("ok", true)
                          put("msg", if (enableStealth) "Đã ẩn trạng thái ADB (Mở VNeID & Ngân hàng an toàn)" else "Đã bật lại hiển thị ADB")
                      }
                  } else {
                      JSONObject().apply {
                          put("ok", false)
                          put("msg", res.optString("err", "Không thể ghi trạng thái ẩn ADB qua Shizuku"))
                      }
                  }
              }
          }
          EOF

          # 10. BangGameSidebarService.kt (Logo Tròn Nhỏ Liquid Glass Kéo Thả 360° + Animation Bung Mở Ra Bảng MAGIC GAME SPACE Y Hệt Ảnh + Nút Out Game)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/BangGameSidebarService.kt
          package com.bangtech.optimize

          import android.animation.ValueAnimator
          import android.app.ActivityManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class BangGameSidebarService : Service() {
              private var windowManager: WindowManager? = null
              private var floatingOrbView: View? = null
              private var orbParams: WindowManager.LayoutParams? = null
              private var panelView: View? = null
              private var crosshairView: View? = null
              private var miniHudView: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isOverlayVisible = false
              private var isClosingPanel = false
              private var isCrosshairEnabled = false
              private var isMiniHudEnabled = true
              private var isRes720p = false
              private var currentActiveGamePkg: String = ""

              private val idleDimRunnable = Runnable {
                  floatingOrbView?.animate()?.alpha(0.76f)?.scaleX(0.92f)?.scaleY(0.92f)?.setDuration(420)?.start()
              }

              companion object {
                  val watchedGamePackages = HashSet<String>(
                      listOf(
                          "com.garena.game.kgvn", "com.dts.freefiremax", "com.dts.freefireth",
                          "com.vng.pubgmobile", "com.tencent.ig", "com.roblox.client",
                          "com.miHoYo.GenshinImpact", "com.proxima.dfm", "com.riotgames.league.wildrift",
                          "com.mobile.legends", "com.supercell.clashofclans", "com.supercell.brawlstars",
                          "com.garena.game.codm", "com.ea.gp.fifamobile", "jp.konami.pesam",
                          "com.block.juggle"
                      )
                  )
              }

              private val foregroundWatcherRunnable = object : Runnable {
                  override fun run() {
                      checkForegroundAppAndToggleSidebar()
                      if (isMiniHudEnabled && miniHudView != null) updateMiniHudText()
                      handler.postDelayed(this, 2400L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  handler.postDelayed(foregroundWatcherRunnable, 1400L)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action ?: "ACTION_WATCHER") {
                      "ACTION_WATCHER" -> hideGameSpaceHandle()
                      "ACTION_GAME_LAUNCHED" -> {
                          val pkg = intent?.getStringExtra("game_pkg") ?: ""
                          if (pkg.isNotEmpty()) {
                              watchedGamePackages.add(pkg)
                              currentActiveGamePkg = pkg
                          }
                          handler.postDelayed({
                              showFloatingLogoOrb()
                              if (isMiniHudEnabled && miniHudView == null) toggleMiniHudOverlay(forceOn = true)
                          }, 520L)
                      }
                      "ACTION_HIDE_IN_APP" -> hideGameSpaceHandle()
                  }
                  return START_STICKY
              }

              private fun checkForegroundAppAndToggleSidebar() {
                  Thread {
                      var fgPkg = ""
                      try {
                          val p = Runtime.getRuntime().exec(arrayOf("sh", "-c", "dumpsys window displays | grep -E 'mCurrentFocus|mFocusedApp'"))
                          p.waitFor(700, TimeUnit.MILLISECONDS)
                          val out = BufferedReader(InputStreamReader(p.inputStream)).readText()
                          for (gamePkg in watchedGamePackages) {
                              if (out.contains(gamePkg)) {
                                  fgPkg = gamePkg
                                  currentActiveGamePkg = gamePkg
                                  break
                              }
                          }
                          if (out.contains("com.bangtech.optimize")) fgPkg = "BANG_APP"
                      } catch (_: Throwable) {}

                      handler.post {
                          if (fgPkg == "BANG_APP") {
                              hideGameSpaceHandle()
                          } else if (fgPkg.isNotEmpty()) {
                              showFloatingLogoOrb()
                          }
                      }
                  }.start()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun overlayType(): Int {
                  return if (Build.VERSION.SDK_INT >= 26) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }
              }

              private fun readCpuAndGpuUsage(tempC: Double, ramPct: Int): Pair<Int, Int> {
                  var gpuPct = -1
                  try {
                      val kgsl = File("/sys/class/kgsl/kgsl-3d0/gpubusy")
                      if (kgsl.exists() && kgsl.canRead()) {
                          val parts = kgsl.readText().trim().split(Regex("\\s+"))
                          if (parts.size >= 2) {
                              val busy = parts[0].toLongOrNull() ?: 0L
                              val total = parts[1].toLongOrNull() ?: 1L
                              if (total > 0) gpuPct = ((busy * 100L) / total).toInt().coerceIn(5, 99)
                          }
                      }
                  } catch (_: Throwable) {}

                  var cpuPct = -1
                  try {
                      val curFreqFile = File("/sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq")
                      val maxFreqFile = File("/sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq")
                      if (curFreqFile.exists() && maxFreqFile.exists()) {
                          val cur = curFreqFile.readText().trim().toLongOrNull() ?: 0L
                          val max = maxFreqFile.readText().trim().toLongOrNull() ?: 1L
                          if (max > 0 && cur > 0) {
                              cpuPct = ((cur * 100L) / max).toInt().coerceIn(8, 98)
                          }
                      }
                  } catch (_: Throwable) {}

                  if (cpuPct < 0) {
                      cpuPct = (22 + ((tempC - 32.0) * 3.2).roundToInt() + (ramPct / 6)).coerceIn(14, 92)
                  }
                  if (gpuPct < 0) {
                      gpuPct = (cpuPct + 10).coerceIn(18, 96)
                  }
                  return Pair(cpuPct, gpuPct)
              }

              // LỚP VẼ LOGO TRÒN NHỎ LIQUID GLASS 3D QUANG HỌC ĐA TẦNG
              private inner class LiquidGlassOrbCanvasView(context: Context) : View(context) {
                  private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val rimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = dp(2).toFloat()
                  }
                  private val meniscusPaint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val coreRingPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = dp(1).toFloat()
                      color = Color.parseColor("#8834D399")
                  }
                  private val boltPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.FILL
                      color = Color.WHITE
                      setShadowLayer(dp(4).toFloat(), 0f, 0f, Color.parseColor("#FF38BDF8"))
                  }
                  private val boltPath = Path()

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val w = width.toFloat()
                      val h = height.toFloat()
                      if (w <= 0f || h <= 0f) return
                      val cx = w / 2f
                      val cy = h / 2f
                      val radius = (w.coerceAtMost(h) / 2f) - dp(2).toFloat()

                      // 1. Nền cầu thủy tinh lỏng sâu
                      bgPaint.shader = RadialGradient(
                          cx * 0.65f, cy * 0.60f, radius * 1.25f,
                          intArrayOf(
                              Color.parseColor("#EE1E2D4A"),
                              Color.parseColor("#E60B111E"),
                              Color.parseColor("#F2060911")
                          ),
                          floatArrayOf(0f, 0.62f, 1f),
                          Shader.TileMode.CLAMP
                      )
                      canvas.drawCircle(cx, cy, radius, bgPaint)

                      // 2. Vầng phản xạ mặt khum trên (Top Meniscus Specular Highlight)
                      meniscusPaint.shader = LinearGradient(
                          cx, cy - radius, cx, cy,
                          Color.parseColor("#75FFFFFF"),
                          Color.TRANSPARENT,
                          Shader.TileMode.CLAMP
                      )
                      canvas.drawCircle(cx, cy - radius * 0.18f, radius * 0.78f, meniscusPaint)

                      // 3. Viền khúc xạ cầu vồng (Prismatic Specular Rim)
                      rimPaint.shader = SweepGradient(
                          cx, cy,
                          intArrayOf(
                              Color.parseColor("#FF7DD3FC"),
                              Color.parseColor("#FF34D399"),
                              Color.parseColor("#FFC084FC"),
                              Color.parseColor("#FFFDA4AF"),
                              Color.parseColor("#FFFFFFFF"),
                              Color.parseColor("#FF7DD3FC")
                          ),
                          null
                      )
                      canvas.drawCircle(cx, cy, radius, rimPaint)

                      // 4. Vòng năng lượng Reactor bên trong
                      canvas.drawCircle(cx, cy, radius * 0.56f, coreRingPaint)

                      // 5. Tia chớp lõi Bình Công Nghệ ở tâm
                      boltPath.reset()
                      boltPath.moveTo(cx + radius * 0.08f, cy - radius * 0.34f)
                      boltPath.lineTo(cx - radius * 0.24f, cy + radius * 0.04f)
                      boltPath.lineTo(cx + radius * 0.02f, cy + radius * 0.04f)
                      boltPath.lineTo(cx - radius * 0.08f, cy + radius * 0.34f)
                      boltPath.lineTo(cx + radius * 0.24f, cy - radius * 0.04f)
                      boltPath.lineTo(cx - radius * 0.02f, cy - radius * 0.04f)
                      boltPath.close()
                      canvas.drawPath(boltPath, boltPaint)
                  }
              }

              // 1. HIỂN THỊ LOGO TRÒN NHỎ NỔI CÓ THỂ DI CHUYỂN TỰ DO & HÍT MÉP MÀN HÌNH
              private fun showFloatingLogoOrb() {
                  if (isOverlayVisible || floatingOrbView != null) return
                  try {
                      val screenW = resources.displayMetrics.widthPixels
                      val screenH = resources.displayMetrics.heightPixels
                      val orbSize = dp(43)

                      val params = WindowManager.LayoutParams(
                          orbSize,
                          orbSize,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = screenW - orbSize - dp(8)
                          y = (screenH * 0.34f).toInt()
                      }
                      orbParams = params

                      val orbView = LiquidGlassOrbCanvasView(this).apply {
                          alpha = 0f
                          scaleX = 0.3f
                          scaleY = 0.3f
                      }

                      var startX = 0
                      var startY = 0
                      var touchX = 0f
                      var touchY = 0f
                      var isDraggingOrb = false

                      orbView.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  handler.removeCallbacks(idleDimRunnable)
                                  startX = params.x
                                  startY = params.y
                                  touchX = ev.rawX
                                  touchY = ev.rawY
                                  isDraggingOrb = false
                                  orbView.animate().alpha(1f).scaleX(1.12f).scaleY(1.12f).setDuration(130).start()
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (ev.rawX - touchX).toInt()
                                  val dy = (ev.rawY - touchY).toInt()
                                  if (abs(dx) > dp(6) || abs(dy) > dp(6)) {
                                      isDraggingOrb = true
                                  }
                                  if (isDraggingOrb) {
                                      val curW = resources.displayMetrics.widthPixels
                                      val curH = resources.displayMetrics.heightPixels
                                      params.x = (startX + dx).coerceIn(dp(4), curW - orbSize - dp(4))
                                      params.y = (startY + dy).coerceIn(dp(24), curH - orbSize - dp(24))
                                      try { windowManager?.updateViewLayout(orbView, params) } catch (_: Throwable) {}
                                  }
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!isDraggingOrb) {
                                      // Chạm nhẹ vào Logo tròn nhỏ -> Bung mở bảng MAGIC GAME SPACE với animation!
                                      openGamePanelFromOrb()
                                  } else {
                                      // Kéo thả xong -> Tự động đàn hồi hít mượt về mép trái hoặc mép phải gần nhất
                                      val curW = resources.displayMetrics.widthPixels
                                      val targetEdgeX = if (params.x + orbSize / 2 < curW / 2) {
                                          dp(6)
                                      } else {
                                          curW - orbSize - dp(6)
                                      }
                                      ValueAnimator.ofInt(params.x, targetEdgeX).apply {
                                          duration = 380L
                                          interpolator = OvershootInterpolator(1.06f)
                                          addUpdateListener { anim ->
                                              params.x = anim.animatedValue as Int
                                              try { windowManager?.updateViewLayout(orbView, params) } catch (_: Throwable) {}
                                          }
                                          start()
                                      }
                                      orbView.animate().scaleX(1f).scaleY(1f).setDuration(220).start()
                                      handler.postDelayed(idleDimRunnable, 3200L)
                                  }
                                  true
                              }
                              else -> false
                          }
                      }

                      floatingOrbView = orbView
                      windowManager?.addView(orbView, params)
                      orbView.animate()
                          .alpha(0.95f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setInterpolator(OvershootInterpolator(1.22f))
                          .setDuration(460)
                          .withEndAction { handler.postDelayed(idleDimRunnable, 3200L) }
                          .start()
                      isOverlayVisible = true
                  } catch (_: Throwable) {}
              }

              private fun hideGameSpaceHandle() {
                  handler.removeCallbacks(idleDimRunnable)
                  closeGamePanel(animated = false)
                  floatingOrbView?.let {
                      try { windowManager?.removeView(it) } catch (_: Throwable) {}
                      floatingOrbView = null
                  }
                  miniHudView?.let {
                      try { windowManager?.removeView(it) } catch (_: Throwable) {}
                      miniHudView = null
                  }
                  isOverlayVisible = false
              }

              // 2. MINI HUD GÓC TRÊN PHẢI SIÊU GỌN (THÊM CPU & GPU + KÉO DI CHUYỂN ĐƯỢC)
              private fun toggleMiniHudOverlay(forceOn: Boolean = false) {
                  if (miniHudView != null && !forceOn) {
                      try { windowManager?.removeView(miniHudView) } catch (_: Throwable) {}
                      miniHudView = null
                      isMiniHudEnabled = false
                      Toast.makeText(this, "Game Space: Đã ẩn HUD góc phải", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (miniHudView != null) return
                  try {
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.END
                          x = dp(58)
                          y = dp(6)
                      }

                      val hud = TextView(this).apply {
                          textSize = 8.8f
                          setTypeface(Typeface.MONOSPACE, Typeface.BOLD)
                          setTextColor(Color.parseColor("#F1F5F9"))
                          setPadding(dp(8), dp(3), dp(8), dp(3))
                          alpha = 0f
                          translationY = -dp(12).toFloat()
                          background = GradientDrawable(
                              GradientDrawable.Orientation.LEFT_RIGHT,
                              intArrayOf(
                                  Color.parseColor("#B8090D16"),
                                  Color.parseColor("#CC111827")
                              )
                          ).apply {
                              setStroke(dp(1), Color.parseColor("#887DD3FC"))
                              cornerRadius = dp(99).toFloat()
                          }
                      }

                      var initX = 0
                      var initY = 0
                      var tX = 0f
                      var tY = 0f
                      hud.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = params.x
                                  initY = params.y
                                  tX = ev.rawX
                                  tY = ev.rawY
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = (initX - (ev.rawX - tX).toInt()).coerceAtLeast(0)
                                  params.y = (initY + (ev.rawY - tY).toInt()).coerceAtLeast(0)
                                  try { windowManager?.updateViewLayout(hud, params) } catch (_: Throwable) {}
                                  true
                              }
                              else -> false
                          }
                      }

                      miniHudView = hud
                      windowManager?.addView(hud, params)
                      isMiniHudEnabled = true
                      updateMiniHudText()
                      hud.animate().alpha(0.95f).translationY(0f).setDuration(380).start()
                  } catch (_: Throwable) {}
              }

              private fun updateMiniHudText() {
                  val hud = miniHudView ?: return
                  try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                      val ramPct = (((mem.totalMem - mem.availMem).toDouble() / mem.totalMem.toDouble()) * 100).toInt()
                      val batIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val tempC = (batIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 350) ?: 350) / 10.0
                      val (cpuPct, gpuPct) = readCpuAndGpuUsage(tempC, ramPct)
                      hud.text = "⚡120FPS • CPU $cpuPct% • GPU $gpuPct% • RAM $ramPct% • ${tempC}°C"
                  } catch (_: Throwable) {}
              }

              private fun performOutGameBackToApp() {
                  Toast.makeText(this, "🚪 Đang rời Game & đưa giao diện về bình thường...", Toast.LENGTH_SHORT).show()
                  closeGamePanel(animated = true) {
                      hideGameSpaceHandle()
                      Thread {
                          if (currentActiveGamePkg.isNotEmpty() && currentActiveGamePkg != "com.bangtech.optimize") {
                              ShizukuEngine.executeShizukuStrict("am force-stop $currentActiveGamePkg && wm size reset && wm density reset && settings put system pointer_speed 0")
                          } else {
                              ShizukuEngine.executeShizukuStrict("wm size reset && wm density reset && settings put system pointer_speed 0")
                          }
                      }.start()
                      try {
                          val backIntent = Intent(this@BangGameSidebarService, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          }
                          startActivity(backIntent)
                      } catch (_: Throwable) {}
                  }
              }

              // Lớp View vẽ ánh sáng khúc xạ Liquid Glass chạy chéo qua bảng MAGIC GAME SPACE
              private inner class SpecularLightSweepView(context: Context) : View(context) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var sweepProgress = -0.4f
                  private var animator: ValueAnimator? = null

                  fun startSweep() {
                      animator?.cancel()
                      animator = ValueAnimator.ofFloat(-0.35f, 1.35f).apply {
                          duration = 1750L
                          interpolator = AccelerateDecelerateInterpolator()
                          addUpdateListener {
                              sweepProgress = it.animatedValue as Float
                              invalidate()
                          }
                          start()
                      }
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      if (width <= 0 || height <= 0) return
                      val cx = width * sweepProgress
                      val shader = LinearGradient(
                          cx - dp(50).toFloat(), 0f,
                          cx + dp(50).toFloat(), height.toFloat(),
                          intArrayOf(
                              Color.TRANSPARENT,
                              Color.parseColor("#32FFFFFF"),
                              Color.parseColor("#427DD3FC"),
                              Color.TRANSPARENT
                          ),
                          floatArrayOf(0f, 0.45f, 0.55f, 1f),
                          Shader.TileMode.CLAMP
                      )
                      paint.shader = shader
                      canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                  }
              }

              // 3. KHI CHẠM LOGO TRÒN NHỎ -> BUNG MỞ BẢNG "✨ MAGIC GAME SPACE" Y HỆT ẢNH VỚI LIQUID GLASS ĐA TẦNG
              private fun openGamePanelFromOrb() {
                  if (panelView != null || isClosingPanel) return
                  try {
                      // Thu nhỏ nhẹ Logo tròn vào trong trước khi bung bảng kính lỏng
                      floatingOrbView?.animate()
                          ?.alpha(0f)
                          ?.scaleX(0.35f)
                          ?.scaleY(0.35f)
                          ?.setDuration(220)
                          ?.start()

                      var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      if (Build.VERSION.SDK_INT >= 31) {
                          flags = flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                      }

                      val screenW = resources.displayMetrics.widthPixels
                      val orbX = orbParams?.x ?: (screenW - dp(50))
                      val isOnRightSide = orbX > screenW / 2

                      val params = WindowManager.LayoutParams(
                          dp(248),
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(),
                          flags,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = (if (isOnRightSide) Gravity.END else Gravity.START) or Gravity.CENTER_VERTICAL
