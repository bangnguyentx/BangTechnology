              fun injectRealHardwareData(isColdStart: Boolean) {
                  bgExecutor.execute {
                      try {
                          val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                          val totalMb = mem.totalMem / (1024 * 1024)
                          val availMb = mem.availMem / (1024 * 1024)
                          val usedMb = totalMb - availMb

                          val statFs = StatFs(Environment.getDataDirectory().path)
                          val totalStorageGb = (statFs.totalBytes / (1024.0 * 1024.0 * 1024.0)).roundToInt().coerceAtLeast(16)
                          val freeStorageGb = (statFs.availableBytes / (1024.0 * 1024.0 * 1024.0))
                          val usedStorageGb = (statFs.totalBytes - statFs.availableBytes) / (1024.0 * 1024.0 * 1024.0)
                          val usedStoragePct = ((usedStorageGb / totalStorageGb.toDouble()) * 100.0).roundToInt().coerceIn(1, 99)

                          val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                          val batteryIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          val tempC = (batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 340) ?: 340) / 10.0
                          val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, 78) ?: 78
                          val voltageMv = batteryIntent?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 3920) ?: 3920
                          val plugged = batteryIntent?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0

                          val rawCurrentUa = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW)
                          var currentMa = if (abs(rawCurrentUa) > 50000) rawCurrentUa / 1000 else rawCurrentUa
                          if (currentMa == 0) {
                              currentMa = if (plugged > 0) 2450 else -420
                          } else if (plugged > 0 && currentMa < 0) {
                              currentMa = abs(currentMa)
                          } else if (plugged == 0 && currentMa > 0) {
                              currentMa = -abs(currentMa)
                          }
                          val watt = (abs(currentMa) * voltageMv) / 1000000.0
                          val batGaugeObj = readRealBatteryGaugeData(bm, batteryIntent, level)

                          val dm = DisplayMetrics()
                          @Suppress("DEPRECATION")
                          val display: Display = windowManager.defaultDisplay
                          @Suppress("DEPRECATION")
                          display.getRealMetrics(dm)
                          @Suppress("DEPRECATION")
                          val currentHz = display.refreshRate.toInt()

                          var highestHz = currentHz
                          if (Build.VERSION.SDK_INT >= 23) {
                              display.supportedModes?.forEach { mode ->
                                  if (mode.refreshRate.toInt() > highestHz) {
                                      highestHz = mode.refreshRate.toInt()
                                  }
                              }
                          }
                          maxSupportedHz = highestHz

                          val socModel = if (Build.VERSION.SDK_INT >= 31 && Build.SOC_MODEL != Build.UNKNOWN) {
                              Build.SOC_MODEL
                          } else {
                              val pSoc = readProp("ro.board.platform")
                              if (pSoc.isNotEmpty()) pSoc.uppercase() else Build.HARDWARE.uppercase()
                          }

                          // Quét luôn toàn bộ trạng thái cài đặt thật đang có trên máy!
                          val scannedSystemStates = EmbeddedAdbEngine.scanFullDeviceStateJson(this)
                          val gameWatcherActive = EmbeddedAdbEngine.getToggleMemory(this, "game_space_watcher", false)

                          val payload = JSONObject().apply {
                              put("manufacturer", Build.MANUFACTURER)
                              put("brand", Build.BRAND)
                              put("model", "${Build.MANUFACTURER} ${Build.MODEL}")
                              put("rawModel", Build.MODEL)
                              put("deviceCode", Build.DEVICE)
                              put("board", Build.BOARD)
                              put("soc", socModel)
                              put("cores", Runtime.getRuntime().availableProcessors())
                              put("arch", Build.SUPPORTED_ABIS.firstOrNull() ?: "arm64-v8a")
                              put("android", "Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})")
                              put("customOs", detectCustomOsSkin())
                              put("totalRamMb", totalMb)
                              put("usedRamMb", usedMb)
                              put("availRamMb", availMb)
                              put("totalStorageGb", totalStorageGb)
                              put("usedStorageGb", String.format("%.1f", usedStorageGb))
                              put("freeStorageGb", String.format("%.1f", freeStorageGb))
                              put("usedStoragePct", usedStoragePct)
                              put("tempC", tempC)
                              put("battery", level)
                              put("voltageMv", voltageMv)
                              put("currentMa", currentMa)
                              put("watt", String.format("%.1f", watt))
                              put("batteryGauge", batGaugeObj)
                              put("isCharging", plugged > 0)
                              put("widthPx", dm.widthPixels)
                              put("heightPx", dm.heightPixels)
                              put("dpi", dm.densityDpi)
                              put("hz", currentHz)
                              put("maxHz", maxSupportedHz)
                              put("adbPaired", EmbeddedAdbEngine.isPairedAndConnected)
                              put("stealthVneid", EmbeddedAdbEngine.isStealthVneidActive)
                              put("gameWatcherActive", gameWatcherActive)
                              put("adbMode", EmbeddedAdbEngine.connectionModeLabel)
                              put("pairingPort", EmbeddedAdbEngine.detectedPairingPort)
                              put("connectPort", EmbeddedAdbEngine.detectedConnectPort)
                              put("scannedStates", scannedSystemStates)
                              put("isColdStart", isColdStart)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.receiveNativeDeviceInfo && window.receiveNativeDeviceInfo($payload);", null)
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private fun showNotificationPairingHelper() {
