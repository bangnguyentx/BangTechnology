                      val notif = NotificationCompat.Builder(this, chId)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle("BangOptimize v16.0 • Nhập Mã Ghép Nối")
                          .setContentText("$portHint Bấm nút bên dưới để gõ 6 số.")
                          .addAction(action)
                          .setOngoing(false)
                          .setAutoCancel(true)
                          .build()

                      nm?.notify(2005, notif)
                  } catch (_: Throwable) {}
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && volDownStartTime == 0L) {
                      volDownStartTime = SystemClock.elapsedRealtime()
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && volDownStartTime > 0L) {
                      val heldMs = SystemClock.elapsedRealtime() - volDownStartTime
                      volDownStartTime = 0L
                      if (heldMs >= 3000L) {
                          bgExecutor.execute {
                              EmbeddedAdbEngine.runSafeGraphicRescue(this)
                              mainHandler.post {
                                  Toast.makeText(this, "BangOptimize: Đã khôi phục màn hình gốc!", Toast.LENGTH_LONG).show()
                              }
                          }
                          return true
                      }
                  }
                  return super.onKeyUp(keyCode, event)
              }

