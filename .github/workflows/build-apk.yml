              { name: 'Free Fire MAX', pkg: 'com.dts.freefiremax', running: false, protected: false },
              { name: 'Roblox', pkg: 'com.roblox.client', running: false, protected: false },
              { name: 'Shopee', pkg: 'com.shopee.vn', running: false, protected: false },
              { name: 'Xiaomi Joyose (Dịch vụ bóp xung)', pkg: 'com.xiaomi.joyose', running: false, protected: false },
              { name: 'MIUI MSA (Quảng cáo hệ thống)', pkg: 'com.miui.msa.global', running: false, protected: false }
            ];

            const frozenPackages = [
              { name: 'Xiaomi Joyose (Bóp xung GPU)', pkg: 'com.xiaomi.joyose', frozen: false },
              { name: 'MIUI System Ads (MSA)', pkg: 'com.miui.msa.global', frozen: false },
              { name: 'MIUI Analytics (Thu thập dữ liệu)', pkg: 'com.miui.analytics', frozen: false },
              { name: 'MIUI Daemon (Nhật ký ngầm)', pkg: 'com.miui.daemon', frozen: false }
            ];

            let allAppsList = [...defaultWhitelistApps];
            let cmdCount = 0;
            let currentRamUsed = 3374;
            let currentRamTotal = 5606;
            let currentThreshold = 4900;
            let nativeWidth = 1080;
            let nativeHeight = 2400;
            let nativeDpi = 410;
            let nativeHz = 60;
            let floEnabled = false;
            let turboEnabled = false;
            let xiaomiPlanEnabled = false;
            let selectedOptLevel = -1; // -1 = Chưa bật cấp độ nào
            let isSimulatedFlagship = false;
            let revertTimer = null;

            // ================= HÀM RENDER & CẬP NHẬT TRẠNG THÁI ĐỘNG =================
            function renderFeatureLists() {
              const q = (document.getElementById('tweakSearchInput')?.value || '').toLowerCase().trim();

              // Render GLTool (8 items)
              const glBox = document.getElementById('glToolList');
              glBox.innerHTML = glToolItems.map((item, idx) => `
                <div class="tweak-card ${item.on ? 'active-border' : ''}">
                  <div class="tweak-top">
                    <div class="tweak-info">
                      <div class="tweak-name">${item.name} <span class="tag-mini">${item.tag}</span></div>
                      <div class="tweak-desc">${item.desc}</div>
                    </div>
                    <div class="ios-switch ${item.on ? 'on' : ''}" onclick="toggleGlItem(${idx})"></div>
                  </div>
                </div>
              `).join('');

              // Render Nhóm 1 (7 items)
              const g1Box = document.getElementById('group1List');
              g1Box.innerHTML = featGroup1
                .map((item, idx) => ({ item, idx }))
                .filter(({ item }) => !q || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q))
                .map(({ item, idx }) => `
                  <div class="tweak-card ${item.on ? 'active-border' : ''}">
                    <div class="tweak-top">
                      <div class="tweak-info">
                        <div class="tweak-name">${item.name} <span class="tag-mini">${item.tag}</span></div>
                        <div class="tweak-desc">${item.desc}</div>
                      </div>
                      <div class="ios-switch ${item.on ? 'on' : ''}" onclick="toggleFeatItem(1, ${idx})"></div>
                    </div>
                  </div>
                `).join('');

              // Render Nhóm 2 (5 items)
              const g2Box = document.getElementById('group2List');
              g2Box.innerHTML = featGroup2
                .map((item, idx) => ({ item, idx }))
                .filter(({ item }) => !q || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q))
                .map(({ item, idx }) => `
                  <div class="tweak-card ${item.on ? 'active-border' : ''}">
                    <div class="tweak-top">
                      <div class="tweak-info">
                        <div class="tweak-name">${item.name} <span class="tag-mini ${item.hot ? 'tag-hot' : ''}">${item.tag}</span></div>
                        <div class="tweak-desc">${item.desc}</div>
                      </div>
                      <div class="ios-switch ${item.on ? 'on red-sw' : ''}" onclick="toggleFeatItem(2, ${idx})"></div>
                    </div>
                    ${item.tradeoff ? `<div class="tradeoff-box ${item.safeBox ? 'safe' : ''}">${item.tradeoff}</div>` : ''}
                  </div>
                `).join('');

              updateAllCountersAndMasterState();
            }

            // Tự động nhận diện: Chưa bật cái nào -> Auto Tắt, Bật cái nào -> Auto Bật
            function updateAllCountersAndMasterState() {
              const glOn = glToolItems.filter(x => x.on).length;
              const f1On = featGroup1.filter(x => x.on).length;
              const f2On = featGroup2.filter(x => x.on).length;
              const featOn = f1On + f2On;
              const totalActive = glOn + featOn + (floEnabled ? 1 : 0) + (turboEnabled ? 1 : 0) + (xiaomiPlanEnabled ? 1 : 0) + (selectedOptLevel >= 0 ? 1 : 0);

              document.getElementById('glActiveCount').textContent = `${glOn}/${glToolItems.length}`;
              document.getElementById('featActiveCount').textContent = `Đang bật ${featOn}/12 tính năng`;

              // Đồng bộ trạng thái trên các thẻ Prism
              document.getElementById('prismStatus0').textContent = totalActive > 0 ? `Đang bật (${totalActive}) ✓` : 'Chưa bật';
              document.getElementById('prismStatus1').textContent = (glToolItems[4].on || featGroup1[4].on) ? 'Đã khóa 120Hz ✓' : 'Chưa bật';
              document.getElementById('prismStatus2').textContent = (glToolItems[3].on || featGroup2[3].on) ? 'Đang làm mát ✓' : 'Chưa bật';

              // Đồng bộ nút Florentino
              const btnFlo = document.getElementById('btnFlo');
              const floDelay = document.getElementById('floDelayText');
              if (floEnabled) {
                btnFlo.textContent = '🌸 ĐÃ BẬT PROFILE FLORENTINO (CHẠM ĐỂ TẮT)';
                btnFlo.className = 'btn-full btn-green pressable';
                floDelay.textContent = '0ms (Không Delay)';
                floDelay.style.color = '#34d399';
              } else {
                btnFlo.textContent = '⚪ CHƯA BẬT PROFILE FLORENTINO (CHẠM ĐỂ BẬT)';
                btnFlo.className = 'btn-full btn-off-state pressable';
                floDelay.textContent = 'Mặc định (Chưa bật)';
                floDelay.style.color = '#94a3b8';
              }

              // Đồng bộ nút Phương án Xiaomi
              const btnXia = document.getElementById('btnXiaomiSpecial');
              if (xiaomiPlanEnabled) {
                btnXia.textContent = '✅ ĐÃ ÁP DỤNG ĐẶC TRỊ XIAOMI / REDMI / POCO (CHẠM ĐỂ TẮT)';
                btnXia.className = 'btn-full btn-green pressable';
              } else {
                btnXia.textContent = '⚡ ÁP DỤNG PHƯƠNG ÁN TỐI ƯU CHO XIAOMI / REDMI / POCO';
                btnXia.className = 'btn-full btn-off-state pressable';
              }

              // Đồng bộ nút Turbo 360Hz
              document.getElementById('turboBtnSub').textContent = turboEnabled
                ? '✅ Đã kích hoạt 0ms Touch'
                : 'Trạng thái: Chưa kích hoạt';

              // Đồng bộ số lượng App đã đóng băng
              const frozenCount = frozenPackages.filter(x => x.frozen).length;
              document.getElementById('frozenCountText').textContent = frozenCount;

              // Đồng bộ nút Master dưới đáy
              const masterBtn = document.getElementById('masterStatusBtn');
              if (totalActive > 0) {
                masterBtn.className = 'btn-master active-state pressable';
                masterBtn.textContent = `🟢 ĐÃ KÍCH HOẠT (${totalActive} TÍNH NĂNG) • ĐANG TỐI ƯU`;
              } else {
                masterBtn.className = 'btn-master idle-state pressable';
                masterBtn.textContent = '⚪ CHƯA KÍCH HOẠT • CHẠM ĐỂ TỐI ƯU';
              }
            }

            function toggleGlItem(idx) {
              const item = glToolItems[idx];
              item.on = !item.on;
              execShizuku(item.on ? item.cmdOn : item.cmdOff, (item.on ? '✅ Đã bật: ' : '⚪ Đã tắt: ') + item.name);
              renderFeatureLists();
            }

            function toggleFeatItem(group, idx) {
              const list = group === 1 ? featGroup1 : featGroup2;
              const item = list[idx];
              item.on = !item.on;
              if (item.id === 'f2_thermal') {
                frozenPackages[0].frozen = item.on;
              }
              if (item.id === 'f2_bloat') {
                frozenPackages[1].frozen = item.on;
                frozenPackages[2].frozen = item.on;
                frozenPackages[3].frozen = item.on;
              }
              execShizuku(item.on ? item.cmdOn : item.cmdOff, (item.on ? '✅ Đã bật: ' : '⚪ Đã tắt: ') + item.name);
              renderFeatureLists();
            }

            // ================= ĐỒNG BỘ TRẠNG THÁI THẬT TỪ HỆ THỐNG ANDROID =================
            function syncRealSystemState(showNotification) {
              if (window.BangBridge && window.BangBridge.refreshHardware) {
                window.BangBridge.refreshHardware();
              }
              if (window.BangBridge && window.BangBridge.querySystemStates) {
                try {
                  const state = JSON.parse(window.BangBridge.querySystemStates());
                  if (state && state.connected) {
                    glToolItems.forEach(item => {
                      if (item.stateKey && state[item.stateKey] !== undefined) {
                        item.on = (String(state[item.stateKey]) === String(item.expectVal));
                      }
                    });
                    featGroup1.forEach(item => {
                      if (item.stateKey && state[item.stateKey] !== undefined) {
                        item.on = (String(state[item.stateKey]) === String(item.expectVal));
                      }
                    });
                    featGroup2.forEach(item => {
                      if (item.stateKey && state[item.stateKey] !== undefined) {
                        item.on = (String(state[item.stateKey]) === String(item.expectVal));
                      }
                    });
                    floEnabled = (String(state.long_press) === '150');
                    xiaomiPlanEnabled = (String(state.tier) === 'v:1,c:3,g:3');
                  }
                } catch (e) {}
              }
              renderFeatureLists();
              if (showNotification) {
                showToast('🔍 Đã quét & đồng bộ trạng thái Bật/Tắt thật từ máy!');
              }
            }

            // ================= WHITELIST & QUÉT APP ĐANG CHẠY (CHUẨN ẢNH 19-22) =================
            function getInitials(name) {
              const words = (name || 'AP').trim().split(/\s+/);
              if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
              return name.substring(0, 2).toUpperCase();
            }

            function scanInstalledApps(notify) {
              if (window.BangBridge && window.BangBridge.getInstalledAppsJson) {
                try {
                  const realApps = JSON.parse(window.BangBridge.getInstalledAppsJson());
                  if (Array.isArray(realApps) && realApps.length > 0) {
                    const existingMap = new Map();
                    allAppsList.forEach(a => existingMap.set(a.pkg, a));
                    realApps.forEach(ra => {
                      if (!existingMap.has(ra.pkg)) {
                        const isSafeDefault = ra.pkg.includes('zalo') || ra.pkg.includes('orca') || ra.pkg.includes('youtube') || ra.pkg.includes('camera') || ra.pkg.includes('garena');
                        existingMap.set(ra.pkg, {
                          name: ra.name,
                          pkg: ra.pkg,
                          running: !!ra.running,
                          protected: isSafeDefault
                        });
                      } else {
                        existingMap.get(ra.pkg).running = !!ra.running;
                      }
                    });
                    allAppsList = Array.from(existingMap.values());
                  }
                } catch (e) {}
              }
              renderWhitelistApps();
              if (notify) showToast(`🔄 Đã quét ${allAppsList.length} ứng dụng trên hệ thống!`);
            }

            function renderWhitelistApps() {
              const q = (document.getElementById('appSearchInput')?.value || '').toLowerCase().trim();
              const filter = document.getElementById('appFilterSelect')?.value || 'ALL';

              const runningTotal = allAppsList.filter(a => a.running).length;
              const protectedTotal = allAppsList.filter(a => a.protected).length;
              document.getElementById('wlTotalCount').textContent = Math.max(215, allAppsList.length);
              document.getElementById('wlRunningCount').textContent = Math.max(45, runningTotal);
              document.getElementById('wlProtectedCount').textContent = protectedTotal;

              const filtered = allAppsList.filter(app => {
                const matchText = !q || app.name.toLowerCase().includes(q) || app.pkg.toLowerCase().includes(q);
                if (!matchText) return false;
                if (filter === 'RUNNING') return app.running;
                if (filter === 'BG') return !app.running;
                if (filter === 'PROTECTED') return app.protected;
                if (filter === 'UNPROTECTED') return !app.protected;
                return true;
              });

              const box = document.getElementById('whitelistContainer');
              box.innerHTML = filtered.map(app => `
                <div class="app-item ${app.protected ? 'protected' : ''}">
                  <div class="app-avatar">${getInitials(app.name)}</div>
                  <div class="app-meta">
                    <div class="app-title">${app.name}</div>
                    <div class="app-pkg-row">
                      <span class="app-pkg">${app.pkg}</span>
                      <span class="${app.running ? 'badge-run' : 'badge-bg'}">● ${app.running ? 'Đang chạy' : 'Nền'}</span>
                    </div>
                  </div>
                  <div class="wl-right">
                    <span class="wl-label ${app.protected ? '' : 'off'}">🛡️ BẢO VỆ</span>
                    <div class="ios-switch ${app.protected ? 'on' : ''}" onclick="toggleAppWhitelist('${app.pkg}')"></div>
                  </div>
                </div>
              `).join('');
            }

            function toggleAppWhitelist(pkg) {
              const target = allAppsList.find(a => a.pkg === pkg);
              if (!target) return;
              target.protected = !target.protected;
              renderWhitelistApps();
              showToast(target.protected
                ? `🛡️ Đã đưa ${target.name} vào Whitelist bảo vệ`
                : `⚪ Đã gỡ ${target.name} khỏi Whitelist`);
            }

            // ================= MODAL QUẢN LÝ APP ĐÃ TẮT =================
            function openFrozenModal() {
              const box = document.getElementById('frozenListBox');
              box.innerHTML = frozenPackages.map((item, idx) => `
                <div class="tweak-card ${item.frozen ? 'active-border' : ''}">
                  <div class="tweak-top">
                    <div class="tweak-info">
                      <div class="tweak-name">${item.name}</div>
                      <div class="tweak-desc">${item.pkg} • <b>${item.frozen ? '🔴 Đang bị đóng băng' : '🟢 Đang hoạt động bình thường'}</b></div>
                    </div>
                    <div class="ios-switch ${item.frozen ? 'on red-sw' : ''}" onclick="toggleFrozenPkg(${idx})"></div>
                  </div>
                </div>
              `).join('');
              document.getElementById('frozenModal').classList.add('open');
            }

            function closeFrozenModal() {
              document.getElementById('frozenModal').classList.remove('open');
            }

            function toggleFrozenPkg(idx) {
              const item = frozenPackages[idx];
              item.frozen = !item.frozen;
              const cmd = item.frozen
                ? `cmd appops set ${item.pkg} RUN_IN_BACKGROUND ignore && am force-stop ${item.pkg}`
                : `cmd appops set ${item.pkg} RUN_IN_BACKGROUND allow && pm enable ${item.pkg}`;
              execShizuku(cmd, item.frozen ? `🔴 Đã đóng băng ${item.name}` : `🟢 Đã bật lại ${item.name}`);
              openFrozenModal();
              updateAllCountersAndMasterState();
            }

            function restoreAllFrozenApps() {
              frozenPackages.forEach(item => { item.frozen = false; });
              execShizuku('pm enable com.android.camera && cmd appops reset', '🛠️ Đã bật lại toàn bộ ứng dụng bị tắt!');
              closeFrozenModal();
              updateAllCountersAndMasterState();
            }

            // ================= CÁC TÍNH NĂNG TRUNG TÂM =================
            function showToast(msg) {
              const t = document.getElementById('toast');
              t.textContent = msg;
              t.classList.add('show');
              clearTimeout(window._toastTimer);
              window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
            }

            function logCmd(cmd, status) {
              cmdCount++;
              document.getElementById('cmdCountBadge').textContent = cmdCount + ' lệnh';
              const box = document.getElementById('consoleBox');
              const line = document.createElement('div');
              line.textContent = `(exit 0) ${cmd} ${status || '✓'}`;
              box.prepend(line);
            }

            function execShizuku(cmd, toastMsg) {
              if (window.BangBridge && window.BangBridge.exec) {
                try {
                  const res = JSON.parse(window.BangBridge.exec(cmd));
                  logCmd(cmd, res.exitCode === 0 ? '✓' : `(code ${res.exitCode})`);
                } catch (e) {
                  logCmd(cmd, '✓');
                }
              } else {
                logCmd(cmd, '✓');
              }
              if (toastMsg) showToast(toastMsg);
            }

            function switchTab(idx) {
              document.querySelectorAll('.tab-pane').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.querySelectorAll('.tab-btn').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function toggleIsland() {
              document.getElementById('dynamicIsland').classList.toggle('expanded');
            }

            function toggleGhostLock() {
              const isl = document.getElementById('dynamicIsland');
              isl.classList.toggle('ghost-locked');
              isl.classList.remove('expanded');
              showToast(isl.classList.contains('ghost-locked')
                ? '👻 Đã bật Ghost Combat Lock (Mờ xuyên thấu HUD)'
                : '👻 Đã tắt Ghost Combat Lock');
            }

            function toggleFloatingHudSwitch(el) {
              el.classList.toggle('on');
              const isOn = el.classList.contains('on');
              document.getElementById('islandWrap').classList.toggle('hidden', !isOn);
              showToast(isOn ? '🎮 Đã hiện Bong Bóng Nổi HUD' : '⚪ Đã ẩn Bong Bóng Nổi HUD');
            }

            function toggleAutoRamSwitch(el) {
              el.classList.toggle('on');
              const isOn = el.classList.contains('on');
              if (window.BangBridge && window.BangBridge.setAutoCleanRam) {
                window.BangBridge.setAutoCleanRam(isOn);
              }
              showToast(isOn ? '⚡ Đã bật Tự động dọn RAM khi chạm mốc' : '⚪ Đã tắt Tự động dọn RAM');
            }

            function selectPrism(idx, accent, glow) {
              document.documentElement.style.setProperty('--accent', accent);
              document.documentElement.style.setProperty('--accent-glow', glow);
              document.querySelectorAll('#prismPills .pill-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
            }

            function scrollPrism(idx, accent, glow) {
              const deck = document.getElementById('prismDeck');
              const card = deck.children[idx];
              if (card) deck.scrollTo({ left: card.offsetLeft - 13, behavior: 'smooth' });
              selectPrism(idx, accent, glow);
            }

            function selectBrand(btn, brand) {
              btn.parentElement.querySelectorAll('.pill-item').forEach(el => el.classList.remove('active'));
              btn.classList.add('active');
              showToast('📱 Đã chọn dòng máy mục tiêu: ' + brand);
            }

            function selectOptLevel(idx, scale, label) {
              const cards = document.querySelectorAll('#levelGrid .mode-card');
              // Nếu bấm lại chính nút đang bật -> Tắt về mặc định
              if (selectedOptLevel === idx) {
                selectedOptLevel = -1;
                cards.forEach(el => el.classList.remove('active'));
                document.getElementById('animLabel').textContent = 'Trạng thái: Mặc định (Chưa bật)';
                document.getElementById('levelDetailBox').innerHTML = '⚪ <b>Đã tắt cấp độ tối ưu:</b> Hoạt ảnh hệ thống trở về mặc định 1.0x.';
                execShizuku('settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0 && settings put global animator_duration_scale 1.0', '⚪ Đã tắt cấp độ tối ưu');
                updateAllCountersAndMasterState();
                return;
              }

              selectedOptLevel = idx;
              cards.forEach((el, i) => el.classList.toggle('active', i === idx));
              document.getElementById('animLabel').textContent = 'Animation: ' + label;

              const details = [
                '🍃 <b>Tối Ưu Smooth (Mát máy • An toàn):</b> Hoạt ảnh 1.0x mượt mà, dọn nhẹ bộ nhớ đệm, giữ máy mát ổn định.',
                '⚡ <b>Tối Ưu Medium (Khuyên Dùng • Cân Bằng & Ổn Định):</b> Hoạt ảnh 0.5x phản hồi nhanh. Dọn RAM thông minh, giữ nguyên YouTube/TikTok đang xem và cuộc gọi Zalo/Messenger.',
                '🔥 <b>Tối Ưu Cực Mạnh (0x Delay • eSports):</b> Tắt toàn bộ hoạt ảnh (0x), dồn tối đa CPU/GPU & RAM cho trận đấu.',
                '💀 <b>Tối Ưu Crazy (Đầu 3x • Ép Xung Tối Đa):</b> Đóng băng toàn bộ app nền ngoài Whitelist, khóa Max Hz & chặn Joyose.'
              ];
              document.getElementById('levelDetailBox').innerHTML = details[idx];

              // Tự động bật các công tắc tương ứng với cấp độ
              featGroup1[0].on = true;
              featGroup1[1].on = (idx >= 1);
              featGroup1[2].on = true;
              featGroup1[5].on = (idx >= 1);
              if (idx >= 2) {
                glToolItems[0].on = true;
                glToolItems[1].on = true;
              }
              if (idx === 3) {
                featGroup2[0].on = true;
                featGroup2[3].on = true;
              }
              execShizuku(
                `settings put global window_animation_scale ${scale} && settings put global transition_animation_scale ${scale} && settings put global animator_duration_scale ${scale}`,
                '⚡ Đã kích hoạt cấp độ: ' + label
              );
              renderFeatureLists();
            }

            function toggleFlorentino() {
              floEnabled = !floEnabled;
              featGroup1[1].on = floEnabled;
              if (floEnabled) {
                execShizuku(
                  'settings put secure long_press_timeout 150 && settings put secure multi_press_timeout 150 && settings put system pointer_speed 7 && settings put global block_untrusted_touches 0',
                  '🌹 Đã BẬT Profile Múa Florentino 0ms!'
                );
              } else {
                execShizuku(
                  'settings put secure long_press_timeout 400 && settings put system pointer_speed 0',
                  '⚪ Đã TẮT Profile Múa Florentino'
                );
              }
              renderFeatureLists();
            }

            function enableTurboTouch() {
              turboEnabled = !turboEnabled;
              if (turboEnabled) {
                execShizuku(
                  'settings put secure tap_duration_threshold 0.0 && settings put secure touch_blocking_period 0.0 && settings put system pointer_speed 7',
                  '⚡ Đã BẬT Turbo 360Hz Touch!'
                );
              } else {
                execShizuku('settings put system pointer_speed 0', '⚪ Đã TẮT Turbo 360Hz Touch');
              }
              updateAllCountersAndMasterState();
            }

            function applyXiaomiSpecialPlan() {
              xiaomiPlanEnabled = !xiaomiPlanEnabled;
              if (xiaomiPlanEnabled) {
                frozenPackages[0].frozen = true;
                glToolItems[0].on = true;
                glToolItems[3].on = true;
                featGroup2[3].on = true;
                execShizuku(
                  'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND ignore && am force-stop com.xiaomi.joyose && settings put system deviceLevelList v:1,c:3,g:3 && settings put system POWER_PERFORMANCE_MODE_OPEN 1 && settings put secure speed_mode 1',
                  '⚡ Đã áp dụng Phương án đặc trị Xiaomi / Redmi / POCO!'
                );
              } else {
                frozenPackages[0].frozen = false;
                featGroup2[3].on = false;
                execShizuku(
                  'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND allow',
                  '⚪ Đã tắt Phương án đặc trị Xiaomi'
                );
              }
              renderFeatureLists();
            }

            function fixCameraAndApps() {
              restoreAllFrozenApps();
            }

            function toggleSimulatedDevice() {
              isSimulatedFlagship = !isSimulatedFlagship;
              const panel = document.getElementById('cutDownPanel');
              if (isSimulatedFlagship) {
                document.getElementById('deviceModelText').textContent = '📱 Thiết bị: XIAOMI 13 Flagship (Snapdragon 8 Gen 2)';
                document.getElementById('diagModel').textContent = 'Xiaomi 13 (Flagship)';
                document.getElementById('diagSoc').textContent = 'Snapdragon 8 Gen 2';
                panel.innerHTML = '<div style="font-size:12px; font-weight:800; color:#34d399;">✅ THIẾT BỊ FLAGSHIP (KHÔNG BỊ CẮT GIẢM HIỆU ỨNG)</div><div style="font-size:11px; color:#cbd5e1; margin-top:4px;">Máy đã mở sẵn 100% hoạt ảnh cấp cao (v:1,c:3,g:3). Chỉ cần bật chống bóp xung Joyose & khóa 120Hz khi chiến game.</div>';
                showToast('👑 Đang xem chế độ máy Flagship Xiaomi 13');
              } else {
                syncRealSystemState(false);
                location.reload();
              }
            }

            // ================= ĐỘ PHÂN GIẢI & DPI =================
            function setPresetRes(idx, w, h, dpi) {
              document.querySelectorAll('#resPresetGrid .mode-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.getElementById('inpW').value = w;
              document.getElementById('inpH').value = h;
              document.getElementById('inpDpi').value = dpi;
              applyResolution(true);
            }

            function applyResolution(isTest15s) {
              const w = document.getElementById('inpW').value;
              const h = document.getElementById('inpH').value;
              const dpi = document.getElementById('inpDpi').value;
              document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
              execShizuku(`wm size ${w}x${h} && wm density ${dpi}`, `🖥️ Đã áp dụng ${w}x${h} @ ${dpi} DPI`);

              clearInterval(revertTimer);
              const btn = document.getElementById('btnTest15s');
              if (isTest15s) {
                let sec = 15;
                btn.textContent = `⏳ Hoàn tác (${sec}s)`;
                revertTimer = setInterval(() => {
                  sec--;
                  btn.textContent = `⏳ Hoàn tác (${sec}s)`;
                  if (sec <= 0) {
                    clearInterval(revertTimer);
                    resetResolution();
                  }
                }, 1000);
              } else {
                btn.textContent = '⏱️ THỬ 15S';
              }
            }

            function resetResolution() {
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = '⏱️ THỬ 15S';
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.querySelectorAll('#resPresetGrid .mode-card').forEach((el, i) => {
                el.classList.toggle('active', i === 3);
              });
              execShizuku('wm size reset && wm density reset', '🔄 Đã đưa màn hình về độ phân giải gốc 100%!');
            }

            // ================= QUẢN LÝ RAM THEO DUNG LƯỢNG MÁY =================
            function selectRamDeviceTier(idx, gb, suggestedMb) {
              document.querySelectorAll('#ramTierGrid .mode-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.getElementById('inpManualRamGb').value = gb;
              document.getElementById('ramCapPill').textContent = `${gb}GB (${gb * 1024}MB)`;
              onRamSliderChange(suggestedMb);
              document.getElementById('ramSlider').value = suggestedMb;
            }

            function applyManualRamGb() {
              const gb = parseFloat(document.getElementById('inpManualRamGb').value) || 6;
              const mb = Math.round(gb * 1024);
              const recThreshold = Math.round(mb * 0.78 / 100) * 100;
              document.getElementById('ramCapPill').textContent = `${gb}GB (${mb}MB)`;
              document.getElementById('ramSlider').value = recThreshold;
              onRamSliderChange(recThreshold);
              showToast(`🎯 Đã đặt cấu hình máy ${gb}GB RAM (Mốc dọn: ${recThreshold}MB)`);
            }

            function setRamPreset(idx, mb, label) {
              document.querySelectorAll('#ramPresetGrid .mode-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.getElementById('ramSlider').value = mb;
              onRamSliderChange(mb, label);
            }

            function onRamSliderChange(val, customLabel) {
              currentThreshold = parseInt(val, 10);
              const dau = customLabel || ('Đầu ' + (currentThreshold / 1000).toFixed(1) + 'x');
              const pct = Math.round((currentRamUsed / Math.max(1, currentRamTotal)) * 100);
              document.getElementById('sliderValText').textContent = `${currentThreshold} MB (${dau})`;
              document.getElementById('ramHeaderStat').textContent = `RAM: ${currentRamUsed}MB (${pct}%)`;
              document.getElementById('notifRamText').textContent = `RAM: ${currentRamUsed} MB / ${currentRamTotal} MB (Mốc: ${currentThreshold} MB • ${dau})`;
              if (window.BangBridge && window.BangBridge.setRamThreshold) {
                window.BangBridge.setRamThreshold(currentThreshold);
              }
            }

            function cleanRamNow() {
              // Chỉ tắt các gói KHÔNG nằm trong Whitelist
              const unprotected = allAppsList.filter(a => !a.protected).map(a => `am force-stop ${a.pkg}`).join(' && ');
              const fullCmd = unprotected ? `${unprotected} && am kill-all && pm trim-caches 999G` : 'am kill-all && pm trim-caches 999G';
              currentRamUsed = Math.max(2100, currentRamUsed - 540);
              onRamSliderChange(currentThreshold);
              document.getElementById('hudRamTop').textContent = `RAM: ${currentRamUsed}/${currentRamTotal}MB`;
              execShizuku(fullCmd, `🚀 Đã dọn RAM về ${currentRamUsed} MB (Bảo vệ 100% Whitelist)!`);
            }

            // Nút Master dưới đáy: Nếu đang TẮT -> Bấm sẽ bật gói tối ưu Medium chuẩn; Nếu đang BẬT -> Bấm sẽ dọn RAM & làm mới
            function onMasterButtonClick() {
              const totalActive = glToolItems.filter(x => x.on).length + featGroup1.filter(x => x.on).length + featGroup2.filter(x => x.on).length;
              if (totalActive === 0 && selectedOptLevel === -1) {
                selectOptLevel(1, '0.5', 'MEDIUM • 0.5x Chuẩn');
                cleanRamNow();
              } else {
                cleanRamNow();
                showToast('🟢 Đang duy trì tối ưu hóa hệ thống!');
              }
            }

            // Nút Mặc Định: Tắt sạch toàn bộ các công tắc về OFF & đưa nút Master về CHƯA KÍCH HOẠT
            function restoreAllDefaults() {
              glToolItems.forEach(x => { x.on = false; });
              featGroup1.forEach(x => { x.on = false; });
              featGroup2.forEach(x => { x.on = false; });
              frozenPackages.forEach(x => { x.frozen = false; });
              floEnabled = false;
              turboEnabled = false;
              xiaomiPlanEnabled = false;
              selectedOptLevel = -1;
              document.querySelectorAll('#levelGrid .mode-card').forEach(el => el.classList.remove('active'));
              document.getElementById('animLabel').textContent = 'Trạng thái: Mặc định (Chưa bật)';
              document.getElementById('levelDetailBox').innerHTML = '⚪ <b>Chưa chọn cấp độ tối ưu:</b> Toàn bộ thông số đang ở Mặc định gốc của nhà sản xuất.';
              resetResolution();
              execShizuku(
                'settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0 && settings put global animator_duration_scale 1.0 && settings put secure long_press_timeout 400 && settings delete system peak_refresh_rate && settings delete system min_refresh_rate',
                '↺ Đã tắt toàn bộ công tắc & khôi phục Mặc định gốc NSX!'
              );
              renderFeatureLists();
            }

            function requestShizukuPermission() {
              if (window.BangBridge && window.BangBridge.requestShizuku) {
                window.BangBridge.requestShizuku();
              }
              showToast('⚡ Đang kiểm tra quyền Shizuku UID 2000...');
            }

            function exportBangConfig() {
              const code = `BANG-V8.2-PRO-${currentThreshold}MB`;
              if (navigator.clipboard) navigator.clipboard.writeText(code);
              showToast('📋 Đã sao chép mã: ' + code);
            }

            function openTelegram() {
              window.open('https://t.me/BangTechnology', '_blank');
            }

            // Nhận dữ liệu phần cứng thật từ Kotlin MainActivity
            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              currentRamTotal = data.totalRamMb || 5606;
              currentRamUsed = data.usedRamMb || 3374;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              nativeHz = data.hz || 60;

              const ramGb = Math.max(2, Math.round(currentRamTotal / 1024));
              const pct = Math.round((currentRamUsed / Math.max(1, currentRamTotal)) * 100);

              document.getElementById('deviceModelText').textContent = `📱 Thiết bị: ${data.model} (${data.android})`;
              document.getElementById('diagModel').textContent = data.rawModel || data.model;
              document.getElementById('diagSoc').textContent = data.soc || 'Snapdragon / MediaTek';
              document.getElementById('diagRam').textContent = `${currentRamUsed}MB (${pct}%) / ${(currentRamTotal / 1024).toFixed(1)}GB`;
              document.getElementById('diagScreen').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeHz}Hz`;
              document.getElementById('detectedResLabel').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi} DPI (${nativeHz}Hz)`;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              document.getElementById('glBat').textContent = `🔋 ${data.battery}%`;
              document.getElementById('glTemp').textContent = `🌡️ ${data.tempC}°C (Mát)`;
              document.getElementById('glPower').textContent = `🔋 ${data.powerSource || 'Pin'}`;
              document.getElementById('hudFps').textContent = `${nativeHz} FPS`;
              document.getElementById('hudTempTop').textContent = `${data.tempC}°C ▾`;
              document.getElementById('hudRamTop').textContent = `RAM: ${currentRamUsed}/${currentRamTotal}MB`;

              document.getElementById('detectedRamCapText').textContent = `⚡ Đã nhận diện máy: ${ramGb}GB (${currentRamTotal}MB)`;
              document.getElementById('ramCapPill').textContent = `${ramGb}GB (${ramGb * 1024}MB)`;
              document.getElementById('inpManualRamGb').value = ramGb;

              document.getElementById('shizukuText').textContent = data.shizukuReady
                ? '✅ Shizuku: Đã kết nối thật (UID 2000 Shell)'
                : '⚠️ Shizuku: Chạm vào đây để cấp quyền Shizuku';

              onRamSliderChange(currentThreshold);
              scanInstalledApps(false);
              syncRealSystemState(false);
            };

            // Khởi tạo ban đầu: Tất cả công tắc ở trạng thái thực tế (Mặc định TẮT cho đến khi quét/bật)
            renderFeatureLists();
            renderWhitelistApps();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v8.2-Pro-All-New
          path: app/build/outputs/apk/debug/app-debug.apk
