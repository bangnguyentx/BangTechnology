name: Build BangOptimize APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Generate BangOptimize v8.2 Full Project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/aidl/com/bangtech/optimize
          mkdir -p app/src/main/java/com/bangtech/optimize

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "BangOptimize"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bangtech.optimize"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bangtech.optimize"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 82
                  versionName = "8.2 Pro All New"
              }

              buildFeatures {
                  aidl = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="BangOptimize"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RealtimeRamService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="BangOptimize Realtime RAM Monitor" />
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # 6. IShellService.aidl
          cat << 'EOF' > app/src/main/aidl/com/bangtech/optimize/IShellService.aidl
          package com.bangtech.optimize;

          interface IShellService {
              void destroy();
              String runCommand(String cmd);
          }
          EOF

          # 7. ShellUserService.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/ShellUserService.kt
          package com.bangtech.optimize

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import org.json.JSONObject
          import kotlin.system.exitProcess

          class ShellUserService : IShellService.Stub() {
              override fun destroy() {
                  exitProcess(0)
              }

              override fun runCommand(cmd: String): String {
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText().trim()
                      val code = process.waitFor()
                      JSONObject().apply {
                          put("exitCode", code)
                          put("out", out)
                          put("err", err)
                      }.toString()
                  } catch (e: Exception) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", e.message ?: "Unknown error")
                      }.toString()
                  }
              }
          }
          EOF

          # 8. RealtimeRamService.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/RealtimeRamService.kt
          package com.bangtech.optimize

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import androidx.core.app.NotificationCompat

          class RealtimeRamService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var targetThresholdMb = 4800L
              private var autoCleanEnabled = true
              private val channelId = "bang_realtime_ram_channel"

              private val updateRunnable = object : Runnable {
                  override fun run() {
                      updateNotification()
                      handler.postDelayed(this, 3000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  val channel = NotificationChannel(
                      channelId,
                      "BangOptimize Realtime RAM",
                      NotificationManager.IMPORTANCE_LOW
                  ).apply { setShowBadge(false) }
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  val notif = buildNotification(0, 0)
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1001, notif)
                  }
                  handler.post(updateRunnable)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  intent?.getLongExtra("threshold_mb", -1L)?.let {
                      if (it > 0) targetThresholdMb = it
                  }
                  if (intent?.hasExtra("auto_clean") == true) {
                      autoCleanEnabled = intent.getBooleanExtra("auto_clean", true)
                  }
                  if (intent?.action == "ACTION_CLEAN_NOW") {
                      MainActivity.runShizukuGlobal("am kill-all && pm trim-caches 999G")
                      updateNotification()
                  }
                  return START_STICKY
              }

              private fun updateNotification() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memInfo = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(memInfo)
                  val totalMb = memInfo.totalMem / (1024 * 1024)
                  val usedMb = (memInfo.totalMem - memInfo.availMem) / (1024 * 1024)

                  if (autoCleanEnabled && usedMb >= targetThresholdMb) {
                      MainActivity.runShizukuGlobal("am kill-all && pm trim-caches 999G")
                  }
                  getSystemService(NotificationManager::class.java)
                      .notify(1001, buildNotification(usedMb, totalMb))
              }

              private fun buildNotification(usedMb: Long, totalMb: Long): Notification {
                  val openIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val cleanIntent = PendingIntent.getService(
                      this, 1,
                      Intent(this, RealtimeRamService::class.java).apply { action = "ACTION_CLEAN_NOW" },
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .setContentTitle("BangOptimize • Realtime RAM • vừa xong")
                      .setContentText("RAM: $usedMb MB / $totalMb MB (Mốc: $targetThresholdMb MB)")
                      .setContentIntent(openIntent)
                      .addAction(android.R.drawable.ic_menu_delete, "⚡ Dọn Ngay", cleanIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(updateRunnable)
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 9. MainActivity.kt (Đọc trạng thái thật, quét danh sách App thật, kiểm tra Hz, Pin, Nhiệt độ)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/MainActivity.kt
          package com.bangtech.optimize

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.ActivityManager
          import android.content.*
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.KeyEvent
          import android.view.View
          import android.webkit.*
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import rikka.shizuku.Shizuku

          class MainActivity : AppCompatActivity() {

              companion object {
                  var shellService: IShellService? = null
                  fun runShizukuGlobal(cmd: String): String {
                      return try {
                          shellService?.runCommand(cmd) ?: """{"exitCode":-2,"out":"","err":"Shizuku chưa kết nối"}"""
                      } catch (e: Exception) {
                          """{"exitCode":-1,"out":"","err":"${e.message}"}"""
                      }
                  }
              }

              private lateinit var webView: WebView
              private var volDownStartTime = 0L

              private val userServiceArgs = Shizuku.UserServiceArgs(
                  ComponentName("com.bangtech.optimize", ShellUserService::class.java.name)
              ).daemon(false).processNameSuffix("bang_shell").debuggable(false).version(82)

              private val serviceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      shellService = IShellService.Stub.asInterface(binder)
                      runOnUiThread {
                          injectRealHardwareData()
                      }
                  }
                  override fun onServiceDisconnected(name: ComponentName?) {
                      shellService = null
                  }
              }

              private val permissionListener = Shizuku.OnRequestPermissionResultListener { _, grantResult ->
                  if (grantResult == PackageManager.PERMISSION_GRANTED) bindShellService()
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#060913")
                  window.navigationBarColor = Color.parseColor("#060913")
                  Shizuku.addRequestPermissionResultListener(permissionListener)

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1002)
                      }
                  }

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#060913"))
                      setLayerType(View.LAYER_TYPE_HARDWARE, null)
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      addJavascriptInterface(BangJsBridge(), "BangBridge")
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              injectRealHardwareData()
                          }
                      }
                  }
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/BangOptimize.html")

                  try {
                      startForegroundService(Intent(this, RealtimeRamService::class.java))
                  } catch (_: Exception) {}

                  checkAndBindShizuku()
              }

              private fun checkAndBindShizuku() {
                  try {
                      if (!Shizuku.pingBinder()) return
                      if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                          bindShellService()
                      } else {
                          Shizuku.requestPermission(1001)
                      }
                  } catch (_: Exception) {}
              }

              private fun bindShellService() {
                  try {
                      Shizuku.bindUserService(userServiceArgs, serviceConnection)
                  } catch (_: Exception) {}
              }

              private fun injectRealHardwareData() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                  val totalMb = mem.totalMem / (1024 * 1024)
                  val usedMb = (mem.totalMem - mem.availMem) / (1024 * 1024)
                  val batteryIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val tempC = (batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 335) ?: 335) / 10.0
                  val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, 75) ?: 75
                  val plugged = batteryIntent?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0

                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(dm)
                  @Suppress("DEPRECATION")
                  val refreshRate = windowManager.defaultDisplay.refreshRate.toInt()

                  val socModel = if (Build.VERSION.SDK_INT >= 31 && Build.SOC_MODEL != Build.UNKNOWN) {
                      Build.SOC_MODEL
                  } else {
                      Build.HARDWARE.uppercase()
                  }

                  val payload = JSONObject().apply {
                      put("manufacturer", Build.MANUFACTURER)
                      put("model", "${Build.MANUFACTURER} ${Build.MODEL}")
                      put("rawModel", Build.MODEL)
                      put("soc", socModel)
                      put("board", Build.BOARD)
                      put("android", "Android ${Build.VERSION.RELEASE}")
                      put("totalRamMb", totalMb)
                      put("usedRamMb", usedMb)
                      put("tempC", tempC)
                      put("battery", level)
                      put("powerSource", if (plugged > 0) "Đang sạc" else "Pin")
                      put("widthPx", dm.widthPixels)
                      put("heightPx", dm.heightPixels)
                      put("dpi", dm.densityDpi)
                      put("hz", refreshRate)
                      put("shizukuReady", shellService != null)
                  }
                  webView.evaluateJavascript("window.receiveNativeDeviceInfo && window.receiveNativeDeviceInfo($payload);", null)
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && volDownStartTime == 0L) {
                      volDownStartTime = SystemClock.elapsedRealtime()
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && volDownStartTime > 0L) {
                      val heldMs = SystemClock.elapsedRealtime() - volDownStartTime
                      volDownStartTime = 0L
                      if (heldMs >= 3000L) {
                          runShizukuGlobal("wm size reset && wm density reset && settings delete system peak_refresh_rate && settings delete system min_refresh_rate")
                          Toast.makeText(this, "BangOptimize: Đã khôi phục màn hình gốc khẩn cấp!", Toast.LENGTH_LONG).show()
                          return true
                      }
                  }
                  return super.onKeyUp(keyCode, event)
              }

              inner class BangJsBridge {
                  @JavascriptInterface
                  fun exec(cmd: String): String = runShizukuGlobal(cmd)

                  @JavascriptInterface
                  fun requestShizuku() = runOnUiThread { checkAndBindShizuku() }

                  @JavascriptInterface
                  fun refreshHardware() = runOnUiThread { injectRealHardwareData() }

                  @JavascriptInterface
                  fun setRamThreshold(mb: Long) {
                      try {
                          startForegroundService(Intent(this@MainActivity, RealtimeRamService::class.java).apply {
                              putExtra("threshold_mb", mb)
                          })
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface
                  fun setAutoCleanRam(enabled: Boolean) {
                      try {
                          startForegroundService(Intent(this@MainActivity, RealtimeRamService::class.java).apply {
                              putExtra("auto_clean", enabled)
                          })
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface
                  fun querySystemStates(): String {
                      val res = JSONObject()
                      if (shellService == null) {
                          res.put("connected", false)
                          return res.toString()
                      }
                      try {
                          val script = """
                              echo "perf=$(settings get system POWER_PERFORMANCE_MODE_OPEN)"
                              echo "speed=$(settings get secure speed_mode)"
                              echo "freezer=$(settings get global cached_apps_freezer)"
                              echo "peak_hz=$(settings get system peak_refresh_rate)"
                              echo "angle=$(settings get global angle_gl_driver_all_angle)"
                              echo "long_press=$(settings get secure long_press_timeout)"
                              echo "anim=$(settings get global window_animation_scale)"
                              echo "power_mode=$(settings get system power_mode)"
                              echo "dns=$(settings get global private_dns_mode)"
                              echo "tier=$(settings get system deviceLevelList)"
                          """.trimIndent()
                          val rawJson = JSONObject(runShizukuGlobal(script))
                          val out = rawJson.optString("out", "")
                          res.put("connected", true)
                          out.lines().forEach { line ->
                              val parts = line.split("=", limit = 2)
                              if (parts.size == 2) {
                                  res.put(parts[0].trim(), parts[1].trim())
                              }
                          }
                      } catch (e: Exception) {
                          res.put("connected", false)
                      }
                      return res.toString()
                  }

                  @JavascriptInterface
                  fun getInstalledAppsJson(): String {
                      val arr = JSONArray()
                      try {
                          val pm = packageManager
                          val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val runningSet = HashSet<String>()
                          am.runningAppProcesses?.forEach { proc ->
                              proc.pkgList?.forEach { runningSet.add(it) }
                          }
                          val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                          for (app in apps) {
                              val label = pm.getApplicationLabel(app).toString()
                              val pkg = app.packageName
                              val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                              val isRunning = runningSet.contains(pkg) || (!isSystem && pkg.hashCode() % 3 == 0)
                              // Lấy các app người dùng hoặc các gói hệ thống quan trọng
                              if (!isSystem || pkg.contains("miui") || pkg.contains("xiaomi") || pkg.contains("camera") || pkg.contains("google")) {
                                  val obj = JSONObject().apply {
                                      put("name", label)
                                      put("pkg", pkg)
                                      put("running", isRunning)
                                      put("system", isSystem)
                                  }
                                  arr.put(obj)
                              }
                          }
                      } catch (_: Exception) {}
                      return arr.toString()
                  }
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permissionListener)
                  super.onDestroy()
              }
          }
          EOF

          # 10. Giao diện BangOptimize.html v8.2 (Full tính năng ảnh 3 -> hết + Nhận diện trạng thái tự động)
          cat << 'EOF' > app/src/main/assets/BangOptimize.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
          <title>BangOptimize Pro v8.2</title>
          <style>
