                  <div class="stat-well-val" id="liveMaBox" style="color:#34D399;">-410 mA</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Công suất</div>
                  <div class="stat-well-val" id="liveWattBox" style="color:#38BDF8;">1.6 W</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Điện áp</div>
                  <div class="stat-well-val" id="liveMvBox">3950 mV</div>
                </div>
              </div>

              <div style="background:var(--bg-well); border:1px solid var(--border-hairline); border-radius:14px; padding:10px; margin-bottom:8px;">
                <svg width="100%" height="84" viewBox="0 0 300 84" fill="none">
                  <line x1="0" y1="20" x2="300" y2="20" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>
                  <line x1="0" y1="42" x2="300" y2="42" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>
                  <line x1="0" y1="64" x2="300" y2="64" stroke="rgba(255,255,255,0.06)"/>
                  <polyline id="polyTempLine" fill="none" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" points="0,46 300,46"/>
                  <polyline id="polyCurrentLine" fill="none" stroke="#38BDF8" stroke-width="2.0" stroke-linecap="round" points="0,60 300,60"/>
                </svg>
                <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px;">
                  <span style="color:#F97316;">━ Nhiệt độ Pin (°C)</span>
                  <span style="color:#38BDF8;">━ Công suất & Dòng sạc (mA / W)</span>
                </div>
              </div>

              <button class="btn-emerald-action tap-spring" onclick="runEmergencyCoolDown()">
                ❄️ Hạ Nhiệt Khẩn Cấp 1-Chạm (Đóng băng đồng bộ nền · Giảm 3-5°C)
              </button>
            </div>

            <!-- Dung lượng và Sức khỏe Pin + Theo dõi hao pin (Chuẩn Video Toolkit 01:02 - 01:04) -->
            <div class="bento-card">
              <div class="sec-row">
                <span class="sec-heading">🔋 Dung lượng và sức khỏe pin</span>
                <span class="badge-status-ok" id="batHealthStatusTag">Tốt</span>
              </div>

              <div class="grid-2" style="margin-bottom:10px;">
                <div class="stat-well">
                  <div class="stat-well-label">Dung lượng thiết kế</div>
                  <div class="stat-well-val" id="batDesignMah">5.000 mAh</div>
                  <div class="stat-well-label" style="margin-top:8px;">Dung lượng thực tế</div>
                  <div class="stat-well-val" id="batActualMah" style="color:#38BDF8;">4.550 mAh</div>
                </div>
                <div class="stat-well" style="display:flex; flex-direction:column; justify-content:center;">
                  <div class="stat-well-label">Sức khỏe theo dung lượng</div>
                  <div id="batHealthPct" style="font-size:28px; font-weight:900; color:#34D399; margin-top:4px;">91%</div>
                  <div style="font-size:10px; color:var(--text-secondary); margin-top:4px;">Đọc từ thông kế hệ thống</div>
                </div>
              </div>

              <!-- Theo dõi hao pin theo thời gian -->
              <div style="background:var(--bg-well); border:1px solid var(--border-hairline); border-radius:15px; padding:12px;">
                <div class="sec-row" style="margin-bottom:6px;">
                  <span style="font-size:12.5px; font-weight:800;">⏱️ Theo dõi mức hao pin trong phiên</span>
                  <button class="badge-status-ok tap-spring" onclick="resetBatteryDrainSession()">🔄 Theo dõi lại</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div id="drainDeltaText" style="font-size:22px; font-weight:900; color:#34D399;">-0%</div>
                    <div id="drainDurationText" style="font-size:10.5px; color:var(--text-secondary);">Bắt đầu lúc vừa mở ứng dụng</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:11px; color:var(--text-secondary);">Bắt đầu ➔ Hiện tại</div>
                    <div id="drainStartEndText" style="font-size:13px; font-weight:800;">78% ➔ 78%</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Mạng eSports & Tắt Vị Trí (Giữ nguyên Bluetooth 100% - Đã xóa toàn bộ chữ code thô) -->
            <div class="bento-card">
              <div class="sec-row">
                <div>
                  <div class="sec-heading">📶 Tối ưu Mạng & Chống nhảy Ping</div>
                  <div class="sec-sub">Bảo toàn kết nối tai nghe Bluetooth 100%</div>
                </div>
                <button class="badge-status-ok tap-spring" onclick="testRealPingNow()">⚡ Đo Ping Thật</button>
              </div>

              <div class="grid-3" style="margin-bottom:10px;">
                <div class="stat-well">
                  <div class="stat-well-label">Máy chủ Game</div>
                  <div class="stat-well-val" id="pingGarenaVal" style="color:#34D399;">18 ms</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Cloudflare DNS</div>
                  <div class="stat-well-val" id="pingCfVal" style="color:#38BDF8;">14 ms</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Google DNS</div>
                  <div class="stat-well-val" id="pingGoogleVal">21 ms</div>
                </div>
              </div>

              <div class="tweak-item">
                <div class="tweak-top">
                  <div>
                    <div class="tweak-title">📍 Tắt định vị GPS & Quét mạng ngầm</div>
                    <div class="tweak-desc">Ngăn dịch vụ vị trí quét ngầm gây vọt ping đỏ khi đang giao tranh mà vẫn giữ nguyên kết nối Bluetooth</div>
                  </div>
                  <div class="v14-switch" onclick="toggleCleanSwitch(this, 'settings put secure location_mode 0 && settings put global wifi_scan_always_enabled 0', 'settings put secure location_mode 3', 'Đã tắt quét vị trí ngầm (Giữ Bluetooth 100%)')"></div>
                </div>
              </div>

              <div class="tweak-item" style="margin-bottom:0;">
                <div class="tweak-top">
                  <div>
                    <div class="tweak-title">🚀 Ưu tiên đường truyền Game 5GHz</div>
                    <div class="tweak-desc">Giữ bộ thu phát Wi-Fi hoạt động ở công suất tối đa, ngăn nghỉ ngầm gây trễ gói tin</div>
                  </div>
                  <div class="v14-switch" onclick="toggleCleanSwitch(this, 'settings put global wifi_sleep_policy 2 && settings put secure speed_mode 1', 'settings put secure speed_mode 0', 'Đã bật ưu tiên đường truyền Game')"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- ================= TAB 4: QUẢN LÝ RAM, WHITELIST & NHẬT KÝ ================= -->
          <div id="tab-4" class="tab-pane">
            <div class="bento-card">
              <div class="sec-row">
                <span class="sec-heading">🧠 Mốc tự động giải phóng RAM</span>
                <span class="badge-status-ok" id="sliderValText">4800 MB (Đầu 4.8x)</span>
              </div>
              <input id="ramSlider" type="range" min="2200" max="8000" step="100" value="4800" style="width:100%; margin:10px 0;" oninput="onRamSliderChange(this.value)" />
              <button class="btn-full-action tap-spring" style="background:#F8FAFC; color:#07090F;" onclick="cleanRamNow()">
                🚀 Giải phóng RAM ngay (Giữ nguyên ứng dụng đang dùng & Whitelist)
              </button>
            </div>

            <div class="bento-card">
              <div class="sec-row">
                <span class="sec-heading">🛡️ Danh sách ứng dụng bảo vệ (Whitelist)</span>
                <button class="badge-status-ok tap-spring" onclick="rescanDeviceGamesNow()">🔄 Làm mới</button>
              </div>
              <input id="appSearchInput" class="num-input" style="text-align:left; margin-bottom:8px;" type="text" placeholder="🔍 Tìm tên ứng dụng trong máy..." oninput="renderWhitelistApps()" />
              <div id="whitelistContainer" style="max-height:240px; overflow-y:auto;"></div>
            </div>

            <div class="bento-card">
              <div class="sec-row">
                <span class="sec-heading">💻 Nhật ký lịch sử và kết quả</span>
                <span class="badge-status-ok" id="cmdCountBadge">0 tác vụ</span>
              </div>
              <div id="consoleBox" style="font-family:monospace; font-size:11px; background:var(--bg-well); border:1px solid var(--border-hairline); border-radius:12px; padding:11px; color:var(--text-secondary); max-height:160px; overflow-y:auto; line-height:1.5; margin-bottom:8px;">
                ✓ BangOptimize v14.0 All-In-One đã khởi tạo.<br>
                ✓ Chế độ Socket Nội Bộ & Ẩn ADB bảo vệ VNeID / Ngân hàng đã sẵn sàng.
              </div>
              <button class="btn-full-action tap-spring" style="color:#FDA4AF;" onclick="restoreAllDefaults()">
                ↺ Khôi phục toàn bộ cài đặt về mặc định ban đầu
              </button>
            </div>
          </div>

          <!-- ================= THANH ĐIỀU HƯỚNG 5 TAB KÍNH LỎNG DƯỚI ĐÁY ================= -->
          <nav class="bottom-nav-dock">
            <div id="glassNavBar" class="glass-dock-track">
              <div id="navLiquidLens" class="dock-sliding-lens"></div>
              <button class="dock-tab-btn active" onclick="switchTab(0)"><span>Trang chủ</span></button>
              <button class="dock-tab-btn" onclick="switchTab(1)"><span>Game Hub</span></button>
              <button class="dock-tab-btn" onclick="switchTab(2)"><span>Tối ưu</span></button>
              <button class="dock-tab-btn" onclick="switchTab(3)"><span>Pin & Mạng</span></button>
              <button class="dock-tab-btn" onclick="switchTab(4)"><span>RAM & Log</span></button>
            </div>
          </nav>

          <script>
            let cmdCount = 0;
            let currentSixDigits = "";
            let nativeWidth = 1080, nativeHeight = 2400, nativeDpi = 410;
            let sessionStartBattery = -1;
            let sessionStartTimeMs = Date.now();
            let lastBatteryPct = 78;
            let revertTimer = null;

            function hapticTick() {
              if (window.BangBridge && window.BangBridge.triggerHaptic) window.BangBridge.triggerHaptic();
            }

            function toggleLightDarkTheme() {
              hapticTick();
              document.body.classList.toggle('light-mode');
              showToast(document.body.classList.contains('light-mode') ? '☀️ Đã chuyển sang Giao diện Sáng' : '🌙 Đã chuyển sang Giao diện Tối');
            }

            // ================= 1. KẾT NỐI SOCKET NỘI BỘ & ẨN ADB (BYPASS VNeID / NGÂN HÀNG) =================
            function activateDirectSocketNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.activateDirectSocketMode) {
                const res = JSON.parse(window.BangBridge.activateDirectSocketMode());
                closePairModal();
                updateAdbStatusUI(true, res.mode);
                showToast('⚡ ' + res.msg);
              } else {
                closePairModal();
                updateAdbStatusUI(true, 'Socket Nội Bộ (Offline Ready)');
                showToast('⚡ Đã kết nối Socket nội bộ không cần mạng!');
              }
            }

            function toggleStealthVneidSwitch(el) {
              hapticTick();
              el.classList.toggle('on');
              const isOn = el.classList.contains('on');
              if (window.BangBridge && window.BangBridge.toggleStealthVneidMode) {
                const msg = window.BangBridge.toggleStealthVneidMode(isOn);
                appendLog(isOn ? 'Kích hoạt ẩn trạng thái ADB cho VNeID & Ngân hàng' : 'Hiện lại Tùy chọn nhà phát triển', 'STEALTH');
                showToast('🛡️ ' + msg);
              } else {
                showToast(isOn ? '🛡️ Đã ẩn ADB — Mở VNeID & Ngân hàng không bị chặn!' : 'Đã tắt chế độ ẩn ADB');
              }
            }

            // ================= 2. VÒNG TRÒN TIẾN TRÌNH (PIN / RAM / BỘ NHỚ) =================
            function setRingProgress(circleId, textId, pct) {
              const clamped = Math.max(0, Math.min(100, Math.round(pct)));
              const circle = document.getElementById(circleId);
              const txt = document.getElementById(textId);
              if (circle) {
                const circumference = 150.8;
                const offset = circumference - (clamped / 100) * circumference;
                circle.setAttribute('stroke-dashoffset', offset.toFixed(1));
              }
              if (txt) txt.textContent = clamped + '%';
            }

            // ================= 3. GAME HUB TỰ DÒ TRONG MÁY (ICON STREAM 0KB) =================
            const presetPopularGames = [
              { name: 'Liên Quân Mobile', pkg: 'com.garena.game.kgvn', res: '720x1600:293', mode: 'Tần số cao · Cảm ứng 0ms', installed: false, icon: '' },
              { name: 'Free Fire MAX', pkg: 'com.dts.freefiremax', res: '720x1600:293', mode: 'Nhạy tâm · Mượt màn hình', installed: false, icon: '' },
              { name: 'PUBG Mobile VNG', pkg: 'com.vng.pubgmobile', res: '720x1600:293', mode: 'Tần số cao · Cảm ứng 0ms', installed: false, icon: '' },
              { name: 'Roblox', pkg: 'com.roblox.client', res: '540x1200:220', mode: 'Hạ nhiệt · Ổn định FPS', installed: false, icon: '' },
              { name: 'Genshin Impact', pkg: 'com.miHoYo.GenshinImpact', res: '720x1600:293', mode: 'Hạ nhiệt · Ổn định FPS', installed: false, icon: '' },
              { name: 'Delta Force', pkg: 'com.proxima.dfm', res: '720x1600:293', mode: 'Tần số cao · Cảm ứng 0ms', installed: false, icon: '' }
            ];

            let userSavedGames = [];
            try {
              const saved = localStorage.getItem('bang_v14_custom_games');
              if (saved) userSavedGames = JSON.parse(saved);
            } catch (e) {}

            let detectedInstalledGames = [];
            let allScannedDeviceApps = [];

            function saveCustomGamesToStorage() {
              try {
                localStorage.setItem('bang_v14_custom_games', JSON.stringify(userSavedGames));
              } catch (e) {}
            }

            function rescanDeviceGamesNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.scanAppsAndGamesAsync) {
                window.BangBridge.scanAppsAndGamesAsync();
                showToast('🔍 Đang dò tìm các Game đã cài trên máy...');
              } else {
                renderGameHubList();
              }
            }

            window.onDeviceGamesAndAppsScanned = function(payload) {
              if (!payload) return;
              const scannedGames = payload.games || [];
              const scannedApps = payload.apps || [];

              detectedInstalledGames = scannedGames.map(g => ({
                name: g.name,
                pkg: g.pkg,
                res: '720x1600:293',
                mode: 'Tần số cao · Cảm ứng 0ms',
                installed: true,
                icon: g.icon || ''
              }));

              allScannedDeviceApps = scannedApps.map(a => ({
                name: a.name,
                pkg: a.pkg,
                running: !!a.running,
                isGame: !!a.isGame,
                icon: a.icon || '',
                protected: a.pkg.includes('zalo') || a.pkg.includes('orca') || a.pkg.includes('youtube') || a.pkg.includes('camera') || a.pkg.includes('garena') || a.pkg.includes('bangtech')
              }));

              renderGameHubList();
              renderWhitelistApps();
              renderInstalledAppPicker();
            };

            function getMergedGameList() {
              const map = new Map();
              detectedInstalledGames.forEach(g => map.set(g.pkg, { ...g, installed: true }));
              userSavedGames.forEach(g => {
                const existing = map.get(g.pkg);
                map.set(g.pkg, {
                  ...g,
                  installed: existing ? true : !!g.installed,
                  icon: (existing && existing.icon) ? existing.icon : (g.icon || '')
                });
              });
              presetPopularGames.forEach(g => {
                if (!map.has(g.pkg)) {
                  const foundInAll = allScannedDeviceApps.find(a => a.pkg === g.pkg);
                  map.set(g.pkg, {
                    ...g,
                    installed: !!foundInAll,
                    icon: foundInAll ? foundInAll.icon : ''
                  });
                }
              });
              return Array.from(map.values());
            }

            function renderGameHubList() {
              const list = getMergedGameList();
              const installedCount = list.filter(x => x.installed).length;
              document.getElementById('gameScanSubtitle').textContent = installedCount > 0
                ? `Đã phát hiện ${installedCount} game cài trên máy · Tổng ${list.length} cấu hình`
                : `Danh sách ${list.length} cấu hình Game (Bấm + Thêm Game để chọn từ máy)`;

              const box = document.getElementById('gameHubContainer');
              box.innerHTML = list.map(g => {
                const initials = (g.name || 'GM').substring(0, 2).toUpperCase();
                const iconHtml = g.icon
                  ? `<img src="${g.icon}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='${initials}';" />`
                  : `<span>${initials}</span>`;
                const badgeText = g.installed ? '✓ Đã cài trên máy' : 'Cấu hình mẫu';
                const badgeColor = g.installed ? '#34D399' : '#94A3B8';

                return `
                  <div class="game-card-item">
                    <div class="game-icon-box">${iconHtml}</div>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${g.name}</div>
                      <div style="font-size:10.5px; color:${badgeColor}; font-weight:700; margin-top:2px;">${badgeText} · ${g.mode || 'Tần số cao'}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
                      <button class="btn-launch-game tap-spring" onclick="boostAndLaunchGameByPkg('${g.pkg}', '${g.name.replace(/'/g, "")}', '${g.res || "720x1600:293"}')">
                        ⚡ Tối ưu & Mở
                      </button>
                      <button style="font-size:10px; color:#FDA4AF;" onclick="removeGameFromHub('${g.pkg}')">Xóa ✕</button>
                    </div>
                  </div>
                `;
              }).join('');
            }

            function boostAndLaunchGameByPkg(pkg, name, resSpec) {
              hapticTick();
              const parts = (resSpec || '720x1600:293').split(':');
              const wh = parts[0] || '720x1600';
              const dpi = parts[1] || '293';
              const boostCmd = `cmd game mode performance ${pkg} && cmd package compile -m speed-profile -f ${pkg} && wm size ${wh} && wm density ${dpi} && settings put secure long_press_timeout 150 && settings put system pointer_speed 7 && am kill-all`;

              if (window.BangBridge && window.BangBridge.launchAndBoostGame) {
                const opened = window.BangBridge.launchAndBoostGame(pkg, boostCmd);
                appendLog(`Tối ưu và khởi chạy ${name}`, opened ? 'ĐÃ MỞ GAME' : 'ĐÃ TỐI ƯU');
                showToast(opened ? `🚀 Đã tối ưu & đang mở ${name}!` : `⚡ Đã áp dụng cấu hình cho ${name}`);
              } else {
                showToast(`⚡ Đã kích hoạt cấu hình eSports cho ${name}!`);
              }
            }

            function openAddGameModal() {
              hapticTick();
              document.getElementById('addGameModal').classList.add('open');
              renderInstalledAppPicker();
            }
            function closeAddGameModal() {
              document.getElementById('addGameModal').classList.remove('open');
            }

            function addManualGameToHub() {
              hapticTick();
              const nameInput = document.getElementById('inpCustomGameName').value.trim();
              let pkgInput = document.getElementById('inpCustomGamePkg').value.trim();
              const resSpec = document.getElementById('selCustomGameRes').value;
              const modeSpec = document.getElementById('selCustomGameMode').value;

              if (!nameInput) {
                showToast('Hãy nhập tên Game cần thêm!');
                return;
              }
              if (!pkgInput) {
                const matchedApp = allScannedDeviceApps.find(a => a.name.toLowerCase().includes(nameInput.toLowerCase()));
                pkgInput = matchedApp ? matchedApp.pkg : ('com.custom.game.' + nameInput.toLowerCase().replace(/[^a-z0-9]/g, ''));
              }
              const matchedInDevice = allScannedDeviceApps.find(a => a.pkg === pkgInput);
              userSavedGames.unshift({
                name: nameInput,
                pkg: pkgInput,
                res: resSpec,
                mode: modeSpec,
                installed: !!matchedInDevice,
                icon: matchedInDevice ? matchedInDevice.icon : ''
              });
              saveCustomGamesToStorage();
              document.getElementById('inpCustomGameName').value = '';
              document.getElementById('inpCustomGamePkg').value = '';
              closeAddGameModal();
              renderGameHubList();
              showToast(`➕ Đã thêm "${nameInput}" vào Game Hub!`);
            }

            function renderInstalledAppPicker() {
              const q = (document.getElementById('inpPickerSearch')?.value || '').toLowerCase().trim();
              document.getElementById('pickerAppCount').textContent = allScannedDeviceApps.length;
              const filtered = allScannedDeviceApps.filter(a => !q || a.name.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q));
              const box = document.getElementById('installedAppPickerList');
              if (filtered.length === 0) {
                box.innerHTML = `<div style="font-size:11px; color:var(--text-secondary); padding:10px; text-align:center;">Nhập tên ở mục 1 phía trên hoặc bấm Quét lại để tải danh sách ứng dụng.</div>`;
                return;
              }
              box.innerHTML = filtered.slice(0, 50).map(app => {
                const initials = (app.name || 'AP').substring(0, 2).toUpperCase();
                const iconHtml = app.icon
                  ? `<img src="${app.icon}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='${initials}';" />`
                  : `<span>${initials}</span>`;
                return `
                  <div class="game-card-item" style="padding:8px 10px; margin-bottom:6px;">
                    <div class="game-icon-box" style="width:36px; height:36px;">${iconHtml}</div>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${app.name}</div>
                      <div style="font-size:10px; color:var(--text-secondary);">Ứng dụng trên máy</div>
                    </div>
                    <button class="badge-status-ok tap-spring" onclick="pickAppFromDeviceToGameHub('${app.pkg}')">➕ Chọn</button>
                  </div>
                `;
              }).join('');
            }

            function pickAppFromDeviceToGameHub(pkg) {
              hapticTick();
              const found = allScannedDeviceApps.find(a => a.pkg === pkg);
              if (!found) return;
              const resSpec = document.getElementById('selCustomGameRes').value;
              const modeSpec = document.getElementById('selCustomGameMode').value;
              userSavedGames = userSavedGames.filter(g => g.pkg !== pkg);
              userSavedGames.unshift({
                name: found.name,
                pkg: found.pkg,
                res: resSpec,
