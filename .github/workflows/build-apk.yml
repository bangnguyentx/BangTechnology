              border-color: transparent;
            }
            .apple-toggle.on::after {
              transform: translate3d(20px, 0, 0);
            }
            /* Inputs & Sliders */
            input[type="range"] {
              -webkit-appearance: none;
              width: 100%;
              height: 6px;
              border-radius: 99px;
              background: rgba(255, 255, 255, 0.14);
              margin: 12px 0;
            }
            input[type="range"]::-webkit-slider-thumb {
              -webkit-appearance: none;
              width: 20px;
              height: 20px;
              border-radius: 50%;
              background: #FFFFFF;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
              border: 2px solid var(--accent);
            }
            .field-input {
              width: 100%;
              background: rgba(0, 0, 0, 0.4);
              border: 1px solid rgba(255, 255, 255, 0.12);
              border-radius: 10px;
              padding: 8px 10px;
              font-size: 12px;
              font-weight: 700;
              color: #FFFFFF;
              text-align: center;
              font-variant-numeric: tabular-nums;
            }
            /* Whitelist App List */
            .filter-bar {
              display: flex;
              gap: 8px;
              margin-bottom: 10px;
            }
            .search-field {
              flex: 1;
              background: rgba(0, 0, 0, 0.38);
              border: 1px solid rgba(255, 255, 255, 0.12);
              border-radius: 11px;
              padding: 9px 12px;
              font-size: 12px;
              color: #FFFFFF;
            }
            .select-field {
              background: rgba(0, 0, 0, 0.38);
              border: 1px solid rgba(255, 255, 255, 0.12);
              border-radius: 11px;
              padding: 8px 10px;
              font-size: 11.5px;
              font-weight: 600;
              color: #E2E8F0;
            }
            .app-scroll-box {
              max-height: 350px;
              overflow-y: auto;
            }
            .app-row {
              background: rgba(0, 0, 0, 0.25);
              border: 1px solid rgba(255, 255, 255, 0.07);
              border-radius: 14px;
              padding: 10px 12px;
              margin-bottom: 7px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
            }
            .app-icon-mono {
              width: 36px;
              height: 36px;
              border-radius: 10px;
              background: rgba(255, 255, 255, 0.06);
              border: 1px solid rgba(255, 255, 255, 0.12);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 11px;
              font-weight: 800;
              color: #E2E8F0;
              flex-shrink: 0;
            }
            /* Modal Sheet (Quét ngầm Shizuku khi mở app & Quản lý App đã tắt) */
            .sheet-backdrop {
              position: fixed;
              inset: 0;
              background: rgba(4, 6, 10, 0.78);
              backdrop-filter: blur(16px);
              -webkit-backdrop-filter: blur(16px);
              z-index: 160;
              display: none;
              align-items: center;
              justify-content: center;
              padding: 18px;
            }
            .sheet-backdrop.open {
              display: flex;
            }
            .sheet-dialog {
              background: linear-gradient(165deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%), #111520;
              border: 1px solid rgba(255, 255, 255, 0.18);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 20px 50px rgba(0, 0, 0, 0.75);
              border-radius: 24px;
              width: 100%;
              max-width: 400px;
              padding: 20px;
            }
            /* Bottom Navigation Dock */
            .bottom-chrome {
              position: fixed;
              bottom: 0;
              left: 0;
              right: 0;
              z-index: 95;
              background: rgba(10, 13, 20, 0.86);
              backdrop-filter: blur(28px) saturate(190%);
              -webkit-backdrop-filter: blur(28px) saturate(190%);
              border-top: 1px solid rgba(255, 255, 255, 0.12);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
              padding: 8px 13px 12px;
            }
            .nav-tabs {
              display: grid;
              grid-template-columns: repeat(4, 1fr);
              gap: 6px;
              margin-bottom: 8px;
            }
            .nav-tab {
              padding: 7px 4px;
              border-radius: 10px;
              font-size: 11px;
              font-weight: 700;
              text-align: center;
              color: var(--text-muted);
              background: transparent;
              border: 1px solid transparent;
            }
            .nav-tab.active {
              color: #FFFFFF;
              background: rgba(255, 255, 255, 0.09);
              border-color: rgba(255, 255, 255, 0.18);
            }
            .dock-actions {
              display: flex;
              gap: 8px;
            }
            .btn-dock-main {
              flex: 1;
              padding: 12px;
              border-radius: 14px;
              font-size: 12px;
              font-weight: 800;
              text-align: center;
              letter-spacing: -0.01em;
            }
            .btn-dock-main.idle {
              background: rgba(255, 255, 255, 0.06);
              border: 1px solid rgba(255, 255, 255, 0.14);
              color: var(--text-secondary);
            }
            .btn-dock-main.active {
              background: rgba(16, 185, 129, 0.18);
              border: 1px solid rgba(16, 185, 129, 0.55);
              color: #34D399;
            }
            .btn-dock-reset {
              background: rgba(255, 255, 255, 0.06);
              border: 1px solid rgba(255, 255, 255, 0.12);
              color: #E2E8F0;
              font-weight: 700;
              font-size: 12px;
              padding: 12px 15px;
              border-radius: 14px;
            }
            .tab-view {
              display: none;
            }
            .tab-view.active {
              display: block;
            }
            /* Toast Notification */
            #toastBanner {
              position: fixed;
              top: 64px;
              left: 50%;
              transform: translate3d(-50%, -16px, 0);
              background: rgba(15, 19, 28, 0.96);
              border: 1px solid rgba(255, 255, 255, 0.22);
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
              color: #FFFFFF;
              padding: 9px 15px;
              border-radius: 99px;
              font-size: 11.5px;
              font-weight: 600;
              z-index: 220;
              opacity: 0;
              pointer-events: none;
              transition: opacity 160ms ease, transform 160ms ease;
              max-width: 92vw;
              text-align: center;
            }
            #toastBanner.show {
              opacity: 1;
              transform: translate3d(-50%, 0, 0);
            }
          </style>
          </head>
          <body>

          <div class="ambient-top-light"></div>
          <div id="toastBanner">Hệ thống sẵn sàng</div>

          <!-- HỘP THOẠI TỰ ĐỘNG QUÉT NGẦM SHIZUKU KHI MỞ APP / XÓA ĐA NHIỆM -->
          <div id="shizukuAlertModal" class="sheet-backdrop">
            <div class="sheet-dialog">
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                <div style="width:36px; height:36px; border-radius:10px; background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.4); display:flex; align-items:center; justify-content:center; color:#FDA4AF; font-weight:800;">!</div>
                <div>
                  <div style="font-size:15px; font-weight:800; color:#FFFFFF;">Cần cấp quyền Shizuku</div>
                  <div style="font-size:11px; color:var(--text-secondary);">Quét ngầm khi khởi động ứng dụng</div>
                </div>
              </div>
              <p id="shizukuModalDesc" style="font-size:12px; color:#CBD5E1; line-height:1.5; margin-bottom:14px;">
                Phát hiện BangOptimize chưa được thêm hoặc chưa bật quyền trong ứng dụng Shizuku. Các công tắc can thiệp hệ thống cần quyền UID 2000 Shell để hoạt động thật.
              </p>
              <button class="btn-block btn-primary pressable" onclick="triggerShizukuAuthFromModal()">
                Yêu cầu cấp quyền Shizuku ngay
              </button>
              <button class="btn-block btn-subtle pressable" onclick="openExternalShizukuApp()">
                Mở ứng dụng Shizuku để bật BangOptimize
              </button>
              <button class="btn-block pressable" style="color:var(--text-muted); font-size:11px; margin-top:6px;" onclick="closeShizukuModal()">
                Để sau (Chế độ xem trước)
              </button>
            </div>
          </div>

          <!-- MODAL QUẢN LÝ APP ĐÃ TẮT -->
          <div id="frozenModal" class="sheet-backdrop" onclick="closeFrozenModal()">
            <div class="sheet-dialog" onclick="event.stopPropagation()">
              <div class="panel-head">
                <span class="panel-title">Quản lý gói dịch vụ đã tắt</span>
                <button class="seg-pill pressable" onclick="closeFrozenModal()">Đóng</button>
              </div>
              <p style="font-size:11px; color:var(--text-secondary); margin-bottom:10px; line-height:1.4;">
                Danh sách các tiến trình hệ thống đang bị đóng băng chạy ngầm. Bạn có thể bật lại từng gói hoặc khôi phục toàn bộ:
              </p>
              <div id="frozenListBox"></div>
              <button class="btn-block btn-primary pressable" onclick="restoreAllFrozenApps()">
                Khôi phục toàn bộ gói đã tắt
              </button>
            </div>
          </div>

          <!-- DYNAMIC ISLAND FLOATING HUD -->
          <div id="islandWrap" class="hud-sticky">
            <div id="dynamicIsland" class="hud-capsule pressable" onclick="toggleIsland()">
              <div class="hud-bar">
                <span><span class="status-dot"></span><span id="hudFps">60 FPS</span> · <span id="hudPing">14ms</span></span>
                <span id="hudRamTop">RAM: -- / -- MB</span>
                <span id="hudTempTop">--°C</span>
              </div>
              <div class="hud-drawer" onclick="event.stopPropagation()">
                <button class="hud-btn pressable" onclick="cleanRamNow()">Giải phóng RAM</button>
                <button class="hud-btn pressable" onclick="toggleFlorentino()">Độ nhạy 0ms</button>
                <button class="hud-btn pressable" onclick="toggleGhostLock()">Làm mờ HUD</button>
              </div>
            </div>
          </div>

          <!-- REALTIME RAM BAR -->
          <div class="ram-strip">
            <div>
              <div class="ram-strip-title">BangOptimize · Giám sát bộ nhớ thời gian thực</div>
              <div class="ram-strip-val" id="notifRamText">RAM: Đang đồng bộ... (Mốc: 4900 MB)</div>
            </div>
            <button class="btn-action-pill pressable" onclick="cleanRamNow()">Dọn ngay</button>
          </div>

          <!-- TOP UTILITY BAR -->
          <div class="util-bar">
            <button class="util-pill pressable" onclick="openFrozenModal()">
              <span>Quản lý App đã tắt (<b id="frozenCountText">0</b>)</span>
            </button>
            <button class="util-pill pressable" onclick="syncRealSystemState(true)">
              <span>Quét trạng thái thực tế</span>
            </button>
          </div>

          <!-- ENGINEERED BRAND HEADER (CUSTOM VECTOR SVG EMBLEM) -->
          <div class="header-brand">
            <div class="brand-identity">
              <div class="logo-emblem">
                <svg width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M14 2L25 8.5V19.5L14 26L3 19.5V8.5L14 2Z" stroke="#F8FAFC" stroke-width="1.6" fill="rgba(56,189,248,0.12)"/>
                  <path d="M14 6.5L21 10.6V17.4L14 21.5L7 17.4V10.6L14 6.5Z" stroke="#38BDF8" stroke-width="1.4"/>
                  <path d="M10.5 14H17.5M14 10.5V17.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </div>
              <div>
                <div class="brand-title-row">
                  <span class="brand-title">BangOptimize</span>
                  <span class="version-tag">v8.3 Flagship</span>
                </div>
                <div class="brand-subtitle">Bang Technology · Hệ thống tinh chỉnh nhân Android & Shizuku</div>
              </div>
            </div>
          </div>

          <!-- SHIZUKU LIVE STATUS BANNER -->
          <div id="shizukuBanner" class="shizuku-banner warn pressable" onclick="requestShizukuPermission()">
            <span id="shizukuText">Đang kiểm tra kết nối Shizuku (UID 2000 Shell)...</span>
            <span style="font-size:11px; text-decoration:underline;">Cấp quyền</span>
          </div>

          <div class="hw-bar">
            <span id="deviceModelText">Thiết bị: Đang đọc phần cứng...</span>
            <button class="pressable" style="color:var(--accent); font-weight:700;" onclick="syncRealSystemState(true)">Làm mới</button>
          </div>

          <!-- LIQUID GLASS ARCHITECTURE CAROUSEL -->
          <div class="arch-carousel">
            <div class="arch-card">
              <div class="arch-eyebrow">Lõi thực thi · UID 2000 Shell</div>
              <div class="arch-title">Đồng bộ & Xác thực Trạng thái Thật</div>
              <div class="arch-desc">Mỗi công tắc khi gạt đều kiểm tra kết quả trả về từ hệ thống. Nếu thiết bị không hỗ trợ, công tắc tự động tắt và báo rõ nguyên nhân.</div>
              <div class="arch-terminal"><span>shizuku.verify(settings)</span><span id="prismStatus0">Đang kiểm tra</span></div>
            </div>
            <div class="arch-card">
              <div class="arch-eyebrow">Đồ họa & Màn hình</div>
              <div class="arch-title">Kiểm soát Tần số quét & Vulkan ANGLE</div>
              <div class="arch-desc">Tự động đối chiếu tần số quét tối đa của tấm nền phần cứng trước khi khóa Hz và kích hoạt dựng hình GPU.</div>
              <div class="arch-terminal"><span>display.maxSupportedHz</span><span id="prismStatus1">60Hz / 120Hz</span></div>
            </div>
            <div class="arch-card">
              <div class="arch-eyebrow">Quản lý Nhiệt & Bộ nhớ</div>
              <div class="arch-title">Kiểm soát Tiến trình Nền & Whitelist</div>
              <div class="arch-desc">Đóng băng cgroup v2 đối với ứng dụng gây tốn tài nguyên và bảo vệ tuyệt đối các ứng dụng liên lạc trong Whitelist.</div>
              <div class="arch-terminal"><span>cached_apps_freezer</span><span id="prismStatus2">Sẵn sàng</span></div>
            </div>
          </div>

          <!-- ================= TAB 1: TRUNG TÂM ================= -->
          <div id="tab-0" class="tab-view active">

            <!-- Khôi phục & Tác vụ nhanh -->
            <div class="glass-panel">
              <div class="panel-head">
                <span class="panel-title">Tác vụ khẩn cấp & Cứu hộ phần cứng</span>
                <span class="panel-meta">Thực thi tức thì</span>
              </div>
              <div class="grid-2">
                <button class="metric-cell pressable" style="text-align:left; border-color:rgba(255,255,255,0.14);" onclick="fixCameraAndApps()">
                  <div class="metric-label" style="color:#FDA4AF;">Khôi phục gói bị tắt</div>
                  <div class="metric-val" style="font-size:12px;">Fix Camera & App</div>
                  <div style="font-size:10px; color:var(--text-secondary); margin-top:3px;">Bật lại máy ảnh & quyền gốc</div>
                </button>
                <button class="metric-cell pressable" style="text-align:left; border-color:rgba(56,189,248,0.28);" onclick="enableTurboTouch()">
                  <div class="metric-label" style="color:var(--accent);">Độ nhạy màn hình</div>
                  <div class="metric-val" style="font-size:12px;">Turbo Touch 0ms</div>
                  <div id="turboBtnSub" style="font-size:10px; color:var(--text-secondary); margin-top:3px;">Chưa kích hoạt</div>
                </button>
              </div>
              <div class="note-callout" style="margin-top:10px;">
                Phím cứu hộ vật lý: Giữ phím <b>Giảm âm lượng 3 giây</b> bất kỳ lúc nào để đưa Độ phân giải và DPI về mặc định gốc.
              </div>
            </div>

            <!-- 1. Dòng máy & 2. Cấp độ tối ưu -->
            <div class="glass-panel">
              <div class="panel-head">
                <span class="panel-title">1. Cấu hình theo dòng máy</span>
                <span class="panel-meta">Tự động nhận diện</span>
              </div>
              <div class="seg-row">
                <button class="seg-pill pressable" onclick="selectBrand(this, 'ALL')">Tất cả Android</button>
                <button class="seg-pill active pressable" onclick="selectBrand(this, 'XIAOMI')">Xiaomi / Redmi / POCO</button>
                <button class="seg-pill pressable" onclick="selectBrand(this, 'SAMSUNG')">Samsung OneUI</button>
                <button class="seg-pill pressable" onclick="selectBrand(this, 'OPPO')">OPPO / Realme</button>
              </div>

              <div class="panel-head" style="margin-top:6px;">
                <span class="panel-title">2. Cấp độ tối ưu hóa</span>
                <span class="panel-meta" id="animLabel">Mặc định (Chưa bật)</span>
              </div>
              <div class="grid-4" id="levelGrid">
                <button class="tier-card pressable" onclick="selectOptLevel(0, '1.0', 'SMOOTH · 1.0x')">
                  <span class="tier-name">SMOOTH</span>
                  <span class="tier-sub">Mát máy</span>
                </button>
                <button class="tier-card pressable" onclick="selectOptLevel(1, '0.5', 'MEDIUM · 0.5x')">
                  <span class="tier-name">MEDIUM</span>
                  <span class="tier-sub">0.5x Chuẩn</span>
                </button>
                <button class="tier-card pressable" onclick="selectOptLevel(2, '0.0', 'CỰC MẠNH · 0x')">
                  <span class="tier-name">CỰC MẠNH</span>
                  <span class="tier-sub">0x Delay</span>
                </button>
                <button class="tier-card pressable" onclick="selectOptLevel(3, '0.0', 'CRAZY · Эp xung')">
                  <span class="tier-name" style="color:#FDA4AF;">CRAZY</span>
                  <span class="tier-sub">Tối đa</span>
                </button>
              </div>
              <div id="levelDetailBox" class="note-callout" style="margin-top:10px;">
                Trạng thái: Chưa kích hoạt cấp độ tối ưu. Chọn một cấu hình ở trên để áp dụng qua Shizuku.
              </div>
            </div>

            <!-- Bảng Độ Nhạy Múa Florentino -->
            <div class="glass-panel">
              <div class="panel-head">
                <span class="panel-title">Bảng độ nhạy cảm ứng chuyên sâu (Florentino)</span>
                <span class="panel-meta">Pointer +7 · 150ms</span>
              </div>
              <div class="grid-2">
                <div class="metric-cell">
                  <div class="metric-label">Độ trễ phản hồi</div>
                  <div class="metric-val" id="floDelayText" style="color:var(--text-secondary);">Mặc định (Chưa bật)</div>
                </div>
                <div class="metric-cell">
                  <div class="metric-label">Biên độ vuốt</div>
                  <div class="metric-val">Pointer Speed +7</div>
                </div>
              </div>
              <button id="btnFlo" class="btn-block btn-subtle pressable" onclick="toggleFlorentino()">
                Chưa bật Profile Florentino (Chạm để kích hoạt)
              </button>
            </div>

            <!-- Chẩn đoán phần cứng & Mở khóa cắt giảm -->
            <div class="glass-panel">
              <div class="panel-head">
                <span class="panel-title">Chẩn đoán phần cứng & Mở khóa giới hạn ROM</span>
                <span class="panel-meta" id="maxHzBadge">Max: --Hz</span>
              </div>
              <div class="grid-2" style="margin-bottom:10px;">
                <div class="metric-cell">
                  <div class="metric-label">Thiết bị</div>
                  <div class="metric-val" id="diagModel">Đang đọc...</div>
                </div>
                <div class="metric-cell">
                  <div class="metric-label">Vi xử lý / SoC</div>
                  <div class="metric-val" id="diagSoc">--</div>
                </div>
                <div class="metric-cell">
                  <div class="metric-label">Dung lượng RAM</div>
                  <div class="metric-val" id="diagRam">--</div>
                </div>
                <div class="metric-cell">
                  <div class="metric-label">Màn hình thực tế</div>
                  <div class="metric-val" id="diagScreen">--</div>
                </div>
              </div>

              <div class="note-callout" style="margin-bottom:10px;">
                <b>Đặc trị Xiaomi / Redmi / POCO:</b> Chặn dịch vụ <code>com.xiaomi.joyose</code> bóp xung GPU ở 38°C và mở khóa cấp độ hiệu ứng <code>deviceLevelList v:1,c:3,g:3</code> cho máy tầm trung bị cắt giảm.
              </div>
              <button id="btnXiaomiSpecial" class="btn-block btn-subtle pressable" onclick="applyXiaomiSpecialPlan()">
                Áp dụng phương án tối ưu Xiaomi / Redmi / POCO
              </button>
            </div>

            <!-- Độ phân giải & DPI -->
            <div class="glass-panel">
              <div class="panel-head">
                <span class="panel-title">Độ phân giải & Mật độ điểm ảnh (DPI)</span>
                <span class="panel-meta" id="resCurrentBadge">1080x2400 @ 410</span>
              </div>
              <div style="font-size:11px; color:var(--text-secondary); margin-bottom:10px;">
                Thông số màn hình gốc: <b id="detectedResLabel" style="color:#FFFFFF;">1080x2400 @ 410 DPI</b>
              </div>
              <div class="grid-2" id="resPresetGrid" style="margin-bottom:10px;">
                <button class="tier-card pressable" onclick="setPresetRes(0, 360, 800, 147)">
                  <span class="tier-name">360p Ultra Smooth</span>
                  <span class="tier-sub">360x800 · 147 DPI</span>
                </button>
                <button class="tier-card pressable" onclick="setPresetRes(1, 480, 1066, 196)">
                  <span class="tier-name">480p eSports</span>
                  <span class="tier-sub">480x1066 · 196 DPI</span>
                </button>
                <button class="tier-card pressable" onclick="setPresetRes(2, 720, 1600, 293)">
                  <span class="tier-name">720p Gaming</span>
                  <span class="tier-sub">720x1600 · 293 DPI</span>
                </button>
                <button class="tier-card active pressable" onclick="setPresetRes(3, 1080, 2400, 410)">
                  <span class="tier-name">Màn hình gốc</span>
                  <span class="tier-sub">1080x2400 · 410 DPI</span>
                </button>
              </div>

