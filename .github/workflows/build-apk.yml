                              )
                          }
                      }

                      var initialY = 0
                      var touchY = 0f
                      var moved = false

                      handle.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialY = params.y
                                  touchY = ev.rawY
                                  moved = false
                                  handle.animate().scaleX(0.92f).scaleY(0.92f).setDuration(90).start()
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dy = (ev.rawY - touchY).toInt()
                                  if (kotlin.math.abs(dy) > dp(8)) moved = true
                                  params.y = initialY + dy
                                  try { windowManager?.updateViewLayout(handle, params) } catch (_: Throwable) {}
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  handle.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                                  if (!moved) toggleGamePanel()
                                  true
                              }
                              else -> false
                          }
                      }

                      edgeHandleView = handle
                      windowManager?.addView(handle, params)
                      handle.animate()
                          .alpha(1f)
                          .translationX(0f)
                          .setInterpolator(OvershootInterpolator(1.2f))
                          .setDuration(320)
                          .start()
                      isOverlayVisible = true
                  } catch (_: Throwable) {}
              }

