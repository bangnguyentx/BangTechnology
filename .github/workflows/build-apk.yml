              // LỚP VẼ CỤC TRÒN NHỎ GAME SPACE (34PX VẬT LÝ THU GỌN - KHÔNG BAO GIỜ BỊ PHÌNH TO KHI HẠ 720P!)
              private inner class LiquidGlassOrbCanvasView(context: Context) : View(context) {
                  private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val rimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = fixedDp(2).toFloat()
                  }
                  private val meniscusPaint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val coreRingPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = fixedDp(1).toFloat()
                      color = Color.parseColor("#CCFF3B30")
                  }
                  private val boltPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.FILL
                      color = Color.parseColor("#B3F50B")
                  }
                  private val boltPath = Path()

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val w = width.toFloat()
                      val h = height.toFloat()
                      if (w <= 0f || h <= 0f) return
                      val cx = w / 2f
                      val cy = h / 2f
                      val radius = (w.coerceAtMost(h) / 2f) - fixedDp(2).toFloat()

                      bgPaint.shader = RadialGradient(
                          cx * 0.65f, cy * 0.60f, radius * 1.25f,
                          intArrayOf(
                              Color.parseColor("#EE2A080C"),
                              Color.parseColor("#E60A0302"),
                              Color.parseColor("#F4050202")
                          ),
                          floatArrayOf(0f, 0.65f, 1f),
                          Shader.TileMode.CLAMP
                      )
                      canvas.drawCircle(cx, cy, radius, bgPaint)

                      meniscusPaint.shader = LinearGradient(
                          cx, cy - radius, cx, cy,
                          Color.parseColor("#80FFFFFF"),
                          Color.TRANSPARENT,
                          Shader.TileMode.CLAMP
                      )
                      canvas.drawCircle(cx, cy - radius * 0.18f, radius * 0.76f, meniscusPaint)

                      rimPaint.shader = SweepGradient(
                          cx, cy,
                          intArrayOf(
                              Color.parseColor("#FFE20A21"),
                              Color.parseColor("#FFF42902"),
                              Color.parseColor("#FFB3F50B"),
                              Color.parseColor("#FFCBE7FC"),
                              Color.parseColor("#FFE20A21")
                          ),
                          null
                      )
                      canvas.drawCircle(cx, cy, radius, rimPaint)
                      canvas.drawCircle(cx, cy, radius * 0.56f, coreRingPaint)

                      boltPath.reset()
                      boltPath.moveTo(cx + radius * 0.08f, cy - radius * 0.34f)
                      boltPath.lineTo(cx - radius * 0.24f, cy + radius * 0.04f)
                      boltPath.lineTo(cx + radius * 0.02f, cy + radius * 0.04f)
                      boltPath.lineTo(cx - radius * 0.08f, cy + radius * 0.34f)
                      boltPath.lineTo(cx + radius * 0.24f, cy - radius * 0.04f)
                      boltPath.lineTo(cx - radius * 0.02f, cy - radius * 0.04f)
                      boltPath.close()
                      canvas.drawPath(boltPath, boltPaint)
                  }
              }

              // 1. HIỂN THỊ CỤC TRÒN NHỎ THU GỌN (34dp cố định) + BẤM 1 LẦN MỞ MENU + BẤM ĐÚP 2 LẦN CHẠY MACRO
              private fun showFloatingLogoOrb() {
                  if (isOverlayVisible || floatingOrbView != null) return
                  try {
                      val screenW = resources.displayMetrics.widthPixels
                      val screenH = resources.displayMetrics.heightPixels
                      val orbSize = fixedDp(34)

                      val params = WindowManager.LayoutParams(
                          orbSize,
                          orbSize,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = screenW - orbSize - fixedDp(6)
                          y = (screenH * 0.32f).toInt()
                      }
                      orbParams = params

                      val orbView = LiquidGlassOrbCanvasView(this).apply {
                          alpha = 0f
                          scaleX = 0.3f
                          scaleY = 0.3f
                      }

                      var startX = 0
                      var startY = 0
                      var touchX = 0f
                      var touchY = 0f
                      var isDraggingOrb = false

                      orbView.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  handler.removeCallbacks(idleDimRunnable)
                                  startX = params.x
                                  startY = params.y
                                  touchX = ev.rawX
                                  touchY = ev.rawY
                                  isDraggingOrb = false
                                  orbView.animate().alpha(1f).scaleX(1.12f).scaleY(1.12f).setDuration(120).start()
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (ev.rawX - touchX).toInt()
                                  val dy = (ev.rawY - touchY).toInt()
                                  if (abs(dx) > fixedDp(5) || abs(dy) > fixedDp(5)) {
                                      isDraggingOrb = true
                                  }
                                  if (isDraggingOrb) {
                                      val curW = resources.displayMetrics.widthPixels
                                      val curH = resources.displayMetrics.heightPixels
                                      params.x = (startX + dx).coerceIn(fixedDp(4), curW - orbSize - fixedDp(4))
                                      params.y = (startY + dy).coerceIn(fixedDp(20), curH - orbSize - fixedDp(20))
                                      try { windowManager?.updateViewLayout(orbView, params) } catch (_: Throwable) {}
                                  }
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!isDraggingOrb) {
                                      val now = SystemClock.elapsedRealtime()
                                      if (now - lastOrbTapTimeMs <= 320L) {
                                          // BẤM ĐÚP 2 LẦN VÀO CỤC TRÒN -> KÍCH HOẠT NGAY MACRO BÁN ĐỒ NHANH!
                                          handler.removeCallbacksAndMessages("SINGLE_TAP_OPEN")
                                          lastOrbTapTimeMs = 0L
                                          executeDoubleTapMacroNonBlocking()
                                      } else {
                                          lastOrbTapTimeMs = now
                                          handler.postAtTime({
                                              openGamePanelFromOrb()
                                          }, "SINGLE_TAP_OPEN", SystemClock.uptimeMillis() + 260L)
                                      }
                                  } else {
                                      val curW = resources.displayMetrics.widthPixels
                                      val targetEdgeX = if (params.x + orbSize / 2 < curW / 2) {
                                          fixedDp(5)
                                      } else {
                                          curW - orbSize - fixedDp(5)
                                      }
                                      ValueAnimator.ofInt(params.x, targetEdgeX).apply {
                                          duration = 360L
                                          interpolator = OvershootInterpolator(1.04f)
                                          addUpdateListener { anim ->
                                              params.x = anim.animatedValue as Int
                                              try { windowManager?.updateViewLayout(orbView, params) } catch (_: Throwable) {}
                                          }
                                          start()
                                      }
                                      orbView.animate().scaleX(1f).scaleY(1f).setDuration(200).start()
                                      handler.postDelayed(idleDimRunnable, 3000L)
                                  }
                                  true
                              }
                              else -> false
                          }
                      }

                      floatingOrbView = orbView
                      windowManager?.addView(orbView, params)
                      orbView.animate()
                          .alpha(0.95f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setInterpolator(OvershootInterpolator(1.16f))
                          .setDuration(420)
                          .withEndAction { handler.postDelayed(idleDimRunnable, 3000L) }
                          .start()
                      isOverlayVisible = true
                  } catch (_: Throwable) {}
              }

              private fun hideGameSpaceHandle() {
                  handler.removeCallbacks(idleDimRunnable)
                  dismissQuickResPrompt()
                  closeVisualMacroEditor()
                  closeGamePanel(animated = false)
                  floatingOrbView?.let {
                      try { windowManager?.removeView(it) } catch (_: Throwable) {}
                      floatingOrbView = null
                  }
                  miniHudView?.let {
                      try { windowManager?.removeView(it) } catch (_: Throwable) {}
                      miniHudView = null
                  }
                  isOverlayVisible = false
              }

              // 2. MINI HUD GÓC TRÊN PHẢI THU GỌN CHUẨN PIXEL VẬT LÝ (KHÔNG BỊ PHÌNH TO KHI HẠ 720P!)
              private fun toggleMiniHudOverlay(forceOn: Boolean = false) {
                  if (miniHudView != null && !forceOn) {
                      try { windowManager?.removeView(miniHudView) } catch (_: Throwable) {}
                      miniHudView = null
                      isMiniHudEnabled = false
                      Toast.makeText(this, "Game Space: Đã ẩn HUD góc phải", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (miniHudView != null) return
                  try {
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.END
                          x = fixedDp(48)
                          y = fixedDp(5)
                      }

                      val hud = TextView(this).apply {
                          setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(9).toFloat())
                          setTypeface(Typeface.MONOSPACE, Typeface.BOLD)
                          setTextColor(Color.parseColor("#FDFDFC"))
                          setPadding(fixedDp(7), fixedDp(3), fixedDp(7), fixedDp(3))
                          alpha = 0f
                          translationY = -fixedDp(10).toFloat()
                          background = GradientDrawable(
                              GradientDrawable.Orientation.LEFT_RIGHT,
                              intArrayOf(
                                  Color.parseColor("#CC0A0302"),
                                  Color.parseColor("#D818080A")
                              )
                          ).apply {
                              setStroke(1, Color.parseColor("#AAE20A21"))
                              cornerRadius = fixedDp(99).toFloat()
                          }
                      }

                      var initX = 0
                      var initY = 0
                      var tX = 0f
                      var tY = 0f
                      hud.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = params.x
                                  initY = params.y
                                  tX = ev.rawX
                                  tY = ev.rawY
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = (initX - (ev.rawX - tX).toInt()).coerceAtLeast(0)
                                  params.y = (initY + (ev.rawY - tY).toInt()).coerceAtLeast(0)
                                  try { windowManager?.updateViewLayout(hud, params) } catch (_: Throwable) {}
                                  true
                              }
                              else -> false
                          }
                      }

                      miniHudView = hud
                      windowManager?.addView(hud, params)
                      isMiniHudEnabled = true
                      updateMiniHudText()
                      hud.animate().alpha(0.94f).translationY(0f).setDuration(360).start()
                  } catch (_: Throwable) {}
              }

              private fun updateMiniHudText() {
                  val hud = miniHudView ?: return
                  try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                      val ramPct = (((mem.totalMem - mem.availMem).toDouble() / mem.totalMem.toDouble()) * 100).toInt()
                      val batIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val tempC = (batIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 350) ?: 350) / 10.0
                      val (cpuPct, gpuPct) = readCpuAndGpuUsage(tempC, ramPct)
                      hud.text = "🔥120FPS • CPU $cpuPct% • GPU $gpuPct% • RAM $ramPct% • ${tempC}°C"
                  } catch (_: Throwable) {}
              }

              // CHỨC NĂNG "OUT GAME • THOÁT GAME & ĐƯA GIAO DIỆN VỀ BÌNH THƯỜNG ➔ ĐƯA VỀ MÀN HÌNH CHÍNH"
              private fun performOutGameBackToHomeLauncher() {
                  Toast.makeText(this, "🚪 Đang thoát Game, khôi phục 1080p & đưa về Màn hình chính...", Toast.LENGTH_SHORT).show()
                  closeGamePanel(animated = true) {
                      hideGameSpaceHandle()
                      Thread {
                          if (currentActiveGamePkg.isNotEmpty() && currentActiveGamePkg != "com.bangtech.optimize") {
                              ShizukuEngine.executeShizukuStrict("am force-stop $currentActiveGamePkg && wm size reset && wm density reset && settings put system pointer_speed 0 && settings put global heads_up_notifications_enabled 1")
                          } else {
                              ShizukuEngine.executeShizukuStrict("wm size reset && wm density reset && settings put system pointer_speed 0 && settings put global heads_up_notifications_enabled 1")
                          }
                      }.start()
                      try {
                          // Đưa thẳng về Màn hình chính điện thoại (Home Launcher) theo đúng yêu cầu!
                          val homeIntent = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_HOME)
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          }
                          startActivity(homeIntent)
                      } catch (_: Throwable) {}
                  }
              }

              private inner class SpecularLightSweepView(context: Context) : View(context) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var sweepProgress = -0.4f
                  private var animator: ValueAnimator? = null

                  fun startSweep() {
                      animator?.cancel()
                      animator = ValueAnimator.ofFloat(-0.35f, 1.35f).apply {
                          duration = 1600L
                          interpolator = AccelerateDecelerateInterpolator()
                          addUpdateListener {
                              sweepProgress = it.animatedValue as Float
                              invalidate()
                          }
                          start()
                      }
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      if (width <= 0 || height <= 0) return
                      val cx = width * sweepProgress
                      val shader = LinearGradient(
                          cx - fixedDp(45).toFloat(), 0f,
                          cx + fixedDp(45).toFloat(), height.toFloat(),
                          intArrayOf(
                              Color.TRANSPARENT,
                              Color.parseColor("#30FFFFFF"),
                              Color.parseColor("#38E20A21"),
                              Color.TRANSPARENT
                          ),
                          floatArrayOf(0f, 0.45f, 0.55f, 1f),
                          Shader.TileMode.CLAMP
                      )
                      paint.shader = shader
                      canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                  }
              }

              // 3. BUNG MỞ BẢNG MAGIC GAME SPACE (THU NHỎ GỌN 216PX CỐ ĐỊNH + TÍCH HỢP GHI MACRO + OUT GAME VỀ MÀN HÌNH CHÍNH)
              private fun openGamePanelFromOrb() {
                  if (panelView != null || isClosingPanel) return
                  try {
                      floatingOrbView?.animate()
                          ?.alpha(0f)
                          ?.scaleX(0.32f)
                          ?.scaleY(0.32f)
                          ?.setDuration(200)
                          ?.start()

                      var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      if (Build.VERSION.SDK_INT >= 31) {
                          flags = flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                      }

                      val screenW = resources.displayMetrics.widthPixels
                      val orbX = orbParams?.x ?: (screenW - fixedDp(45))
                      val isOnRightSide = orbX > screenW / 2

                      val params = WindowManager.LayoutParams(
                          fixedDp(218),
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(),
                          flags,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = (if (isOnRightSide) Gravity.END else Gravity.START) or Gravity.CENTER_VERTICAL
                          x = fixedDp(14)
                          if (Build.VERSION.SDK_INT >= 31) {
                              blurBehindRadius = 46
                          }
                      }

                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                      val ramPct = (((mem.totalMem - mem.availMem).toDouble() / mem.totalMem.toDouble()) * 100).toInt()
                      val batIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val tempC = (batIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 340) ?: 340) / 10.0
                      val (cpuPct, gpuPct) = readCpuAndGpuUsage(tempC, ramPct)

                      val startTransX = if (isOnRightSide) fixedDp(46).toFloat() else -fixedDp(46).toFloat()

                      val rootFrame = FrameLayout(this).apply {
                          alpha = 0f
                          translationX = startTransX
                          scaleX = 0.72f
                          scaleY = 0.72f
                          background = GradientDrawable(
                              GradientDrawable.Orientation.TL_BR,
                              intArrayOf(
                                  Color.parseColor("#E61A0A0D"),
                                  Color.parseColor("#F00A0302"),
                                  Color.parseColor("#E614070A")
                              )
                          ).apply {
                              setStroke(fixedDp(1), Color.parseColor("#CCE20A21"))
                              cornerRadius = fixedDp(22).toFloat()
                          }
                      }

                      val lightSweepView = SpecularLightSweepView(this).apply {
                          layoutParams = FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT
                          )
                      }

                      val contentBox = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(fixedDp(11), fixedDp(10), fixedDp(11), fixedDp(11))
                      }

                      val headerRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(fixedDp(2), 0, fixedDp(2), fixedDp(6))
                      }
                      val titleTv = TextView(this).apply {
                          text = "🔥 MAGIC GAME SPACE"
                          setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(10).toFloat())
                          setTypeface(typeface, Typeface.BOLD)
                          setTextColor(Color.parseColor("#CBE7FC"))
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }
                      val closeIcon = TextView(this).apply {
                          text = "✕"
                          setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(11).toFloat())
                          setTypeface(typeface, Typeface.BOLD)
                          setTextColor(Color.parseColor("#94A3B8"))
                          setPadding(fixedDp(6), fixedDp(2), fixedDp(4), fixedDp(2))
                          setOnClickListener { closeGamePanel(animated = true) }
                      }
                      headerRow.addView(titleTv)
                      headerRow.addView(closeIcon)
                      contentBox.addView(headerRow)

                      val metricRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(fixedDp(6), fixedDp(5), fixedDp(6), fixedDp(5))
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#99060202"))
                              setStroke(1, Color.parseColor("#38FFFFFF"))
                              cornerRadius = fixedDp(12).toFloat()
                          }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { bottomMargin = fixedDp(7) }
                      }

                      fun makeMiniStat(lbl: String, valStr: String, colorHex: String): LinearLayout {
                          return LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              gravity = Gravity.CENTER
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                              addView(TextView(this@BangGameSidebarService).apply {
                                  text = lbl
                                  setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(7).toFloat())
                                  setTextColor(Color.parseColor("#94A3B8"))
                              })
                              addView(TextView(this@BangGameSidebarService).apply {
                                  text = valStr
                                  setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(9).toFloat())
                                  setTypeface(typeface, Typeface.BOLD)
                                  setTextColor(Color.parseColor(colorHex))
                              })
                          }
                      }
                      metricRow.addView(makeMiniStat("CPU", "$cpuPct%", "#CBE7FC"))
                      metricRow.addView(makeMiniStat("GPU", "$gpuPct%", "#B3F50B"))
                      metricRow.addView(makeMiniStat("RAM", "$ramPct%", "#FC6E5E"))
                      metricRow.addView(makeMiniStat("NHIỆT", "${tempC}°C", "#F42902"))
                      contentBox.addView(metricRow)

                      fun makeGlassPillBtn(label: String, onClick: () -> Unit): TextView {
                          return TextView(this).apply {
                              text = label
                              setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(9).toFloat())
                              gravity = Gravity.CENTER
                              setTypeface(typeface, Typeface.BOLD)
                              setTextColor(Color.parseColor("#FDFDFC"))
                              setPadding(fixedDp(6), fixedDp(7), fixedDp(6), fixedDp(7))
                              background = GradientDrawable(
                                  GradientDrawable.Orientation.TOP_BOTTOM,
                                  intArrayOf(
                                      Color.parseColor("#32FFFFFF"),
                                      Color.parseColor("#221E1214")
                                  )
                              ).apply {
                                  setStroke(1, Color.parseColor("#48FFFFFF"))
                                  cornerRadius = fixedDp(11).toFloat()
                              }
                              layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                                  marginStart = fixedDp(2)
                                  marginEnd = fixedDp(2)
                              }
                              setOnClickListener { onClick() }
                          }
                      }

                      fun addPillRow(leftBtn: View, rightBtn: View) {
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply { bottomMargin = fixedDp(5) }
                          }
                          row.addView(leftBtn)
                          row.addView(rightBtn)
                          contentBox.addView(row)
                      }

                      addPillRow(
                          makeGlassPillBtn("🚀 Dọn RAM") {
                              Thread { ShizukuEngine.executeShizukuStrict("am kill-all && pm trim-caches 999G") }.start()
                              Toast.makeText(this, "🚀 Đã giải phóng RAM tức thì!", Toast.LENGTH_SHORT).show()
                              closeGamePanel(animated = true)
                          },
                          makeGlassPillBtn("⚡ Cảm ứng 0ms") {
                              Thread { ShizukuEngine.executeShizukuStrict("settings put secure long_press_timeout 150 && settings put system pointer_speed 7") }.start()
                              Toast.makeText(this, "⚡ Đã kích hoạt Cảm ứng 0ms + Nhạy tâm!", Toast.LENGTH_SHORT).show()
                              closeGamePanel(animated = true)
                          }
                      )

                      // Hàng 2: 🔒 Khóa 120Hz | 🔕 Chặn TB nổi
                      addPillRow(
                          makeGlassPillBtn("🔒 Khóa 120Hz") {
                              Thread { ShizukuEngine.executeShizukuStrict("settings put system peak_refresh_rate 120.0 && settings put system min_refresh_rate 90.0") }.start()
                              Toast.makeText(this, "🔒 Đã khóa cứng tần số quét 120Hz!", Toast.LENGTH_SHORT).show()
                              closeGamePanel(animated = true)
                          },
                          makeGlassPillBtn("🔕 Chặn TB nổi") {
                              Thread { ShizukuEngine.executeShizukuStrict("settings put global heads_up_notifications_enabled 0") }.start()
                              Toast.makeText(this, "🔕 Đã chặn thông báo nổi khi giao tranh!", Toast.LENGTH_SHORT).show()
                              closeGamePanel(animated = true)
                          }
                      )

                      // Hàng 3: ☀️ Khóa Sáng | 🖥️ Về 1080p / 720p
                      addPillRow(
                          makeGlassPillBtn("☀️ Khóa Sáng") {
                              Thread { ShizukuEngine.executeShizukuStrict("settings put system screen_brightness_mode 0") }.start()
                              Toast.makeText(this, "☀️ Đã khóa cố định độ sáng màn hình!", Toast.LENGTH_SHORT).show()
                              closeGamePanel(animated = true)
                          },
                          makeGlassPillBtn(if (isRes720p) "🖥️ Về 1080p" else "🖥️ Mượt 720p") {
                              isRes720p = !isRes720p
                              val cmd = if (isRes720p) "wm size 720x1600 && wm density 280" else "wm size reset && wm density reset"
                              Thread { ShizukuEngine.executeShizukuStrict(cmd) }.start()
                              Toast.makeText(this, if (isRes720p) "🖥️ Đã chuyển sang 720p Smooth (Cục tròn giữ nguyên cỡ)!" else "🖥️ Đã đưa màn hình về 1080p chuẩn!", Toast.LENGTH_SHORT).show()
                              closeGamePanel(animated = true)
                          }
                      )

                      // Hàng 4 (MỚI): 🎯 Ghi Tọa Độ Macro | ⚡ Chạy Macro (Hoặc bấm đúp 2 lần vào Cục tròn)
                      addPillRow(
                          makeGlassPillBtn("🎯 Ghi Macro") {
                              closeGamePanel(animated = true) {
                                  openVisualMacroCoordinateEditor()
                              }
                          },
                          makeGlassPillBtn("⚡ Chạy Macro") {
                              closeGamePanel(animated = true) {
                                  executeDoubleTapMacroNonBlocking()
                              }
                          }
                      )

                      // Nút Out Game chuẩn yêu cầu: Thoát Game & Đưa giao diện về bình thường ➔ Đưa về màn hình chính
                      val outGameBtn = TextView(this).apply {
                          text = "🚪 Out Game • Thoát Game & Đưa giao diện\nvề bình thường ➔ Đưa về màn hình chính"
                          setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(9).toFloat())
                          gravity = Gravity.CENTER
                          setTypeface(typeface, Typeface.BOLD)
                          setTextColor(Color.parseColor("#FDFDFC"))
                          setPadding(fixedDp(8), fixedDp(8), fixedDp(8), fixedDp(8))
                          background = GradientDrawable(
                              GradientDrawable.Orientation.LEFT_RIGHT,
                              intArrayOf(
                                  Color.parseColor("#AA991B1B"),
                                  Color.parseColor("#AA9A3412"),
                                  Color.parseColor("#881E293B")
                              )
                          ).apply {
                              setStroke(fixedDp(1), Color.parseColor("#EEF42902"))
                              cornerRadius = fixedDp(13).toFloat()
                          }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = fixedDp(2) }
                          setOnClickListener { performOutGameBackToHomeLauncher() }
                      }
                      contentBox.addView(outGameBtn)

                      rootFrame.addView(contentBox)
                      rootFrame.addView(lightSweepView)

                      panelView = rootFrame
                      windowManager?.addView(rootFrame, params)

                      // Animation OriginOS 7 Shared-Element Morphing mượt mà
                      rootFrame.animate()
                          .alpha(1f)
                          .translationX(0f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setInterpolator(OvershootInterpolator(1.04f))
                          .setDuration(420)
                          .withEndAction { lightSweepView.startSweep() }
                          .start()
                  } catch (_: Throwable) {}
              }

              private fun closeGamePanel(animated: Boolean = true, onClosed: (() -> Unit)? = null) {
                  val target = panelView ?: run {
                      onClosed?.invoke()
                      return
                  }
                  if (!animated) {
                      try { windowManager?.removeView(target) } catch (_: Throwable) {}
                      panelView = null
                      isClosingPanel = false
                      onClosed?.invoke()
                      return
                  }
