                showToast(window._lastSwitchLabel || 'Đã áp dụng thành công!');
              } else {
                if (window._lastSwitchEl) {
                  window._lastSwitchEl.classList.remove('on');
                  const parentCard = window._lastSwitchEl.closest('.tweak-item');
                  if (parentCard) parentCard.classList.remove('active-on');
                }
                appendLog(res.reason || 'Chờ kết nối', 'CHỜ KẾT NỐI');
                showToast(res.reason || 'Hãy bấm Quản lý kết nối để kích hoạt!');
