              document.querySelectorAll('.dock-tab-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
              const bar = document.getElementById('glassNavBar');
              const lens = document.getElementById('navLiquidLens');
              if (bar && lens) {
                const slotW = (bar.clientWidth - 10) / 5;
                lens.style.transform = `translate3d(${idx * slotW}px, 0, 0)`;
              }
              if (idx === 3) updateRealtimeBatteryOscilloscope();
              window.scrollTo({ top: 0, behavior: 'instant' });
            }

            (function initNavSwipe() {
              const bar = document.getElementById('glassNavBar');
              const lens = document.getElementById('navLiquidLens');
              if (!bar || !lens) return;
              let navDrag = false;
              bar.addEventListener('pointerdown', e => {
                navDrag = true;
                bar.setPointerCapture(e.pointerId);
              });
              bar.addEventListener('pointermove', e => {
                if (!navDrag) return;
                const rect = bar.getBoundingClientRect();
                const slotW = (rect.width - 10) / 5;
                const relX = Math.max(0, Math.min(slotW * 4, e.clientX - rect.left - slotW / 2));
                lens.style.transition = 'none';
                lens.style.transform = `translate3d(${relX}px, 0, 0) scaleX(1.1)`;
              });
              bar.addEventListener('pointerup', e => {
                if (!navDrag) return;
                navDrag = false;
                lens.style.transition = 'transform 230ms cubic-bezier(0.22, 1.25, 0.36, 1)';
                const rect = bar.getBoundingClientRect();
                const target = Math.max(0, Math.min(4, Math.floor(((e.clientX - rect.left) / rect.width) * 5)));
                switchTab(target);
              });
            })();

