              <path android:strokeColor="#1E293B" android:strokeWidth="1" android:pathData="M0,27L108,27M0,54L108,54M0,81L108,81M27,0L27,108M54,0L54,108M81,0L81,108"/>
              <path android:strokeColor="#38BDF8" android:strokeAlpha="0.4" android:strokeWidth="2" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
