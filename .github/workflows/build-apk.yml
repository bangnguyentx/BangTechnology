                              put("shizukuAuthorized", ShizukuEngine.isShizukuAuthorized())
                              put("shizukuReady", ShizukuEngine.isReady())
                              put("shizukuLabel", ShizukuEngine.statusLabel())
                              put("gameWatcherActive", gameWatcherActive)
