            let savedRamThreshold = 4800;
            let sessionStartBattery = -1;
            let sessionStartTimeMs = Date.now();

            try {
              savedLogs = JSON.parse(localStorage.getItem('bang_v19_logs') || '[]');
              savedWhitelistMap = JSON.parse(localStorage.getItem('bang_v19_whitelist') || '{}');
              savedRamThreshold = parseInt(localStorage.getItem('bang_v19_ram_threshold') || '4800', 10);
              sessionStartBattery = parseInt(localStorage.getItem('bang_v19_drain_start_bat') || '-1', 10);
              sessionStartTimeMs = parseInt(localStorage.getItem('bang_v19_drain_start_time') || String(Date.now()), 10);
              currentFirePaletteIdx = parseInt(localStorage.getItem('bang_v19_fire_palette') || '0', 10);
              applyFirePaletteClass(currentFirePaletteIdx);
              if (localStorage.getItem('bang_v19_light_theme') === '1') {
                document.body.classList.add('light-mode');
              }
            } catch (e) {}

            function applyFirePaletteClass(idx) {
              document.body.classList.remove('fire-theme-amber', 'fire-theme-navy');
              if (idx === 1) document.body.classList.add('fire-theme-amber');
              else if (idx === 2) document.body.classList.add('fire-theme-navy');
            }

            function cycleFireElementPalette() {
              hapticTick();
              currentFirePaletteIdx = (currentFirePaletteIdx + 1) % 3;
              applyFirePaletteClass(currentFirePaletteIdx);
              try { localStorage.setItem('bang_v19_fire_palette', String(currentFirePaletteIdx)); } catch (e) {}
              const names = [
                '🔥 Bảng màu Mệnh Hỏa 1: Đen Tuyền + Đỏ Anh Túc + Xanh Băng',
                '🔥 Bảng màu Mệnh Hỏa 2: Đen Carbon + Đỏ Hổ Phách + Xanh Axit',
                '🔥 Bảng màu Mệnh Hỏa 3: Xanh Navy Đậm + Cam San Hô + Xanh Nhạt'
              ];
              showToast(names[currentFirePaletteIdx]);
            }

