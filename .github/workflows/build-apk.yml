              { id: 'f1_fstrim', name: 'Giải Phóng Bộ Nhớ Đệm Flash UFS', tag: 'Storage', desc: 'Dọn sạch cache ứng dụng tồn đọng giúp đọc ghi dữ liệu mượt hơn.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'pm trim-caches 999G', cmdOff: 'echo ok', verifyCmd: '', expectVal: '', minHz: 0 },
