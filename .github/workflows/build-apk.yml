                return;
              }
              box.innerHTML = savedLogs.map(line => `<div>${line}</div>`).join('');
            }

            function appendLog(actionDesc, status) {
              const now = new Date();
              const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
              const entry = `[${timeStr} • ${status}] ${actionDesc}`;
              savedLogs.unshift(entry);
              if (savedLogs.length > 80) savedLogs.pop();
              try { localStorage.setItem('bang_v16_logs', JSON.stringify(savedLogs)); } catch (e) {}
              renderSavedLogsToBox();
            }

            function clearSavedLogs() {
              hapticTick();
