              border-radius: 50%;
              will-change: transform;
            }
            .aurora-orb-1 {
              width: 310px;
              height: 310px;
              top: -90px;
              left: -60px;
              background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(16, 185, 129, 0.06) 52%, transparent 72%);
              animation: orbFloat1 11s ease-in-out infinite alternate;
            }
            .aurora-orb-2 {
              width: 280px;
              height: 280px;
              top: 22%;
              right: -80px;
              background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(56, 189, 248, 0.05) 55%, transparent 72%);
              animation: orbFloat2 14s ease-in-out infinite alternate;
            }
            @keyframes orbFloat1 {
              0% { transform: translate3d(0, 0, 0) scale(1); }
              100% { transform: translate3d(70px, 45px, 0) scale(1.14); }
            }
            @keyframes orbFloat2 {
              0% { transform: translate3d(0, 0, 0) scale(1); }
              100% { transform: translate3d(-65px, 60px, 0) scale(1.12); }
            }
            body.app-hidden .aurora-orb-1,
            body.app-hidden .aurora-orb-2,
            body.app-hidden .luminous-card::after {
              animation-play-state: paused !important;
            }

            /* ================= 2. ANIMATION CHUYỂN MỤC KIỂU COLOROS 17 (TRƯỢT ĐÀN HỒI 2 CHIỀU + THÁC ĐỔ) ================= */
            @keyframes colorosSlideFromRight {
              0% { opacity: 0; transform: translate3d(34px, 0, 0) scale(0.972); }
              100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
            }
            @keyframes colorosSlideFromLeft {
              0% { opacity: 0; transform: translate3d(-34px, 0, 0) scale(0.972); }
              100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
            }
            @keyframes cardCascadeUp {
              0% { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.968); }
              100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
            }
            .tab-pane {
              display: none;
              position: relative;
              z-index: 2;
            }
            .tab-pane.active {
              display: block;
            }
            .tab-pane.anim-right {
              animation: colorosSlideFromRight 340ms var(--coloros-spring) forwards;
            }
            .tab-pane.anim-left {
              animation: colorosSlideFromLeft 340ms var(--coloros-spring) forwards;
            }
            .tab-pane.active > .bento-card:nth-child(1) { animation: cardCascadeUp 320ms var(--coloros-spring) 15ms both; }
            .tab-pane.active > .bento-card:nth-child(2) { animation: cardCascadeUp 340ms var(--coloros-spring) 50ms both; }
            .tab-pane.active > .bento-card:nth-child(3) { animation: cardCascadeUp 360ms var(--coloros-spring) 85ms both; }
            .tab-pane.active > .bento-card:nth-child(4) { animation: cardCascadeUp 380ms var(--coloros-spring) 120ms both; }
            .tab-pane.active > .bento-card:nth-child(5) { animation: cardCascadeUp 400ms var(--coloros-spring) 150ms both; }

            /* ================= 3. THẺ KÍNH LUMINOUS & VỆT SÁNG QUÉT QUA VIỀN ================= */
            .bento-card {
              position: relative;
              overflow: hidden;
              background: var(--bg-card);
              border: 1px solid var(--border-hairline);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 10px 26px rgba(0, 0, 0, 0.42);
              border-radius: 22px;
              padding: 15px;
              margin: 10px 13px;
            }
            /* Ánh sáng quét ngang mặt kính kiểu ColorOS 17 */
            @keyframes lightSweepPass {
              0% { transform: translate3d(-130%, 0, 0) skewX(-22deg); }
              35%, 100% { transform: translate3d(230%, 0, 0) skewX(-22deg); }
            }
            .luminous-card::after {
              content: "";
              position: absolute;
              top: 0;
              bottom: 0;
              left: 0;
              width: 48%;
              background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.09), rgba(56, 189, 248, 0.12), transparent);
              transform: translate3d(-130%, 0, 0) skewX(-22deg);
              animation: lightSweepPass 6.5s ease-in-out infinite;
              pointer-events: none;
            }
            /* Hiệu ứng sóng sáng lan tỏa khi chạm vào bất kỳ nút/thẻ nào */
            .tap-spring {
              position: relative;
              overflow: hidden;
              transition: transform 110ms var(--coloros-spring), opacity 110ms ease;
              will-change: transform;
            }
            .tap-spring:active {
              transform: translateY(1px) scale(0.958);
              opacity: 0.92;
            }

            /* ================= 4. ANIMATION GAME SPACE TURBINE HUD (KHI BẬT GAME SPACE HOẶC MỞ GAME) ================= */
            .gamespace-hud-overlay {
              position: fixed;
              inset: 0;
              z-index: 350;
              background: radial-gradient(circle at 50% 45%, rgba(16, 24, 42, 0.94) 0%, rgba(5, 7, 12, 0.98) 100%);
              display: none;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              padding: 20px;
            }
            .gamespace-hud-overlay.show {
              display: flex;
              animation: hudFadeIn 220ms ease forwards;
            }
            @keyframes hudFadeIn {
              from { opacity: 0; transform: scale(1.06); }
              to { opacity: 1; transform: scale(1); }
            }
            @keyframes turbineSpinCw {
              to { transform: rotate(360deg); }
            }
            @keyframes turbineSpinCcw {
              to { transform: rotate(-360deg); }
            }
            @keyframes radarPulse {
              0% { transform: scale(0.85); opacity: 0.9; }
              100% { transform: scale(1.45); opacity: 0; }
            }
            .turbine-core-wrap {
              position: relative;
              width: 148px;
              height: 148px;
              display: flex;
              align-items: center;
              justify-content: center;
              margin-bottom: 18px;
            }
            .turbine-ring-outer {
              position: absolute;
              inset: 0;
              border-radius: 50%;
              border: 2.5px dashed #38BDF8;
              box-shadow: 0 0 25px rgba(56, 189, 248, 0.45);
              animation: turbineSpinCw 2.6s linear infinite;
            }
            .turbine-ring-inner {
              position: absolute;
              inset: 14px;
              border-radius: 50%;
              border: 2.5px solid transparent;
              border-top-color: #10B981;
              border-bottom-color: #A855F7;
              animation: turbineSpinCcw 1.5s linear infinite;
            }
            .turbine-pulse-wave {
              position: absolute;
              inset: 8px;
              border-radius: 50%;
              border: 2px solid rgba(16, 185, 129, 0.65);
              animation: radarPulse 1.1s ease-out infinite;
            }
            .turbine-center-badge {
              width: 86px;
              height: 86px;
              border-radius: 50%;
              background: linear-gradient(145deg, rgba(16, 185, 129, 0.25), rgba(56, 189, 248, 0.25));
              border: 1.5px solid rgba(255, 255, 255, 0.4);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              box-shadow: inset 0 0 18px rgba(56, 189, 248, 0.5);
            }
            .hud-telemetry-pills {
              display: flex;
              gap: 8px;
              margin-top: 12px;
              flex-wrap: wrap;
              justify-content: center;
            }
            .hud-pill-item {
              padding: 6px 12px;
              border-radius: 99px;
              background: rgba(56, 189, 248, 0.14);
              border: 1px solid rgba(56, 189, 248, 0.45);
              font-size: 11px;
              font-weight: 800;
              color: #E0F2FE;
              animation: cardCascadeUp 300ms var(--coloros-spring) both;
            }

            /* ================= 5. CÁC THÀNH PHẦN GIAO DIỆN CHÍNH ================= */
            .sec-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
            .sec-heading { font-size: 14px; font-weight: 800; }
            .sec-sub { font-size: 11px; color: var(--text-secondary); line-height: 1.38; }
            .badge-status-ok {
              font-size: 10px;
              font-weight: 700;
              padding: 4px 9px;
              border-radius: 99px;
              background: rgba(16, 185, 129, 0.16);
              border: 1px solid rgba(16, 185, 129, 0.42);
              color: #34D399;
              white-space: nowrap;
            }
            .badge-status-wait {
              font-size: 10px;
              font-weight: 700;
              padding: 4px 9px;
              border-radius: 99px;
              background: rgba(249, 115, 22, 0.16);
              border: 1px solid rgba(249, 115, 22, 0.42);
              color: #FB923C;
              white-space: nowrap;
            }
            .ring-gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
            .ring-box {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 16px;
              padding: 10px 6px;
              display: flex;
              flex-direction: column;
              align-items: center;
            }
            .ring-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; }
            .ring-svg-wrap { position: relative; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; }
            .ring-val-text { position: absolute; font-size: 12.5px; font-weight: 800; }
            .ring-sub-cap { font-size: 9.5px; color: var(--text-muted); margin-top: 5px; white-space: nowrap; }
            .hw-spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
            .hw-spec-cell {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 13px;
              padding: 9px 10px;
            }
            .hw-cell-lbl { font-size: 9.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 3px; }
            .hw-cell-val { font-size: 12px; font-weight: 800; line-height: 1.3; }
            .hw-cell-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
            .tweak-item {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 16px;
              padding: 11px 13px;
              margin-bottom: 8px;
              transition: border-color 180ms ease, background-color 180ms ease, transform 180ms var(--coloros-spring);
            }
            .tweak-item.active-on {
              border-color: rgba(16, 185, 129, 0.52);
              background: linear-gradient(135deg, rgba(16, 185, 129, 0.11) 0%, rgba(56, 189, 248, 0.04) 100%);
              box-shadow: 0 4px 16px rgba(16, 185, 129, 0.12);
            }
            .tweak-item.error-rejected {
              border-color: rgba(244, 63, 94, 0.58);
              background: rgba(244, 63, 94, 0.09);
            }
            .tweak-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
            .tweak-title { font-size: 12.6px; font-weight: 700; margin-bottom: 3px; }
            .tweak-desc { font-size: 10.8px; color: var(--text-secondary); line-height: 1.36; }
            .tweak-status-line {
              margin-top: 6px;
              padding-top: 5px;
              border-top: 1px solid rgba(255, 255, 255, 0.05);
              font-size: 10px;
              font-weight: 700;
              color: var(--text-muted);
            }
            .tweak-status-line.ok { color: #34D399; }
            .tweak-status-line.err { color: #FDA4AF; }
            .v14-switch {
              width: 48px;
              height: 27px;
              border-radius: 99px;
              background: rgba(148, 163, 184, 0.25);
              border: 1px solid rgba(148, 163, 184, 0.3);
              position: relative;
              flex-shrink: 0;
              cursor: pointer;
              transition: background-color 200ms ease, box-shadow 200ms ease;
            }
            .v14-switch::after {
              content: "";
              position: absolute;
              top: 2.5px;
              left: 2.5px;
              width: 20px;
              height: 20px;
              border-radius: 50%;
              background: #FFFFFF;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
              transition: transform 240ms var(--coloros-spring);
            }
            .v14-switch.on {
              background: linear-gradient(135deg, #10B981, #059669);
              border-color: transparent;
              box-shadow: 0 0 12px rgba(16, 185, 129, 0.45);
            }
            .v14-switch.on::after {
              transform: translate3d(21px, 0, 0);
            }
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
            .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .stat-well {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 13px;
              padding: 9px 7px;
              text-align: center;
              transition: all 180ms var(--coloros-spring);
            }
            .stat-well.active-preset {
              border-color: #38BDF8;
              background: rgba(56, 189, 248, 0.16);
              box-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
              transform: translateY(-1px);
            }
            .stat-well-label { font-size: 9.5px; color: var(--text-secondary); margin-bottom: 3px; white-space: nowrap; }
            .stat-well-val { font-size: 12.5px; font-weight: 800; white-space: nowrap; }
            .chart-matrix-box {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 15px;
              padding: 10px;
              margin-bottom: 8px;
            }
            .chart-time-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
            .chart-time-cell {
              background: rgba(255, 255, 255, 0.04);
              border: 1px solid var(--border-hairline);
              border-radius: 7px;
              padding: 4px 2px;
              text-align: center;
              font-size: 9.5px;
              font-weight: 700;
              color: var(--text-secondary);
            }
            .dns-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
            .dns-card-btn {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 14px;
              padding: 10px;
              text-align: left;
              transition: all 180ms var(--coloros-spring);
            }
            .dns-card-btn.active {
              border-color: #34D399;
              background: rgba(16, 185, 129, 0.15);
              box-shadow: 0 0 14px rgba(16, 185, 129, 0.2);
            }
            .game-card-item {
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 16px;
              padding: 11px 12px;
              margin-bottom: 8px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
            }
            .game-icon-box {
              width: 44px;
              height: 44px;
              border-radius: 12px;
              background: rgba(56, 189, 248, 0.12);
              border: 1px solid rgba(56, 189, 248, 0.28);
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
              flex-shrink: 0;
              font-weight: 800;
              font-size: 13px;
              color: #38BDF8;
            }
            .game-icon-box img { width: 100%; height: 100%; object-fit: cover; }
            .btn-launch-game {
              background: linear-gradient(135deg, #10B981, #059669);
              color: #FFFFFF;
              font-size: 11px;
              font-weight: 800;
              padding: 9px 12px;
              border-radius: 11px;
              white-space: nowrap;
              box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
            }
            .btn-full-action {
              width: 100%;
              padding: 12px;
              border-radius: 14px;
              background: rgba(255, 255, 255, 0.08);
              border: 1px solid rgba(255, 255, 255, 0.16);
              font-size: 12px;
              font-weight: 800;
              text-align: center;
              margin-top: 8px;
              display: block;
            }
            .btn-emerald-action {
              width: 100%;
              padding: 12px;
              border-radius: 14px;
              background: rgba(16, 185, 129, 0.16);
              border: 1px solid rgba(16, 185, 129, 0.45);
              color: #34D399;
              font-size: 12px;
              font-weight: 800;
              text-align: center;
              margin-top: 8px;
              display: block;
            }
            .num-input {
              width: 100%;
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 11px;
              padding: 9px 11px;
              font-size: 12px;
              font-weight: 700;
              color: var(--text-primary);
              text-align: center;
            }
            .oem-chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 9px; scrollbar-width: none; }
            .oem-chip-row::-webkit-scrollbar { display: none; }
            .oem-chip {
              padding: 7px 12px;
              border-radius: 10px;
              font-size: 11px;
              font-weight: 700;
              white-space: nowrap;
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              color: var(--text-secondary);
              transition: all 180ms var(--coloros-spring);
            }
            .oem-chip.active {
              background: rgba(56, 189, 248, 0.2);
              border-color: #38BDF8;
              color: var(--text-primary);
              transform: scale(1.03);
            }

            /* ================= 6. THANH ĐIỀU HƯỚNG ĐÁY COLOROS 17 FLUID LENS ================= */
            .bottom-nav-dock {
              position: fixed;
              bottom: 10px;
              left: 11px;
              right: 11px;
              max-width: 500px;
              margin: 0 auto;
              z-index: 120;
            }
            .glass-dock-track {
              position: relative;
              height: 62px;
              border-radius: 99px;
              padding: 5px;
              display: grid;
              grid-template-columns: repeat(5, 1fr);
              align-items: center;
              background: rgba(11, 15, 24, 0.94);
              border: 1px solid rgba(255, 255, 255, 0.22);
              box-shadow: 0 14px 34px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.25);
              touch-action: none;
            }
            .dock-sliding-lens {
              position: absolute;
              top: 5px;
              bottom: 5px;
              left: 5px;
              width: calc((100% - 10px) / 5);
              border-radius: 99px;
              background: radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.42) 0%, rgba(56, 189, 248, 0.28) 65%, rgba(16, 185, 129, 0.22) 100%);
              border: 1px solid rgba(255, 255, 255, 0.55);
              box-shadow: 0 0 18px rgba(56, 189, 248, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.7);
              pointer-events: none;
              z-index: 1;
              will-change: transform;
              transition: transform 320ms var(--coloros-spring);
            }
            .dock-tab-btn {
              position: relative;
              z-index: 2;
              height: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              font-size: 10.5px;
              font-weight: 700;
              color: #94A3B8;
              transition: color 180ms ease, transform 220ms var(--coloros-spring);
            }
            .dock-tab-btn.active {
              color: #FFFFFF;
              transform: translateY(-1px) scale(1.06);
              text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            }
            .modal-backdrop {
              position: fixed;
              inset: 0;
              background: rgba(3, 5, 10, 0.86);
              z-index: 240;
              display: none;
              align-items: center;
              justify-content: center;
              padding: 14px;
            }
            .modal-backdrop.open { display: flex; }
            .modal-sheet-box {
              width: 100%;
              max-width: 410px;
              border-radius: 26px;
              padding: 18px;
              max-height: 86vh;
              overflow-y: auto;
              background: #0D121D;
              border: 1px solid rgba(255, 255, 255, 0.22);
              animation: cardCascadeUp 260ms var(--coloros-spring) both;
            }
            #toastPill {
              position: fixed;
              top: 14px;
              left: 50%;
              transform: translate3d(-50%, -24px, 0) scale(0.92);
              z-index: 400;
              padding: 10px 16px;
              border-radius: 99px;
              background: linear-gradient(135deg, #0F172A, #1E293B);
              border: 1px solid #38BDF8;
              box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.35);
              font-size: 11.5px;
              font-weight: 700;
              color: #FFFFFF;
              opacity: 0;
              pointer-events: none;
              transition: opacity 200ms ease, transform 240ms var(--coloros-spring);
              max-width: 92vw;
              text-align: center;
            }
            #toastPill.show {
              opacity: 1;
              transform: translate3d(-50%, 0, 0) scale(1);
            }
          </style>
          </head>
          <body>

          <!-- SÂN KHẤU ÁNH SÁNG CỰC QUANG TRÔI NỔI COLOROS 17 -->
          <div class="ambient-light-stage">
            <div class="aurora-orb-1"></div>
            <div class="aurora-orb-2"></div>
          </div>

          <div id="toastPill">BangOptimize v17.0 Shizuku ColorOS 17 sẵn sàng</div>

          <!-- ANIMATION GAME SPACE TURBINE HUD (KÍCH HOẠT KHI BẬT GAME SPACE HOẶC MỞ GAME) -->
          <div id="gameSpaceAnimModal" class="gamespace-hud-overlay" onclick="closeGameSpaceAnimHud()">
            <div class="turbine-core-wrap">
              <div class="turbine-pulse-wave"></div>
              <div class="turbine-ring-outer"></div>
              <div class="turbine-ring-inner"></div>
              <div class="turbine-center-badge">
                <div style="font-size:22px;">🎮</div>
                <div style="font-size:11px; font-weight:900; color:#34D399; margin-top:2px;">HYPERBOOST</div>
              </div>
            </div>
            <div id="gsHudTitle" style="font-size:18px; font-weight:900; letter-spacing:-0.02em; color:#FFFFFF; text-align:center;">
              ĐANG KÍCH HOẠT BANG GAME SPACE
            </div>
            <div id="gsHudSub" style="font-size:12px; color:#38BDF8; font-weight:700; margin-top:4px; text-align:center;">
              Đồng bộ Shizuku UID 2000 • Mở khóa 120FPS & Cảm ứng 0ms
            </div>
            <div class="hud-telemetry-pills">
              <span class="hud-pill-item">⚡ Cảm ứng: 150ms (0ms Delay)</span>
              <span class="hud-pill-item">🎯 Tâm ngắm ảo: Sẵn sàng</span>
              <span class="hud-pill-item">🚀 Dọn RAM & Khóa Hz</span>
            </div>
          </div>

          <!-- MODAL THÊM GAME MỚI -->
          <div id="addGameModal" class="modal-backdrop" onclick="closeAddGameModal()">
            <div class="modal-sheet-box" onclick="event.stopPropagation()">
              <div class="sec-row">
