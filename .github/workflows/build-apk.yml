              const wh = parts[0] || '720x1600';
              const dpi = parts[1] || '293';
              const boostCmd = `cmd game mode performance ${pkg} && cmd package compile -m speed-profile -f ${pkg} && wm size ${wh} && wm density ${dpi} && settings put secure long_press_timeout 150 && settings put system pointer_speed 7 && am kill-all`;

              // Kích hoạt ngay Logo Tròn Nhỏ Nổi cả ở trong Web lẫn Service Native khi bấm Tối ưu mở Game!
              spawnDraggableFloatingOrbInApp();

              playGameSpaceAnimHud(
                `ĐANG TỐI ƯU & MỞ ${name.toUpperCase()}`,
                `Bung Logo Tròn Kính Lỏng • Chạm Logo Để Mở Magic Game Space`,
                () => {
                  if (window.BangBridge && window.BangBridge.launchAndBoostGame) {
                    const opened = window.BangBridge.launchAndBoostGame(pkg, boostCmd);
                    appendLog(`Khởi chạy ${name} kèm Logo Tròn Magic Game Space`, opened ? 'ĐÃ MỞ GAME' : 'ĐÃ TỐI ƯU');
                    showToast(opened ? `🚀 Đã mở ${name} & hiện Logo Tròn Nổi Game Space!` : `🔮 Đã kích hoạt Logo Tròn Nổi cho ${name}!`);
