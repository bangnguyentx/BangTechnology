            ];

            const allToggleRegistry = new Map();
            function rebuildRegistry() {
              [...proGameTools, ...universalSystemTweaks, ...netAndBatteryTweaks, ...ramDeepTools].forEach(it => allToggleRegistry.set(it.id, it));
              Object.values(oemProfiles).forEach(arr => arr.forEach(it => allToggleRegistry.set(it.id, it)));
            }
            rebuildRegistry();

            // ================= 2. LOGO TRÒN NHỎ KÉO THẢ 360° & HIỆU ỨNG BUNG MỞ BẢNG MAGIC GAME SPACE =================
            (function initDraggableFloatingOrbInWeb() {
              const orb = document.getElementById('floatingGameOrb');
              if (!orb) return;
              let dragging = false;
              let moved = false;
              let startX = 0, startY = 0;
              let orbLeft = window.innerWidth - 54;
              let orbTop = Math.round(window.innerHeight * 0.38);

              function applyOrbPos(x, y, withTransition) {
                orbLeft = x;
                orbTop = y;
                orb.style.transition = withTransition
                  ? 'left 380ms cubic-bezier(0.18, 1.15, 0.28, 1), top 280ms ease, opacity 320ms ease, transform 340ms cubic-bezier(0.18, 1.15, 0.28, 1)'
                  : 'none';
                orb.style.right = 'auto';
                orb.style.left = x + 'px';
                orb.style.top = y + 'px';
              }

              orb.addEventListener('pointerdown', (e) => {
                dragging = true;
                moved = false;
                hapticTick();
                orb.setPointerCapture(e.pointerId);
                const rect = orb.getBoundingClientRect();
                orbLeft = rect.left;
                orbTop = rect.top;
                startX = e.clientX - orbLeft;
                startY = e.clientY - orbTop;
                orb.style.transition = 'transform 120ms ease';
                orb.style.transform = 'scale(1.14)';
                orb.style.opacity = '1';
                clearTimeout(window._orbIdleTimer);
              });

              orb.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const nx = e.clientX - startX;
                const ny = e.clientY - startY;
                if (Math.abs(nx - orbLeft) > 5 || Math.abs(ny - orbTop) > 5) {
                  moved = true;
                }
                if (moved) {
                  const clampedX = Math.max(6, Math.min(window.innerWidth - 50, nx));
                  const clampedY = Math.max(24, Math.min(window.innerHeight - 90, ny));
                  applyOrbPos(clampedX, clampedY, false);
                }
              });

              orb.addEventListener('pointerup', () => {
                if (!dragging) return;
                dragging = false;
                orb.style.transform = 'scale(1)';
                if (!moved) {
                  openMagicGameSpacePreview();
                } else {
                  const snapX = (orbLeft + 22 < window.innerWidth / 2) ? 8 : (window.innerWidth - 52);
                  applyOrbPos(snapX, orbTop, true);
                  window._orbIdleTimer = setTimeout(() => {
                    orb.style.opacity = '0.78';
                  }, 3200);
                }
              });
            })();

            function spawnDraggableFloatingOrbInApp() {
              hapticTick();
              const orb = document.getElementById('floatingGameOrb');
              if (orb) {
                orb.classList.add('visible');
                orb.classList.remove('morphed-out');
                orb.style.opacity = '1';
              }
              showToast('🔮 Đã hiện Logo Tròn Nổi! Hãy kéo di chuyển hoặc chạm vào để bung Magic Game Space.');
            }

            function openMagicGameSpacePreview() {
              hapticTick();
              const orb = document.getElementById('floatingGameOrb');
              const backdrop = document.getElementById('magicGsPreviewBackdrop');
              const panel = document.getElementById('magicGsCapsulePanel');
              if (orb && panel) {
                const rect = orb.getBoundingClientRect();
                const isLeft = rect.left > 0 && (rect.left + 22 < window.innerWidth / 2);
                backdrop.style.justifyContent = isLeft ? 'flex-start' : 'flex-end';
                backdrop.style.paddingLeft = isLeft ? '16px' : '0';
                backdrop.style.paddingRight = isLeft ? '0' : '16px';
                panel.style.transformOrigin = isLeft ? 'left center' : 'right center';
                orb.classList.add('morphed-out');
              }
              if (backdrop) backdrop.classList.add('open');
            }

            function closeMagicGameSpacePreview() {
              hapticTick();
              const orb = document.getElementById('floatingGameOrb');
              const backdrop = document.getElementById('magicGsPreviewBackdrop');
              if (backdrop) backdrop.classList.remove('open');
              if (orb) {
                setTimeout(() => {
                  orb.classList.remove('morphed-out');
                }, 220);
              }
            }

            document.addEventListener('pointerdown', (e) => {
              const target = e.target.closest('.tap-spring, .tweak-item, .dns-card-btn, .oem-chip');
              if (!target) return;
              const rect = target.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              const ripple = document.createElement('span');
              ripple.style.cssText = `
                position:absolute;
                left:${x}px;
                top:${y}px;
                width:12px;
                height:12px;
                border-radius:50%;
                background:radial-gradient(circle, rgba(125,211,252,0.48) 0%, rgba(16,185,129,0.22) 60%, transparent 100%);
                transform:translate(-50%, -50%) scale(1);
                pointer-events:none;
                z-index:5;
                transition:transform 540ms cubic-bezier(0.18, 1.08, 0.28, 1), opacity 540ms ease;
              `;
              if (getComputedStyle(target).position === 'static') {
                target.style.position = 'relative';
              }
              target.appendChild(ripple);
              requestAnimationFrame(() => {
                ripple.style.transform = 'translate(-50%, -50%) scale(20)';
                ripple.style.opacity = '0';
              });
              setTimeout(() => ripple.remove(), 560);
            }, { passive: true });

            function quickExitGameAndRestoreNormalUI() {
              hapticTick();
              closeMagicGameSpacePreview();
              const orb = document.getElementById('floatingGameOrb');
              if (orb) orb.classList.remove('visible');
              const restoreCmd = 'wm size reset && wm density reset && settings put system pointer_speed 0 && settings put global heads_up_notifications_enabled 1 && settings put system screen_brightness_mode 1';
              runVerifiedCustomCmd('out_game_' + Date.now(), false, '', '', '', restoreCmd, restoreCmd, () => {
                document.getElementById('inpW').value = nativeWidth;
                document.getElementById('inpH').value = nativeHeight;
                document.getElementById('inpDpi').value = nativeDpi;
                document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
                appendLog('Out Game: Đã đóng chế độ Game & khôi phục giao diện bình thường (1080p gốc)', 'HOÀN TÁC GỐC');
                showToast('🚪 Đã thoát chế độ Game & đưa giao diện màn hình về bình thường!');
                switchTab(0);
              });
            }

            function playGameSpaceAnimHud(titleText, subText, onComplete) {
              const modal = document.getElementById('gameSpaceAnimModal');
              const tEl = document.getElementById('gsHudTitle');
              const sEl = document.getElementById('gsHudSub');
              if (!modal) {
                if (onComplete) onComplete();
                return;
              }
              if (tEl && titleText) tEl.textContent = titleText;
              if (sEl && subText) sEl.textContent = subText;
              modal.classList.add('show');
              clearTimeout(window._gsHudTimer);
              window._gsHudTimer = setTimeout(() => {
                modal.classList.remove('show');
                if (onComplete) onComplete();
              }, 1350);
            }

            function closeGameSpaceAnimHud() {
              const modal = document.getElementById('gameSpaceAnimModal');
              if (modal) modal.classList.remove('show');
            }

            // ================= 3. VẼ DANH SÁCH CÔNG TẮC & THỰC THI QUA SHIZUKU =================
            function buildTweakCardHtml(item) {
              const statusTxt = item.statusText || (item.on ? '✓ Đang bật trên hệ thống (Shizuku Verified)' : 'Trạng thái: Đang tắt');
              const statusCls = item.statusClass || (item.on ? 'ok' : '');
              return `
                <div id="card_${item.id}" class="tweak-item ${item.on ? 'active-on' : ''} ${statusCls === 'err' ? 'error-rejected' : ''}">
                  <div class="tweak-top">
                    <div style="flex:1;">
                      <div class="tweak-title">${item.name}</div>
                      <div class="tweak-desc">${item.desc}</div>
                    </div>
                    <div id="sw_${item.id}" class="v14-switch ${item.on ? 'on' : ''}" onclick="onUserClickTrueToggle('${item.id}')"></div>
                  </div>
                  <div id="st_${item.id}" class="tweak-status-line ${statusCls}">${statusTxt}</div>
                </div>
              `;
            }

            let currentSelectedBrand = 'HYPEROS';

            function renderAllTweakLists(currentOemKey = 'HYPEROS') {
              document.getElementById('proGameToolsList').innerHTML = proGameTools.map(buildTweakCardHtml).join('');
              document.getElementById('universalSystemTweakList').innerHTML = universalSystemTweaks.map(buildTweakCardHtml).join('');
              document.getElementById('netAndBatteryTweakList').innerHTML = netAndBatteryTweaks.map(buildTweakCardHtml).join('');
              document.getElementById('ramDeepToolsList').innerHTML = ramDeepTools.map(buildTweakCardHtml).join('');
              selectOemBrand(currentOemKey);
              updateActiveCountSummary();
            }

            function selectOemBrand(brandKey, btnEl) {
              currentSelectedBrand = brandKey;
              if (btnEl) {
                hapticTick();
                document.querySelectorAll('#oemChipRow .oem-chip').forEach(el => el.classList.remove('active'));
                btnEl.classList.add('active');
              }
              const list = oemProfiles[brandKey] || oemProfiles.HYPEROS;
              document.getElementById('oemSpecificTweakList').innerHTML = list.map(buildTweakCardHtml).join('');
            }

            function updateSingleTweakCardDOM(id) {
              const item = allToggleRegistry.get(id);
              if (!item) return;
              const card = document.getElementById('card_' + id);
              const sw = document.getElementById('sw_' + id);
              const st = document.getElementById('st_' + id);
              if (!card || !sw || !st) return;

              sw.classList.toggle('on', !!item.on);
              card.classList.toggle('active-on', !!item.on && item.statusClass !== 'err');
              card.classList.toggle('error-rejected', item.statusClass === 'err');
              st.className = 'tweak-status-line ' + (item.statusClass || (item.on ? 'ok' : ''));
              st.textContent = item.statusText || (item.on ? '✓ Đang bật trên hệ thống' : 'Trạng thái: Đang tắt');
              updateActiveCountSummary();
            }

            function updateActiveCountSummary() {
              let activeTotal = 0;
              allToggleRegistry.forEach(it => { if (it.on) activeTotal++; });
              const sysBadge = document.getElementById('sysActiveCounter');
              if (sysBadge) sysBadge.textContent = `${activeTotal} chức năng đang bật`;
            }

            function onUserClickTrueToggle(id) {
              const item = allToggleRegistry.get(id);
              if (!item) return;
              hapticTick();

              if (item.isAutoRestore) {
                item.on = !item.on;
                item.statusClass = item.on ? 'ok' : '';
                item.statusText = item.on ? '✓ Đang bật tự hoàn trả 1080p khi rời Game' : 'Đã tắt tự hoàn trả';
                updateSingleTweakCardDOM(id);
                if (window.BangBridge && window.BangBridge.setAutoRestoreGameOnExit) {
                  window.BangBridge.setAutoRestoreGameOnExit(item.on);
                }
                showToast(item.statusText);
                return;
              }

              const targetOn = !item.on;
              item.statusClass = '';
              item.statusText = targetOn ? '⏳ Đang ghi qua Shizuku & kiểm chứng...' : '⏳ Đang khôi phục về giá trị gốc ban đầu...';
              updateSingleTweakCardDOM(id);

              if (window.BangBridge && window.BangBridge.execTrueStateToggleAsync) {
                window.BangBridge.execTrueStateToggleAsync(
                  item.id,
                  targetOn,
                  item.stateKey || '',
                  item.expectVal || '',
                  item.defOff || '',
                  item.cmdOn || 'echo ok',
                  item.cmdOff || 'echo ok',
                  item.minHz || 0
                );
              } else {
                item.on = false;
                item.statusClass = 'err';
                item.statusText = '❌ Lỗi: Chưa kết nối Shizuku (Hãy bấm Cấp quyền Shizuku ở Trang chủ)';
                updateSingleTweakCardDOM(id);
                showToast('❌ Chưa kết nối Shizuku! Hãy cấp quyền Shizuku trước.');
                requestShizukuAuthNow();
              }
            }

            let customCmdCallbacks = {};

            function runVerifiedCustomCmd(cmdId, targetOn, stateKey, expectVal, defOff, cmdOn, cmdOff, cb) {
              customCmdCallbacks[cmdId] = cb;
              if (window.BangBridge && window.BangBridge.execTrueStateToggleAsync) {
                window.BangBridge.execTrueStateToggleAsync(cmdId, targetOn, stateKey, expectVal, defOff, cmdOn, cmdOff, 0);
              } else {
                delete customCmdCallbacks[cmdId];
                cb({ ok: false, reason: 'Chưa kết nối Shizuku UID 2000!', needShizuku: true });
              }
            }

            window.onSwitchVerifiedResult = function(res) {
              if (!res) return;

              if (res.itemId && customCmdCallbacks[res.itemId]) {
                const fn = customCmdCallbacks[res.itemId];
                delete customCmdCallbacks[res.itemId];
                fn(res);
                return;
              }

              const item = allToggleRegistry.get(res.itemId);
              if (!item) return;

              if (res.ok) {
                item.on = !!res.targetOn;
                item.statusClass = item.on ? 'ok' : '';
                item.statusText = item.on
                  ? `✓ Đã ghi & xác thực qua Shizuku (${res.verifiedValue || 'Hoạt động'})`
                  : `↺ Đã hoàn trả về ban đầu (${res.verifiedValue || 'Mặc định'})`;
                updateSingleTweakCardDOM(item.id);
                appendLog(`${item.on ? 'Bật' : 'Tắt hoàn trả'}: ${item.name} -> ${res.verifiedValue || 'OK'}`, 'SHIZUKU OK');
                showToast(item.on ? `✅ Đã bật thật: ${item.name}` : `↺ Đã trả về ban đầu: ${item.name}`);
              } else {
                item.on = false;
                item.statusClass = 'err';
                item.statusText = `❌ Không ghi được vào máy: ${res.reason || 'Shizuku chưa cấp quyền hoặc ROM chặn'}`;
                updateSingleTweakCardDOM(item.id);
                appendLog(`Lỗi ghi [${item.name}]: ${res.reason}`, 'TỪ CHỐI');
                showToast(`❌ Lỗi: ${res.reason}`);
                if (res.needShizuku) requestShizukuAuthNow();
              }
            };

            // ================= 4. QUÉT DỮ LIỆU THẬT TRÊN MÁY KHI MỞ APP =================
            function syncScannedStatesFromDevice(scannedStates) {
              if (!scannedStates) return;
              const savedMem = scannedStates._savedMemory || {};
              let detectedActiveCount = 0;

              allToggleRegistry.forEach(item => {
                if (item.isAutoRestore) {
                  if (savedMem.auto_restore_game !== undefined) {
                    item.on = !!savedMem.auto_restore_game;
                  }
                  return;
                }

                if (item.stateKey && scannedStates[item.stateKey] !== undefined) {
                  const actualVal = String(scannedStates[item.stateKey] || '').trim();
                  if (actualVal !== '' && item.expectVal !== '') {
                    const isMatched = actualVal.toLowerCase() === item.expectVal.toLowerCase() ||
                                      actualVal.toLowerCase().startsWith(item.expectVal.toLowerCase());
                    item.on = isMatched;
                    if (isMatched) {
                      detectedActiveCount++;
                      item.statusClass = 'ok';
                      item.statusText = `✓ Đã quét thấy đang bật sẵn trên máy (${item.stateKey.split(':')[1]} = ${actualVal})`;
                    } else {
                      item.statusClass = '';
                      item.statusText = `Giá trị hiện tại trên máy: ${actualVal}`;
                    }
                    return;
                  }
                }

                if (savedMem[item.id] !== undefined) {
                  item.on = !!savedMem[item.id];
                  if (item.on) {
                    detectedActiveCount++;
                    item.statusClass = 'ok';
                    item.statusText = '✓ Đã khôi phục trạng thái bật từ bộ nhớ máy';
                  } else {
                    item.statusClass = '';
                    item.statusText = 'Trạng thái: Đang tắt';
                  }
                }
              });

              const winScale = String(scannedStates['global:window_animation_scale'] || '1.0').trim();
              highlightAnimationScaleButtons(winScale);

              const dnsMode = String(scannedStates['global:private_dns_mode'] || '').trim();
              const dnsHost = String(scannedStates['global:private_dns_specifier'] || '').trim().toLowerCase();
              syncDnsSelectionFromScan(dnsMode, dnsHost);

              const adbEnabledVal = String(scannedStates['global:adb_enabled'] || '').trim();
              const swStealth = document.getElementById('swStealthVneid');
              const cardStealth = document.getElementById('cardStealthVneid');
              const stStealth = document.getElementById('stStealthVneid');
              if (swStealth && cardStealth && stStealth) {
                const isHiddenNow = adbEnabledVal === '0';
                swStealth.classList.toggle('on', isHiddenNow);
                cardStealth.classList.toggle('active-on', isHiddenNow);
                stStealth.className = 'tweak-status-line ' + (isHiddenNow ? 'ok' : '');
                stStealth.textContent = isHiddenNow
                  ? '✓ Đã quét máy: Trạng thái ADB đang được ẩn (Mở VNeID & Ngân hàng an toàn)'
                  : 'Trạng thái trên máy: Đang hiển thị gỡ lỗi ADB';
              }

              renderAllTweakLists(currentSelectedBrand);

              const sumEl = document.getElementById('headerScanSummary');
              if (sumEl) {
                sumEl.textContent = detectedActiveCount > 0
                  ? `✓ Đã quét máy: Phát hiện & tự động bật ${detectedActiveCount} chức năng đã kích hoạt`
                  : `✓ Đã quét toàn bộ máy: Các thông số đang ở mức mặc định gốc`;
              }
            }

            function triggerManualFullScan() {
              hapticTick();
              showToast('🔍 Đang đồng bộ Shizuku & quét toàn bộ thông số trên máy...');
              if (window.BangBridge && window.BangBridge.scanAllSystemStatesNow) {
                window.BangBridge.scanAllSystemStatesNow();
              }
            }

            function requestShizukuAuthNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.requestShizukuPermission) {
                window.BangBridge.requestShizukuPermission();
              } else {
                showToast('⚡ Đang yêu cầu quyền Shizuku UID 2000...');
              }
            }

            function openExternalShizukuAppNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.openShizukuApp) {
                window.BangBridge.openShizukuApp();
              } else {
                showToast('Hãy mở ứng dụng Shizuku trên màn hình chính của bạn!');
              }
            }

            // ================= 5. CHẾ ĐỘ CHỜ GAME SPACE + LOGO TRÒN NỔI =================
            function toggleSmartGameSpaceWatcherUI(el) {
              hapticTick();
              const targetOn = !el.classList.contains('on');
              const stLine = document.getElementById('gameSpaceStatusLine');

              if (window.BangBridge && window.BangBridge.toggleSmartGameSpaceWatcherStr) {
                try {
                  const res = JSON.parse(window.BangBridge.toggleSmartGameSpaceWatcherStr(targetOn));
                  if (res.ok) {
                    el.classList.toggle('on', targetOn);
                    if (stLine) {
                      stLine.className = 'tweak-status-line ' + (targetOn ? 'ok' : '');
                      stLine.textContent = targetOn
                        ? '✓ Đang canh gác ngầm! Logo Tròn Nhỏ sẽ tự động hiện lên khi bạn vào Game.'
                        : 'Trạng thái: Đang tắt';
                    }
                    appendLog(res.msg, 'GAME SPACE');
                    if (targetOn) {
                      spawnDraggableFloatingOrbInApp();
                      playGameSpaceAnimHud(
                        'ĐÃ BẬT MAGIC GAME SPACE ORB',
                        'Đang chuyển sang Game Hub • Chọn mở Game để bung Logo Tròn Nổi!',
                        () => switchTab(1)
                      );
                    } else {
                      const orb = document.getElementById('floatingGameOrb');
                      if (orb) orb.classList.remove('visible');
                      showToast('🎮 ' + res.msg);
                    }
                  } else {
                    el.classList.remove('on');
                    if (stLine) {
                      stLine.className = 'tweak-status-line err';
                      stLine.textContent = '❌ ' + (res.msg || 'Chưa cấp quyền hiển thị trên ứng dụng khác');
                    }
                    showToast('⚠️ ' + res.msg);
                  }
                } catch (e) {}
              } else {
                el.classList.toggle('on', targetOn);
                if (targetOn) {
                  spawnDraggableFloatingOrbInApp();
                  playGameSpaceAnimHud(
                    'ĐÃ BẬT MAGIC GAME SPACE ORB',
                    'Đang chuyển sang Game Hub • Chọn mở Game để bung Logo Tròn Nổi!',
                    () => switchTab(1)
                  );
                } else {
                  const orb = document.getElementById('floatingGameOrb');
                  if (orb) orb.classList.remove('visible');
                }
              }
            }

            // ================= 6. HOẠT ẢNH & ĐỘ PHÂN GIẢI =================
            function highlightAnimationScaleButtons(scaleStr) {
              const s10 = document.getElementById('btnScale10');
              const s05 = document.getElementById('btnScale05');
              const s00 = document.getElementById('btnScale00');
              const lbl = document.getElementById('animLabel');
              if (!s10 || !s05 || !s00) return;

              s10.classList.remove('active-preset');
              s05.classList.remove('active-preset');
              s00.classList.remove('active-preset');

              if (scaleStr === '0' || scaleStr === '0.0') {
                s00.classList.add('active-preset');
                if (lbl) lbl.textContent = 'Đang bật: 0.0x Tức thì';
              } else if (scaleStr === '0.5' || scaleStr === '.5') {
                s05.classList.add('active-preset');
                if (lbl) lbl.textContent = 'Đang bật: 0.5x Mượt';
              } else {
                s10.classList.add('active-preset');
                if (lbl) lbl.textContent = `Hiện tại: ${scaleStr || '1.0'}x Chuẩn`;
              }
            }

            function applyTrueAnimationScale(scaleVal, label) {
              hapticTick();
              const cmd = `settings put global window_animation_scale ${scaleVal} && settings put global transition_animation_scale ${scaleVal} && settings put global animator_duration_scale ${scaleVal}`;
              runVerifiedCustomCmd('anim_scale_' + Date.now(), true, 'global:window_animation_scale', scaleVal, '1.0', cmd, '', (res) => {
                if (res.ok) {
                  highlightAnimationScaleButtons(scaleVal);
                  triggerManualFullScan();
                  appendLog(`Đặt tốc độ hoạt ảnh = ${scaleVal}x`, 'SHIZUKU OK');
                  showToast(`✅ Đã ghi vào máy: ${label}`);
                } else {
                  appendLog(`Lỗi đặt hoạt ảnh ${scaleVal}x: ${res.reason}`, 'TỪ CHỐI');
                  showToast(`❌ Không ghi được: ${res.reason}`);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            function applyResolution(isTest15s) {
              hapticTick();
              const w = parseInt(document.getElementById('inpW').value, 10) || nativeWidth;
              const h = parseInt(document.getElementById('inpH').value, 10) || nativeHeight;
              const dpi = parseInt(document.getElementById('inpDpi').value, 10) || nativeDpi;
              const cmd = `wm size ${w}x${h} && wm density ${dpi}`;

              runVerifiedCustomCmd('res_apply_' + Date.now(), true, '', '', '', cmd, '', (res) => {
                if (res.ok) {
                  document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
                  appendLog(`Đổi độ phân giải: ${w}x${h} @ ${dpi} DPI`, 'SHIZUKU OK');
                  showToast(`🖥️ Đã áp dụng thật: ${w}x${h} @ ${dpi} DPI`);
                  clearInterval(revertTimer);
                  const btn = document.getElementById('btnTest15s');
                  if (isTest15s) {
                    let sec = 15;
                    btn.textContent = `Hoàn tác (${sec}s)`;
                    revertTimer = setInterval(() => {
                      sec--;
                      btn.textContent = `Hoàn tác (${sec}s)`;
                      if (sec <= 0) {
                        clearInterval(revertTimer);
                        resetResolution();
                      }
                    }, 1000);
                  } else {
                    btn.textContent = 'Thử 15s';
                  }
                } else {
                  appendLog(`Lỗi đổi độ phân giải: ${res.reason}`, 'TỪ CHỐI');
                  showToast(`❌ Không thể đổi độ phân giải: ${res.reason}`);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            function resetResolution() {
              hapticTick();
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = 'Thử 15s';
              runVerifiedCustomCmd('res_reset_' + Date.now(), false, '', '', '', 'wm size reset && wm density reset', 'wm size reset && wm density reset', (res) => {
                document.getElementById('inpW').value = nativeWidth;
                document.getElementById('inpH').value = nativeHeight;
                document.getElementById('inpDpi').value = nativeDpi;
                document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
                if (res.ok) {
                  appendLog('Khôi phục độ phân giải & DPI về mặc định gốc', 'HOÀN TÁC');
                  showToast('🔄 Đã trả màn hình về đúng độ phân giải gốc ban đầu!');
                } else {
                  showToast('❌ Lỗi: ' + (res.reason || 'Chưa cấp quyền Shizuku'));
                }
              });
            }

            // ================= 7. KHO 8 MÁY CHỦ DNS =================
            const dnsServers = [
              { id: 'cf', name: 'Cloudflare 1.1.1.1', sub: 'Ping thấp nhất cho Game', host: 'one.one.one.one', mode: 'hostname' },
              { id: 'gg', name: 'Google Public DNS', sub: 'Ổn định quốc tế 8.8.8.8', host: 'dns.google', mode: 'hostname' },
              { id: 'ag', name: 'AdGuard DNS', sub: 'Chặn quảng cáo toàn máy', host: 'dns.adguard-dns.com', mode: 'hostname' },
              { id: 'q9', name: 'Quad9 Security', sub: 'Bảo mật & chống giật lag', host: 'dns.quad9.net', mode: 'hostname' },
              { id: 'cd', name: 'ControlD Gaming', sub: 'Tối ưu tuyến cáp châu Á', host: 'freedns.controld.com', mode: 'hostname' },
              { id: 'od', name: 'OpenDNS Cisco', sub: 'Phân giải tên miền siêu tốc', host: 'doh.opendns.com', mode: 'hostname' },
              { id: 'nx', name: 'NextDNS Ultra', sub: 'Độ trễ thấp cho MOBA/FPS', host: 'dns.nextdns.io', mode: 'hostname' },
              { id: 'auto', name: 'Mặc định Nhà mạng', sub: 'Trả về DNS gốc ban đầu', host: '', mode: 'opportunistic' }
            ];
            let selectedDnsId = 'auto';

            function syncDnsSelectionFromScan(dnsMode, dnsHost) {
              const statusEl = document.getElementById('currentDnsStatusText');
              if (dnsMode === 'hostname' && dnsHost) {
                const matched = dnsServers.find(d => d.host && dnsHost.includes(d.host.toLowerCase()));
                if (matched) {
                  selectedDnsId = matched.id;
                  if (statusEl) statusEl.textContent = `✓ Đã quét máy: Đang dùng ${matched.name} (${dnsHost})`;
                } else {
                  selectedDnsId = '';
                  if (statusEl) statusEl.textContent = `✓ Đã quét máy: Đang dùng DNS tùy chỉnh (${dnsHost})`;
                }
              } else {
                selectedDnsId = 'auto';
                if (statusEl) statusEl.textContent = `✓ Đã quét máy: Đang ở DNS Mặc định Nhà mạng (${dnsMode || 'Tự động'})`;
              }
              renderDnsGrid();
            }

            function renderDnsGrid() {
              const box = document.getElementById('dnsSwitcherGrid');
              if (!box) return;
              box.innerHTML = dnsServers.map(d => {
                const isAct = selectedDnsId === d.id;
                return `
                  <button class="dns-card-btn tap-spring ${isAct ? 'active' : ''}" onclick="applyDnsServer('${d.id}')">
                    <div style="font-size:12px; font-weight:800; color:${isAct ? '#34D399' : 'var(--text-primary)'};">
                      ${isAct ? '✓ ' : '🌐 '}${d.name}
                    </div>
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;">${d.sub}</div>
                  </button>
                `;
              }).join('');
            }

            function applyDnsServer(id) {
              hapticTick();
              const d = dnsServers.find(x => x.id === id);
              if (!d) return;

              const shouldRevertToDefault = (selectedDnsId === id && id !== 'auto') || id === 'auto';
              const targetDns = shouldRevertToDefault ? dnsServers.find(x => x.id === 'auto') : d;

              const cmd = targetDns.mode === 'hostname'
                ? `settings put global private_dns_mode hostname && settings put global private_dns_specifier ${targetDns.host}`
                : `settings put global private_dns_mode opportunistic && settings delete global private_dns_specifier`;

              const stateKeyToVerify = targetDns.mode === 'hostname' ? 'global:private_dns_specifier' : 'global:private_dns_mode';
              const expectValToVerify = targetDns.mode === 'hostname' ? targetDns.host : 'opportunistic';

              runVerifiedCustomCmd('dns_' + Date.now(), true, stateKeyToVerify, expectValToVerify, 'opportunistic', cmd, '', (res) => {
                if (res.ok) {
                  selectedDnsId = targetDns.id;
                  renderDnsGrid();
                  const statusEl = document.getElementById('currentDnsStatusText');
                  if (statusEl) {
                    statusEl.textContent = targetDns.mode === 'hostname'
                      ? `✓ Đã ghi & xác thực DNS: ${targetDns.name} (${targetDns.host})`
                      : `↺ Đã trả về DNS Mặc định Nhà mạng (opportunistic)`;
                  }
                  appendLog(`Đổi DNS -> ${targetDns.name} (${res.verifiedValue || 'OK'})`, 'SHIZUKU OK');
                  showToast(targetDns.mode === 'hostname' ? `✅ Đã kích hoạt thật: ${targetDns.name}` : `↺ Đã trả về DNS Mặc định ban đầu!`);
                  testRealPingNow();
                } else {
                  appendLog(`Lỗi đổi DNS [${targetDns.name}]: ${res.reason}`, 'TỪ CHỐI');
                  showToast(`❌ Không ghi được DNS: ${res.reason}`);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            // ================= 8. BIỂU ĐỒ NHIỆT ĐỘ & DÒNG SẠC 1.0S =================
            const tempHistory = new Array(20).fill(35.5);
            const wattHistory = new Array(20).fill(2.4);
            const maHistory = new Array(20).fill(-620);

            function updateRealtimeBatteryOscilloscope() {
              if (document.hidden) return;
              if (window.BangBridge && window.BangBridge.getLiveBatteryTelemetryJson) {
                try {
                  const d = JSON.parse(window.BangBridge.getLiveBatteryTelemetryJson());
                  pushTelemetrySample(d.tempC || 35.5, d.currentMa || -620, d.watt || 2.4, d.voltageMv || 3880, !!d.charging, d.battery || 78, d.chargedMah || 0);
                  return;
                } catch (e) {}
              }
              const simTemp = +(35.4 + Math.sin(Date.now() / 2000) * 0.5).toFixed(1);
              const simMa = Math.round(-610 + Math.cos(Date.now() / 1300) * 40);
              const simMv = 3880;
              const simW = +((Math.abs(simMa) * simMv) / 1000000).toFixed(1);
              pushTelemetrySample(simTemp, simMa, simW, simMv, false, lastBatteryPct, 0);
            }

            function pushTelemetrySample(tempC, currentMa, watt, voltageMv, charging, batPct, chargedMah) {
              lastBatteryPct = batPct;
              if (sessionStartBattery < 0) {
                sessionStartBattery = batPct;
                sessionStartTimeMs = Date.now();
                try {
                  localStorage.setItem('bang_v18_drain_start_bat', String(sessionStartBattery));
                  localStorage.setItem('bang_v18_drain_start_time', String(sessionStartTimeMs));
                } catch (e) {}
              }

              setRingProgress('ringCircleBat', 'ringTextBat', batPct);
              document.getElementById('ringSubBat').textContent = `${tempC.toFixed(1)}°C · ${charging ? 'Đang sạc' : 'Ổn định'}`;

              const gsTemp = document.getElementById('gsPrevTemp');
              if (gsTemp) gsTemp.textContent = `${tempC.toFixed(1)}°C`;

              tempHistory.push(tempC);
              if (tempHistory.length > 20) tempHistory.shift();
              wattHistory.push(Number(watt));
              if (wattHistory.length > 20) wattHistory.shift();
              maHistory.push(currentMa);
              if (maHistory.length > 20) maHistory.shift();

              if (currentTabIdx !== 3) return;

              document.getElementById('liveTempBox').textContent = `${tempC.toFixed(1)}°C`;
              document.getElementById('liveMaBox').textContent = `${currentMa > 0 ? '+' : ''}${currentMa} mA`;
              document.getElementById('liveMaBox').style.color = charging ? '#34D399' : '#38BDF8';
              document.getElementById('liveWattBox').textContent = `${Number(watt).toFixed(1)} W`;
              document.getElementById('liveMvBox').textContent = `${voltageMv} mV`;

              if (chargedMah > 100) {
                document.getElementById('batChargedNowMah').textContent = `${chargedMah.toLocaleString('vi-VN')} mAh (${batPct}%)`;
              }

              const minT = Math.min(...tempHistory).toFixed(1);
              const maxT = Math.max(...tempHistory).toFixed(1);
              const avgMa = Math.round(maHistory.reduce((a, b) => a + b, 0) / maHistory.length);
              const peakW = Math.max(...wattHistory).toFixed(1);

              document.getElementById('statTempMinMax').textContent = `${minT}° / ${maxT}°C`;
              document.getElementById('statMaAvg').textContent = `${avgMa > 0 ? '+' : ''}${avgMa} mA`;
              document.getElementById('statWattPeak').textContent = `${peakW} W`;

              document.getElementById('tCell4').textContent = `-16s: ${tempHistory[3].toFixed(1)}°`;
              document.getElementById('tCell3').textContent = `-12s: ${tempHistory[7].toFixed(1)}°`;
              document.getElementById('tCell2').textContent = `-8s: ${tempHistory[11].toFixed(1)}°`;
              document.getElementById('tCell1').textContent = `-4s: ${tempHistory[15].toFixed(1)}°`;
              document.getElementById('tCell0').textContent = `Nay: ${tempC.toFixed(1)}°`;

              const delta = Math.max(0, sessionStartBattery - batPct);
              const elapsedMin = Math.max(0, Math.floor((Date.now() - sessionStartTimeMs) / 60000));
              document.getElementById('drainDeltaText').textContent = `-${delta}%`;
              document.getElementById('drainDurationText').textContent = `Đã hao ${delta}% trong ${elapsedMin} phút (Đã lưu trí nhớ)`;
              document.getElementById('drainStartEndText').textContent = `${sessionStartBattery}% ➔ ${batPct}%`;

              const tempPts = tempHistory.map((t, i) => {
                const x = Math.round(28 + (i / 19) * 264);
                const y = Math.max(14, Math.min(96, Math.round(98 - ((t - 20) / 30) * 82)));
                return `${x},${y}`;
              }).join(' ');

              const wattPts = wattHistory.map((w, i) => {
                const x = Math.round(28 + (i / 19) * 264);
                const y = Math.max(16, Math.min(96, Math.round(98 - (Math.min(25, w) / 25) * 82)));
                return `${x},${y}`;
              }).join(' ');

              document.getElementById('polyTempLine').setAttribute('points', tempPts);
              document.getElementById('polyCurrentLine').setAttribute('points', wattPts);
            }

            function resetBatteryDrainSession() {
              hapticTick();
              sessionStartBattery = lastBatteryPct;
              sessionStartTimeMs = Date.now();
              try {
                localStorage.setItem('bang_v18_drain_start_bat', String(sessionStartBattery));
                localStorage.setItem('bang_v18_drain_start_time', String(sessionStartTimeMs));
              } catch (e) {}
              updateRealtimeBatteryOscilloscope();
              showToast('⏱️ Đã lưu mốc theo dõi hao pin mới vào bộ nhớ!');
            }

            setInterval(updateRealtimeBatteryOscilloscope, 1000);

            function testRealPingNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.measureRealPingAsync) {
                window.BangBridge.measureRealPingAsync();
                showToast('📶 Đang đo độ trễ Ping thực tế tới máy chủ...');
              }
            }

            window.onRealPingMeasured = function(res) {
              if (!res) return;
              document.getElementById('pingGarenaVal').textContent = `${res.garenaMs} ms`;
              document.getElementById('pingCfVal').textContent = `${res.cloudflareMs} ms`;
              document.getElementById('pingGoogleVal').textContent = `${res.googleMs} ms`;
              showToast(`⚡ Ping thực tế: Máy chủ Game ${res.garenaMs}ms · 1.1.1.1 ${res.cloudflareMs}ms`);
            };

            // ================= 9. GAME HUB & WHITELIST (CHỈ HIỆN GAME ĐÃ CÀI TRÊN MÁY & LỌC SẠCH ZALOPAY/VÍ ĐIỆN TỬ) =================
            const strictNonGameFilter = [
              'zalopay', 'com.zing.zalo', 'zing.mp3', 'momo', 'vnpay', 'viettelpay',
              'bank', 'shopee', 'lazada', 'tiktok', 'facebook', 'orca', 'youtube',
              'chrome', 'camera', 'gallery', 'photos', 'settings', 'shizuku', 'bangtech'
            ];

            function isInvalidGamePackage(pkg, name) {
              const p = String(pkg || '').toLowerCase();
              const n = String(name || '').toLowerCase();
              return strictNonGameFilter.some(bad => p.includes(bad) || n.includes(bad));
            }

            let userSavedGames = [];
            try {
              const saved = localStorage.getItem('bang_v18_custom_games');
              if (saved) {
                userSavedGames = JSON.parse(saved).filter(g => !isInvalidGamePackage(g.pkg, g.name));
              }
            } catch (e) {}

            let detectedInstalledGames = [];
            let allScannedDeviceApps = [];

            function saveCustomGamesToStorage() {
              try {
                localStorage.setItem('bang_v18_custom_games', JSON.stringify(userSavedGames));
              } catch (e) {}
            }

            function rescanDeviceGamesNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.scanAppsAndGamesAsync) {
                window.BangBridge.scanAppsAndGamesAsync();
                showToast('🔍 Đang dò tìm các Game thực sự đã cài trên máy...');
              } else {
                renderGameHubList();
              }
            }

            window.onDeviceGamesAndAppsScanned = function(payload) {
              if (!payload) return;
              const scannedGames = payload.games || [];
              const scannedApps = payload.apps || [];

              detectedInstalledGames = scannedGames
                .filter(g => !isInvalidGamePackage(g.pkg, g.name))
                .map(g => ({
                  name: g.name,
                  pkg: g.pkg,
                  res: '720x1600:293',
                  mode: 'Tần số cao · Cảm ứng 0ms',
                  installed: true,
                  icon: g.icon || ''
                }));

              allScannedDeviceApps = scannedApps.map(a => {
                const defaultSafe = a.pkg.includes('zalo') || a.pkg.includes('orca') || a.pkg.includes('youtube') || a.pkg.includes('camera') || a.pkg.includes('garena') || a.pkg.includes('bangtech') || a.pkg.includes('shizuku');
                const isProtected = savedWhitelistMap[a.pkg] !== undefined ? !!savedWhitelistMap[a.pkg] : defaultSafe;
                return {
                  name: a.name,
                  pkg: a.pkg,
                  isGame: !!a.isGame && !isInvalidGamePackage(a.pkg, a.name),
                  icon: a.icon || '',
                  protected: isProtected
                };
              });

              renderGameHubList();
              renderWhitelistApps();
              renderInstalledAppPicker();
            };

            function getMergedGameList() {
              const map = new Map();
              detectedInstalledGames.forEach(g => {
                if (!isInvalidGamePackage(g.pkg, g.name)) {
                  map.set(g.pkg, { ...g, installed: true });
                }
              });
              userSavedGames.forEach(g => {
                if (isInvalidGamePackage(g.pkg, g.name)) return;
                const existing = map.get(g.pkg);
                const foundInAll = allScannedDeviceApps.find(a => a.pkg === g.pkg);
                map.set(g.pkg, {
                  ...g,
                  installed: existing ? true : !!foundInAll,
                  icon: (existing && existing.icon) ? existing.icon : (foundInAll ? foundInAll.icon : (g.icon || ''))
                });
              });
              return Array.from(map.values());
            }

            function renderGameHubList() {
              const list = getMergedGameList();
              const subEl = document.getElementById('gameScanSubtitle');
              if (subEl) {
                subEl.textContent = list.length > 0
                  ? `Đã phát hiện ${list.length} tựa game đang cài trên máy · Bấm Mở để bung Logo Tròn Nổi!`
                  : `Chưa phát hiện game nào · Hãy bấm "+ Thêm Game Mới" để chọn từ máy`;
              }

              const box = document.getElementById('gameHubContainer');
              if (list.length === 0) {
                box.innerHTML = `
