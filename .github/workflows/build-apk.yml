              background: linear-gradient(90deg, rgba(56, 189, 248, 0.16) 0%, rgba(255, 255, 255, 0.03) 80%);
              border-color: rgba(56, 189, 248, 0.45);
            }
            .vibe-mode-item.active::before {
              content: "";
              position: absolute;
              left: 0;
              top: 6px;
              bottom: 6px;
              width: 3.5px;
              border-radius: 0 4px 4px 0;
              background: #38BDF8;
              box-shadow: 0 0 10px #38BDF8;
            }

            /* Switch Cards */
            .tweak-item-v14 {
              background: rgba(255, 255, 255, 0.03);
              border: 1px solid rgba(255, 255, 255, 0.08);
              border-radius: 16px;
              padding: 12px 13px;
              margin-bottom: 8px;
              contain: content;
            }
            .tweak-item-v14.verified-on {
              border-color: rgba(16, 185, 129, 0.42);
              background: rgba(16, 185, 129, 0.05);
            }
            .tweak-item-v14.verified-err {
              border-color: rgba(244, 63, 94, 0.42);
              background: rgba(244, 63, 94, 0.05);
            }
            .tweak-row-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
            .tweak-title { font-size: 12.5px; font-weight: 700; color: #F8FAFC; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
            .tweak-sub { font-size: 11px; color: var(--text-secondary); line-height: 1.38; }
            .tag-pill { font-size: 9px; font-weight: 700; padding: 1.5px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); color: #CBD5E1; border: 1px solid rgba(255, 255, 255, 0.12); }
            .verify-line { margin-top: 7px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 10.5px; font-weight: 600; }
            .verify-line.idle { color: var(--text-muted); }
            .verify-line.pending { color: var(--accent-cyan); }
            .verify-line.ok { color: var(--accent-emerald); }
            .verify-line.err { color: #FDA4AF; }

            /* Switch Toggle */
            .v14-switch {
              width: 46px;
              height: 26px;
              border-radius: 99px;
              background: rgba(255, 255, 255, 0.14);
              border: 1px solid rgba(255, 255, 255, 0.18);
              position: relative;
              flex-shrink: 0;
              cursor: pointer;
              transition: background-color 150ms ease;
            }
            .v14-switch::after {
              content: "";
              position: absolute;
              top: 2px;
              left: 2px;
              width: 20px;
              height: 20px;
              border-radius: 50%;
              background: #FFFFFF;
              box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
              transition: transform 170ms cubic-bezier(0.22, 1, 0.36, 1);
              will-change: transform;
            }
            .v14-switch.on { background: var(--accent-warm); border-color: transparent; }
            .v14-switch.on.emerald { background: var(--accent-emerald); }
            .v14-switch.on::after { transform: translate3d(20px, 0, 0); }

            /* ================= iOS 27 LIQUID GLASS BOTTOM NAVBAR & DRAGGABLE LENS ================= */
            .ios27-bottom-dock-wrap {
              position: fixed;
              bottom: 12px;
              left: 12px;
              right: 12px;
              z-index: 100;
              display: flex;
              align-items: center;
              gap: 10px;
