                </div>
                <button class="tag-pill tap-spring" style="padding:5px 10px;" onclick="closeAddGameModal()">Đóng ✕</button>
              </div>

              <div style="background:rgba(0,0,0,0.35); border:1px solid var(--border-hairline); border-radius:16px; padding:12px; margin-bottom:12px;">
                <div style="font-size:11.5px; font-weight:800; color:#38BDF8; margin-bottom:8px;">1. Nhập tên Game & Cài đặt cấu hình riêng</div>
                <input id="inpCustomGameName" class="num-input" style="text-align:left; margin-bottom:7px;" type="text" placeholder="Nhập tên Game (VD: Liên Quân, Wuthering Waves, FC Online...)" />
                <input id="inpCustomGamePkg" class="num-input" style="text-align:left; margin-bottom:8px; font-family:monospace;" type="text" placeholder="Tên gói Package (VD: com.garena.game.kgvn - có thể để trống)" />

                <div class="grid-2" style="margin-bottom:8px;">
                  <div>
                    <div class="stat-well-label">Độ phân giải khi vào Game</div>
                    <select id="selCustomGameRes" class="num-input" style="padding:7px;">
                      <option value="720x1600:293">720p Gaming (293 DPI)</option>
                      <option value="540x1200:220">540p Siêu Mượt (220 DPI)</option>
                      <option value="1080x2400:410">Màn gốc 1080p (Sắc nét)</option>
                    </select>
                  </div>
                  <div>
                    <div class="stat-well-label">Chế độ Cảm ứng & Hz</div>
