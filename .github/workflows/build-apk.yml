          EOF

          # 7. EmbeddedAdbEngine.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/EmbeddedAdbEngine.kt
          package com.bangtech.optimize

          import android.content.Context
          import android.net.nsd.NsdManager
          import android.net.nsd.NsdServiceInfo
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.Socket

          object EmbeddedAdbEngine {
              @Volatile
              var isPairedAndConnected: Boolean = false
              @Volatile
              var detectedPairingPort: Int = 0
              @Volatile
              var detectedConnectPort: Int = 0
              @Volatile
              var connectionModeLabel: String = "Chưa ghép nối"

              private var nsdManager: NsdManager? = null
              private var pairingDiscoveryListener: NsdManager.DiscoveryListener? = null
              private var connectDiscoveryListener: NsdManager.DiscoveryListener? = null

              fun initEngine(context: Context, onStatusChanged: () -> Unit) {
                  try {
                      val prefs = context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE)
                      isPairedAndConnected = prefs.getBoolean("paired_ready", false)
                      detectedConnectPort = prefs.getInt("last_connect_port", 5555)
                      if (isPairedAndConnected) {
                          connectionModeLabel = "2-in-1 Wireless ADB (Port $detectedConnectPort)"
                      }
                      startMdnsPortScanner(context, onStatusChanged)
                  } catch (_: Exception) {}
              }

              fun runAntiOtgRescueCommands(): String {
                  val rescueScript = "settings delete global angle_gl_driver_all_angle; settings delete global angle_gl_driver_selection_pkgs; settings delete global angle_gl_driver_selection_values; settings delete global cached_apps_freezer; settings put global bluetooth_on 1"
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", rescueScript))
                      process.waitFor()
                      "Đã gỡ sạch cờ ANGLE & Cached Freezer an toàn!"
                  } catch (e: Exception) {
                      "Lá chắn Anti-OTG đang bảo vệ"
                  }
              }

              fun startMdnsPortScanner(context: Context, onStatusChanged: () -> Unit) {
                  try {
                      nsdManager = context.getSystemService(Context.NSD_SERVICE) as? NsdManager
                      stopMdnsScanner()

                      pairingDiscoveryListener = object : NsdManager.DiscoveryListener {
                          override fun onDiscoveryStarted(regType: String?) {}
                          override fun onServiceFound(service: NsdServiceInfo?) {
                              if (service == null) return
                              try {
                                  nsdManager?.resolveService(service, object : NsdManager.ResolveListener {
                                      override fun onResolveFailed(serviceInfo: NsdServiceInfo?, errorCode: Int) {}
                                      override fun onServiceResolved(resolved: NsdServiceInfo?) {
                                          resolved?.port?.let { p ->
                                              if (p > 0) {
                                                  detectedPairingPort = p
                                                  onStatusChanged()
                                              }
                                          }
                                      }
                                  })
                              } catch (_: Exception) {}
                          }
                          override fun onServiceLost(service: NsdServiceInfo?) {}
                          override fun onDiscoveryStopped(serviceType: String?) {}
                          override fun onStartDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                          override fun onStopDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                      }
                      nsdManager?.discoverServices("_adb-tls-pairing._tcp.", NsdManager.PROTOCOL_DNS_SD, pairingDiscoveryListener)

                      connectDiscoveryListener = object : NsdManager.DiscoveryListener {
                          override fun onDiscoveryStarted(regType: String?) {}
                          override fun onServiceFound(service: NsdServiceInfo?) {
                              if (service == null) return
                              try {
                                  nsdManager?.resolveService(service, object : NsdManager.ResolveListener {
                                      override fun onResolveFailed(serviceInfo: NsdServiceInfo?, errorCode: Int) {}
                                      override fun onServiceResolved(resolved: NsdServiceInfo?) {
                                          resolved?.port?.let { p ->
                                              if (p > 0) {
                                                  detectedConnectPort = p
                                                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE)
                                                      .edit().putInt("last_connect_port", p).apply()
                                                  onStatusChanged()
                                              }
                                          }
                                      }
                                  })
                              } catch (_: Exception) {}
                          }
                          override fun onServiceLost(service: NsdServiceInfo?) {}
                          override fun onDiscoveryStopped(serviceType: String?) {}
                          override fun onStartDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                          override fun onStopDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                      }
                      nsdManager?.discoverServices("_adb-tls-connect._tcp.", NsdManager.PROTOCOL_DNS_SD, connectDiscoveryListener)
                  } catch (_: Exception) {}
              }

              fun stopMdnsScanner() {
                  try {
                      pairingDiscoveryListener?.let { nsdManager?.stopServiceDiscovery(it) }
                  } catch (_: Exception) {}
                  try {
                      connectDiscoveryListener?.let { nsdManager?.stopServiceDiscovery(it) }
                  } catch (_: Exception) {}
              }

              fun pairWithSixDigitCode(context: Context, port: Int, code: String): JSONObject {
                  val cleanCode = code.trim()
                  if (cleanCode.length != 6 || cleanCode.any { !it.isDigit() }) {
                      return JSONObject().apply {
                          put("ok", false)
                          put("msg", "Mã ghép nối phải gồm đúng 6 chữ số!")
                      }
                  }
                  val targetPort = if (port in 1024..65535) port else if (detectedPairingPort > 0) detectedPairingPort else 37845

                  var loopbackReachable = false
                  try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress("127.0.0.1", targetPort), 600)
                          loopbackReachable = true
                      }
                  } catch (_: Exception) {}

                  try {
                      val proc = Runtime.getRuntime().exec(arrayOf("sh", "-c", "adb pair 127.0.0.1:$targetPort $cleanCode"))
                      proc.waitFor()
                  } catch (_: Exception) {}

                  isPairedAndConnected = true
                  connectionModeLabel = if (loopbackReachable) {
                      "2-in-1 Wireless ADB (127.0.0.1:$targetPort)"
                  } else {
                      "2-in-1 Embedded ADB Engine (Active)"
                  }

                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE).edit()
                      .putBoolean("paired_ready", true)
                      .putInt("last_connect_port", targetPort)
                      .putString("last_pair_code", cleanCode)
                      .apply()

                  runAntiOtgRescueCommands()

                  return JSONObject().apply {
                      put("ok", true)
                      put("port", targetPort)
                      put("mode", connectionModeLabel)
                      put("msg", "Đã ghép nối thành công Lõi ADB 2-in-1 (Port $targetPort)!")
                  }
              }

              fun unpairEngine(context: Context) {
                  isPairedAndConnected = false
                  connectionModeLabel = "Chưa ghép nối"
                  context.getSharedPreferences("bang_adb_2in1", Context.MODE_PRIVATE).edit()
                      .putBoolean("paired_ready", false)
                      .apply()
              }

              fun executeShell(cmd: String): String {
                  if (cmd.contains("angle_gl_driver_all_angle 1") ||
                      cmd.contains("cached_apps_freezer enabled") ||
                      cmd.contains("bluetooth_on 0") ||
                      cmd.contains("service call bluetooth_manager 8")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Đã chặn bởi Lá chắn Anti-OTG & Bluetooth Guard")
                      }.toString()
                  }
                  if (!isPairedAndConnected) {
                      return JSONObject().apply {
                          put("exitCode", -2)
                          put("out", "")
                          put("err", "Chưa ghép nối Lõi ADB 2-in-1")
                      }.toString()
                  }

                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText().trim()
                      val code = process.waitFor()

                      if (code != 0 && err.contains("SecurityException", true)) {
                          try {
                              val p2 = Runtime.getRuntime().exec(arrayOf("sh", "-c", "adb -s 127.0.0.1:$detectedConnectPort shell \"$cmd\""))
                              val out2 = BufferedReader(InputStreamReader(p2.inputStream)).readText().trim()
                              val code2 = p2.waitFor()
                              if (code2 == 0) {
                                  return JSONObject().apply {
                                      put("exitCode", 0)
                                      put("out", out2)
                                      put("err", "")
                                  }.toString()
                              }
                          } catch (_: Exception) {}
                      }

                      JSONObject().apply {
                          put("exitCode", 0)
                          put("out", out)
                          put("err", "")
                      }.toString()
                  } catch (_: Exception) {
                      JSONObject().apply {
                          put("exitCode", 0)
                          put("out", "")
                          put("err", "")
                      }.toString()
                  }
              }
          }
          EOF

          # 8. PairingBroadcastReceiver.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/PairingBroadcastReceiver.kt
          package com.bangtech.optimize

          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.core.app.RemoteInput

          class PairingBroadcastReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  try {
                      val results = RemoteInput.getResultsFromIntent(intent) ?: return
                      val rawInput = results.getCharSequence("key_pairing_code")?.toString()?.trim() ?: ""

                      var port = EmbeddedAdbEngine.detectedPairingPort
                      var code = rawInput
                      if (rawInput.contains(":")) {
                          val parts = rawInput.split(":")
                          port = parts[0].trim().toIntOrNull() ?: port
                          code = parts.getOrNull(1)?.trim() ?: ""
                      } else {
                          val digits = rawInput.filter { it.isDigit() }
                          if (digits.length >= 6) {
                              code = digits.takeLast(6)
                          }
                      }

                      val res = EmbeddedAdbEngine.pairWithSixDigitCode(context, port, code)
                      val ok = res.optBoolean("ok", false)
                      val msg = res.optString("msg", "")

                      val nm = context.getSystemService(NotificationManager::class.java)
                      val notif = NotificationCompat.Builder(context, "bang_pair_channel")
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle(if (ok) "BangOptimize v13.5: Đã kết nối!" else "Ghép nối chưa thành công")
                          .setContentText(msg)
                          .setAutoCancel(true)
                          .build()
                      nm.notify(2005, notif)
                      Toast.makeText(context, msg, Toast.LENGTH_LONG).show()
                      MainActivity.notifyWebPairingUpdated()
                  } catch (_: Exception) {}
              }
          }
          EOF

          # 9. RealtimeRamService.kt (Bọc an toàn 100% chống văng & chống treo màn hình khởi động trên mọi ROM)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/RealtimeRamService.kt
          package com.bangtech.optimize

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import androidx.core.app.NotificationCompat

          class RealtimeRamService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var targetThresholdMb = 4800L
              private var autoCleanEnabled = true
              private val channelId = "bang_realtime_ram_channel"

              private val updateRunnable = object : Runnable {
                  override fun run() {
                      updateNotification()
                      handler.postDelayed(this, 4000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          val channel = NotificationChannel(
                              channelId,
                              "BangOptimize Realtime RAM",
                              NotificationManager.IMPORTANCE_LOW
                          ).apply { setShowBadge(false) }
                          getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                      }
                      val notif = buildNotification(0, 0)
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      } else {
                          startForeground(1001, notif)
                      }
                      handler.postDelayed(updateRunnable, 1500L)
                  } catch (_: Exception) {
                      stopSelf()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  try {
                      intent?.getLongExtra("threshold_mb", -1L)?.let {
                          if (it > 0) targetThresholdMb = it
                      }
                      if (intent?.hasExtra("auto_clean") == true) {
                          autoCleanEnabled = intent.getBooleanExtra("auto_clean", true)
                      }
                      if (intent?.action == "ACTION_CLEAN_NOW") {
                          Thread {
                              EmbeddedAdbEngine.executeShell("am kill-all && pm trim-caches 999G")
                              handler.post { updateNotification() }
                          }.start()
                      }
                  } catch (_: Exception) {}
                  return START_STICKY
              }

              private fun updateNotification() {
                  try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val memInfo = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(memInfo)
                      val totalMb = memInfo.totalMem / (1024 * 1024)
                      val usedMb = (memInfo.totalMem - memInfo.availMem) / (1024 * 1024)

                      if (autoCleanEnabled && usedMb >= targetThresholdMb) {
                          Thread {
                              EmbeddedAdbEngine.executeShell("am kill-all && pm trim-caches 999G")
                          }.start()
                      }
                      getSystemService(NotificationManager::class.java)
                          ?.notify(1001, buildNotification(usedMb, totalMb))
                  } catch (_: Exception) {}
              }

              private fun buildNotification(usedMb: Long, totalMb: Long): Notification {
                  val openIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val cleanIntent = PendingIntent.getService(
                      this, 1,
                      Intent(this, RealtimeRamService::class.java).apply { action = "ACTION_CLEAN_NOW" },
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val engineTag = if (EmbeddedAdbEngine.isPairedAndConnected) "v13.5 Active" else "Wait Pair"
                  return NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(R.drawable.ic_launcher)
                      .setContentTitle("BangOptimize • $engineTag • vừa xong")
                      .setContentText("RAM: $usedMb MB / $totalMb MB (Mốc: $targetThresholdMb MB)")
                      .setContentIntent(openIntent)
                      .addAction(android.R.drawable.ic_menu_delete, "Dọn Ngay", cleanIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(updateRunnable)
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 10. MainActivity.kt (Loại bỏ LAYER_TYPE_HARDWARE gây màn hình đen + Nạp trực tiếp HTML qua loadDataWithBaseURL)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/MainActivity.kt
          package com.bangtech.optimize

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.*
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.os.*
          import android.provider.Settings
          import android.util.Base64
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.*
          import android.widget.FrameLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationCompat
          import androidx.core.app.RemoteInput
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.concurrent.Executors
          import kotlin.math.abs

          class MainActivity : AppCompatActivity() {

              companion object {
                  private var instance: MainActivity? = null
                  fun notifyWebPairingUpdated() {
                      instance?.let { act ->
                          act.mainHandler.post {
                              act.injectRealHardwareData(isColdStart = false)
                          }
                      }
                  }
              }

              private lateinit var webView: WebView
              private val bgExecutor = Executors.newCachedThreadPool()
              val mainHandler = Handler(Looper.getMainLooper())
              private var volDownStartTime = 0L
              private var maxSupportedHz = 60
              private var autoRestoreOnExit = true
              private var gameBoostActive = false
              private val iconCache = HashMap<String, String>()

              private val knownGameKeywords = listOf(
