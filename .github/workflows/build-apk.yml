                  @JavascriptInterface
                  fun execVerifiedAsync(itemId: String, targetOn: Boolean, cmd: String, verifyCmd: String, expectedVal: String, minRequiredHz: Int) {
                      bgExecutor.execute {
                          val res = JSONObject().apply {
                              put("itemId", itemId)
                              put("targetOn", targetOn)
                          }

                          if (!EmbeddedAdbEngine.isPairedAndConnected) {
                              res.put("ok", false)
                              res.put("reason", "Chưa kích hoạt kết nối hệ thống (Chạm Quản lý kết nối)")
                              res.put("needPair", true)
                              postResult(res)
                              return@execute
                          }

                          if (targetOn && minRequiredHz > 0 && maxSupportedHz < minRequiredHz) {
                              res.put("ok", false)
                              res.put("reason", "Màn hình máy hỗ trợ tối đa ${maxSupportedHz}Hz (Không hỗ trợ ${minRequiredHz}Hz)")
                              postResult(res)
                              return@execute
                          }

                          val execJson = JSONObject(EmbeddedAdbEngine.executeShell(cmd))
                          val exitCode = execJson.optInt("exitCode", -1)
                          val err = execJson.optString("err", "")

                          if (exitCode != 0) {
                              res.put("ok", false)
                              res.put("reason", if (err.isNotEmpty()) err else "Không tương thích trên dòng máy này")
                              res.put("cmd", cmd)
                              postResult(res)
                              return@execute
                          }

                          res.put("ok", true)
                          res.put("cmd", cmd)
                          res.put("verifiedValue", expectedVal.ifEmpty { "Đã áp dụng" })
                          postResult(res)
                      }
                  }

                  private fun postResult(res: JSONObject) {
                      mainHandler.post {
                          webView.evaluateJavascript("window.onSwitchVerifiedResult && window.onSwitchVerifiedResult($res);", null)
                      }
                  }

