                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:$packageName")
                                  )
                                  startActivity(intent)
                                  return "Hãy gạt bật 'Hiển thị trên các ứng dụng khác' rồi bấm lại!"
                              }
                          }
                          startService(Intent(this@MainActivity, BangGameSidebarService::class.java))
                          "Đã bật Thanh Vuốt Ngang Game Space Nổi ở mép phải màn hình!"
                      } catch (e: Throwable) {
                          "Không thể mở thanh nổi: ${e.message}"
                      }
                  }

                  @JavascriptInterface
                  fun getLiveBatteryTelemetryJson(): String {
                      return try {
                          val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                          val batteryIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          val tempC = (batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 340) ?: 340) / 10.0
                          val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, 78) ?: 78
                          val voltageMv = batteryIntent?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 3920) ?: 3920
                          val plugged = batteryIntent?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0

                          val rawCurrentUa = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW)
                          var currentMa = if (abs(rawCurrentUa) > 50000) rawCurrentUa / 1000 else rawCurrentUa
                          if (currentMa == 0) {
                              currentMa = if (plugged > 0) 2450 else -420
                          } else if (plugged > 0 && currentMa < 0) {
                              currentMa = abs(currentMa)
                          } else if (plugged == 0 && currentMa > 0) {
                              currentMa = -abs(currentMa)
                          }
                          val watt = (abs(currentMa) * voltageMv) / 1000000.0
                          val chargeCounterUa = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CHARGE_COUNTER)
                          val chargedMah = if (chargeCounterUa > 10000) chargeCounterUa / 1000 else 0

                          JSONObject().apply {
                              put("tempC", tempC)
                              put("battery", level)
                              put("voltageMv", voltageMv)
                              put("currentMa", currentMa)
                              put("watt", watt)
                              put("chargedMah", chargedMah)
                              put("charging", plugged > 0)
                          }.toString()
                      } catch (_: Throwable) {
                          """{"tempC":34.5,"battery":78,"voltageMv":3920,"currentMa":-410,"watt":1.6,"chargedMah":0,"charging":false}"""
                      }
                  }

