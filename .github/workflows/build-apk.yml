                          allowFileAccess = true
                          allowContentAccess = true
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          cacheMode = WebSettings.LOAD_DEFAULT
                      }
                      webChromeClient = WebChromeClient()
                      addJavascriptInterface(BangJsBridge(), "BangBridge")
                      webViewClient = object : WebViewClient() {
                          override fun shouldInterceptRequest(view: WebView?, request: WebResourceRequest?): WebResourceResponse? {
                              val url = request?.url?.toString() ?: ""
                              if (url.startsWith("https://bangoptimize.local/app-icon/")) {
                                  val pkg = url.removePrefix("https://bangoptimize.local/app-icon/").trim()
                                  return loadAppIconStream(pkg)
                              }
                              return super.shouldInterceptRequest(view, request)
                          }

                          override fun onPageFinished(view: WebView?, url: String?) {
                              injectRealHardwareData(isColdStart = true)
                          }
                      }
                  }

                  rootLayout.addView(webView)
                  setContentView(rootLayout)
                  webView.loadUrl("file:///android_asset/BangOptimize.html")

                  mainHandler.postDelayed({
                      bgExecutor.execute {
                          EmbeddedAdbEngine.initEngine(this) {
                              mainHandler.post { pushMdnsPortUpdate() }
                          }
                      }
                  }, 700L)
              }

              private fun loadAppIconStream(pkg: String): WebResourceResponse? {
                  return try {
                      val drawable = packageManager.getApplicationIcon(pkg)
                      val size = 64
                      val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      drawable.setBounds(0, 0, size, size)
                      drawable.draw(canvas)
                      val out = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.PNG, 85, out)
                      WebResourceResponse("image/png", "UTF-8", ByteArrayInputStream(out.toByteArray()))
                  } catch (_: Throwable) {
                      null
                  }
              }

              override fun onResume() {
                  super.onResume()
                  // Khi người dùng đang ở trong BangOptimize, tạm ẩn thanh Game Space nổi để không vướng màn hình
                  try {
                      val prefs = getSharedPreferences("bang_toggle_mem_v16", Context.MODE_PRIVATE)
                      if (prefs.getBoolean("game_space_watcher", false)) {
                          startService(Intent(this, BangGameSidebarService::class.java).apply {
                              action = "ACTION_HIDE_IN_APP"
                          })
                      }
                  } catch (_: Throwable) {}

                  if (gameBoostActive && autoRestoreOnExit && EmbeddedAdbEngine.isPairedAndConnected) {
                      gameBoostActive = false
                      bgExecutor.execute {
                          EmbeddedAdbEngine.executeShellStrict("wm size reset && wm density reset && settings put system pointer_speed 0")
                          mainHandler.post {
                              Toast.makeText(this, "BangOptimize: Đã tự hoàn trả độ phân giải gốc sau khi rời Game!", Toast.LENGTH_SHORT).show()
                              injectRealHardwareData(isColdStart = false)
                          }
                      }
                  }
              }

              private fun readProp(propName: String): String {
                  return try {
                      val p = Runtime.getRuntime().exec(arrayOf("getprop", propName))
                      BufferedReader(InputStreamReader(p.inputStream)).readLine()?.trim() ?: ""
                  } catch (_: Throwable) {
                      ""
                  }
              }

              private fun detectCustomOsSkin(): String {
                  val hyperOs = readProp("ro.mi.os.version.name")
                  if (hyperOs.isNotEmpty()) return "Xiaomi HyperOS $hyperOs"
                  val miui = readProp("ro.miui.ui.version.name")
                  if (miui.isNotEmpty()) return "Xiaomi MIUI $miui"
                  val colorOs = readProp("ro.build.version.opporom")
                  if (colorOs.isNotEmpty()) return "OPPO ColorOS $colorOs"
                  val originOs = readProp("ro.vivo.os.build.display.id")
                  if (originOs.isNotEmpty()) return "Vivo $originOs"
                  val oneUi = readProp("ro.build.version.oneui")
                  if (oneUi.isNotEmpty()) return "Samsung One UI $oneUi"
                  return "Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})"
              }

              private fun readRealBatteryGaugeData(bm: BatteryManager, batteryIntent: Intent?, levelPct: Int): JSONObject {
                  val chargeCounterUa = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CHARGE_COUNTER)
                  var currentChargedMah = 0
                  if (chargeCounterUa > 10000) {
                      currentChargedMah = chargeCounterUa / 1000
                  } else if (chargeCounterUa in 100..9999) {
                      currentChargedMah = chargeCounterUa
                  }

                  var estimatedFullMah = 0
                  var sourceLabel = "IC Fuel Gauge (Hardware)"
                  if (currentChargedMah > 100 && levelPct >= 15) {
                      estimatedFullMah = ((currentChargedMah.toDouble() / levelPct.toDouble()) * 100.0).roundToInt()
                  }

                  var designMah = 5000
                  var cycleCount = -1
                  try {
                      val fDesign = File("/sys/class/power_supply/battery/charge_full_design")
                      if (fDesign.exists() && fDesign.canRead()) {
                          val v = fDesign.readText().trim().toLongOrNull() ?: 0L
                          if (v > 100000) designMah = (v / 1000).toInt()
                          else if (v > 1000) designMah = v.toInt()
                      }
                      val fFull = File("/sys/class/power_supply/battery/charge_full")
                      if (fFull.exists() && fFull.canRead()) {
                          val v = fFull.readText().trim().toLongOrNull() ?: 0L
                          if (v > 100000) {
                              estimatedFullMah = (v / 1000).toInt()
                              sourceLabel = "Kernel sysfs charge_full"
                          } else if (v > 1000) {
                              estimatedFullMah = v.toInt()
                              sourceLabel = "Kernel sysfs charge_full"
                          }
                      }
                      val fCycle = File("/sys/class/power_supply/battery/cycle_count")
                      if (fCycle.exists() && fCycle.canRead()) {
                          cycleCount = fCycle.readText().trim().toIntOrNull() ?: -1
                      }
                  } catch (_: Throwable) {}

                  val healthInt = batteryIntent?.getIntExtra(BatteryManager.EXTRA_HEALTH, BatteryManager.BATTERY_HEALTH_GOOD)
                      ?: BatteryManager.BATTERY_HEALTH_GOOD
                  val healthStr = when (healthInt) {
                      BatteryManager.BATTERY_HEALTH_GOOD -> "Tốt (Good)"
                      BatteryManager.BATTERY_HEALTH_OVERHEAT -> "Quá nhiệt"
                      BatteryManager.BATTERY_HEALTH_DEAD -> "Chai nặng"
                      else -> "Bình thường"
                  }

                  return JSONObject().apply {
                      put("designMah", designMah)
                      put("currentChargedMah", currentChargedMah)
                      put("estimatedFullMah", estimatedFullMah)
                      put("cycleCount", cycleCount)
                      put("hwHealthStatus", healthStr)
                      put("gaugeSource", sourceLabel)
                  }
              }

              private fun isAppGame(app: ApplicationInfo, label: String): Boolean {
                  if (Build.VERSION.SDK_INT >= 26 && app.category == ApplicationInfo.CATEGORY_GAME) {
                      return true
                  }
                  @Suppress("DEPRECATION")
                  if ((app.flags and ApplicationInfo.FLAG_IS_GAME) != 0) {
                      return true
                  }
                  val pkgLower = app.packageName.lowercase()
                  val labelLower = label.lowercase()
                  if (pkgLower == "com.bangtech.optimize") return false
                  return knownGameKeywords.any { kw -> pkgLower.contains(kw) || labelLower.contains(kw) }
              }

