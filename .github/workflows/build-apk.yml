                <input id="inpPairPort" class="input-well" style="width:82px; color:#38BDF8;" type="number" value="37845" />
              </div>

              <div class="digit-slots-6" id="sixDigitGrid">
                <div class="digit-cell">-</div>
                <div class="digit-cell">-</div>
                <div class="digit-cell">-</div>
                <div class="digit-cell">-</div>
                <div class="digit-cell">-</div>
                <div class="digit-cell">-</div>
              </div>

              <div class="keypad-grid">
                <button class="keypad-btn press-phys" onclick="pressDigit('1')">1</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('2')">2</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('3')">3</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('4')">4</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('5')">5</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('6')">6</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('7')">7</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('8')">8</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('9')">9</button>
                <button class="keypad-btn press-phys" style="font-size:11.5px; color:#FDA4AF;" onclick="clearDigits()">Xóa hết</button>
                <button class="keypad-btn press-phys" onclick="pressDigit('0')">0</button>
                <button class="keypad-btn press-phys" onclick="backspaceDigit()">⌫</button>
              </div>

              <button class="btn-primary-light press-phys" onclick="submitSixDigitPairing()">Kết nối Lõi ADB 2-in-1 ngay</button>
              <button class="btn-shield-emerald press-phys" onclick="launchDevOptionsWithNotification()">Mở Cài đặt & Nhập mã trên Thanh thông báo</button>
            </div>
          </div>

          <div class="shell-container">
            <!-- THANH ĐẦU TRANG WORKBENCH (KHÔNG CÒN HỘP KÍNH LÚP CŨ) -->
            <header class="top-workbench-bar obsidian-glass">
              <div class="brand-cluster">
