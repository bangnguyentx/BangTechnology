              { id: 'f2_thermal', name: 'Chặn Dịch Vụ Bóp Xung Joyose (Xiaomi)', tag: 'Anti-Throttle', desc: 'Ngăn com.xiaomi.joyose hạ xung GPU khi máy ấm (Tự động bỏ qua nếu máy hãng khác).', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND ignore && am force-stop com.xiaomi.joyose', cmdOff: 'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND allow', verifyCmd: '', expectVal: '', minHz: 0 },
              { id: 'f2_samsung', name: 'Tối Ưu Dịch Vụ Game (Samsung / OPPO / Vivo)', tag: 'Multi-Brand', desc: 'Hạn chế chạy nền dịch vụ giám sát gây sụt khung hình trên OneUI & ColorOS.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put secure game_auto_temperature_control 0', cmdOff: 'settings put secure game_auto_temperature_control 1', verifyCmd: 'settings get secure game_auto_temperature_control', expectVal: '0', minHz: 0 },
              { id: 'f2_tier', name: 'Mở Khóa Hiệu Ứng Bị Cắt Giảm (Tier v:1,c:3,g:3)', tag: 'Unlocker', desc: 'Mở khóa hoạt ảnh đóng mở ứng dụng mượt cho các dòng máy tầm trung.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put system deviceLevelList v:1,c:3,g:3', cmdOff: 'settings put system deviceLevelList v:1,c:1,g:1', verifyCmd: 'settings get system deviceLevelList', expectVal: 'v:1,c:3,g:3', minHz: 0 },
              { id: 'f2_log', name: 'Làm Sạch Nhật Ký Hệ Thống (Logcat)', tag: 'I/O Clean', desc: 'Xóa bộ đệm ghi log liên tục để giảm tải đọc ghi ổ cứng.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'logcat -c', cmdOff: 'echo ok', verifyCmd: '', expectVal: '', minHz: 0 },
              { id: 'f2_bloat', name: 'Dừng Dịch Vụ Quảng Cáo Chạy Ngầm (MSA)', tag: 'Debloat', desc: 'Tắt tiến trình quảng cáo ngầm gây tốn RAM và nhảy ping.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'am force-stop com.miui.msa.global && am force-stop com.miui.analytics', cmdOff: 'echo ok', verifyCmd: '', expectVal: '', minHz: 0 }
            ];

            const allSwitchMap = new Map();
            [...glToolItems, ...featGroup1, ...featGroup2].forEach(it => allSwitchMap.set(it.id, it));

            const defaultWhitelistApps = [
              { name: 'BangOptimize', pkg: 'com.bangtech.optimize', running: true, protected: true },
              { name: 'Liên Quân Mobile', pkg: 'com.garena.game.kgvn', running: false, protected: true },
              { name: 'Zalo', pkg: 'com.zing.zalo', running: true, protected: true },
              { name: 'Messenger', pkg: 'com.facebook.orca', running: true, protected: true },
              { name: 'TikTok', pkg: 'com.ss.android.ugc.trill', running: false, protected: true },
              { name: 'YouTube', pkg: 'com.google.android.youtube', running: false, protected: true },
              { name: 'Máy Ảnh Hệ Thống', pkg: 'com.android.camera', running: false, protected: true },
              { name: 'Facebook', pkg: 'com.facebook.katana', running: true, protected: false }
            ];

            let allAppsList = [...defaultWhitelistApps];
            let cmdCount = 0;
            let currentRamUsed = 3600;
            let currentRamTotal = 5606;
            let currentThreshold = 4900;
            let nativeWidth = 1080;
            let nativeHeight = 2400;
            let nativeDpi = 410;
            let nativeHz = 60;
            let maxSupportedHz = 120;
            let floEnabled = false;
            let xiaomiPlanEnabled = false;
            let selectedOptLevel = -1;
