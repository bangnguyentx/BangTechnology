              hapticTick();
              const bodyEl = document.getElementById('shizukuCollapsibleBody');
              const chevEl = document.getElementById('shizukuChevronBtn');
              if (!bodyEl || !chevEl) return;

              const shouldCollapse = typeof forceCollapse === 'boolean'
                ? forceCollapse
                : !bodyEl.classList.contains('collapsed');

              bodyEl.classList.toggle('collapsed', shouldCollapse);
              chevEl.classList.toggle('expanded', !shouldCollapse);
              isShizukuBannerManuallyExpanded = !shouldCollapse;
            }

