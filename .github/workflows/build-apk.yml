            function toggleCleanSwitch(el, cmdOn, cmdOff, friendlyLabel) {
              hapticTick();
              const targetOn = el ? !el.classList.contains('on') : true;
              if (el) {
                el.classList.toggle('on', targetOn);
                const parentCard = el.closest('.tweak-item');
                if (parentCard) parentCard.classList.toggle('active-on', targetOn);
              }
              const cmd = targetOn ? cmdOn : (cmdOff || 'echo ok');

              if (window.BangBridge && window.BangBridge.execVerifiedAsync) {
                window._lastSwitchEl = el;
                window._lastSwitchLabel = friendlyLabel;
                window.BangBridge.execVerifiedAsync('sw_' + Date.now(), targetOn, cmd, '', '', 0);
              } else {
                appendLog(friendlyLabel, 'OK');
                showToast(friendlyLabel);
              }
            }

