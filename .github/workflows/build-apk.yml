            let nativeHz = 60;
            let maxSupportedHz = 120;
            let shizukuReady = false;
            let floEnabled = false;
            let turboEnabled = false;
            let xiaomiPlanEnabled = false;
            let selectedOptLevel = -1;
            let revertTimer = null;

            // ================= KHỞI TẠO DOM 1 LẦN DUY NHẤT (TRÁNH GIẬT LAG KHI GẠT NÚT) =================
            function buildSwitchCardHTML(item) {
              return `
                <div id="card_${item.id}" class="switch-item" data-search="${(item.name + ' ' + item.desc + ' ' + item.tag).toLowerCase()}">
                  <div class="switch-row-top">
                    <div class="switch-text">
                      <div class="switch-title">${item.name} <span class="badge-spec">${item.tag}</span></div>
                      <div class="switch-desc">${item.desc}</div>
                    </div>
                    <div id="sw_${item.id}" class="apple-toggle" onclick="onUserToggleSwitch('${item.id}')"></div>
                  </div>
                  ${item.tradeoff ? `<div class="note-callout">${item.tradeoff}</div>` : ''}
                  <div id="st_${item.id}" class="verify-status-line idle">Trạng thái: Chưa bật</div>
                </div>
              `;
            }

            function initAllSwitchDOM() {
              document.getElementById('glToolList').innerHTML = glToolItems.map(buildSwitchCardHTML).join('');
              document.getElementById('group1List').innerHTML = featGroup1.map(buildSwitchCardHTML).join('');
              document.getElementById('group2List').innerHTML = featGroup2.map(buildSwitchCardHTML).join('');
              updateCountersAndMasterBar();
            }

            // Cập nhật đúng 1 công tắc mà không render lại toàn trang (0ms Lag)
            function updateSingleSwitchDOM(id) {
              const item = allSwitchMap.get(id);
              if (!item) return;
              const card = document.getElementById('card_' + id);
              const sw = document.getElementById('sw_' + id);
              const st = document.getElementById('st_' + id);
              if (!card || !sw || !st) return;

              sw.classList.toggle('on', !!item.on);
              card.classList.toggle('verified-on', !!item.on && item.statusType === 'ok');
              card.classList.toggle('verified-err', !item.on && item.statusType === 'err');

              st.className = 'verify-status-line ' + (item.statusType || 'idle');
              st.textContent = item.statusText || (item.on ? 'Đang hoạt động' : 'Trạng thái: Chưa bật');
            }

            function filterTweakDOM() {
              const q = (document.getElementById('tweakSearchInput')?.value || '').toLowerCase().trim();
              document.querySelectorAll('#group1List .switch-item, #group2List .switch-item').forEach(el => {
                const text = el.getAttribute('data-search') || '';
                el.style.display = (!q || text.includes(q)) ? 'block' : 'none';
              });
            }

            // ================= XỬ LÝ GẠT CÔNG TẮC & XÁC THỰC KẾT QUẢ THẬT =================
            function onUserToggleSwitch(id) {
              const item = allSwitchMap.get(id);
              if (!item) return;

              const targetOn = !item.on;
              // Phản hồi thị giác tức thì (0ms)
              item.on = targetOn;
              item.statusType = 'pending';
              item.statusText = targetOn ? 'Đang thực thi & kiểm tra trên hệ thống...' : 'Đang tắt thiết lập...';
              updateSingleSwitchDOM(id);

              const cmdToRun = targetOn ? item.cmdOn : item.cmdOff;
              if (window.BangBridge && window.BangBridge.execVerifiedAsync) {
                window.BangBridge.execVerifiedAsync(
                  id,
                  targetOn,
                  cmdToRun,
                  item.verifyCmd || '',
                  item.expectVal || '',
                  item.minHz || 0
                );
              } else {
                // Nếu chạy ngoài môi trường Android Bridge -> Báo rõ chưa có Shizuku
                setTimeout(() => {
                  window.onSwitchVerifiedResult({
                    itemId: id,
                    targetOn: targetOn,
                    ok: false,
                    reason: 'Chưa kết nối Shizuku UID 2000 Shell',
                    needAuth: true
                  });
                }, 180);
              }
            }

            // Callback từ Kotlin sau khi đã chạy lệnh và đọc ngược lại giá trị hệ thống
            window.onSwitchVerifiedResult = function(res) {
              if (!res) return;
              const item = allSwitchMap.get(res.itemId);
              if (!item) return;

              if (res.ok) {
                item.on = res.targetOn;
                if (res.targetOn) {
                  item.statusType = 'ok';
                  const valInfo = res.verifiedValue ? ` (Giá trị: ${res.verifiedValue})` : '';
                  item.statusText = `Đã kích hoạt & xác nhận trên hệ thống${valInfo}`;
                  showToast(`Đã bật: ${item.name}`);
                } else {
                  item.statusType = 'idle';
                  item.statusText = 'Trạng thái: Đã tắt';
                  showToast(`Đã tắt: ${item.name}`);
                }
                if (res.cmd) appendLog(res.cmd, 'OK');
              } else {
                // LỆNH KHÔNG HOẠT ĐỘNG -> Tự động gạt công tắc về TẮT và ghi rõ nguyên nhân!
                item.on = false;
                item.statusType = 'err';
                item.statusText = `Không hoạt động: ${res.reason || 'Thiết bị từ chối lệnh'}`;
                showToast(`Không thể bật ${item.name}: ${res.reason}`);
                if (res.cmd) appendLog(res.cmd, `LỖI: ${res.reason}`);
                if (res.needAuth) {
                  openShizukuModal(res.reason);
                }
              }

              if (item.id === 'f2_thermal') {
                frozenPackages[0].frozen = item.on;
              }
              updateSingleSwitchDOM(res.itemId);
              updateCountersAndMasterBar();
            };

            function updateCountersAndMasterBar() {
              const glOn = glToolItems.filter(x => x.on).length;
              const f1On = featGroup1.filter(x => x.on).length;
              const f2On = featGroup2.filter(x => x.on).length;
              const featOn = f1On + f2On;
              const totalActive = glOn + featOn + (floEnabled ? 1 : 0) + (turboEnabled ? 1 : 0) + (xiaomiPlanEnabled ? 1 : 0) + (selectedOptLevel >= 0 ? 1 : 0);

              document.getElementById('glActiveCount').textContent = `${glOn}/${glToolItems.length}`;
              document.getElementById('featActiveCount').textContent = `Đang bật ${featOn}/12`;
              document.getElementById('prismStatus0').textContent = totalActive > 0 ? `Đang bật (${totalActive})` : 'Chưa kích hoạt';

              const frozenCount = frozenPackages.filter(x => x.frozen).length;
              document.getElementById('frozenCountText').textContent = frozenCount;

              const masterBtn = document.getElementById('masterStatusBtn');
              if (totalActive > 0) {
                masterBtn.className = 'btn-dock-main active pressable';
                masterBtn.textContent = `Đã kích hoạt (${totalActive} tính năng) · Đang tối ưu`;
              } else {
                masterBtn.className = 'btn-dock-main idle pressable';
                masterBtn.textContent = 'Chưa kích hoạt · Chạm để tối ưu';
              }
            }

            // ================= QUÉT NGẦM SHIZUKU KHI MỞ APP (COLD START) =================
            window.onShizukuDiagnostic = function(info) {
              if (!info) return;
              const banner = document.getElementById('shizukuBanner');
              const txt = document.getElementById('shizukuText');

              if (info.state === 'READY') {
                shizukuReady = true;
                banner.className = 'shizuku-banner ok pressable';
                txt.textContent = 'Shizuku: Đã kết nối thật (UID 2000 Shell)';
                closeShizukuModal();
                syncRealSystemState(false);
              } else {
                shizukuReady = false;
                banner.className = 'shizuku-banner warn pressable';
                txt.textContent = info.state === 'NOT_RUNNING'
                  ? 'Shizuku chưa chạy · Chạm để mở Shizuku'
                  : 'Chưa cấp quyền cho BangOptimize trong Shizuku · Chạm để cấp quyền';
                openShizukuModal(info.detail);
              }
            };

            function openShizukuModal(reasonText) {
              if (reasonText) {
                document.getElementById('shizukuModalDesc').textContent = reasonText + ' Hãy cấp quyền hoặc mở ứng dụng Shizuku để thêm BangOptimize vào danh sách được phép.';
              }
              document.getElementById('shizukuAlertModal').classList.add('open');
            }

            function closeShizukuModal() {
              document.getElementById('shizukuAlertModal').classList.remove('open');
            }

            function triggerShizukuAuthFromModal() {
              closeShizukuModal();
              requestShizukuPermission();
            }

            function openExternalShizukuApp() {
              if (window.BangBridge && window.BangBridge.openShizukuApp) {
                window.BangBridge.openShizukuApp();
              } else {
                showToast('Hãy mở ứng dụng Shizuku trên màn hình chính của bạn');
              }
            }

            function requestShizukuPermission() {
              if (window.BangBridge && window.BangBridge.requestShizuku) {
                window.BangBridge.requestShizuku();
              } else {
                openShizukuModal('Không tìm thấy cầu nối Shizuku trên thiết bị.');
              }
            }

            // ================= ĐỒNG BỘ TRẠNG THÁI THẬT TỪ MÁY =================
            function syncRealSystemState(notifyUser) {
              if (window.BangBridge && window.BangBridge.refreshHardware) {
                window.BangBridge.refreshHardware();
              }
              if (window.BangBridge && window.BangBridge.syncSystemStatesAsync) {
                window.BangBridge.syncSystemStatesAsync();
              }
              if (notifyUser) showToast('Đang quét trạng thái thực tế từ hệ thống...');
            }

            window.onSystemStatesSynced = function(state) {
              if (!state || !state.connected) {
                updateCountersAndMasterBar();
                return;
              }
              const mapCheck = [
                { id: 'gl_zero_lag', key: 'perf', val: '1' },
                { id: 'gl_ping', key: 'speed', val: '1' },
                { id: 'gl_cooling', key: 'freezer', val: 'enabled' },
                { id: 'gl_120hz', key: 'peak_hz', val: '120' },
                { id: 'gl_gfx', key: 'angle', val: '1' },
                { id: 'f1_touch', key: 'long_press', val: '150' },
                { id: 'f1_maxhz', key: 'peak_hz', val: '120' },
                { id: 'f1_sf', key: 'anim', val: '0.5' },
                { id: 'f2_highperf', key: 'power_mode', val: 'high' },
                { id: 'f2_thermal', key: 'joyose', val: 'ignore' }
              ];
              mapCheck.forEach(chk => {
                const it = allSwitchMap.get(chk.id);
                if (it && state[chk.key] !== undefined) {
                  const actual = String(state[chk.key]);
                  const matched = actual.includes(chk.val);
                  it.on = matched;
                  it.statusType = matched ? 'ok' : 'idle';
                  it.statusText = matched ? `Đang bật trên hệ thống (${actual})` : 'Trạng thái: Chưa bật';
                  updateSingleSwitchDOM(chk.id);
                }
              });

              floEnabled = String(state.long_press) === '150';
              syncFloButtonUI();
              updateCountersAndMasterBar();
            };

            // ================= CÁC NÚT CHỨC NĂNG TRUNG TÂM =================
            function syncFloButtonUI() {
              const btn = document.getElementById('btnFlo');
              const lbl = document.getElementById('floDelayText');
              if (floEnabled) {
                btn.className = 'btn-block btn-active-emerald pressable';
                btn.textContent = 'Đã kích hoạt Profile Florentino (Chạm để tắt)';
                lbl.textContent = '0ms (150ms Polling)';
                lbl.style.color = '#34D399';
              } else {
                btn.className = 'btn-block btn-subtle pressable';
                btn.textContent = 'Chưa bật Profile Florentino (Chạm để kích hoạt)';
                lbl.textContent = 'Mặc định (Chưa bật)';
                lbl.style.color = 'var(--text-secondary)';
              }
            }

            function toggleFlorentino() {
              const target = !floEnabled;
              const cmd = target
                ? 'settings put secure long_press_timeout 150 && settings put secure multi_press_timeout 150 && settings put system pointer_speed 7'
                : 'settings put secure long_press_timeout 400 && settings put system pointer_speed 0';
              runCustomVerifiedCommand(cmd, 'settings get secure long_press_timeout', target ? '150' : '', (ok, reason) => {
                if (ok) {
                  floEnabled = target;
                  syncFloButtonUI();
                  updateCountersAndMasterBar();
                  showToast(target ? 'Đã kích hoạt Profile Florentino' : 'Đã tắt Profile Florentino');
                } else {
                  floEnabled = false;
                  syncFloButtonUI();
                  showToast('Không thể bật Profile Florentino: ' + reason);
                }
              });
            }

            function enableTurboTouch() {
              const target = !turboEnabled;
              const cmd = target
                ? 'settings put secure tap_duration_threshold 0.0 && settings put system pointer_speed 7'
                : 'settings put system pointer_speed 0';
              runCustomVerifiedCommand(cmd, 'settings get system pointer_speed', target ? '7' : '', (ok, reason) => {
                if (ok) {
                  turboEnabled = target;
                  document.getElementById('turboBtnSub').textContent = target ? 'Đang hoạt động (Pointer +7)' : 'Chưa kích hoạt';
                  document.getElementById('turboBtnSub').style.color = target ? '#34D399' : 'var(--text-secondary)';
                  updateCountersAndMasterBar();
                  showToast(target ? 'Đã kích hoạt Turbo Touch' : 'Đã tắt Turbo Touch');
                } else {
                  turboEnabled = false;
                  document.getElementById('turboBtnSub').textContent = 'Lỗi: ' + reason;
                  document.getElementById('turboBtnSub').style.color = '#FDA4AF';
                  showToast('Không thể bật Turbo Touch: ' + reason);
                }
              });
            }

            function applyXiaomiSpecialPlan() {
              const target = !xiaomiPlanEnabled;
              const cmd = target
                ? 'settings put system deviceLevelList v:1,c:3,g:3 && settings put system POWER_PERFORMANCE_MODE_OPEN 1 && cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND ignore'
                : 'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND allow';
              runCustomVerifiedCommand(cmd, 'settings get system deviceLevelList', target ? 'v:1,c:3,g:3' : '', (ok, reason) => {
                const btn = document.getElementById('btnXiaomiSpecial');
                if (ok) {
                  xiaomiPlanEnabled = target;
                  btn.className = target ? 'btn-block btn-active-emerald pressable' : 'btn-block btn-subtle pressable';
                  btn.textContent = target
                    ? 'Đã kích hoạt phương án tối ưu Xiaomi (Chạm để tắt)'
                    : 'Áp dụng phương án tối ưu Xiaomi / Redmi / POCO';
                  updateCountersAndMasterBar();
                  showToast(target ? 'Đã mở khóa v:1,c:3,g:3 & chặn Joyose' : 'Đã tắt phương án Xiaomi');
                } else {
                  xiaomiPlanEnabled = false;
                  btn.className = 'btn-block btn-subtle pressable';
                  btn.textContent = 'Không thể áp dụng: ' + reason;
                  showToast('Không thể áp dụng: ' + reason);
                }
              });
            }

            // Hàm chạy lệnh tùy chỉnh có kiểm tra kết quả thật
            let customCallbacks = {};
            function runCustomVerifiedCommand(cmd, verifyCmd, expectVal, cb) {
              const cid = 'custom_' + Date.now();
              customCallbacks[cid] = cb;
              if (window.BangBridge && window.BangBridge.execVerifiedAsync) {
                window.BangBridge.execVerifiedAsync(cid, true, cmd, verifyCmd, expectVal, 0);
              } else {
                cb(false, 'Chưa kết nối Shizuku UID 2000');
                openShizukuModal('Bạn cần cấp quyền Shizuku trước khi sử dụng tính năng này.');
              }
            }

            // Bắt cả callback của nút tùy chỉnh
            const origSwitchCallback = window.onSwitchVerifiedResult;
            window.onSwitchVerifiedResult = function(res) {
              if (res && res.itemId && customCallbacks[res.itemId]) {
                const fn = customCallbacks[res.itemId];
                delete customCallbacks[res.itemId];
                if (res.cmd) appendLog(res.cmd, res.ok ? 'OK' : ('LỖI: ' + res.reason));
                if (res.needAuth) openShizukuModal(res.reason);
                fn(res.ok, res.reason || 'Lỗi thực thi');
                return;
              }
              origSwitchCallback(res);
            };

            function selectOptLevel(idx, scale, label) {
              const cards = document.querySelectorAll('#levelGrid .tier-card');
              if (selectedOptLevel === idx) {
                selectedOptLevel = -1;
                cards.forEach(el => el.classList.remove('active'));
                document.getElementById('animLabel').textContent = 'Mặc định (Chưa bật)';
                document.getElementById('levelDetailBox').textContent = 'Đã tắt cấp độ tối ưu, đưa tỉ lệ hoạt ảnh về 1.0x.';
                runCustomVerifiedCommand('settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0', '', '', () => {});
                updateCountersAndMasterBar();
                return;
              }

              const cmd = `settings put global window_animation_scale ${scale} && settings put global transition_animation_scale ${scale} && settings put global animator_duration_scale ${scale}`;
              runCustomVerifiedCommand(cmd, 'settings get global window_animation_scale', scale, (ok, reason) => {
                if (ok) {
                  selectedOptLevel = idx;
                  cards.forEach((el, i) => el.classList.toggle('active', i === idx));
                  document.getElementById('animLabel').textContent = label;
                  document.getElementById('levelDetailBox').textContent = `Đã xác nhận trên hệ thống: Hoạt ảnh cửa sổ = ${scale}x (${label}).`;
                  updateCountersAndMasterBar();
                  showToast('Đã kích hoạt cấp độ: ' + label);
                } else {
                  selectedOptLevel = -1;
                  cards.forEach(el => el.classList.remove('active'));
                  document.getElementById('levelDetailBox').textContent = `Không thể bật cấp độ ${label}: ${reason}`;
                  showToast('Không thể bật: ' + reason);
                }
              });
            }

            // ================= ĐỘ PHÂN GIẢI & DPI =================
            function setPresetRes(idx, w, h, dpi) {
              document.querySelectorAll('#resPresetGrid .tier-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.getElementById('inpW').value = w;
              document.getElementById('inpH').value = h;
              document.getElementById('inpDpi').value = dpi;
              applyResolution(true);
            }

            function applyResolution(isTest15s) {
              const w = document.getElementById('inpW').value;
              const h = document.getElementById('inpH').value;
              const dpi = document.getElementById('inpDpi').value;
              runCustomVerifiedCommand(`wm size ${w}x${h} && wm density ${dpi}`, 'wm size', `${w}x${h}`, (ok, reason) => {
                if (!ok) {
                  showToast('Không thể đổi độ phân giải: ' + reason);
                  return;
                }
                document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
                showToast(`Đã áp dụng ${w}x${h} @ ${dpi} DPI`);
                clearInterval(revertTimer);
                const btn = document.getElementById('btnTest15s');
                if (isTest15s) {
                  let sec = 15;
                  btn.textContent = `Hoàn tác (${sec}s)`;
                  revertTimer = setInterval(() => {
                    sec--;
                    btn.textContent = `Hoàn tác (${sec}s)`;
                    if (sec <= 0) {
                      clearInterval(revertTimer);
                      resetResolution();
                    }
                  }, 1000);
                } else {
                  btn.textContent = 'Thử 15 giây';
                }
              });
            }

            function resetResolution() {
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = 'Thử 15 giây';
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              runCustomVerifiedCommand('wm size reset && wm density reset', '', '', () => {
                showToast('Đã khôi phục màn hình gốc');
              });
            }

            // ================= QUẢN LÝ RAM & WHITELIST =================
            function setRamPreset(idx, mb, label) {
              document.querySelectorAll('#ramPresetGrid .tier-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.getElementById('ramSlider').value = mb;
              onRamSliderChange(mb, label);
            }

            function onRamSliderChange(val, customLabel) {
              currentThreshold = parseInt(val, 10);
              const dau = customLabel || ('Đầu ' + (currentThreshold / 1000).toFixed(1) + 'x');
              const pct = Math.round((currentRamUsed / Math.max(1, currentRamTotal)) * 100);
              document.getElementById('sliderValText').textContent = `${currentThreshold} MB (${dau})`;
              document.getElementById('ramHeaderStat').textContent = `RAM: ${currentRamUsed} MB (${pct}%)`;
              document.getElementById('notifRamText').textContent = `RAM: ${currentRamUsed} MB / ${currentRamTotal} MB (Mốc: ${currentThreshold} MB · ${dau})`;
              if (window.BangBridge && window.BangBridge.setRamThreshold) {
                window.BangBridge.setRamThreshold(currentThreshold);
              }
            }

            function cleanRamNow() {
              const unprotected = allAppsList.filter(a => !a.protected).slice(0, 12).map(a => `am force-stop ${a.pkg}`).join(' && ');
              const fullCmd = unprotected ? `${unprotected} && am kill-all && pm trim-caches 999G` : 'am kill-all && pm trim-caches 999G';
              runCustomVerifiedCommand(fullCmd, '', '', (ok, reason) => {
                if (ok) {
                  if (window.BangBridge && window.BangBridge.refreshHardware) {
                    window.BangBridge.refreshHardware();
                  }
                  showToast('Đã thực thi giải phóng RAM (Bảo toàn Whitelist)');
                } else {
                  showToast('Không thể dọn sâu bằng Shizuku: ' + reason);
                }
              });
            }

            function scanInstalledApps(notify) {
              if (window.BangBridge && window.BangBridge.scanAppsAsync) {
                window.BangBridge.scanAppsAsync();
                if (notify) showToast('Đang quét danh sách ứng dụng trên máy...');
              } else {
                renderWhitelistApps();
              }
            }

            window.onAppsScanned = function(realApps) {
              if (Array.isArray(realApps) && realApps.length > 0) {
                const map = new Map();
                allAppsList.forEach(a => map.set(a.pkg, a));
                realApps.forEach(ra => {
                  if (!map.has(ra.pkg)) {
                    const safe = ra.pkg.includes('zalo') || ra.pkg.includes('orca') || ra.pkg.includes('youtube') || ra.pkg.includes('camera') || ra.pkg.includes('garena');
                    map.set(ra.pkg, { name: ra.name, pkg: ra.pkg, running: !!ra.running, protected: safe });
                  } else {
                    map.get(ra.pkg).running = !!ra.running;
                  }
                });
                allAppsList = Array.from(map.values());
              }
              renderWhitelistApps();
            };

            function renderWhitelistApps() {
              const q = (document.getElementById('appSearchInput')?.value || '').toLowerCase().trim();
              const filter = document.getElementById('appFilterSelect')?.value || 'ALL';

              document.getElementById('wlTotalCount').textContent = allAppsList.length;
              document.getElementById('wlRunningCount').textContent = allAppsList.filter(a => a.running).length;
              document.getElementById('wlProtectedCount').textContent = allAppsList.filter(a => a.protected).length;

              const filtered = allAppsList.filter(app => {
                const matchText = !q || app.name.toLowerCase().includes(q) || app.pkg.toLowerCase().includes(q);
                if (!matchText) return false;
                if (filter === 'RUNNING') return app.running;
                if (filter === 'PROTECTED') return app.protected;
                if (filter === 'UNPROTECTED') return !app.protected;
                return true;
              });

              const box = document.getElementById('whitelistContainer');
              box.innerHTML = filtered.slice(0, 60).map(app => {
                const initials = (app.name || 'AP').substring(0, 2).toUpperCase();
                return `
                  <div class="app-row">
                    <div class="app-icon-mono">${initials}</div>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:12.5px; font-weight:700; color:#FFFFFF; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${app.name}</div>
                      <div style="font-size:10px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${app.pkg} · <span style="color:${app.running ? '#34D399' : '#64748B'};">${app.running ? 'Đang chạy' : 'Nền'}</span>
                      </div>
                    </div>
                    <div class="apple-toggle ${app.protected ? 'on' : ''}" onclick="toggleAppWhitelist('${app.pkg}', this)"></div>
                  </div>
                `;
              }).join('');
            }

            function toggleAppWhitelist(pkg, el) {
              const target = allAppsList.find(a => a.pkg === pkg);
              if (!target) return;
              target.protected = !target.protected;
              el.classList.toggle('on', target.protected);
              document.getElementById('wlProtectedCount').textContent = allAppsList.filter(a => a.protected).length;
            }

            // ================= MODAL APP ĐÃ TẮT & TIỆN ÍCH =================
            function openFrozenModal() {
              const box = document.getElementById('frozenListBox');
              box.innerHTML = frozenPackages.map((item, idx) => `
                <div class="switch-item">
                  <div class="switch-row-top">
                    <div class="switch-text">
                      <div class="switch-title">${item.name}</div>
                      <div class="switch-desc">${item.pkg} · ${item.frozen ? 'Đang bị chặn nền' : 'Đang hoạt động'}</div>
                    </div>
                    <div class="apple-toggle ${item.frozen ? 'on' : ''}" onclick="toggleFrozenPkg(${idx})"></div>
                  </div>
                </div>
              `).join('');
              document.getElementById('frozenModal').classList.add('open');
            }

            function closeFrozenModal() {
              document.getElementById('frozenModal').classList.remove('open');
            }

            function toggleFrozenPkg(idx) {
              const item = frozenPackages[idx];
              const target = !item.frozen;
              const cmd = target
                ? `cmd appops set ${item.pkg} RUN_IN_BACKGROUND ignore && am force-stop ${item.pkg}`
                : `cmd appops set ${item.pkg} RUN_IN_BACKGROUND allow && pm enable ${item.pkg}`;
              runCustomVerifiedCommand(cmd, '', '', (ok, reason) => {
                if (ok) {
                  item.frozen = target;
                  openFrozenModal();
                  updateCountersAndMasterBar();
                } else {
                  showToast('Không thể thay đổi gói: ' + reason);
                }
              });
            }

            function restoreAllFrozenApps() {
              runCustomVerifiedCommand('pm enable com.android.camera && cmd appops reset', '', '', (ok, reason) => {
                if (ok) {
                  frozenPackages.forEach(x => { x.frozen = false; });
                  closeFrozenModal();
                  updateCountersAndMasterBar();
                  showToast('Đã bật lại toàn bộ gói ứng dụng & máy ảnh');
                } else {
                  showToast('Lỗi khôi phục: ' + reason);
                }
              });
            }

            function fixCameraAndApps() {
              restoreAllFrozenApps();
            }

            function onMasterButtonClick() {
              const totalActive = glToolItems.filter(x => x.on).length + featGroup1.filter(x => x.on).length + featGroup2.filter(x => x.on).length;
              if (totalActive === 0 && selectedOptLevel === -1) {
                selectOptLevel(1, '0.5', 'MEDIUM · 0.5x');
              } else {
                cleanRamNow();
              }
            }

            function restoreAllDefaults() {
              runCustomVerifiedCommand(
                'settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0 && settings put global animator_duration_scale 1.0 && settings put secure long_press_timeout 400 && settings delete system peak_refresh_rate && settings delete system min_refresh_rate',
                '',
                '',
                (ok, reason) => {
                  [...glToolItems, ...featGroup1, ...featGroup2].forEach(it => {
                    it.on = false;
                    it.statusType = 'idle';
                    it.statusText = 'Trạng thái: Đã đưa về mặc định';
                    updateSingleSwitchDOM(it.id);
                  });
                  floEnabled = false;
                  turboEnabled = false;
                  xiaomiPlanEnabled = false;
                  selectedOptLevel = -1;
                  syncFloButtonUI();
                  document.querySelectorAll('#levelGrid .tier-card').forEach(el => el.classList.remove('active'));
                  document.getElementById('animLabel').textContent = 'Mặc định (Chưa bật)';
                  updateCountersAndMasterBar();
                  showToast(ok ? 'Đã khôi phục toàn bộ thông số về mặc định NSX' : ('Đã đặt lại giao diện (' + reason + ')'));
                }
              );
            }

            function switchTab(idx) {
              document.querySelectorAll('.tab-view').forEach((el, i) => el.classList.toggle('active', i === idx));
              document.querySelectorAll('.nav-tab').forEach((el, i) => el.classList.toggle('active', i === idx));
              window.scrollTo({ top: 0, behavior: 'instant' });
            }

            function selectBrand(btn, brand) {
              btn.parentElement.querySelectorAll('.seg-pill').forEach(el => el.classList.remove('active'));
              btn.classList.add('active');
              showToast('Đã chọn cấu hình: ' + brand);
            }

            function toggleIsland() {
              document.getElementById('dynamicIsland').classList.toggle('expanded');
            }

            function toggleGhostLock() {
              const isl = document.getElementById('dynamicIsland');
              isl.classList.toggle('ghost');
              isl.classList.remove('expanded');
            }

            function toggleFloatingHudSwitch(el) {
              el.classList.toggle('on');
              document.getElementById('islandWrap').classList.toggle('hidden', !el.classList.contains('on'));
            }

            function toggleAutoRamSwitch(el) {
              el.classList.toggle('on');
              if (window.BangBridge && window.BangBridge.setAutoCleanRam) {
                window.BangBridge.setAutoCleanRam(el.classList.contains('on'));
              }
            }

            function appendLog(cmd, status) {
              cmdCount++;
              document.getElementById('cmdCountBadge').textContent = cmdCount + ' lệnh';
              const box = document.getElementById('consoleBox');
              const div = document.createElement('div');
              div.textContent = `[${status}] $ ${cmd}`;
              box.prepend(div);
            }

            function showToast(msg) {
              const t = document.getElementById('toastBanner');
              t.textContent = msg;
              t.classList.add('show');
              clearTimeout(window._toastTimer);
              window._toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
            }

            function exportBangConfig() {
              const code = `BANG-V8.3-FLAGSHIP-${currentThreshold}MB`;
              if (navigator.clipboard) navigator.clipboard.writeText(code);
              showToast('Đã sao chép mã: ' + code);
            }

            function openTelegram() {
              window.open('https://t.me/BangTechnology', '_blank');
            }

            // Nhận thông số phần cứng thật từ Kotlin
            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              currentRamTotal = data.totalRamMb || 5606;
              currentRamUsed = data.usedRamMb || 3800;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              nativeHz = data.hz || 60;
              maxSupportedHz = data.maxHz || nativeHz;
              shizukuReady = !!data.shizukuReady;

              const ramGb = Math.max(2, Math.round(currentRamTotal / 1024));
              const pct = Math.round((currentRamUsed / Math.max(1, currentRamTotal)) * 100);

              document.getElementById('deviceModelText').textContent = `Thiết bị: ${data.model} (${data.android})`;
              document.getElementById('diagModel').textContent = data.rawModel || data.model;
              document.getElementById('diagSoc').textContent = data.soc || 'Snapdragon / MediaTek';
              document.getElementById('diagRam').textContent = `${currentRamUsed} MB (${pct}%) / ${(currentRamTotal / 1024).toFixed(1)} GB`;
              document.getElementById('diagScreen').textContent = `${nativeWidth}x${nativeHeight} · ${nativeHz}Hz`;
              document.getElementById('maxHzBadge').textContent = `Phần cứng tối đa: ${maxSupportedHz}Hz`;
              document.getElementById('prismStatus1').textContent = `Hiện tại ${nativeHz}Hz / Tối đa ${maxSupportedHz}Hz`;

              document.getElementById('detectedResLabel').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi} DPI (${nativeHz}Hz)`;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              document.getElementById('glBat').textContent = `${data.battery}%`;
              document.getElementById('glTemp').textContent = `${data.tempC}°C`;
              document.getElementById('glPower').textContent = data.powerSource || 'Pin';
              document.getElementById('hudFps').textContent = `${nativeHz} FPS`;
              document.getElementById('hudTempTop').textContent = `${data.tempC}°C`;
              document.getElementById('hudRamTop').textContent = `RAM: ${currentRamUsed}/${currentRamTotal}MB`;

              document.getElementById('detectedRamCapText').textContent = `${currentRamTotal} MB (${ramGb} GB)`;
              document.getElementById('ramCapPill').textContent = `${ramGb}GB RAM`;

              const banner = document.getElementById('shizukuBanner');
              const txt = document.getElementById('shizukuText');
              if (data.shizukuState === 'READY') {
                banner.className = 'shizuku-banner ok pressable';
                txt.textContent = 'Shizuku: Đã kết nối thật (UID 2000 Shell)';
              } else if (data.shizukuState === 'NOT_RUNNING') {
                banner.className = 'shizuku-banner warn pressable';
                txt.textContent = 'Shizuku chưa chạy · Chạm để mở Shizuku';
              } else {
                banner.className = 'shizuku-banner warn pressable';
                txt.textContent = 'Chưa cấp quyền cho BangOptimize trong Shizuku';
              }

              onRamSliderChange(currentThreshold);
              if (data.isColdStart) {
                scanInstalledApps(false);
                syncRealSystemState(false);
              }
            };

            initAllSwitchDOM();
            renderWhitelistApps();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v8.3-Flagship
          path: app/build/outputs/apk/debug/app-debug.apk
