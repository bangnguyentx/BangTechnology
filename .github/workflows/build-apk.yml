                  @JavascriptInterface
                  fun execTrueStateToggleAsync(
                      itemId: String,
                      targetOn: Boolean,
                      stateKey: String,
                      expectVal: String,
                      defaultOffVal: String,
                      cmdOn: String,
                      cmdOff: String,
                      minRequiredHz: Int
                  ) {
                      bgExecutor.execute {
                          val res = JSONObject().apply {
                              put("itemId", itemId)
                              put("targetOn", targetOn)
                          }

                          if (targetOn && minRequiredHz > 0 && maxSupportedHz < minRequiredHz) {
                              res.put("ok", false)
                              res.put("reason", "Phần cứng màn hình chỉ hỗ trợ tối đa ${maxSupportedHz}Hz (Không thể ghi ${minRequiredHz}Hz)")
                              postResult(res)
                              return@execute
                          }

                          var namespace = ""
                          var settingName = ""
                          if (stateKey.contains(":")) {
                              val p = stateKey.split(":", limit = 2)
                              namespace = p[0]
                              settingName = p[1]
                          }

                          if (targetOn && namespace.isNotEmpty() && settingName.isNotEmpty()) {
                              val currentBefore = ShizukuEngine.readSettingFromOs(this@MainActivity, namespace, settingName)
                              if (currentBefore.isNotEmpty() && currentBefore != expectVal) {
                                  ShizukuEngine.saveOriginalValueIfAbsent(this@MainActivity, stateKey, currentBefore)
                              }
                          }

                          val finalCmdToRun = if (targetOn) {
                              cmdOn
                          } else {
                              if (namespace.isNotEmpty() && settingName.isNotEmpty() && cmdOff.startsWith("AUTO_RESTORE")) {
                                  val orig = ShizukuEngine.getBackedUpOriginalValue(this@MainActivity, stateKey, defaultOffVal)
                                  if (orig.isEmpty() || orig == "DELETE") {
                                      "settings delete $namespace $settingName"
                                  } else {
                                      "settings put $namespace $settingName $orig"
                                  }
                              } else {
                                  cmdOff
                              }
                          }

                          val execJson = ShizukuEngine.executeShizukuStrict(finalCmdToRun)
                          val exitCode = execJson.optInt("exitCode", -1)
                          val err = execJson.optString("err", "")

                          if (exitCode != 0) {
                              res.put("ok", false)
                              res.put("reason", err.ifEmpty { "Shizuku từ chối thực thi lệnh này (Mã $exitCode)" })
                              res.put("needShizuku", execJson.optBoolean("needShizuku", false))
                              res.put("cmd", finalCmdToRun)
                              postResult(res)
                              return@execute
                          }

                          if (namespace.isNotEmpty() && settingName.isNotEmpty() && expectVal.isNotEmpty()) {
                              val actualAfter = ShizukuEngine.readSettingFromOs(this@MainActivity, namespace, settingName)
                              if (targetOn) {
                                  val matched = actualAfter.equals(expectVal, ignoreCase = true) ||
                                          actualAfter.startsWith(expectVal, ignoreCase = true)
                                  if (!matched) {
                                      res.put("ok", false)
                                      res.put("reason", "Không ghi được vào máy! Hệ điều hành khóa thông số '$settingName' (Giá trị thực vẫn là: ${actualAfter.ifEmpty { "Mặc định" }})")
                                      res.put("cmd", finalCmdToRun)
                                      postResult(res)
                                      return@execute
                                  }
                                  res.put("verifiedValue", "$settingName = $actualAfter")
                              } else {
                                  res.put("verifiedValue", "Đã trả về gốc ($settingName = ${actualAfter.ifEmpty { defaultOffVal }})")
                              }
                          } else {
                              res.put("verifiedValue", if (targetOn) "Đã thực thi qua Shizuku UID 2000" else "Đã hoàn tác về mặc định")
                          }

                          ShizukuEngine.saveToggleMemory(this@MainActivity, itemId, targetOn)
                          res.put("ok", true)
                          res.put("cmd", finalCmdToRun)
                          postResult(res)
                      }
                  }

                  private fun postResult(res: JSONObject) {
                      mainHandler.post {
                          webView.evaluateJavascript("window.onSwitchVerifiedResult && window.onSwitchVerifiedResult($res);", null)
                      }
                  }

                  @JavascriptInterface
                  fun scanAppsAndGamesAsync() {
                      bgExecutor.execute {
                          val gamesArr = JSONArray()
                          val appsArr = JSONArray()
                          try {
                              val pm = packageManager
                              val installed = pm.getInstalledApplications(0)
                              for (app in installed) {
                                  val pkg = app.packageName
                                  val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                                  val hasLauncher = pm.getLaunchIntentForPackage(pkg) != null
                                  if (isSystem && !hasLauncher) continue

                                  val label = pm.getApplicationLabel(app).toString()
                                  val isGame = isAppGame(app, label)
                                  if (isGame) BangGameSidebarService.watchedGamePackages.add(pkg)
                                  val iconUrl = "https://bangoptimize.local/app-icon/$pkg"

                                  val itemObj = JSONObject().apply {
                                      put("name", label)
                                      put("pkg", pkg)
                                      put("system", isSystem)
                                      put("isGame", isGame)
                                      put("icon", iconUrl)
                                  }
                                  if (isGame) gamesArr.put(itemObj)
                                  if (!isSystem || hasLauncher) appsArr.put(itemObj)
                              }
                          } catch (_: Throwable) {}

                          val payload = JSONObject().apply {
                              put("games", gamesArr)
                              put("apps", appsArr)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.onDeviceGamesAndAppsScanned && window.onDeviceGamesAndAppsScanned($payload);", null)
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  try { Shizuku.removeRequestPermissionResultListener(shizukuPermListener) } catch (_: Throwable) {}
                  bgExecutor.shutdownNow()
                  super.onDestroy()
              }
          }
