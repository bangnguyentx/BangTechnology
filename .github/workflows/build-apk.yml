              padding: 6px;
              display: grid;
              grid-template-columns: repeat(4, 1fr);
              align-items: center;
              touch-action: none;
            }
            .ios27-liquid-lens {
              position: absolute;
              top: 5px;
              bottom: 5px;
              left: 6px;
              width: calc((100% - 12px) / 4);
              border-radius: 99px;
              background: radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.14) 62%, rgba(56, 189, 248, 0.24) 100%);
