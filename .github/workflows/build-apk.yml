                          ShizukuEngine.saveToggleMemory(this@MainActivity, "game_space_watcher", true)
                          startService(Intent(this@MainActivity, BangGameSidebarService::class.java).apply {
                              action = "ACTION_WATCHER"
                          })
                          JSONObject().apply {
                              put("ok", true)
                              put("msg", "Đã bật Canh gác Game Space 24/7! Mở Game từ màn hình chính cũng tự động có Cục tròn & Tối ưu.")
                          }.toString()
                      } catch (e: Throwable) {
