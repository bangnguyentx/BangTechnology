name: Build BangOptimize APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Generate BangOptimize v9.0 Universal Liquid Glass Project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/aidl/com/bangtech/optimize
          mkdir -p app/src/main/java/com/bangtech/optimize

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "BangOptimize"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bangtech.optimize"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bangtech.optimize"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 90
                  versionName = "9.0 Liquid Glass"
              }

              buildFeatures {
                  aidl = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="BangOptimize"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RealtimeRamService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="BangOptimize Realtime RAM Monitor" />
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # 6. IShellService.aidl
          cat << 'EOF' > app/src/main/aidl/com/bangtech/optimize/IShellService.aidl
          package com.bangtech.optimize;

          interface IShellService {
              void destroy();
              String runCommand(String cmd);
          }
          EOF

          # 7. ShellUserService.kt (Tích hợp bộ lọc chặn tuyệt đối các lệnh nguy hiểm gây sập nguồn)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/ShellUserService.kt
          package com.bangtech.optimize

          import java.io.BufferedReader
          import java.io.InputStreamReader
          import org.json.JSONObject
          import kotlin.system.exitProcess

          class ShellUserService : IShellService.Stub() {
              override fun destroy() {
                  exitProcess(0)
              }

              override fun runCommand(cmd: String): String {
                  // Chặn cứng ở tầng dịch vụ nếu có bất kỳ lệnh nào cố tình bật ANGLE hoặc Cached Freezer gây lỗi
                  if (cmd.contains("angle_gl_driver_all_angle 1") || cmd.contains("cached_apps_freezer enabled")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Blocked by Universal Safety Guard")
                      }.toString()
                  }
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText().trim()
                      val code = process.waitFor()
                      JSONObject().apply {
                          put("exitCode", code)
                          put("out", out)
                          put("err", err)
                      }.toString()
                  } catch (e: Exception) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", e.message ?: "Unknown error")
                      }.toString()
                  }
              }
          }
          EOF

          # 8. RealtimeRamService.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/RealtimeRamService.kt
          package com.bangtech.optimize

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import androidx.core.app.NotificationCompat

          class RealtimeRamService : Service() {
              private val handler = Handler(Looper.getMainLooper())
              private var targetThresholdMb = 4800L
              private var autoCleanEnabled = true
              private val channelId = "bang_realtime_ram_channel"

              private val updateRunnable = object : Runnable {
                  override fun run() {
                      updateNotification()
                      handler.postDelayed(this, 4000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  val channel = NotificationChannel(
                      channelId,
                      "BangOptimize Realtime RAM",
                      NotificationManager.IMPORTANCE_LOW
                  ).apply { setShowBadge(false) }
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  val notif = buildNotification(0, 0)
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1001, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1001, notif)
                  }
                  handler.post(updateRunnable)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  intent?.getLongExtra("threshold_mb", -1L)?.let {
                      if (it > 0) targetThresholdMb = it
                  }
                  if (intent?.hasExtra("auto_clean") == true) {
                      autoCleanEnabled = intent.getBooleanExtra("auto_clean", true)
                  }
                  if (intent?.action == "ACTION_CLEAN_NOW") {
                      Thread {
                          MainActivity.runShizukuGlobal("am kill-all && pm trim-caches 999G")
                          handler.post { updateNotification() }
                      }.start()
                  }
                  return START_STICKY
              }

              private fun updateNotification() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memInfo = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(memInfo)
                  val totalMb = memInfo.totalMem / (1024 * 1024)
                  val usedMb = (memInfo.totalMem - memInfo.availMem) / (1024 * 1024)

                  if (autoCleanEnabled && usedMb >= targetThresholdMb) {
                      Thread {
                          MainActivity.runShizukuGlobal("am kill-all && pm trim-caches 999G")
                      }.start()
                  }
                  getSystemService(NotificationManager::class.java)
                      .notify(1001, buildNotification(usedMb, totalMb))
              }

              private fun buildNotification(usedMb: Long, totalMb: Long): Notification {
                  val openIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val cleanIntent = PendingIntent.getService(
                      this, 1,
                      Intent(this, RealtimeRamService::class.java).apply { action = "ACTION_CLEAN_NOW" },
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .setContentTitle("BangOptimize • Realtime RAM • vừa xong")
                      .setContentText("RAM: $usedMb MB / $totalMb MB (Mốc: $targetThresholdMb MB)")
                      .setContentIntent(openIntent)
                      .addAction(android.R.drawable.ic_menu_delete, "Dọn Ngay", cleanIntent)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
              }

              override fun onDestroy() {
                  handler.removeCallbacks(updateRunnable)
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 9. MainActivity.kt (Tự động xóa cờ lỗi khi kết nối + Haptic Feedback + Đa luồng 0ms)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/MainActivity.kt
          package com.bangtech.optimize

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.ActivityManager
          import android.content.*
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.View
          import android.webkit.*
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import rikka.shizuku.Shizuku
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              companion object {
                  @Volatile
                  var shellService: IShellService? = null

                  fun runShizukuGlobal(cmd: String): String {
                      return try {
                          shellService?.runCommand(cmd) ?: """{"exitCode":-2,"out":"","err":"Chưa kết nối Shizuku"}"""
                      } catch (e: Exception) {
                          """{"exitCode":-1,"out":"","err":"${e.message}"}"""
                      }
                  }
              }

              private lateinit var webView: WebView
              private val bgExecutor = Executors.newCachedThreadPool()
              private val mainHandler = Handler(Looper.getMainLooper())
              private var volDownStartTime = 0L
              private var maxSupportedHz = 60

              private val userServiceArgs = Shizuku.UserServiceArgs(
                  ComponentName("com.bangtech.optimize", ShellUserService::class.java.name)
              ).daemon(false).processNameSuffix("bang_shell").debuggable(false).version(90)

              private val serviceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      shellService = IShellService.Stub.asInterface(binder)
                      // Tự động gỡ bỏ mọi cờ nguy hiểm tồn đọng ngay khi kết nối Shizuku
                      bgExecutor.execute {
                          runShizukuGlobal("settings delete global angle_gl_driver_all_angle; settings delete global cached_apps_freezer")
                      }
                      mainHandler.post {
                          injectRealHardwareData(isColdStart = false)
                      }
                  }
                  override fun onServiceDisconnected(name: ComponentName?) {
                      shellService = null
                      mainHandler.post {
                          notifyShizukuStatusToWeb("DISCONNECTED", "Kết nối Shizuku bị ngắt")
                      }
                  }
              }

              private val permissionListener = Shizuku.OnRequestPermissionResultListener { _, grantResult ->
                  if (grantResult == PackageManager.PERMISSION_GRANTED) {
                      bindShellService()
                  } else {
                      notifyShizukuStatusToWeb("NOT_AUTHORIZED", "Chưa cấp quyền cho BangOptimize trong Shizuku.")
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#08090D")
                  window.navigationBarColor = Color.parseColor("#08090D")
                  Shizuku.addRequestPermissionResultListener(permissionListener)

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1002)
                      }
                  }

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#08090D"))
                      setLayerType(View.LAYER_TYPE_HARDWARE, null)
                      isVerticalScrollBarEnabled = false
                      overScrollMode = View.OVER_SCROLL_NEVER
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      settings.cacheMode = WebSettings.LOAD_NO_CACHE
                      addJavascriptInterface(BangJsBridge(), "BangBridge")
                      webViewClient = object : WebViewClient() {
                          override fun onPageFinished(view: WebView?, url: String?) {
                              performColdStartShizukuScan()
                              injectRealHardwareData(isColdStart = true)
                          }
                      }
                  }
                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/BangOptimize.html")

                  try {
                      startForegroundService(Intent(this, RealtimeRamService::class.java))
                  } catch (_: Exception) {}
              }

              private fun performColdStartShizukuScan() {
                  try {
                      if (!Shizuku.pingBinder()) {
                          notifyShizukuStatusToWeb("NOT_RUNNING", "Dịch vụ Shizuku chưa chạy trên thiết bị.")
                          return
                      }
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          notifyShizukuStatusToWeb("NOT_AUTHORIZED", "BangOptimize chưa được bật trong danh sách cấp quyền của Shizuku.")
                      } else {
                          bindShellService()
                          notifyShizukuStatusToWeb("READY", "Shizuku UID 2000 Shell đã sẵn sàng")
                      }
                  } catch (e: Exception) {
                      notifyShizukuStatusToWeb("ERROR", e.message ?: "Lỗi kiểm tra Shizuku")
                  }
              }

              private fun notifyShizukuStatusToWeb(state: String, detail: String) {
                  val obj = JSONObject().apply {
                      put("state", state)
                      put("detail", detail)
                  }
                  mainHandler.post {
                      webView.evaluateJavascript("window.onShizukuDiagnostic && window.onShizukuDiagnostic($obj);", null)
                  }
              }

              private fun bindShellService() {
                  try {
                      Shizuku.bindUserService(userServiceArgs, serviceConnection)
                  } catch (_: Exception) {}
              }

              private fun injectRealHardwareData(isColdStart: Boolean) {
                  bgExecutor.execute {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                      val totalMb = mem.totalMem / (1024 * 1024)
                      val usedMb = (mem.totalMem - mem.availMem) / (1024 * 1024)
                      val batteryIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val tempC = (batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 335) ?: 335) / 10.0
                      val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, 75) ?: 75
                      val plugged = batteryIntent?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0

                      val dm = DisplayMetrics()
                      @Suppress("DEPRECATION")
                      val display: Display = windowManager.defaultDisplay
                      @Suppress("DEPRECATION")
                      display.getRealMetrics(dm)
                      @Suppress("DEPRECATION")
                      val currentHz = display.refreshRate.toInt()

                      var highestHz = currentHz
                      if (Build.VERSION.SDK_INT >= 23) {
                          display.supportedModes?.forEach { mode ->
                              if (mode.refreshRate.toInt() > highestHz) {
                                  highestHz = mode.refreshRate.toInt()
                              }
                          }
                      }
                      maxSupportedHz = highestHz

                      val socModel = if (Build.VERSION.SDK_INT >= 31 && Build.SOC_MODEL != Build.UNKNOWN) {
                          Build.SOC_MODEL
                      } else {
                          Build.HARDWARE.uppercase()
                      }

                      val shizukuState = when {
                          !Shizuku.pingBinder() -> "NOT_RUNNING"
                          Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED -> "NOT_AUTHORIZED"
                          shellService != null -> "READY"
                          else -> "BINDING"
                      }

                      val payload = JSONObject().apply {
                          put("manufacturer", Build.MANUFACTURER)
                          put("model", "${Build.MANUFACTURER} ${Build.MODEL}")
                          put("rawModel", Build.MODEL)
                          put("soc", socModel)
                          put("board", Build.BOARD)
                          put("android", "Android ${Build.VERSION.RELEASE}")
                          put("totalRamMb", totalMb)
                          put("usedRamMb", usedMb)
                          put("tempC", tempC)
                          put("battery", level)
                          put("powerSource", if (plugged > 0) "Sạc nhanh" else "Pin")
                          put("widthPx", dm.widthPixels)
                          put("heightPx", dm.heightPixels)
                          put("dpi", dm.densityDpi)
                          put("hz", currentHz)
                          put("maxHz", maxSupportedHz)
                          put("shizukuState", shizukuState)
                          put("shizukuReady", shellService != null)
                          put("isColdStart", isColdStart)
                      }
                      mainHandler.post {
                          webView.evaluateJavascript("window.receiveNativeDeviceInfo && window.receiveNativeDeviceInfo($payload);", null)
                      }
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && volDownStartTime == 0L) {
                      volDownStartTime = SystemClock.elapsedRealtime()
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && volDownStartTime > 0L) {
                      val heldMs = SystemClock.elapsedRealtime() - volDownStartTime
                      volDownStartTime = 0L
                      if (heldMs >= 3000L) {
                          bgExecutor.execute {
                              runShizukuGlobal("wm size reset && wm density reset && settings delete system peak_refresh_rate && settings delete system min_refresh_rate")
                              mainHandler.post {
                                  Toast.makeText(this, "BangOptimize: Đã khôi phục màn hình gốc!", Toast.LENGTH_LONG).show()
                              }
                          }
                          return true
                      }
                  }
                  return super.onKeyUp(keyCode, event)
              }

              inner class BangJsBridge {

                  @JavascriptInterface
                  fun triggerHaptic() {
                      mainHandler.post {
                          webView.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                      }
                  }

                  @JavascriptInterface
                  fun execVerifiedAsync(itemId: String, targetOn: Boolean, cmd: String, verifyCmd: String, expectedVal: String, minRequiredHz: Int) {
                      bgExecutor.execute {
                          val res = JSONObject().apply {
                              put("itemId", itemId)
                              put("targetOn", targetOn)
                          }

                          if (!Shizuku.pingBinder()) {
                              res.put("ok", false)
                              res.put("reason", "Chưa khởi động dịch vụ Shizuku")
                              res.put("needAuth", true)
                              postResult(res)
                              return@execute
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              res.put("ok", false)
                              res.put("reason", "Chưa cấp quyền cho BangOptimize trong Shizuku")
                              res.put("needAuth", true)
                              postResult(res)
                              return@execute
                          }
                          if (shellService == null) {
                              bindShellService()
                              SystemClock.sleep(220)
                              if (shellService == null) {
                                  res.put("ok", false)
                                  res.put("reason", "Đang kết nối Shizuku UID 2000, thử lại sau 1 giây")
                                  postResult(res)
                                  return@execute
                              }
                          }

                          if (targetOn && minRequiredHz > 0 && maxSupportedHz < minRequiredHz) {
                              res.put("ok", false)
                              res.put("reason", "Màn hình phần cứng hỗ trợ tối đa ${maxSupportedHz}Hz (Không hỗ trợ ${minRequiredHz}Hz)")
                              postResult(res)
                              return@execute
                          }

                          val execJson = JSONObject(runShizukuGlobal(cmd))
                          val exitCode = execJson.optInt("exitCode", -1)
                          val out = execJson.optString("out", "")
                          val err = execJson.optString("err", "")

                          if (exitCode != 0 || err.contains("SecurityException", true) || err.contains("Permission denial", true) || err.contains("Unknown package", true)) {
                              val cleanErr = when {
                                  err.contains("Unknown package", true) || err.contains("not found", true) -> "Dòng máy này không có gói dịch vụ trên"
                                  err.contains("SecurityException", true) || err.contains("Permission denial", true) -> "ROM chặn quyền ghi thông số này"
                                  err.isNotEmpty() -> err.lines().firstOrNull() ?: "Mã lỗi $exitCode"
                                  else -> "Không tương thích trên thiết bị này (Mã $exitCode)"
                              }
                              res.put("ok", false)
                              res.put("reason", cleanErr)
                              res.put("cmd", cmd)
                              postResult(res)
                              return@execute
                          }

                          if (targetOn && verifyCmd.isNotEmpty()) {
                              val verJson = JSONObject(runShizukuGlobal(verifyCmd))
                              val actualVal = verJson.optString("out", "").trim()
                              if (expectedVal.isNotEmpty() && !actualVal.contains(expectedVal, ignoreCase = true)) {
                                  res.put("ok", false)
                                  res.put("reason", "Hệ điều hành từ chối lưu (Giá trị thực: ${if (actualVal.isEmpty() || actualVal == "null") "Mặc định" else actualVal})")
                                  res.put("cmd", cmd)
                                  postResult(res)
                                  return@execute
                              }
                              res.put("verifiedValue", if (actualVal.isEmpty() || actualVal == "null") expectedVal else actualVal)
                          }

                          res.put("ok", true)
                          res.put("cmd", cmd)
                          res.put("out", out)
                          postResult(res)
                      }
                  }

                  private fun postResult(res: JSONObject) {
                      mainHandler.post {
                          webView.evaluateJavascript("window.onSwitchVerifiedResult && window.onSwitchVerifiedResult($res);", null)
                      }
                  }

                  @JavascriptInterface
                  fun requestShizuku() {
                      mainHandler.post {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  openShizukuApp()
                                  return@post
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  bindShellService()
                                  notifyShizukuStatusToWeb("READY", "Đã kết nối Shizuku UID 2000")
                              } else {
                                  Shizuku.requestPermission(1001)
                              }
                          } catch (_: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun openShizukuApp() {
                      mainHandler.post {
                          try {
                              val launchIntent = packageManager.getLaunchIntentForPackage("moe.shizuku.privileged.api")
                              if (launchIntent != null) {
                                  startActivity(launchIntent)
                              } else {
                                  Toast.makeText(this@MainActivity, "Hãy mở ứng dụng Shizuku trên máy của bạn", Toast.LENGTH_LONG).show()
                              }
                          } catch (_: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun refreshHardware() {
                      injectRealHardwareData(isColdStart = false)
                  }

                  @JavascriptInterface
                  fun setRamThreshold(mb: Long) {
                      try {
                          startForegroundService(Intent(this@MainActivity, RealtimeRamService::class.java).apply {
                              putExtra("threshold_mb", mb)
                          })
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface
                  fun setAutoCleanRam(enabled: Boolean) {
                      try {
                          startForegroundService(Intent(this@MainActivity, RealtimeRamService::class.java).apply {
                              putExtra("auto_clean", enabled)
                          })
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface
                  fun syncSystemStatesAsync() {
                      bgExecutor.execute {
                          val res = JSONObject()
                          if (!Shizuku.pingBinder() || Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED || shellService == null) {
                              res.put("connected", false)
                              mainHandler.post {
                                  webView.evaluateJavascript("window.onSystemStatesSynced && window.onSystemStatesSynced($res);", null)
                              }
                              return@execute
                          }
                          try {
                              val script = """
                                  echo "perf=$(settings get system POWER_PERFORMANCE_MODE_OPEN)"
                                  echo "speed=$(settings get secure speed_mode)"
                                  echo "peak_hz=$(settings get system peak_refresh_rate)"
                                  echo "long_press=$(settings get secure long_press_timeout)"
                                  echo "anim=$(settings get global window_animation_scale)"
                                  echo "power_mode=$(settings get system power_mode)"
                                  echo "tier=$(settings get system deviceLevelList)"
                              """.trimIndent()
                              val rawJson = JSONObject(runShizukuGlobal(script))
                              val out = rawJson.optString("out", "")
                              res.put("connected", true)
                              out.lines().forEach { line ->
                                  val parts = line.split("=", limit = 2)
                                  if (parts.size == 2) {
                                      res.put(parts[0].trim(), parts[1].trim())
                                  }
                              }
                          } catch (_: Exception) {
                              res.put("connected", false)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.onSystemStatesSynced && window.onSystemStatesSynced($res);", null)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun scanAppsAsync() {
                      bgExecutor.execute {
                          val arr = JSONArray()
                          try {
                              val pm = packageManager
                              val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                              val runningSet = HashSet<String>()
                              am.runningAppProcesses?.forEach { proc ->
                                  proc.pkgList?.forEach { runningSet.add(it) }
                              }
                              val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                              for (app in apps) {
                                  val label = pm.getApplicationLabel(app).toString()
                                  val pkg = app.packageName
                                  val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                                  val isRunning = runningSet.contains(pkg)
                                  if (!isSystem || pkg.contains("miui") || pkg.contains("xiaomi") || pkg.contains("camera") || pkg.contains("google") || pkg.contains("samsung") || pkg.contains("oppo")) {
                                      val obj = JSONObject().apply {
                                          put("name", label)
                                          put("pkg", pkg)
                                          put("running", isRunning)
                                          put("system", isSystem)
                                      }
                                      arr.put(obj)
                                  }
                              }
                          } catch (_: Exception) {}
                          mainHandler.post {
                              webView.evaluateJavascript("window.onAppsScanned && window.onAppsScanned($arr);", null)
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permissionListener)
                  bgExecutor.shutdownNow()
                  super.onDestroy()
              }
          }
