          <body>

          <div id="toast">⚡ Đã đồng bộ trạng thái thực tế!</div>

          <!-- Modal Quản Lý App Đã Tắt -->
          <div id="frozenModal" class="modal-backdrop" onclick="closeFrozenModal()">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div class="sec-head">
                <span class="sec-title">📦 Quản Lý App Đã Tắt / Đóng Băng</span>
                <button class="btn-outline-sm pressable" onclick="closeFrozenModal()">Đóng ✕</button>
              </div>
              <p style="font-size:11px; color:var(--text-sub); margin-bottom:10px;">
                Danh sách các dịch vụ ngầm đang bị đóng băng hoặc hạn chế chạy nền qua Shizuku. Bạn có thể bật lại từng gói hoặc khôi phục toàn bộ:
              </p>
              <div id="frozenListBox"></div>
              <button class="btn-full btn-green pressable" onclick="restoreAllFrozenApps()">
                🛠️ BẬT LẠI TOÀN BỘ APP ĐÃ TẮT (RETURN ALL VALUE)
              </button>
            </div>
          </div>

          <!-- Dynamic Island HUD -->
          <div id="islandWrap" class="island-wrap">
