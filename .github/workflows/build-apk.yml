              </section>

              <!-- Lá chắn Anti-OTG Bootloop Shield -->
              <section class="obsidian-glass" style="border-color: rgba(16, 185, 129, 0.35);">
                <div class="section-head-row">
                  <span class="section-title" style="color:#34D399;">Lá chắn Anti-OTG Bootloop Shield</span>
