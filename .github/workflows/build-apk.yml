                    <path d="M25 14H29V24H25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
                    <rect x="11" y="12" width="14" height="15" rx="2.5" fill="rgba(15,41,58,0.85)" stroke="#38BDF8" stroke-width="1.8"/>
                    <circle cx="18" cy="19.5" r="4.5" fill="#08121C" stroke="#10B981" stroke-width="1.4"/>
                    <path d="M18.8 16.5L16 20H18.2L17.4 22.8L20.2 19.2H18L18.8 16.5Z" fill="#FFFFFF"/>
                  </svg>
                </div>
                <div style="min-width:0;">
