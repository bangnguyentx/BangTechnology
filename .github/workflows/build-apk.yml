              private fun fixedDp(v: Int): Int {
                  val dm = resources.displayMetrics
                  val shortSidePx = min(dm.widthPixels, dm.heightPixels).toFloat()
                  // Luôn tính tỷ lệ theo chuẩn khung ngang 392dp bất kể hệ thống bị ép về 720p hay 540p
                  val scale = (shortSidePx / 392f).coerceIn(1.2f, 3.2f)
                  return (v * scale).roundToInt()
              }

              private fun fixedSp(v: Float): Float {
