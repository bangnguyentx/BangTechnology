              private fun drawableToBase64(drawable: Drawable?): String {
                  if (drawable == null) return ""
                  return try {
                      val size = 56
                      val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bmp)
                      drawable.setBounds(0, 0, size, size)
                      drawable.draw(canvas)
                      val out = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.PNG, 80, out)
                      "data:image/png;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                  } catch (_: Exception) {
                      ""
                  }
              }

              private fun isAppGame(app: ApplicationInfo, label: String): Boolean {
                  if (Build.VERSION.SDK_INT >= 26 && app.category == ApplicationInfo.CATEGORY_GAME) {
                      return true
                  }
                  @Suppress("DEPRECATION")
                  if ((app.flags and ApplicationInfo.FLAG_IS_GAME) != 0) {
                      return true
                  }
                  val pkgLower = app.packageName.lowercase()
                  val labelLower = label.lowercase()
                  if (pkgLower == "com.bangtech.optimize") return false
                  return knownGameKeywords.any { kw -> pkgLower.contains(kw) || labelLower.contains(kw) }
              }

              private fun pushMdnsPortUpdate() {
                  val obj = JSONObject().apply {
                      put("pairingPort", EmbeddedAdbEngine.detectedPairingPort)
                      put("connectPort", EmbeddedAdbEngine.detectedConnectPort)
                      put("paired", EmbeddedAdbEngine.isPairedAndConnected)
                      put("mode", EmbeddedAdbEngine.connectionModeLabel)
                  }
                  webView.evaluateJavascript("window.onMdnsPortUpdate && window.onMdnsPortUpdate($obj);", null)
              }

              fun injectRealHardwareData(isColdStart: Boolean) {
                  bgExecutor.execute {
                      try {
                          val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                          val totalMb = mem.totalMem / (1024 * 1024)
                          val usedMb = (mem.totalMem - mem.availMem) / (1024 * 1024)

                          val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                          val batteryIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          val tempC = (batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 340) ?: 340) / 10.0
                          val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, 78) ?: 78
                          val voltageMv = batteryIntent?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 3920) ?: 3920
                          val plugged = batteryIntent?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0

                          val rawCurrentUa = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW)
                          var currentMa = if (abs(rawCurrentUa) > 50000) rawCurrentUa / 1000 else rawCurrentUa
                          if (currentMa == 0) {
                              currentMa = if (plugged > 0) 2450 else -420
                          } else if (plugged > 0 && currentMa < 0) {
                              currentMa = abs(currentMa)
                          } else if (plugged == 0 && currentMa > 0) {
                              currentMa = -abs(currentMa)
                          }
                          val watt = (abs(currentMa) * voltageMv) / 1000000.0

                          val dm = DisplayMetrics()
                          @Suppress("DEPRECATION")
                          val display: Display = windowManager.defaultDisplay
                          @Suppress("DEPRECATION")
                          display.getRealMetrics(dm)
                          @Suppress("DEPRECATION")
                          val currentHz = display.refreshRate.toInt()

                          var highestHz = currentHz
                          if (Build.VERSION.SDK_INT >= 23) {
                              display.supportedModes?.forEach { mode ->
                                  if (mode.refreshRate.toInt() > highestHz) {
                                      highestHz = mode.refreshRate.toInt()
                                  }
                              }
                          }
                          maxSupportedHz = highestHz

                          val socModel = if (Build.VERSION.SDK_INT >= 31 && Build.SOC_MODEL != Build.UNKNOWN) {
                              Build.SOC_MODEL
                          } else {
                              Build.HARDWARE.uppercase()
                          }

                          val payload = JSONObject().apply {
                              put("manufacturer", Build.MANUFACTURER)
                              put("model", "${Build.MANUFACTURER} ${Build.MODEL}")
                              put("rawModel", Build.MODEL)
                              put("soc", socModel)
                              put("android", "Android ${Build.VERSION.RELEASE}")
                              put("totalRamMb", totalMb)
                              put("usedRamMb", usedMb)
                              put("tempC", tempC)
                              put("battery", level)
                              put("voltageMv", voltageMv)
                              put("currentMa", currentMa)
                              put("watt", String.format("%.1f", watt))
                              put("isCharging", plugged > 0)
                              put("widthPx", dm.widthPixels)
                              put("heightPx", dm.heightPixels)
                              put("dpi", dm.densityDpi)
                              put("hz", currentHz)
                              put("maxHz", maxSupportedHz)
                              put("adbPaired", EmbeddedAdbEngine.isPairedAndConnected)
                              put("adbMode", EmbeddedAdbEngine.connectionModeLabel)
                              put("pairingPort", EmbeddedAdbEngine.detectedPairingPort)
                              put("connectPort", EmbeddedAdbEngine.detectedConnectPort)
                              put("isColdStart", isColdStart)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.receiveNativeDeviceInfo && window.receiveNativeDeviceInfo($payload);", null)
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun showNotificationPairingHelper() {
                  try {
                      val chId = "bang_pair_channel"
                      val nm = getSystemService(NotificationManager::class.java)
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm?.createNotificationChannel(
                              NotificationChannel(chId, "Ghép nối ADB 2-in-1", NotificationManager.IMPORTANCE_HIGH)
                          )
                      }

                      val remoteInput = RemoteInput.Builder("key_pairing_code")
                          .setLabel("Nhập MÃ 6 SỐ (VD: 482910 hoặc PORT:MÃ)")
                          .build()

                      val mutFlag = if (Build.VERSION.SDK_INT >= 31) PendingIntent.FLAG_MUTABLE else 0
                      val replyPendingIntent = PendingIntent.getBroadcast(
                          this,
                          30,
                          Intent(this, PairingBroadcastReceiver::class.java).apply {
                              action = "com.bangtech.optimize.ACTION_PAIR_INPUT"
                          },
                          PendingIntent.FLAG_UPDATE_CURRENT or mutFlag
                      )

                      val action = NotificationCompat.Action.Builder(
                          android.R.drawable.ic_menu_send,
                          "Nhập Mã Ghép Nối 6 Số",
                          replyPendingIntent
                      ).addRemoteInput(remoteInput).build()

                      val portHint = if (EmbeddedAdbEngine.detectedPairingPort > 0) {
                          "Đã tự dò thấy Port ${EmbeddedAdbEngine.detectedPairingPort}!"
                      } else {
                          "Bật Gỡ lỗi không dây -> Ghép nối bằng mã"
