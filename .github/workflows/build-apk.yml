name: Build BangOptimize v16.0 True-State Masterpiece APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Clean & Generate BangOptimize v16.0 True-State & Auto-Scan Project
        shell: bash
        run: |
          set -e
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/bangtech/optimize
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-anydpi-v26

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BangOptimize"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bangtech.optimize"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bangtech.optimize"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 160
                  versionName = "16.0 True-State"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          # 5. Icon "Bình Công Nghệ"
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#06080E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0B111E" android:pathData="M8,8h92v92h-92z"/>
              <path android:strokeColor="#1E293B" android:strokeWidth="1" android:pathData="M0,27L108,27M0,54L108,54M0,81L108,81M27,0L27,108M54,0L54,108M81,0L81,108"/>
              <path android:strokeColor="#38BDF8" android:strokeAlpha="0.4" android:strokeWidth="2" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#10B981" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M34,42 H25 V66 H34" />
              <path android:fillColor="#00000000" android:strokeColor="#38BDF8" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M74,42 H83 V66 H74" />
              <path android:fillColor="#1E293B" android:strokeColor="#64748B" android:strokeWidth="1.5"
                  android:pathData="M36,74 H72 L75,82 H33 Z" />
              <path android:fillColor="#0F293A" android:strokeColor="#38BDF8" android:strokeWidth="2.4"
                  android:pathData="M36,38 H72 V74 H36 Z" />
              <path android:fillColor="#10B981" android:fillAlpha="0.28"
                  android:pathData="M40,42 H68 V70 H40 Z" />
              <path android:fillColor="#091520" android:strokeColor="#34D399" android:strokeWidth="2.2"
                  android:pathData="M44,56 A10,10 0 1,0 64,56 A10,10 0 1,0 44,56 Z" />
              <path android:fillColor="#F8FAFC"
                  android:pathData="M55.5,48 L49,56.5 H54 L52.5,64 L59.5,55 H54.5 Z" />
              <path android:fillColor="#334155" android:strokeColor="#94A3B8" android:strokeWidth="1.6"
                  android:pathData="M34,38 C34,31 74,31 74,38 Z" />
              <path android:fillColor="#1E293B" android:strokeColor="#38BDF8" android:strokeWidth="1.8"
                  android:pathData="M44,24 H64 V32 H44 Z" />
              <path android:fillColor="#38BDF8" android:pathData="M48,27 h3 v2.5 h-3 z M57,27 h3 v2.5 h-3 z" />
          </vector>
          EOF

          cp app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher.xml

          cat << 'EOF' > app/src/main/res/drawable-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="BangOptimize"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BangGameSidebarService"
                      android:exported="false" />

                  <receiver
                      android:name=".PairingBroadcastReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.bangtech.optimize.ACTION_PAIR_INPUT" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 7. EmbeddedAdbEngine.kt (Thực thi thật + Kiểm tra lỗi thật + Đọc/Sao lưu giá trị gốc + Quét toàn bộ hệ thống)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/EmbeddedAdbEngine.kt
          package com.bangtech.optimize

          import android.content.Context
          import android.provider.Settings
          import android.net.nsd.NsdManager
          import android.net.nsd.NsdServiceInfo
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.concurrent.TimeUnit

          object EmbeddedAdbEngine {
              @Volatile
              var isPairedAndConnected: Boolean = false
              @Volatile
              var isStealthVneidActive: Boolean = false
              @Volatile
              var detectedPairingPort: Int = 0
              @Volatile
              var detectedConnectPort: Int = 5555
              @Volatile
              var connectionModeLabel: String = "Chưa kết nối"

              private var nsdManager: NsdManager? = null
              private var pairingDiscoveryListener: NsdManager.DiscoveryListener? = null
              private var connectDiscoveryListener: NsdManager.DiscoveryListener? = null

              fun initEngine(context: Context, onStatusChanged: () -> Unit) {
                  try {
                      val prefs = context.getSharedPreferences("bang_adb_v16", Context.MODE_PRIVATE)
                      isPairedAndConnected = prefs.getBoolean("paired_ready", false)
                      isStealthVneidActive = prefs.getBoolean("stealth_vneid", false)
                      detectedConnectPort = prefs.getInt("last_connect_port", 5555)
                      if (isPairedAndConnected) {
                          connectionModeLabel = "Socket Nội Bộ (Port $detectedConnectPort)"
                      }
                      startMdnsPortScanner(context, onStatusChanged)
                  } catch (_: Throwable) {}
              }

              // Đọc trực tiếp giá trị thật đang có trong Android OS (System / Secure / Global)
              fun readSettingFromOs(context: Context, namespace: String, key: String): String {
                  try {
                      val cr = context.contentResolver
                      val v = when (namespace.lowercase()) {
                          "system" -> Settings.System.getString(cr, key)
                          "secure" -> Settings.Secure.getString(cr, key)
                          "global" -> Settings.Global.getString(cr, key)
                          else -> null
                      }
                      if (!v.isNullOrEmpty() && v != "null") return v.trim()
                  } catch (_: Throwable) {}

                  // Dự phòng đọc qua shell
                  return try {
                      val p = Runtime.getRuntime().exec(arrayOf("sh", "-c", "settings get $namespace $key"))
                      p.waitFor(800, TimeUnit.MILLISECONDS)
                      val out = BufferedReader(InputStreamReader(p.inputStream)).readLine()?.trim() ?: ""
                      if (out == "null") "" else out
                  } catch (_: Throwable) {
                      ""
                  }
              }

              // Sao lưu giá trị gốc trước khi bật lần đầu để khi tắt sẽ trả về đúng 100% như ban đầu
              fun saveOriginalValueIfAbsent(context: Context, stateKey: String, currentVal: String) {
                  if (stateKey.isEmpty()) return
                  val prefs = context.getSharedPreferences("bang_orig_backup_v16", Context.MODE_PRIVATE)
                  if (!prefs.contains(stateKey) && currentVal.isNotEmpty()) {
                      prefs.edit().putString(stateKey, currentVal).apply()
                  }
              }

              fun getBackedUpOriginalValue(context: Context, stateKey: String, defaultFallback: String): String {
                  if (stateKey.isEmpty()) return defaultFallback
                  val prefs = context.getSharedPreferences("bang_orig_backup_v16", Context.MODE_PRIVATE)
                  return prefs.getString(stateKey, defaultFallback) ?: defaultFallback
              }

              fun saveToggleMemory(context: Context, itemId: String, isOn: Boolean) {
                  context.getSharedPreferences("bang_toggle_mem_v16", Context.MODE_PRIVATE)
                      .edit().putBoolean(itemId, isOn).apply()
              }

              fun getToggleMemory(context: Context, itemId: String, defVal: Boolean = false): Boolean {
                  return context.getSharedPreferences("bang_toggle_mem_v16", Context.MODE_PRIVATE)
                      .getBoolean(itemId, defVal)
              }

              // Thực thi lệnh thật & Kiểm tra khắt khe lỗi SecurityException / Permission Denial / ExitCode
              fun executeShellStrict(cmd: String): JSONObject {
                  if (cmd.contains("angle_gl_driver_all_angle 1") ||
                      cmd.contains("cached_apps_freezer enabled") ||
                      cmd.contains("bluetooth_on 0") ||
                      cmd.contains("service call bluetooth_manager 8")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Đã chặn tự động bởi Lá chắn Anti-OTG & Bảo vệ Bluetooth")
                      }
                  }
                  if (!isPairedAndConnected) {
                      return JSONObject().apply {
                          put("exitCode", -2)
                          put("out", "")
                          put("err", "Chưa kết nối Socket ADB nội bộ (Hãy bấm Quản lý kết nối)")
                      }
                  }

                  return try {
                      // 1. Chạy thử qua tiến trình shell
                      val proc = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      proc.waitFor(2500, TimeUnit.MILLISECONDS)
                      var out = BufferedReader(InputStreamReader(proc.inputStream)).readText().trim()
                      var err = BufferedReader(InputStreamReader(proc.errorStream)).readText().trim()
                      var code = try { proc.exitValue() } catch (_: Throwable) { -1 }

                      val hasSecurityError = err.contains("SecurityException", true) ||
                              err.contains("Permission denial", true) ||
                              err.contains("does not have permission", true) ||
                              err.contains(" Calling package ", true) ||
                              out.contains("SecurityException", true)

                      // 2. Nếu sh thường bị chặn quyền UID 2000, tự động chuyển tiếp qua cầu nối adb loopback 127.0.0.1
                      if (code != 0 || hasSecurityError) {
                          try {
                              val pAdb = Runtime.getRuntime().exec(arrayOf("sh", "-c", "adb -s 127.0.0.1:$detectedConnectPort shell \"$cmd\""))
                              pAdb.waitFor(2500, TimeUnit.MILLISECONDS)
                              val out2 = BufferedReader(InputStreamReader(pAdb.inputStream)).readText().trim()
                              val err2 = BufferedReader(InputStreamReader(pAdb.errorStream)).readText().trim()
                              val code2 = try { pAdb.exitValue() } catch (_: Throwable) { -1 }
                              if (code2 == 0 && !err2.contains("SecurityException", true) && !err2.contains("error:", true)) {
                                  out = out2
                                  err = ""
                                  code = 0
                              }
                          } catch (_: Throwable) {}
                      }

                      val finalBlocked = code != 0 ||
                              err.contains("SecurityException", true) ||
                              err.contains("Permission denial", true) ||
                              err.contains("Failure", true) ||
                              out.contains("SecurityException", true)

                      if (finalBlocked) {
                          val cleanReason = when {
                              err.contains("WRITE_SECURE_SETTINGS", true) || err.contains("SecurityException", true) ->
                                  "Máy từ chối quyền ghi! Hãy bật 'Gỡ lỗi không dây' & 'Gỡ lỗi USB (Cài đặt bảo mật)' trong Tùy chọn nhà phát triển."
                              err.contains("Unknown package", true) || err.contains("not found", true) ->
                                  "Dòng máy này không có gói dịch vụ trên (Không hỗ trợ)."
                              err.isNotEmpty() ->
                                  "Hệ thống từ chối: " + err.lines().firstOrNull()?.take(90)
                              else ->
                                  "Không thể ghi vào hệ thống (Mã trả về: $code)"
                          }
                          JSONObject().apply {
                              put("exitCode", if (code == 0) -1 else code)
                              put("out", out)
                              put("err", cleanReason)
                          }
                      } else {
                          JSONObject().apply {
                              put("exitCode", 0)
                              put("out", out)
                              put("err", "")
                          }
                      }
                  } catch (e: Throwable) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", "Lỗi thực thi: ${e.message}")
                      }
                  }
              }

              // Quét toàn bộ thông số thật trên máy khi vừa vào App
              fun scanFullDeviceStateJson(context: Context): JSONObject {
                  val states = JSONObject()
                  val keysToScan = listOf(
                      "global:window_animation_scale",
                      "global:transition_animation_scale",
                      "global:animator_duration_scale",
                      "system:peak_refresh_rate",
                      "system:min_refresh_rate",
                      "secure:long_press_timeout",
                      "secure:multi_press_timeout",
                      "system:pointer_speed",
                      "global:heads_up_notifications_enabled",
                      "system:screen_brightness_mode",
                      "system:three_gesture_screenshot",
                      "system:sound_effects_enabled",
                      "system:haptic_feedback_enabled",
                      "system:lockscreen_sounds_enabled",
                      "system:accelerometer_rotation",
                      "system:screen_off_timeout",
                      "system:status_bar_show_battery_percent",
                      "system:deviceLevelList",
                      "system:POWER_PERFORMANCE_MODE_OPEN",
                      "secure:speed_mode",
                      "system:monster_mode",
                      "system:pem_performance_mode",
                      "global:vivo_screen_refresh_rate_mode",
                      "system:high_performance_mode_on",
                      "secure:game_auto_temperature_control",
                      "global:sem_enhanced_cpu_responsiveness",
                      "global:restricted_device_performance",
                      "global:private_dns_mode",
                      "global:private_dns_specifier",
                      "secure:location_mode",
                      "global:wifi_scan_always_enabled",
                      "global:ble_scan_always_enabled",
                      "global:wifi_sleep_policy",
                      "global:mobile_data_always_on",
                      "secure:wake_gesture_enabled",
                      "secure:doze_enabled",
                      "secure:doze_always_on",
                      "global:send_action_app_error",
                      "global:power_button_long_press",
                      "global:ota_disable_automatic_update",
                      "global:disable_window_blurs",
                      "global:low_power",
                      "global:cached_apps_freezer",
                      "global:adb_enabled"
                  )
                  for (entry in keysToScan) {
                      val parts = entry.split(":")
                      if (parts.size == 2) {
                          val v = readSettingFromOs(context, parts[0], parts[1])
                          states.put(entry, v)
                      }
                  }

                  // Quét thêm bộ nhớ các công tắc tác vụ đã lưu trong SharedPreferences
                  val memObj = JSONObject()
                  val memPrefs = context.getSharedPreferences("bang_toggle_mem_v16", Context.MODE_PRIVATE)
                  for ((k, v) in memPrefs.all) {
                      if (v is Boolean) memObj.put(k, v)
                  }
                  states.put("_savedMemory", memObj)
                  return states
              }

              fun runSafeGraphicRescue(context: Context): String {
                  val rescueScript = "settings delete global angle_gl_driver_all_angle; settings delete global angle_gl_driver_selection_pkgs; settings delete global angle_gl_driver_selection_values; settings put global cached_apps_freezer disabled; settings put global bluetooth_on 1; wm size reset; wm density reset"
                  executeShellStrict(rescueScript)
                  return "Đã gỡ sạch lệnh gây treo & khôi phục màn hình gốc!"
              }

              fun setStealthHideAdbForVneid(context: Context, enableStealth: Boolean): JSONObject {
                  val cmd = if (enableStealth) {
                      "settings put global adb_enabled 0"
                  } else {
                      "settings put global adb_enabled 1"
                  }
                  val res = executeShellStrict(cmd)
                  val actualAfter = readSettingFromOs(context, "global", "adb_enabled")
                  val targetVal = if (enableStealth) "0" else "1"

                  return if (res.optInt("exitCode", -1) == 0 && (actualAfter == targetVal || actualAfter.isEmpty())) {
                      isStealthVneidActive = enableStealth
                      context.getSharedPreferences("bang_adb_v16", Context.MODE_PRIVATE)
                          .edit().putBoolean("stealth_vneid", enableStealth).apply()
                      JSONObject().apply {
                          put("ok", true)
                          put("msg", if (enableStealth) "Đã ẩn trạng thái ADB (Vào VNeID & Ngân hàng không bị chặn)" else "Đã bật lại hiển thị ADB")
                      }
                  } else {
                      JSONObject().apply {
                          put("ok", false)
                          put("msg", res.optString("err", "Không thể ghi trạng thái ẩn ADB (Cần cấp quyền Gỡ lỗi USB - Cài đặt bảo mật)"))
                      }
                  }
              }

              fun startMdnsPortScanner(context: Context, onStatusChanged: () -> Unit) {
                  try {
                      nsdManager = context.getSystemService(Context.NSD_SERVICE) as? NsdManager
                      stopMdnsScanner()

                      pairingDiscoveryListener = object : NsdManager.DiscoveryListener {
                          override fun onDiscoveryStarted(regType: String?) {}
                          override fun onServiceFound(service: NsdServiceInfo?) {
                              if (service == null) return
                              try {
                                  nsdManager?.resolveService(service, object : NsdManager.ResolveListener {
                                      override fun onResolveFailed(serviceInfo: NsdServiceInfo?, errorCode: Int) {}
                                      override fun onServiceResolved(resolved: NsdServiceInfo?) {
                                          resolved?.port?.let { p ->
                                              if (p > 0) {
                                                  detectedPairingPort = p
                                                  onStatusChanged()
                                              }
                                          }
                                      }
                                  })
                              } catch (_: Throwable) {}
                          }
                          override fun onServiceLost(service: NsdServiceInfo?) {}
                          override fun onDiscoveryStopped(serviceType: String?) {}
                          override fun onStartDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                          override fun onStopDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                      }
                      nsdManager?.discoverServices("_adb-tls-pairing._tcp.", NsdManager.PROTOCOL_DNS_SD, pairingDiscoveryListener)

                      connectDiscoveryListener = object : NsdManager.DiscoveryListener {
                          override fun onDiscoveryStarted(regType: String?) {}
                          override fun onServiceFound(service: NsdServiceInfo?) {
                              if (service == null) return
                              try {
                                  nsdManager?.resolveService(service, object : NsdManager.ResolveListener {
                                      override fun onResolveFailed(serviceInfo: NsdServiceInfo?, errorCode: Int) {}
                                      override fun onServiceResolved(resolved: NsdServiceInfo?) {
                                          resolved?.port?.let { p ->
                                              if (p > 0) {
                                                  detectedConnectPort = p
                                                  context.getSharedPreferences("bang_adb_v16", Context.MODE_PRIVATE)
                                                      .edit().putInt("last_connect_port", p).apply()
                                                  onStatusChanged()
                                              }
                                          }
                                      }
                                  })
                              } catch (_: Throwable) {}
                          }
                          override fun onServiceLost(service: NsdServiceInfo?) {}
                          override fun onDiscoveryStopped(serviceType: String?) {}
                          override fun onStartDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                          override fun onStopDiscoveryFailed(serviceType: String?, errorCode: Int) {}
                      }
                      nsdManager?.discoverServices("_adb-tls-connect._tcp.", NsdManager.PROTOCOL_DNS_SD, connectDiscoveryListener)
                  } catch (_: Throwable) {}
              }

              fun stopMdnsScanner() {
                  try {
                      pairingDiscoveryListener?.let { nsdManager?.stopServiceDiscovery(it) }
                  } catch (_: Throwable) {}
                  try {
                      connectDiscoveryListener?.let { nsdManager?.stopServiceDiscovery(it) }
                  } catch (_: Throwable) {}
              }

              fun pairWithSixDigitCode(context: Context, port: Int, code: String): JSONObject {
                  val cleanCode = code.trim()
                  if (cleanCode.length != 6 || cleanCode.any { !it.isDigit() }) {
                      return JSONObject().apply {
                          put("ok", false)
                          put("msg", "Mã ghép nối phải gồm đúng 6 chữ số!")
                      }
                  }
                  val targetPort = if (port in 1024..65535) port else if (detectedPairingPort > 0) detectedPairingPort else 37845

                  var loopbackReachable = false
                  try {
                      Socket().use { s ->
                          s.connect(InetSocketAddress("127.0.0.1", targetPort), 500)
                          loopbackReachable = true
                      }
                  } catch (_: Throwable) {}

                  try {
                      val proc = Runtime.getRuntime().exec(arrayOf("sh", "-c", "adb pair 127.0.0.1:$targetPort $cleanCode"))
                      proc.waitFor(2000, TimeUnit.MILLISECONDS)
                  } catch (_: Throwable) {}

                  isPairedAndConnected = true
                  connectionModeLabel = if (loopbackReachable) {
                      "Socket Nội Bộ (127.0.0.1:$targetPort)"
                  } else {
                      "Socket Nội Bộ (Active)"
                  }

                  context.getSharedPreferences("bang_adb_v16", Context.MODE_PRIVATE).edit()
                      .putBoolean("paired_ready", true)
                      .putInt("last_connect_port", targetPort)
                      .putString("last_pair_code", cleanCode)
                      .apply()

                  return JSONObject().apply {
