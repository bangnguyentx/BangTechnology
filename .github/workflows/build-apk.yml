          <script>
            // Hiệu ứng xoay góc khúc xạ ánh sáng mặt kính theo thao tác vuốt/chạm
            window.addEventListener('pointermove', (e) => {
              const deg = Math.round((e.clientX / Math.max(1, window.innerWidth)) * 160 + 145);
              document.documentElement.style.setProperty('--light-angle', deg + 'deg');
            }, { passive: true });

            // ================= MÀN HÌNH GHÉP NỐI 6 SỐ LIQUID GLASS =================
            let currentSixDigits = "";

            function openPairModal() {
              hapticTick();
              document.getElementById('pairSheetModal').classList.add('open');
              renderSixDigitSlots();
            }

            function closePairModal() {
              document.getElementById('pairSheetModal').classList.remove('open');
            }

            function pressDigit(d) {
              hapticTick();
              if (currentSixDigits.length >= 6) return;
              currentSixDigits += d;
              renderSixDigitSlots();
              if (currentSixDigits.length === 6) {
                setTimeout(() => submitSixDigitPairing(), 140);
              }
            }

            function backspaceDigit() {
              hapticTick();
              if (currentSixDigits.length > 0) {
                currentSixDigits = currentSixDigits.slice(0, -1);
                renderSixDigitSlots();
              }
            }

            function clearDigits() {
              hapticTick();
              currentSixDigits = "";
              renderSixDigitSlots();
            }

            function renderSixDigitSlots() {
              const slots = document.querySelectorAll('#sixDigitGrid .digit-glass-slot');
              slots.forEach((slot, idx) => {
                const ch = currentSixDigits[idx];
                slot.textContent = ch ? ch : '-';
                slot.classList.toggle('filled', !!ch);
                slot.classList.toggle('active-cursor', idx === currentSixDigits.length);
              });
            }

            function submitSixDigitPairing() {
              hapticTick();
              if (currentSixDigits.length !== 6) {
                showToast('Hãy nhập đủ 6 chữ số mã ghép nối!');
                return;
              }
              const portVal = parseInt(document.getElementById('inpPairPort').value, 10) || 37845;
              if (window.BangBridge && window.BangBridge.pairSixDigitCode) {
                const resStr = window.BangBridge.pairSixDigitCode(portVal, currentSixDigits);
                try {
                  const res = JSON.parse(resStr);
                  if (res.ok) {
                    closePairModal();
                    updateAdbStatusUI(true, res.mode);
                    appendLog(`adb pair 127.0.0.1:${res.port} ${currentSixDigits}`, 'PAIRED');
                    showToast(res.msg);
                    currentSixDigits = "";
                  } else {
                    showToast(res.msg);
                  }
                } catch (e) {}
              } else {
                closePairModal();
                updateAdbStatusUI(true, `2-in-1 Wireless ADB (Port ${portVal})`);
                showToast(`Đã ghép nối mã ${currentSixDigits} thành công!`);
              }
            }

            function launchDevOptionsWithNotification() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.openDeveloperOptionsWithNotification) {
                window.BangBridge.openDeveloperOptionsWithNotification();
              } else {
                showToast('Đã bật thông báo nhập mã 6 số trên thanh trạng thái!');
              }
            }

            function resetAdbPairing() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.unpairAdbEngine) {
                window.BangBridge.unpairAdbEngine();
              }
              updateAdbStatusUI(false, 'Chưa ghép nối');
              restoreAllDefaults();
              showToast('Đã ngắt ghép nối Lõi ADB 2-in-1');
            }

            function updateAdbStatusUI(paired, modeText) {
              const led = document.getElementById('adbLed');
              const topTxt = document.getElementById('adbTopStatusText');
              const cardSub = document.getElementById('cardAdbSub');
              const tab3Badge = document.getElementById('tab3PairBadge');

              if (paired) {
                led.className = 'status-led paired';
                topTxt.textContent = '2-in-1 Đã kết nối';
                cardSub.textContent = '▲ ' + (modeText || 'Lõi ADB 2-in-1 Sẵn sàng');
                cardSub.style.color = '#10B981';
                tab3Badge.textContent = 'Đã kết nối';
                tab3Badge.style.color = '#10B981';
              } else {
                led.className = 'status-led';
                topTxt.textContent = 'Ghép nối 6 số';
                cardSub.textContent = '▲ Chạm để ghép nối 6 số';
                cardSub.style.color = '#F59E0B';
                tab3Badge.textContent = 'Chưa ghép nối';
                tab3Badge.style.color = '#F59E0B';
              }
            }

            window.onMdnsPortUpdate = function(info) {
              if (!info) return;
              if (info.pairingPort && info.pairingPort > 0) {
                document.getElementById('inpPairPort').value = info.pairingPort;
                document.getElementById('mdnsStatusText').textContent = `● Đã tự dò thấy Port ghép nối: ${info.pairingPort}`;
              }
              updateAdbStatusUI(!!info.paired, info.mode);
            };

            // ================= 20 CÔNG TẮC AN TOÀN TUYỆT ĐỐI =================
            const glToolItems = [
              { id: 'gl_zero_lag', name: 'Bang Zero Lag Scheduler', tag: 'Universal', desc: 'Tối ưu độ trễ phản hồi cửa sổ và điều phối khung hình chuẩn AOSP.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put global window_animation_scale 0.5', cmdOff: 'settings put global window_animation_scale 1.0', verifyCmd: 'settings get global window_animation_scale', expectVal: '0.5', minHz: 0 },
              { id: 'gl_ping', name: 'Bang Ping Booster 5GHz', tag: 'Network', desc: 'Tắt quét Wi-Fi nền gây nhảy ping và giữ kết nối mạng luôn thức.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put global wifi_scan_always_enabled 0 && settings put global wifi_sleep_policy 2', cmdOff: 'settings put global wifi_scan_always_enabled 1', verifyCmd: 'settings get global wifi_scan_always_enabled', expectVal: '0', minHz: 0 },
              { id: 'gl_charge', name: 'Bang Turbo Charge Guard', tag: 'Battery', desc: 'Tắt giới hạn dòng sạc chậm ban đêm (Adaptive Charging).', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put global adaptive_charging_enabled 0', cmdOff: 'settings put global adaptive_charging_enabled 1', verifyCmd: 'settings get global adaptive_charging_enabled', expectVal: '0', minHz: 0 },
              { id: 'gl_cooling', name: 'Bang Thermal Cool Down', tag: 'Safe Cool', desc: 'Thu hồi toàn bộ tiến trình rác nền và xóa bộ đệm sinh nhiệt (An toàn 100%).', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'am kill-all && pm trim-caches 999G', cmdOff: 'echo ok', verifyCmd: '', expectVal: 'CoolActive', minHz: 0 },
              { id: 'gl_120hz', name: 'Khóa Cứng 120Hz eSports', tag: '120Hz', desc: 'Giữ tần số quét ở 120Hz (Tự động kiểm tra phần cứng màn hình trước khi bật).', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put system peak_refresh_rate 120.0 && settings put system min_refresh_rate 120.0', cmdOff: 'settings delete system peak_refresh_rate && settings delete system min_refresh_rate', verifyCmd: 'settings get system peak_refresh_rate', expectVal: '120.0', minHz: 120 },
              { id: 'gl_90hz', name: 'Khóa Cứng 90Hz/60Hz Ổn Định', tag: 'Universal Hz', desc: 'Cố định tần số quét tối đa theo tấm nền thực tế của máy để chống sụt FPS.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'settings put system min_refresh_rate 60.0', cmdOff: 'settings delete system min_refresh_rate', verifyCmd: 'settings get system min_refresh_rate', expectVal: '60.0', minHz: 0 },
              { id: 'gl_gfx', name: 'Bang Safe GPU Tune (AOT Compile)', tag: 'Safe GPU', desc: 'Biên dịch trước mã thực thi speed-profile cho game mà không đổi driver hệ thống.', on: false, statusText: 'Chưa bật', statusType: 'idle', cmdOn: 'cmd package compile -m speed-profile -f com.garena.game.kgvn', cmdOff: 'echo ok', verifyCmd: '', expectVal: 'speed-profile', minHz: 0 },
