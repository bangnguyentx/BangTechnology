              { id: 'ram_tts_stop', name: '🗣️ Đóng băng dịch vụ Đọc văn bản chạy ngầm (TTS Engine)', desc: 'Giải phóng 80–150MB RAM từ bộ tổng hợp giọng nói chạy ngầm không cần thiết', stateKey: '', expectVal: '', defOff: '', cmdOn: 'am force-stop com.google.android.tts', cmdOff: 'echo ok', on: false },
              { id: 'ram_gms_trim', name: '🛡️ Thu gọn bộ nhớ đệm Dịch vụ Google Play (GMS Cache)', desc: 'Làm sạch bộ đệm phình to của dịch vụ nền mà không làm mất thông báo đẩy', stateKey: '', expectVal: '', defOff: '', cmdOn: 'pm trim-caches 256G', cmdOff: 'echo ok', on: false }
            ];

            const allToggleRegistry = new Map();
            function rebuildRegistry() {
              [...proGameTools, ...universalSystemTweaks, ...netAndBatteryTweaks, ...ramDeepTools].forEach(it => allToggleRegistry.set(it.id, it));
              Object.values(oemProfiles).forEach(arr => arr.forEach(it => allToggleRegistry.set(it.id, it)));
            }
            rebuildRegistry();

            // ================= 2. CỤC TRÒN NHỎ KÉO THẢ 360° + BẤM ĐÚP CHẠY MACRO =================
            (function initDraggableFloatingOrbInWeb() {
              const orb = document.getElementById('floatingGameOrb');
              if (!orb) return;
              let dragging = false;
              let moved = false;
              let startX = 0, startY = 0;
              let orbLeft = window.innerWidth - 46;
              let orbTop = Math.round(window.innerHeight * 0.36);
              let lastTapMs = 0;

              function applyOrbPos(x, y, withTransition) {
                orbLeft = x;
                orbTop = y;
                orb.style.transition = withTransition
                  ? 'left 340ms var(--origin-spring), top 260ms ease, opacity 280ms ease, transform 300ms var(--origin-spring)'
                  : 'none';
                orb.style.right = 'auto';
                orb.style.left = x + 'px';
                orb.style.top = y + 'px';
              }

              orb.addEventListener('pointerdown', (e) => {
                dragging = true;
                moved = false;
                hapticTick();
                orb.setPointerCapture(e.pointerId);
                const rect = orb.getBoundingClientRect();
                orbLeft = rect.left;
                orbTop = rect.top;
                startX = e.clientX - orbLeft;
                startY = e.clientY - orbTop;
                orb.style.transition = 'transform 120ms ease';
                orb.style.transform = 'scale(1.12)';
                orb.style.opacity = '1';
                clearTimeout(window._orbIdleTimer);
              });

              orb.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const nx = e.clientX - startX;
                const ny = e.clientY - startY;
                if (Math.abs(nx - orbLeft) > 5 || Math.abs(ny - orbTop) > 5) {
                  moved = true;
                }
                if (moved) {
                  const clampedX = Math.max(5, Math.min(window.innerWidth - 42, nx));
                  const clampedY = Math.max(20, Math.min(window.innerHeight - 85, ny));
                  applyOrbPos(clampedX, clampedY, false);
                }
              });

              orb.addEventListener('pointerup', () => {
                if (!dragging) return;
                dragging = false;
                orb.style.transform = 'scale(1)';
                if (!moved) {
                  const now = Date.now();
                  if (now - lastTapMs <= 320) {
                    clearTimeout(window._singleOrbTapTimer);
                    lastTapMs = 0;
                    showToast('⚡ Đã kích hoạt Macro Bán Đồ Nhanh (4 chạm siêu tốc • Không khóa di chuyển)!');
                  } else {
                    lastTapMs = now;
                    window._singleOrbTapTimer = setTimeout(() => {
                      openMagicGameSpacePreview();
                    }, 250);
                  }
                } else {
                  const snapX = (orbLeft + 18 < window.innerWidth / 2) ? 6 : (window.innerWidth - 42);
                  applyOrbPos(snapX, orbTop, true);
                  window._orbIdleTimer = setTimeout(() => {
                    orb.style.opacity = '0.74';
                  }, 3000);
                }
              });
            })();

            function spawnDraggableFloatingOrbInApp() {
              hapticTick();
              const orb = document.getElementById('floatingGameOrb');
              if (orb) {
                orb.classList.add('visible');
                orb.classList.remove('morphed-out');
                orb.style.opacity = '1';
              }
              showToast('🔮 Đã hiện Cục Tròn Thu Nhỏ! Chạm 1 lần mở Menu • Bấm đúp 2 lần chạy Macro.');
            }

            function openMagicGameSpacePreview() {
              hapticTick();
              const orb = document.getElementById('floatingGameOrb');
              const backdrop = document.getElementById('magicGsPreviewBackdrop');
              const panel = document.getElementById('magicGsCapsulePanel');
              if (orb && panel) {
                const rect = orb.getBoundingClientRect();
                const isLeft = rect.left > 0 && (rect.left + 18 < window.innerWidth / 2);
                backdrop.style.justifyContent = isLeft ? 'flex-start' : 'flex-end';
                backdrop.style.paddingLeft = isLeft ? '14px' : '0';
                backdrop.style.paddingRight = isLeft ? '0' : '14px';
                panel.style.transformOrigin = isLeft ? 'left center' : 'right center';
                orb.classList.add('morphed-out');
              }
              if (backdrop) backdrop.classList.add('open');
            }

            function closeMagicGameSpacePreview() {
              hapticTick();
              const orb = document.getElementById('floatingGameOrb');
              const backdrop = document.getElementById('magicGsPreviewBackdrop');
              if (backdrop) backdrop.classList.remove('open');
              if (orb) {
                setTimeout(() => {
                  orb.classList.remove('morphed-out');
                }, 200);
              }
            }

            // Nút Out Game: Thoát Game & Đưa giao diện về bình thường ➔ Đưa về màn hình chính
            function quickExitGameAndGoHomeLauncher() {
              hapticTick();
              closeMagicGameSpacePreview();
              const orb = document.getElementById('floatingGameOrb');
              if (orb) orb.classList.remove('visible');
              const restoreCmd = 'wm size reset && wm density reset && settings put system pointer_speed 0 && settings put global heads_up_notifications_enabled 1 && settings put system screen_brightness_mode 1';
              runVerifiedCustomCmd('out_game_' + Date.now(), false, '', '', '', restoreCmd, restoreCmd, () => {
                document.getElementById('inpW').value = nativeWidth;
                document.getElementById('inpH').value = nativeHeight;
                document.getElementById('inpDpi').value = nativeDpi;
                document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
                appendLog('Out Game: Đã khôi phục giao diện 1080p bình thường & đưa về Màn hình chính', 'HOÀN TÁC GỐC');
                showToast('🚪 Đã khôi phục giao diện bình thường & đưa về Màn hình chính!');
                if (window.BangBridge && window.BangBridge.goToPhoneHomeScreen) {
                  setTimeout(() => window.BangBridge.goToPhoneHomeScreen(), 320);
                }
              });
            }

            // ================= 3. VẼ DANH SÁCH CÔNG TẮC & THỰC THI QUA SHIZUKU =================
            function buildTweakCardHtml(item) {
              const statusTxt = item.statusText || (item.on ? '✓ Đang bật trên hệ thống (Shizuku Verified)' : 'Trạng thái: Đang tắt');
              const statusCls = item.statusClass || (item.on ? 'ok' : '');
              return `
                <div id="card_${item.id}" class="tweak-item ${item.on ? 'active-on' : ''} ${statusCls === 'err' ? 'error-rejected' : ''}">
                  <div class="tweak-top">
                    <div style="flex:1;">
                      <div class="tweak-title">${item.name}</div>
                      <div class="tweak-desc">${item.desc}</div>
                    </div>
                    <div id="sw_${item.id}" class="v14-switch ${item.on ? 'on' : ''}" onclick="onUserClickTrueToggle('${item.id}')"></div>
                  </div>
                  <div id="st_${item.id}" class="tweak-status-line ${statusCls}">${statusTxt}</div>
                </div>
              `;
            }

            let currentSelectedBrand = 'HYPEROS';

            function renderAllTweakLists(currentOemKey = 'HYPEROS') {
              document.getElementById('proGameToolsList').innerHTML = proGameTools.map(buildTweakCardHtml).join('');
              document.getElementById('universalSystemTweakList').innerHTML = universalSystemTweaks.map(buildTweakCardHtml).join('');
              document.getElementById('netAndBatteryTweakList').innerHTML = netAndBatteryTweaks.map(buildTweakCardHtml).join('');
              document.getElementById('ramDeepToolsList').innerHTML = ramDeepTools.map(buildTweakCardHtml).join('');
              selectOemBrand(currentOemKey);
              updateActiveCountSummary();
            }

            function selectOemBrand(brandKey, btnEl) {
              currentSelectedBrand = brandKey;
              if (btnEl) {
                hapticTick();
                document.querySelectorAll('#oemChipRow .oem-chip').forEach(el => el.classList.remove('active'));
                btnEl.classList.add('active');
              }
              const list = oemProfiles[brandKey] || oemProfiles.HYPEROS;
              document.getElementById('oemSpecificTweakList').innerHTML = list.map(buildTweakCardHtml).join('');
            }

            function updateSingleTweakCardDOM(id) {
              const item = allToggleRegistry.get(id);
              if (!item) return;
              const card = document.getElementById('card_' + id);
              const sw = document.getElementById('sw_' + id);
              const st = document.getElementById('st_' + id);
              if (!card || !sw || !st) return;

              sw.classList.toggle('on', !!item.on);
              card.classList.toggle('active-on', !!item.on && item.statusClass !== 'err');
              card.classList.toggle('error-rejected', item.statusClass === 'err');
              st.className = 'tweak-status-line ' + (item.statusClass || (item.on ? 'ok' : ''));
              st.textContent = item.statusText || (item.on ? '✓ Đang bật trên hệ thống' : 'Trạng thái: Đang tắt');
              updateActiveCountSummary();
            }

            function updateActiveCountSummary() {
              let activeTotal = 0;
              allToggleRegistry.forEach(it => { if (it.on) activeTotal++; });
              const sysBadge = document.getElementById('sysActiveCounter');
              if (sysBadge) sysBadge.textContent = `${activeTotal} chức năng đang bật`;
            }

            function onUserClickTrueToggle(id) {
              const item = allToggleRegistry.get(id);
              if (!item) return;
              hapticTick();

              if (item.isAutoRestore) {
                item.on = !item.on;
                item.statusClass = item.on ? 'ok' : '';
                item.statusText = item.on ? '✓ Đang bật tự hoàn trả 1080p khi rời Game' : 'Đã tắt tự hoàn trả';
                updateSingleTweakCardDOM(id);
                if (window.BangBridge && window.BangBridge.setAutoRestoreGameOnExit) {
                  window.BangBridge.setAutoRestoreGameOnExit(item.on);
                }
                showToast(item.statusText);
                return;
              }

              const targetOn = !item.on;
              item.statusClass = '';
              item.statusText = targetOn ? '⏳ Đang ghi qua Shizuku & kiểm chứng...' : '⏳ Đang khôi phục về giá trị gốc ban đầu...';
              updateSingleTweakCardDOM(id);

              if (window.BangBridge && window.BangBridge.execTrueStateToggleAsync) {
                window.BangBridge.execTrueStateToggleAsync(
                  item.id,
                  targetOn,
                  item.stateKey || '',
                  item.expectVal || '',
                  item.defOff || '',
                  item.cmdOn || 'echo ok',
                  item.cmdOff || 'echo ok',
                  item.minHz || 0
                );
              } else {
                item.on = false;
                item.statusClass = 'err';
                item.statusText = '❌ Lỗi: Chưa kết nối Shizuku (Hãy bấm Cấp quyền Shizuku ở Trang chủ)';
                updateSingleTweakCardDOM(id);
                showToast('❌ Chưa kết nối Shizuku! Hãy cấp quyền Shizuku trước.');
                requestShizukuAuthNow();
              }
            }

            let customCmdCallbacks = {};

            function runVerifiedCustomCmd(cmdId, targetOn, stateKey, expectVal, defOff, cmdOn, cmdOff, cb) {
              customCmdCallbacks[cmdId] = cb;
              if (window.BangBridge && window.BangBridge.execTrueStateToggleAsync) {
                window.BangBridge.execTrueStateToggleAsync(cmdId, targetOn, stateKey, expectVal, defOff, cmdOn, cmdOff, 0);
              } else {
                delete customCmdCallbacks[cmdId];
                cb({ ok: false, reason: 'Chưa kết nối Shizuku UID 2000!', needShizuku: true });
              }
            }

            window.onSwitchVerifiedResult = function(res) {
              if (!res) return;

              if (res.itemId && customCmdCallbacks[res.itemId]) {
                const fn = customCmdCallbacks[res.itemId];
                delete customCmdCallbacks[res.itemId];
                fn(res);
                return;
              }

              const item = allToggleRegistry.get(res.itemId);
              if (!item) return;

              if (res.ok) {
                item.on = !!res.targetOn;
                item.statusClass = item.on ? 'ok' : '';
                item.statusText = item.on
                  ? `✓ Đã ghi & xác thực qua Shizuku (${res.verifiedValue || 'Hoạt động'})`
                  : `↺ Đã hoàn trả về ban đầu (${res.verifiedValue || 'Mặc định'})`;
                updateSingleTweakCardDOM(item.id);
                appendLog(`${item.on ? 'Bật' : 'Tắt hoàn trả'}: ${item.name} -> ${res.verifiedValue || 'OK'}`, 'SHIZUKU OK');
                showToast(item.on ? `✅ Đã bật thật: ${item.name}` : `↺ Đã trả về ban đầu: ${item.name}`);
              } else {
                item.on = false;
                item.statusClass = 'err';
                item.statusText = `❌ Không ghi được vào máy: ${res.reason || 'Shizuku chưa cấp quyền hoặc ROM chặn'}`;
                updateSingleTweakCardDOM(item.id);
                appendLog(`Lỗi ghi [${item.name}]: ${res.reason}`, 'TỪ CHỐI');
                showToast(`❌ Lỗi: ${res.reason}`);
                if (res.needShizuku) requestShizukuAuthNow();
              }
            };

            // ================= 4. QUÉT DỮ LIỆU THẬT TRÊN MÁY KHI MỞ APP =================
            function syncScannedStatesFromDevice(scannedStates) {
              if (!scannedStates) return;
              const savedMem = scannedStates._savedMemory || {};
              let detectedActiveCount = 0;

              allToggleRegistry.forEach(item => {
                if (item.isAutoRestore) {
                  if (savedMem.auto_restore_game !== undefined) {
                    item.on = !!savedMem.auto_restore_game;
                  }
                  return;
                }

                if (item.stateKey && scannedStates[item.stateKey] !== undefined) {
                  const actualVal = String(scannedStates[item.stateKey] || '').trim();
                  if (actualVal !== '' && item.expectVal !== '') {
                    const isMatched = actualVal.toLowerCase() === item.expectVal.toLowerCase() ||
                                      actualVal.toLowerCase().startsWith(item.expectVal.toLowerCase());
                    item.on = isMatched;
                    if (isMatched) {
                      detectedActiveCount++;
                      item.statusClass = 'ok';
                      item.statusText = `✓ Đã quét thấy đang bật sẵn trên máy (${item.stateKey.split(':')[1]} = ${actualVal})`;
                    } else {
                      item.statusClass = '';
                      item.statusText = `Giá trị hiện tại trên máy: ${actualVal}`;
                    }
                    return;
                  }
                }

                if (savedMem[item.id] !== undefined) {
                  item.on = !!savedMem[item.id];
                  if (item.on) {
                    detectedActiveCount++;
                    item.statusClass = 'ok';
                    item.statusText = '✓ Đã khôi phục trạng thái bật từ bộ nhớ máy';
                  } else {
                    item.statusClass = '';
                    item.statusText = 'Trạng thái: Đang tắt';
                  }
                }
              });

              const winScale = String(scannedStates['global:window_animation_scale'] || '1.0').trim();
              highlightAnimationScaleButtons(winScale);

              const dnsMode = String(scannedStates['global:private_dns_mode'] || '').trim();
              const dnsHost = String(scannedStates['global:private_dns_specifier'] || '').trim().toLowerCase();
              syncDnsSelectionFromScan(dnsMode, dnsHost);

              const adbEnabledVal = String(scannedStates['global:adb_enabled'] || '').trim();
              const swStealth = document.getElementById('swStealthVneid');
              const cardStealth = document.getElementById('cardStealthVneid');
              const stStealth = document.getElementById('stStealthVneid');
              if (swStealth && cardStealth && stStealth) {
                const isHiddenNow = adbEnabledVal === '0' || !!savedMem.deep_stealth_vneid;
                swStealth.classList.toggle('on', isHiddenNow);
                cardStealth.classList.toggle('active-on', isHiddenNow);
                stStealth.className = 'tweak-status-line ' + (isHiddenNow ? 'ok' : '');
                stStealth.textContent = isHiddenNow
                  ? '✓ Đã kích hoạt Ẩn ADB 5 Lớp & Auto-Stealth (Mở VNeID & Ngân hàng an toàn)'
                  : 'Trạng thái trên máy: Đang hiển thị gỡ lỗi ADB';
              }

              renderAllTweakLists(currentSelectedBrand);

              const sumEl = document.getElementById('headerScanSummary');
              if (sumEl) {
                sumEl.textContent = detectedActiveCount > 0
                  ? `✓ Đã quét máy: Phát hiện & tự động bật ${detectedActiveCount} chức năng đã kích hoạt`
                  : `✓ Đã quét toàn bộ máy: Các thông số đang ở mức mặc định gốc`;
              }
            }

            function triggerManualFullScan() {
              hapticTick();
              showToast('🔍 Đang đồng bộ Shizuku & quét toàn bộ thông số trên máy...');
              if (window.BangBridge && window.BangBridge.scanAllSystemStatesNow) {
                window.BangBridge.scanAllSystemStatesNow();
              }
            }

            function requestShizukuAuthNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.requestShizukuPermission) {
                window.BangBridge.requestShizukuPermission();
              } else {
                showToast('⚡ Đang yêu cầu quyền Shizuku UID 2000...');
              }
            }

            function openExternalShizukuAppNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.openShizukuApp) {
                window.BangBridge.openShizukuApp();
              } else {
                showToast('Hãy mở ứng dụng Shizuku trên màn hình chính của bạn!');
              }
            }

            // ================= 5. CHẾ ĐỘ CHỜ GAME SPACE 24/7 =================
            function toggleSmartGameSpaceWatcherUI(el) {
              hapticTick();
              const targetOn = !el.classList.contains('on');
              const stLine = document.getElementById('gameSpaceStatusLine');

              if (window.BangBridge && window.BangBridge.toggleSmartGameSpaceWatcherStr) {
                try {
                  const res = JSON.parse(window.BangBridge.toggleSmartGameSpaceWatcherStr(targetOn));
                  if (res.ok) {
                    el.classList.toggle('on', targetOn);
                    if (stLine) {
                      stLine.className = 'tweak-status-line ' + (targetOn ? 'ok' : '');
                      stLine.textContent = targetOn
                        ? '✓ Đang canh gác 24/7! Mở Game từ màn hình chính vẫn tự động có Cục tròn & Hỏi nhanh 720p.'
                        : 'Trạng thái: Đang tắt';
                    }
                    appendLog(res.msg, 'GAME SPACE');
                    showToast('🔮 ' + res.msg);
                  } else {
                    el.classList.remove('on');
                    if (stLine) {
                      stLine.className = 'tweak-status-line err';
                      stLine.textContent = '❌ ' + (res.msg || 'Chưa cấp quyền hiển thị trên ứng dụng khác');
                    }
                    showToast('⚠️ ' + res.msg);
                  }
                } catch (e) {}
              } else {
                el.classList.toggle('on', targetOn);
                if (targetOn) spawnDraggableFloatingOrbInApp();
              }
            }

            // ================= 6. HOẠT ẢNH & ĐỘ PHÂN GIẢI =================
            function highlightAnimationScaleButtons(scaleStr) {
              const s10 = document.getElementById('btnScale10');
              const s05 = document.getElementById('btnScale05');
              const s00 = document.getElementById('btnScale00');
              const lbl = document.getElementById('animLabel');
              if (!s10 || !s05 || !s00) return;

              s10.classList.remove('active-preset');
              s05.classList.remove('active-preset');
              s00.classList.remove('active-preset');

              if (scaleStr === '0' || scaleStr === '0.0') {
                s00.classList.add('active-preset');
                if (lbl) lbl.textContent = 'Đang bật: 0.0x Tức thì';
              } else if (scaleStr === '0.5' || scaleStr === '.5') {
                s05.classList.add('active-preset');
                if (lbl) lbl.textContent = 'Đang bật: 0.5x Mượt';
              } else {
                s10.classList.add('active-preset');
                if (lbl) lbl.textContent = `Hiện tại: ${scaleStr || '1.0'}x Chuẩn`;
              }
            }

            function applyTrueAnimationScale(scaleVal, label) {
              hapticTick();
              const cmd = `settings put global window_animation_scale ${scaleVal} && settings put global transition_animation_scale ${scaleVal} && settings put global animator_duration_scale ${scaleVal}`;
              runVerifiedCustomCmd('anim_scale_' + Date.now(), true, 'global:window_animation_scale', scaleVal, '1.0', cmd, '', (res) => {
                if (res.ok) {
                  highlightAnimationScaleButtons(scaleVal);
                  triggerManualFullScan();
                  appendLog(`Đặt tốc độ hoạt ảnh = ${scaleVal}x`, 'SHIZUKU OK');
                  showToast(`✅ Đã ghi vào máy: ${label}`);
                } else {
                  appendLog(`Lỗi đặt hoạt ảnh ${scaleVal}x: ${res.reason}`, 'TỪ CHỐI');
                  showToast(`❌ Không ghi được: ${res.reason}`);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            function applyResolution(isTest15s) {
              hapticTick();
              const w = parseInt(document.getElementById('inpW').value, 10) || nativeWidth;
              const h = parseInt(document.getElementById('inpH').value, 10) || nativeHeight;
              const dpi = parseInt(document.getElementById('inpDpi').value, 10) || nativeDpi;
              const cmd = `wm size ${w}x${h} && wm density ${dpi}`;

              runVerifiedCustomCmd('res_apply_' + Date.now(), true, '', '', '', cmd, '', (res) => {
                if (res.ok) {
                  document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
                  appendLog(`Đổi độ phân giải: ${w}x${h} @ ${dpi} DPI`, 'SHIZUKU OK');
                  showToast(`🖥️ Đã áp dụng thật: ${w}x${h} @ ${dpi} DPI`);
                  clearInterval(revertTimer);
                  const btn = document.getElementById('btnTest15s');
                  if (isTest15s) {
                    let sec = 15;
                    btn.textContent = `Hoàn tác (${sec}s)`;
                    revertTimer = setInterval(() => {
                      sec--;
                      btn.textContent = `Hoàn tác (${sec}s)`;
                      if (sec <= 0) {
                        clearInterval(revertTimer);
                        resetResolution();
                      }
                    }, 1000);
                  } else {
                    btn.textContent = 'Thử 15s';
                  }
                } else {
                  appendLog(`Lỗi đổi độ phân giải: ${res.reason}`, 'TỪ CHỐI');
                  showToast(`❌ Không thể đổi độ phân giải: ${res.reason}`);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            function resetResolution() {
              hapticTick();
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = 'Thử 15s';
              runVerifiedCustomCmd('res_reset_' + Date.now(), false, '', '', '', 'wm size reset && wm density reset', 'wm size reset && wm density reset', (res) => {
                document.getElementById('inpW').value = nativeWidth;
                document.getElementById('inpH').value = nativeHeight;
                document.getElementById('inpDpi').value = nativeDpi;
                document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
                if (res.ok) {
                  appendLog('Khôi phục độ phân giải & DPI về mặc định gốc', 'HOÀN TÁC');
                  showToast('🔄 Đã trả màn hình về đúng độ phân giải gốc ban đầu!');
                } else {
                  showToast('❌ Lỗi: ' + (res.reason || 'Chưa cấp quyền Shizuku'));
                }
              });
            }

            // ================= 7. KHO 8 MÁY CHỦ DNS =================
            const dnsServers = [
              { id: 'cf', name: 'Cloudflare 1.1.1.1', sub: 'Ping thấp nhất cho Game', host: 'one.one.one.one', mode: 'hostname' },
              { id: 'gg', name: 'Google Public DNS', sub: 'Ổn định quốc tế 8.8.8.8', host: 'dns.google', mode: 'hostname' },
              { id: 'ag', name: 'AdGuard DNS', sub: 'Chặn quảng cáo toàn máy', host: 'dns.adguard-dns.com', mode: 'hostname' },
              { id: 'q9', name: 'Quad9 Security', sub: 'Bảo mật & chống giật lag', host: 'dns.quad9.net', mode: 'hostname' },
              { id: 'cd', name: 'ControlD Gaming', sub: 'Tối ưu tuyến cáp châu Á', host: 'freedns.controld.com', mode: 'hostname' },
              { id: 'od', name: 'OpenDNS Cisco', sub: 'Phân giải tên miền siêu tốc', host: 'doh.opendns.com', mode: 'hostname' },
              { id: 'nx', name: 'NextDNS Ultra', sub: 'Độ trễ thấp cho MOBA/FPS', host: 'dns.nextdns.io', mode: 'hostname' },
              { id: 'auto', name: 'Mặc định Nhà mạng', sub: 'Trả về DNS gốc ban đầu', host: '', mode: 'opportunistic' }
            ];
            let selectedDnsId = 'auto';

            function syncDnsSelectionFromScan(dnsMode, dnsHost) {
              const statusEl = document.getElementById('currentDnsStatusText');
              if (dnsMode === 'hostname' && dnsHost) {
                const matched = dnsServers.find(d => d.host && dnsHost.includes(d.host.toLowerCase()));
                if (matched) {
                  selectedDnsId = matched.id;
                  if (statusEl) statusEl.textContent = `✓ Đã quét máy: Đang dùng ${matched.name} (${dnsHost})`;
                } else {
                  selectedDnsId = '';
                  if (statusEl) statusEl.textContent = `✓ Đã quét máy: Đang dùng DNS tùy chỉnh (${dnsHost})`;
                }
              } else {
                selectedDnsId = 'auto';
                if (statusEl) statusEl.textContent = `✓ Đã quét máy: Đang ở DNS Mặc định Nhà mạng (${dnsMode || 'Tự động'})`;
              }
              renderDnsGrid();
            }

            function renderDnsGrid() {
              const box = document.getElementById('dnsSwitcherGrid');
              if (!box) return;
              box.innerHTML = dnsServers.map(d => {
                const isAct = selectedDnsId === d.id;
                return `
                  <button class="dns-card-btn tap-spring ${isAct ? 'active' : ''}" onclick="applyDnsServer('${d.id}')">
                    <div style="font-size:12px; font-weight:800; color:${isAct ? 'var(--accent-wood)' : 'var(--text-primary)'};">
                      ${isAct ? '✓ ' : '🌐 '}${d.name}
                    </div>
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;">${d.sub}</div>
                  </button>
                `;
              }).join('');
            }

            function applyDnsServer(id) {
              hapticTick();
              const d = dnsServers.find(x => x.id === id);
              if (!d) return;

              const shouldRevertToDefault = (selectedDnsId === id && id !== 'auto') || id === 'auto';
              const targetDns = shouldRevertToDefault ? dnsServers.find(x => x.id === 'auto') : d;

              const cmd = targetDns.mode === 'hostname'
                ? `settings put global private_dns_mode hostname && settings put global private_dns_specifier ${targetDns.host}`
                : `settings put global private_dns_mode opportunistic && settings delete global private_dns_specifier`;

              const stateKeyToVerify = targetDns.mode === 'hostname' ? 'global:private_dns_specifier' : 'global:private_dns_mode';
              const expectValToVerify = targetDns.mode === 'hostname' ? targetDns.host : 'opportunistic';

              runVerifiedCustomCmd('dns_' + Date.now(), true, stateKeyToVerify, expectValToVerify, 'opportunistic', cmd, '', (res) => {
                if (res.ok) {
                  selectedDnsId = targetDns.id;
                  renderDnsGrid();
                  const statusEl = document.getElementById('currentDnsStatusText');
                  if (statusEl) {
                    statusEl.textContent = targetDns.mode === 'hostname'
                      ? `✓ Đã ghi & xác thực DNS: ${targetDns.name} (${targetDns.host})`
                      : `↺ Đã trả về DNS Mặc định Nhà mạng (opportunistic)`;
                  }
                  appendLog(`Đổi DNS -> ${targetDns.name} (${res.verifiedValue || 'OK'})`, 'SHIZUKU OK');
                  showToast(targetDns.mode === 'hostname' ? `✅ Đã kích hoạt thật: ${targetDns.name}` : `↺ Đã trả về DNS Mặc định ban đầu!`);
                  testRealPingNow();
                } else {
                  appendLog(`Lỗi đổi DNS [${targetDns.name}]: ${res.reason}`, 'TỪ CHỐI');
                  showToast(`❌ Không ghi được DNS: ${res.reason}`);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            // ================= 8. BIỂU ĐỒ NHIỆT ĐỘ & DÒNG SẠC 1.0S =================
            const tempHistory = new Array(20).fill(35.5);
            const wattHistory = new Array(20).fill(2.4);
            const maHistory = new Array(20).fill(-620);

            function updateRealtimeBatteryOscilloscope() {
              if (document.hidden) return;
              if (window.BangBridge && window.BangBridge.getLiveBatteryTelemetryJson) {
                try {
                  const d = JSON.parse(window.BangBridge.getLiveBatteryTelemetryJson());
                  pushTelemetrySample(d.tempC || 35.5, d.currentMa || -620, d.watt || 2.4, d.voltageMv || 3880, !!d.charging, d.battery || 78, d.chargedMah || 0);
                  return;
                } catch (e) {}
              }
              const simTemp = +(35.4 + Math.sin(Date.now() / 2000) * 0.5).toFixed(1);
              const simMa = Math.round(-610 + Math.cos(Date.now() / 1300) * 40);
              const simMv = 3880;
              const simW = +((Math.abs(simMa) * simMv) / 1000000).toFixed(1);
              pushTelemetrySample(simTemp, simMa, simW, simMv, false, lastBatteryPct, 0);
            }

            function pushTelemetrySample(tempC, currentMa, watt, voltageMv, charging, batPct, chargedMah) {
              lastBatteryPct = batPct;
              if (sessionStartBattery < 0) {
                sessionStartBattery = batPct;
                sessionStartTimeMs = Date.now();
                try {
                  localStorage.setItem('bang_v19_drain_start_bat', String(sessionStartBattery));
                  localStorage.setItem('bang_v19_drain_start_time', String(sessionStartTimeMs));
                } catch (e) {}
              }

              setRingProgress('ringCircleBat', 'ringTextBat', batPct);
              document.getElementById('ringSubBat').textContent = `${tempC.toFixed(1)}°C · ${charging ? 'Đang sạc' : 'Ổn định'}`;

              const gsTemp = document.getElementById('gsPrevTemp');
              if (gsTemp) gsTemp.textContent = `${tempC.toFixed(1)}°C`;

              tempHistory.push(tempC);
              if (tempHistory.length > 20) tempHistory.shift();
              wattHistory.push(Number(watt));
              if (wattHistory.length > 20) wattHistory.shift();
              maHistory.push(currentMa);
              if (maHistory.length > 20) maHistory.shift();

              if (currentTabIdx !== 3) return;

              document.getElementById('liveTempBox').textContent = `${tempC.toFixed(1)}°C`;
              document.getElementById('liveMaBox').textContent = `${currentMa > 0 ? '+' : ''}${currentMa} mA`;
              document.getElementById('liveMaBox').style.color = charging ? '#B3F50B' : '#CBE7FC';
              document.getElementById('liveWattBox').textContent = `${Number(watt).toFixed(1)} W`;
              document.getElementById('liveMvBox').textContent = `${voltageMv} mV`;

              if (chargedMah > 100) {
                document.getElementById('batChargedNowMah').textContent = `${chargedMah.toLocaleString('vi-VN')} mAh (${batPct}%)`;
              }

              const minT = Math.min(...tempHistory).toFixed(1);
              const maxT = Math.max(...tempHistory).toFixed(1);
              const avgMa = Math.round(maHistory.reduce((a, b) => a + b, 0) / maHistory.length);
              const peakW = Math.max(...wattHistory).toFixed(1);

              document.getElementById('statTempMinMax').textContent = `${minT}° / ${maxT}°C`;
              document.getElementById('statMaAvg').textContent = `${avgMa > 0 ? '+' : ''}${avgMa} mA`;
              document.getElementById('statWattPeak').textContent = `${peakW} W`;

              document.getElementById('tCell4').textContent = `-16s: ${tempHistory[3].toFixed(1)}°`;
              document.getElementById('tCell3').textContent = `-12s: ${tempHistory[7].toFixed(1)}°`;
              document.getElementById('tCell2').textContent = `-8s: ${tempHistory[11].toFixed(1)}°`;
              document.getElementById('tCell1').textContent = `-4s: ${tempHistory[15].toFixed(1)}°`;
              document.getElementById('tCell0').textContent = `Nay: ${tempC.toFixed(1)}°`;

              const delta = Math.max(0, sessionStartBattery - batPct);
              const elapsedMin = Math.max(0, Math.floor((Date.now() - sessionStartTimeMs) / 60000));
              document.getElementById('drainDeltaText').textContent = `-${delta}%`;
              document.getElementById('drainDurationText').textContent = `Đã hao ${delta}% trong ${elapsedMin} phút (Đã lưu trí nhớ)`;
              document.getElementById('drainStartEndText').textContent = `${sessionStartBattery}% ➔ ${batPct}%`;

              const tempPts = tempHistory.map((t, i) => {
                const x = Math.round(28 + (i / 19) * 264);
                const y = Math.max(14, Math.min(96, Math.round(98 - ((t - 20) / 30) * 82)));
                return `${x},${y}`;
              }).join(' ');

              const wattPts = wattHistory.map((w, i) => {
                const x = Math.round(28 + (i / 19) * 264);
                const y = Math.max(16, Math.min(96, Math.round(98 - (Math.min(25, w) / 25) * 82)));
                return `${x},${y}`;
              }).join(' ');

              document.getElementById('polyTempLine').setAttribute('points', tempPts);
              document.getElementById('polyCurrentLine').setAttribute('points', wattPts);
            }

            function resetBatteryDrainSession() {
              hapticTick();
              sessionStartBattery = lastBatteryPct;
              sessionStartTimeMs = Date.now();
              try {
                localStorage.setItem('bang_v19_drain_start_bat', String(sessionStartBattery));
                localStorage.setItem('bang_v19_drain_start_time', String(sessionStartTimeMs));
              } catch (e) {}
              updateRealtimeBatteryOscilloscope();
              showToast('⏱️ Đã lưu mốc theo dõi hao pin mới vào bộ nhớ!');
            }

            setInterval(updateRealtimeBatteryOscilloscope, 1000);

            function testRealPingNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.measureRealPingAsync) {
                window.BangBridge.measureRealPingAsync();
                showToast('📶 Đang đo độ trễ Ping thực tế tới máy chủ...');
              }
            }

            window.onRealPingMeasured = function(res) {
              if (!res) return;
              document.getElementById('pingGarenaVal').textContent = `${res.garenaMs} ms`;
              document.getElementById('pingCfVal').textContent = `${res.cloudflareMs} ms`;
              document.getElementById('pingGoogleVal').textContent = `${res.googleMs} ms`;
              showToast(`⚡ Ping thực tế: Máy chủ Game ${res.garenaMs}ms · 1.1.1.1 ${res.cloudflareMs}ms`);
            };

            // ================= 9. GAME HUB & WHITELIST =================
            const strictNonGameFilter = [
              'zalopay', 'com.zing.zalo', 'zing.mp3', 'momo', 'vnpay', 'viettelpay',
              'bank', 'shopee', 'lazada', 'tiktok', 'facebook', 'orca', 'youtube',
              'chrome', 'camera', 'gallery', 'photos', 'settings', 'shizuku', 'bangtech'
            ];

            function isInvalidGamePackage(pkg, name) {
              const p = String(pkg || '').toLowerCase();
              const n = String(name || '').toLowerCase();
              return strictNonGameFilter.some(bad => p.includes(bad) || n.includes(bad));
            }

            let userSavedGames = [];
            try {
              const saved = localStorage.getItem('bang_v19_custom_games');
              if (saved) {
                userSavedGames = JSON.parse(saved).filter(g => !isInvalidGamePackage(g.pkg, g.name));
              }
            } catch (e) {}

            let detectedInstalledGames = [];
            let allScannedDeviceApps = [];

            function saveCustomGamesToStorage() {
              try {
                localStorage.setItem('bang_v19_custom_games', JSON.stringify(userSavedGames));
              } catch (e) {}
            }

            function rescanDeviceGamesNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.scanAppsAndGamesAsync) {
                window.BangBridge.scanAppsAndGamesAsync();
                showToast('🔍 Đang dò tìm các Game thực sự đã cài trên máy...');
              } else {
                renderGameHubList();
              }
            }

            window.onDeviceGamesAndAppsScanned = function(payload) {
              if (!payload) return;
              const scannedGames = payload.games || [];
              const scannedApps = payload.apps || [];

              detectedInstalledGames = scannedGames
                .filter(g => !isInvalidGamePackage(g.pkg, g.name))
                .map(g => ({
                  name: g.name,
                  pkg: g.pkg,
                  res: '720x1600:280',
                  mode: 'Tần số cao · Cảm ứng 0ms',
                  installed: true,
                  icon: g.icon || ''
                }));

              allScannedDeviceApps = scannedApps.map(a => {
                const defaultSafe = a.pkg.includes('zalo') || a.pkg.includes('orca') || a.pkg.includes('youtube') || a.pkg.includes('camera') || a.pkg.includes('garena') || a.pkg.includes('bangtech') || a.pkg.includes('shizuku');
                const isProtected = savedWhitelistMap[a.pkg] !== undefined ? !!savedWhitelistMap[a.pkg] : defaultSafe;
                return {
                  name: a.name,
                  pkg: a.pkg,
                  isGame: !!a.isGame && !isInvalidGamePackage(a.pkg, a.name),
                  icon: a.icon || '',
                  protected: isProtected
                };
              });

              renderGameHubList();
              renderWhitelistApps();
              renderInstalledAppPicker();
            };

            function getMergedGameList() {
              const map = new Map();
              detectedInstalledGames.forEach(g => {
                if (!isInvalidGamePackage(g.pkg, g.name)) {
                  map.set(g.pkg, { ...g, installed: true });
                }
              });
              userSavedGames.forEach(g => {
                if (isInvalidGamePackage(g.pkg, g.name)) return;
                const existing = map.get(g.pkg);
                const foundInAll = allScannedDeviceApps.find(a => a.pkg === g.pkg);
                map.set(g.pkg, {
                  ...g,
                  installed: existing ? true : !!foundInAll,
                  icon: (existing && existing.icon) ? existing.icon : (foundInAll ? foundInAll.icon : (g.icon || ''))
                });
              });
              return Array.from(map.values());
            }

            function renderGameHubList() {
              const list = getMergedGameList();
              const subEl = document.getElementById('gameScanSubtitle');
              if (subEl) {
                subEl.textContent = list.length > 0
                  ? `Đã phát hiện ${list.length} tựa game đang cài trên máy · Mở từ màn hình chính cũng tự kích hoạt!`
                  : `Chưa phát hiện game nào · Hãy bấm "+ Thêm Game Mới" để chọn từ máy`;
              }

              const box = document.getElementById('gameHubContainer');
              if (list.length === 0) {
                box.innerHTML = `
                  <div style="text-align:center; padding:18px 12px; color:var(--text-secondary); font-size:11.5px; background:var(--bg-well); border:1px dashed var(--border-hairline); border-radius:16px;">
                    🎮 Đang quét hoặc chưa có game trong danh sách.<br>Bấm nút <b>➕ Thêm Game Mới</b> phía trên để chọn bất kỳ tựa game nào trên máy!
                  </div>
                `;
                return;
              }

              box.innerHTML = list.map(g => {
                const initials = (g.name || 'GM').substring(0, 2).toUpperCase();
                const iconHtml = g.icon
                  ? `<img src="${g.icon}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='${initials}';" />`
                  : `<span>${initials}</span>`;

                return `
                  <div class="game-card-item">
                    <div class="game-icon-box">${iconHtml}</div>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${g.name}</div>
                      <div style="font-size:10.5px; color:var(--accent-wood); font-weight:700; margin-top:2px;">✓ Đã cài trên máy · ${g.mode || 'Tần số cao · Cảm ứng 0ms'}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
                      <button class="btn-launch-game tap-spring" onclick="boostAndLaunchGameByPkg('${g.pkg}', '${g.name.replace(/'/g, "")}', '${g.res || "720x1600:280"}')">
                        🔥 Mở kèm Game Space
                      </button>
                      <button style="font-size:10px; color:#FDA4AF;" onclick="removeGameFromHub('${g.pkg}')">Xóa ✕</button>
                    </div>
                  </div>
                `;
              }).join('');
            }

            function boostAndLaunchGameByPkg(pkg, name, resSpec) {
              hapticTick();
              const parts = (resSpec || '720x1600:280').split(':');
              const wh = parts[0] || '720x1600';
              const dpi = parts[1] || '280';
              const boostCmd = `cmd game mode performance ${pkg} && cmd package compile -m speed-profile -f ${pkg} && wm size ${wh} && wm density ${dpi} && settings put secure long_press_timeout 150 && settings put system pointer_speed 7 && am kill-all`;

              spawnDraggableFloatingOrbInApp();
              if (window.BangBridge && window.BangBridge.launchAndBoostGame) {
                const opened = window.BangBridge.launchAndBoostGame(pkg, boostCmd);
                appendLog(`Khởi chạy ${name} kèm Cục tròn Magic Game Space & Macro`, opened ? 'ĐÃ MỞ GAME' : 'ĐÃ TỐI ƯU');
                showToast(opened ? `🔥 Đã mở ${name} & hiện Cục tròn Game Space!` : `🔮 Đã kích hoạt Cục tròn Game Space cho ${name}!`);
              } else {
                showToast(`🔮 Đã hiện Cục tròn Game Space! Bấm đúp 2 lần vào Cục tròn để chạy Macro.`);
              }
            }

            function openAddGameModal() {
              hapticTick();
              document.getElementById('addGameModal').classList.add('open');
              renderInstalledAppPicker();
            }
            function closeAddGameModal() {
              document.getElementById('addGameModal').classList.remove('open');
            }

            function addManualGameToHub() {
              hapticTick();
              const nameInput = document.getElementById('inpCustomGameName').value.trim();
              let pkgInput = document.getElementById('inpCustomGamePkg').value.trim();
              const resSpec = document.getElementById('selCustomGameRes').value;
              const modeSpec = document.getElementById('selCustomGameMode').value;

              if (!nameInput) {
                showToast('Hãy nhập tên Game cần thêm!');
                return;
              }
              if (!pkgInput) {
                const matchedApp = allScannedDeviceApps.find(a => a.name.toLowerCase().includes(nameInput.toLowerCase()));
                pkgInput = matchedApp ? matchedApp.pkg : ('com.custom.game.' + nameInput.toLowerCase().replace(/[^a-z0-9]/g, ''));
              }
              const matchedInDevice = allScannedDeviceApps.find(a => a.pkg === pkgInput);
              userSavedGames.unshift({
                name: nameInput,
                pkg: pkgInput,
                res: resSpec,
                mode: modeSpec,
                installed: true,
                icon: matchedInDevice ? matchedInDevice.icon : ''
              });
              saveCustomGamesToStorage();
              document.getElementById('inpCustomGameName').value = '';
              document.getElementById('inpCustomGamePkg').value = '';
              closeAddGameModal();
              renderGameHubList();
              showToast(`➕ Đã lưu "${nameInput}" vào bộ nhớ Game Hub!`);
            }

            function renderInstalledAppPicker() {
              const q = (document.getElementById('inpPickerSearch')?.value || '').toLowerCase().trim();
              document.getElementById('pickerAppCount').textContent = allScannedDeviceApps.length;
              const filtered = allScannedDeviceApps.filter(a => !q || a.name.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q));
              const box = document.getElementById('installedAppPickerList');
              if (filtered.length === 0) {
                box.innerHTML = `<div style="font-size:11px; color:var(--text-secondary); padding:10px; text-align:center;">Nhập tên ở mục phía trên hoặc bấm Quét lại để tải danh sách ứng dụng.</div>`;
                return;
              }
              box.innerHTML = filtered.slice(0, 50).map(app => {
                const initials = (app.name || 'AP').substring(0, 2).toUpperCase();
                const iconHtml = app.icon
                  ? `<img src="${app.icon}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='${initials}';" />`
                  : `<span>${initials}</span>`;
                return `
                  <div class="game-card-item" style="padding:8px 10px; margin-bottom:6px;">
                    <div class="game-icon-box" style="width:36px; height:36px;">${iconHtml}</div>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${app.name}</div>
                      <div style="font-size:10px; color:var(--text-secondary);">${app.pkg}</div>
                    </div>
                    <button class="badge-status-ok tap-spring" onclick="pickAppFromDeviceToGameHub('${app.pkg}')">➕ Chọn</button>
                  </div>
                `;
              }).join('');
            }

            function pickAppFromDeviceToGameHub(pkg) {
              hapticTick();
              const found = allScannedDeviceApps.find(a => a.pkg === pkg);
              if (!found) return;
              const resSpec = document.getElementById('selCustomGameRes').value;
              const modeSpec = document.getElementById('selCustomGameMode').value;
              userSavedGames = userSavedGames.filter(g => g.pkg !== pkg);
              userSavedGames.unshift({
                name: found.name,
                pkg: found.pkg,
                res: resSpec,
                mode: modeSpec,
                installed: true,
                icon: found.icon || ''
              });
              saveCustomGamesToStorage();
              closeAddGameModal();
              renderGameHubList();
              showToast(`✅ Đã lưu "${found.name}" vào Game Hub!`);
            }

            function removeGameFromHub(pkg) {
              hapticTick();
              userSavedGames = userSavedGames.filter(g => g.pkg !== pkg);
              detectedInstalledGames = detectedInstalledGames.filter(g => g.pkg !== pkg);
              saveCustomGamesToStorage();
              renderGameHubList();
              showToast('Đã xóa khỏi Game Hub');
            }

            function toggleWhitelistAppMemory(pkg, el) {
              hapticTick();
              el.classList.toggle('on');
              const isOn = el.classList.contains('on');
              savedWhitelistMap[pkg] = isOn;
              const target = allScannedDeviceApps.find(a => a.pkg === pkg);
              if (target) target.protected = isOn;
              try {
                localStorage.setItem('bang_v19_whitelist', JSON.stringify(savedWhitelistMap));
              } catch (e) {}
              showToast(isOn ? `🛡️ Đã lưu bảo vệ ${pkg} vào trí nhớ` : `Đã gỡ bảo vệ ${pkg}`);
            }

            function renderWhitelistApps() {
              const q = (document.getElementById('appSearchInput')?.value || '').toLowerCase().trim();
              const filtered = allScannedDeviceApps.filter(a => !q || a.name.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q));
              const box = document.getElementById('whitelistContainer');
              box.innerHTML = filtered.slice(0, 60).map(app => {
                const initials = (app.name || 'AP').substring(0, 2).toUpperCase();
                const iconHtml = app.icon
                  ? `<img src="${app.icon}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='${initials}';" />`
                  : `<span>${initials}</span>`;
                return `
                  <div class="game-card-item" style="padding:8px 10px; margin-bottom:6px;">
                    <div class="game-icon-box" style="width:36px; height:36px;">${iconHtml}</div>
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${app.name}</div>
                      <div style="font-size:10px; color:var(--text-secondary);">Đã lưu trí nhớ bảo vệ khi dọn RAM</div>
                    </div>
                    <div class="v14-switch ${app.protected ? 'on' : ''}" onclick="toggleWhitelistAppMemory('${app.pkg}', this)"></div>
                  </div>
                `;
              }).join('');
            }

            // ================= 10. TỪ ĐIỂN GIẢI MÃ TÊN MÁY MỞ RỘNG (BAO GỒM CẢ 2606FRN72Y & CÁC ĐỜI REDMI MỚI) =================
            const deviceCommercialMap = {
              '2606FRN72Y': 'Xiaomi Redmi 15 / Note Series',
              '23129RAA4G': 'Xiaomi Redmi Note 13 4G',
              '23129RA5FL': 'Xiaomi Redmi Note 13 4G NFC',
              'sapphire': 'Xiaomi Redmi Note 13 4G',
              'sapphiren': 'Xiaomi Redmi Note 13 4G NFC',
              '23100RN82L': 'Xiaomi Redmi 13C',
              '23106RN0DA': 'Xiaomi Redmi 13C',
              '23108RN04Y': 'Xiaomi Redmi 13C',
              'gale': 'Xiaomi Redmi 13C',
              'gust': 'Xiaomi Redmi 13C',
              '23124RA7EO': 'Xiaomi Redmi Note 13 5G',
              'gold': 'Xiaomi Redmi Note 13 5G',
              '23090RA98G': 'Xiaomi Redmi Note 13 Pro+ 5G',
              'zircon': 'Xiaomi Redmi Note 13 Pro+ 5G',
              '2312DRA50G': 'Xiaomi Redmi Note 13 Pro 5G',
              'garnet': 'Xiaomi Redmi Note 13 Pro 5G',
              '2409BRN2CA': 'Xiaomi Redmi 14C',
              'lake': 'Xiaomi Redmi 14C',
              '2404ARN45A': 'Xiaomi Redmi 13',
              'moon': 'Xiaomi Redmi 13'
            };

            const socCommercialMap = {
              'SM6225': 'Qualcomm Snapdragon 680 4G (6nm)',
              'SM6375': 'Qualcomm Snapdragon 695 5G (6nm)',
              'SM4450': 'Qualcomm Snapdragon 4 Gen 2 (4nm)',
              'SM6450': 'Qualcomm Snapdragon 6 Gen 1 (4nm)',
              'SM7435': 'Qualcomm Snapdragon 7s Gen 2 (4nm)',
              'SM7635': 'Qualcomm Snapdragon 7s Gen 3 (4nm)',
              'SM7475': 'Qualcomm Snapdragon 7+ Gen 2 (4nm)',
              'SM7675': 'Qualcomm Snapdragon 7+ Gen 3 (4nm)',
              'SM8475': 'Qualcomm Snapdragon 8+ Gen 1 (4nm)',
              'SM8550': 'Qualcomm Snapdragon 8 Gen 2 (4nm)',
              'SM8650': 'Qualcomm Snapdragon 8 Gen 3 (4nm)',
              'SM8750': 'Qualcomm Snapdragon 8 Elite (3nm)',
              'MT6769Z': 'MediaTek Helio G85 (12nm)',
              'MT6769': 'MediaTek Helio G85 / G91-Ultra (12nm)',
              'MT6768': 'MediaTek Helio G88 / G85 (12nm)',
              'MT6789': 'MediaTek Helio G99-Ultra (6nm)',
              'MT6833': 'MediaTek Dimensity 6080 (6nm)',
              'MT6835': 'MediaTek Dimensity 6100+ / 6300 (6nm)',
              'MT6877': 'MediaTek Dimensity 1080 / 7050 (6nm)',
              'MT6886': 'MediaTek Dimensity 7200-Ultra (4nm)',
              'MT6897': 'MediaTek Dimensity 8300-Ultra (4nm)',
              'MT6989': 'MediaTek Dimensity 9300+ (4nm)'
            };

            function detectHardwareGpu() {
              try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return { renderer: 'Adreno / Mali GPU', vendor: 'OpenGL ES 3.2' };
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) {
                  return {
                    renderer: gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || 'Hardware GPU',
                    vendor: gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || 'OpenGL ES 3.2'
                  };
                }
              } catch (e) {}
              return { renderer: 'Qualcomm Adreno / ARM Mali', vendor: 'OpenGL ES 3.2' };
            }

            function hapticTick() {
              if (window.BangBridge && window.BangBridge.triggerHaptic) window.BangBridge.triggerHaptic();
            }

            function toggleLightDarkTheme() {
              hapticTick();
              document.body.classList.toggle('light-mode');
              const isLight = document.body.classList.contains('light-mode');
              try { localStorage.setItem('bang_v19_light_theme', isLight ? '1' : '0'); } catch (e) {}
              showToast(isLight ? '☀️ Đã lưu Giao diện Sáng' : '🌙 Đã lưu Giao diện Tối');
            }

            function setRingProgress(circleId, textId, pct) {
              const clamped = Math.max(0, Math.min(100, Math.round(pct)));
              const circle = document.getElementById(circleId);
              const txt = document.getElementById(textId);
              if (circle) {
                const circumference = 150.8;
                const offset = circumference - (clamped / 100) * circumference;
                circle.setAttribute('stroke-dashoffset', offset.toFixed(1));
              }
              if (txt) txt.textContent = clamped + '%';
            }

            function toggleStealthVneidSwitch(el) {
              hapticTick();
              const targetOn = !el.classList.contains('on');
              const stStealth = document.getElementById('stStealthVneid');
              const cardStealth = document.getElementById('cardStealthVneid');

              if (window.BangBridge && window.BangBridge.toggleStealthVneidMode) {
                try {
                  const res = JSON.parse(window.BangBridge.toggleStealthVneidMode(targetOn));
                  if (res.ok) {
                    el.classList.toggle('on', targetOn);
                    if (cardStealth) {
                      cardStealth.classList.toggle('active-on', targetOn);
                      cardStealth.classList.remove('error-rejected');
                    }
                    if (stStealth) {
                      stStealth.className = 'tweak-status-line ok';
                      stStealth.textContent = '✓ ' + res.msg;
                    }
                    appendLog(res.msg, 'STEALTH 5 LỚP');
                    showToast('🛡️ ' + res.msg);
                  } else {
                    el.classList.remove('on');
                    if (cardStealth) cardStealth.classList.add('error-rejected');
                    if (stStealth) {
                      stStealth.className = 'tweak-status-line err';
                      stStealth.textContent = '❌ ' + res.msg;
                    }
                    showToast('❌ ' + res.msg);
                  }
                } catch (e) {}
              } else {
                showToast('❌ Chưa cấp quyền Shizuku!');
                requestShizukuAuthNow();
              }
            }

            function onRamSliderChange(val) {
              const mb = parseInt(val, 10) || 4800;
              savedRamThreshold = mb;
              const dau = 'Đầu ' + (mb / 1000).toFixed(1) + 'x';
              document.getElementById('sliderValText').textContent = `${mb} MB (${dau})`;
              try { localStorage.setItem('bang_v19_ram_threshold', String(mb)); } catch (e) {}
            }

            function cleanRamNow() {
              hapticTick();
              const unprotectedCmd = allScannedDeviceApps
                .filter(a => !a.protected && !a.pkg.includes('bangtech') && !a.pkg.includes('shizuku'))
                .slice(0, 12)
                .map(a => `am force-stop ${a.pkg}`)
                .join(' && ');
              const fullCmd = unprotectedCmd ? `${unprotectedCmd} && am kill-all && pm trim-caches 999G` : 'am kill-all && pm trim-caches 999G';

              runVerifiedCustomCmd('clean_ram_' + Date.now(), true, '', '', '', fullCmd, '', (res) => {
                if (res.ok) {
                  appendLog('Giải phóng RAM qua Shizuku & bảo toàn danh sách Whitelist', 'SHIZUKU OK');
                  showToast('🚀 Đã giải phóng RAM thật & bảo vệ 100% Whitelist!');
                  triggerManualFullScan();
                } else {
                  appendLog('Lỗi dọn RAM: ' + res.reason, 'TỪ CHỐI');
                  showToast('❌ ' + res.reason);
                  if (res.needShizuku) requestShizukuAuthNow();
                }
              });
            }

            function restoreAllDefaults() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.runAntiOtgRescue) {
                const msg = window.BangBridge.runAntiOtgRescue();
                appendLog(msg, 'HOÀN TÁC GỐC');
              }
              applyTrueAnimationScale('1.0', 'Mặc định 1.0x');
              applyDnsServer('auto');
              setTimeout(() => triggerManualFullScan(), 500);
              showToast('↺ Đã trả toàn bộ cài đặt trên máy về mặc định ban đầu!');
            }

            // CẬP NHẬT TRẠNG THÁI SHIZUKU & TỰ ĐỘNG XẾP GỌN THÀNH 1 DÒNG MỎNG KHI SẴN SÀNG (ẢNH 4 - CÂU 4)
            function updateShizukuStatusUI(ready, running, authorized, label) {
              const bShizuku = document.getElementById('statusBadgeShizuku');
              const subEl = document.getElementById('shizukuDetailSub');
              const titleEl = document.getElementById('shizukuCompactTitle');
              if (!bShizuku) return;

              if (ready || authorized) {
                bShizuku.className = 'badge-status-ok';
                bShizuku.textContent = '✓ Shizuku Sẵn sàng';
                if (titleEl) titleEl.textContent = 'Shizuku UID 2000 • Ẩn ADB 5 Lớp';
                if (subEl) subEl.textContent = 'Đã kết nối 0ms • Chạm dấu ▾ bên phải để mở rộng';
                // Tự động xếp gọn mượt mà thành 1 dòng thanh trạng thái mỏng nếu người dùng chưa chủ động bấm mở ra
                if (!isShizukuBannerManuallyExpanded) {
                  toggleShizukuBannerCollapse(true);
                }
              } else if (running && !authorized) {
                bShizuku.className = 'badge-status-wait';
                bShizuku.textContent = 'Chạm cấp quyền';
                if (subEl) subEl.textContent = 'Shizuku đang chạy — Hãy bấm "Cấp quyền & Kết nối Shizuku" bên dưới!';
                toggleShizukuBannerCollapse(false);
              } else {
                bShizuku.className = 'badge-status-wait';
                bShizuku.textContent = 'Shizuku chưa chạy';
                if (subEl) subEl.textContent = 'Hãy bấm "Mở ứng dụng Shizuku" và khởi động dịch vụ Shizuku trước.';
                toggleShizukuBannerCollapse(false);
              }
            }

            // Chuyển mục 2 chiều mượt mà kiểu OriginOS 7 + Lướt viên thuốc kính Apple Liquid Glass
            function switchTab(idx) {
              if (idx === currentTabIdx) return;
              const directionClass = idx > currentTabIdx ? 'anim-right' : 'anim-left';
              currentTabIdx = idx;
              hapticTick();

              document.querySelectorAll('.tab-pane').forEach((el, i) => {
                el.classList.remove('active', 'anim-right', 'anim-left');
                if (i === idx) {
                  void el.offsetWidth;
                  el.classList.add('active', directionClass);
                }
              });

              document.querySelectorAll('.dock-tab-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
              const bar = document.getElementById('glassNavBar');
              const lens = document.getElementById('navLiquidLens');
              if (bar && lens) {
                const slotW = (bar.clientWidth - 8) / 5;
                lens.style.transform = `translate3d(${idx * slotW}px, 0, 0) scaleX(1.12) scaleY(0.95)`;
                clearTimeout(window._lensTimer);
                window._lensTimer = setTimeout(() => {
                  lens.style.transform = `translate3d(${idx * slotW}px, 0, 0) scaleX(1) scaleY(1)`;
                }, 220);
              }
              if (idx === 3) updateRealtimeBatteryOscilloscope();
              window.scrollTo({ top: 0, behavior: 'instant' });
            }

            (function initNavSwipe() {
              const bar = document.getElementById('glassNavBar');
              const lens = document.getElementById('navLiquidLens');
              if (!bar || !lens) return;
              let navDrag = false;
              bar.addEventListener('pointerdown', e => {
                navDrag = true;
                bar.setPointerCapture(e.pointerId);
              });
              bar.addEventListener('pointermove', e => {
                if (!navDrag) return;
                const rect = bar.getBoundingClientRect();
                const slotW = (rect.width - 8) / 5;
                const relX = Math.max(0, Math.min(slotW * 4, e.clientX - rect.left - slotW / 2));
                lens.style.transition = 'none';
                lens.style.transform = `translate3d(${relX}px, 0, 0) scaleX(1.10)`;
              });
              bar.addEventListener('pointerup', e => {
                if (!navDrag) return;
                navDrag = false;
                lens.style.transition = 'transform 380ms var(--origin-spring)';
                const rect = bar.getBoundingClientRect();
                const target = Math.max(0, Math.min(4, Math.floor(((e.clientX - rect.left) / rect.width) * 5)));
                switchTab(target);
              });
            })();

            function renderSavedLogsToBox() {
              const box = document.getElementById('consoleBox');
              const badge = document.getElementById('cmdCountBadge');
              if (!box) return;
              if (badge) badge.textContent = savedLogs.length + ' tác vụ';
              if (savedLogs.length === 0) {
                box.innerHTML = '✓ BangOptimize v19.0 OriginOS 7 Fire đã khởi tạo.<br>✓ Tích hợp Macro Bấm Đúp Cục Tròn, Ẩn ADB 5 Lớp & Đọc Tên Máy Thương Mại.';
                return;
              }
              box.innerHTML = savedLogs.map(line => `<div>${line}</div>`).join('');
            }

            function appendLog(actionDesc, status) {
              const now = new Date();
              const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
              const entry = `[${timeStr} • ${status}] ${actionDesc}`;
              savedLogs.unshift(entry);
              if (savedLogs.length > 80) savedLogs.pop();
              try { localStorage.setItem('bang_v19_logs', JSON.stringify(savedLogs)); } catch (e) {}
              renderSavedLogsToBox();
            }

            function clearSavedLogs() {
              hapticTick();
              savedLogs = [];
              try { localStorage.removeItem('bang_v19_logs'); } catch (e) {}
              renderSavedLogsToBox();
              showToast('🗑️ Đã xóa lịch sử nhật ký!');
            }

            function showToast(msg) {
              const t = document.getElementById('toastPill');
              t.textContent = msg;
              t.classList.add('show');
              clearTimeout(window._toastTimer);
              window._toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
            }

            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              const totalMb = data.totalRamMb || 5606;
              const usedMb = data.usedRamMb || 3410;
              const availMb = data.availRamMb || (totalMb - usedMb);
              const ramPct = Math.round((usedMb / Math.max(1, totalMb)) * 100);
              const stoPct = data.usedStoragePct || 65;
              const batPct = data.battery || 78;

              setRingProgress('ringCircleBat', 'ringTextBat', batPct);
              setRingProgress('ringCircleRam', 'ringTextRam', ramPct);
              setRingProgress('ringCircleSto', 'ringTextSto', stoPct);

              const gsRam = document.getElementById('gsPrevRam');
              if (gsRam) gsRam.textContent = `${ramPct}%`;

              document.getElementById('ringSubRam').textContent = `Trống ${availMb.toLocaleString('en-US')} MB`;
              document.getElementById('ringSubSto').textContent = `Trống ${data.freeStorageGb || '12.5'} / ${data.totalStorageGb || 128} GB`;

              // Ưu tiên tên thương mại đọc trực tiếp từ ro.product.marketname / DEVICE_NAME (Sửa triệt để lỗi hiện mã 2606FRN72Y)
              const rawM = (data.rawModel || '').trim();
              const devCode = (data.deviceCode || '').trim();
              const mktName = (data.marketingName || '').trim();
              let commName = deviceCommercialMap[rawM] || deviceCommercialMap[devCode] || mktName || data.model || rawM;
              if (mktName && !mktName.includes(rawM)) {
                commName = mktName;
              }

              const rawSoc = (data.soc || '').trim().toUpperCase();
              const commSoc = socCommercialMap[rawSoc] || rawSoc || 'Octa-Core SoC';
              const gpuInfo = detectHardwareGpu();

              document.getElementById('headerDeviceTitle').textContent = commName;
              document.getElementById('hwCommName').textContent = commName;
              document.getElementById('hwRawModelCode').textContent = `Mã: ${rawM} · Board: ${devCode || data.board || 'arm64'}`;
              document.getElementById('hwSocFull').textContent = commSoc;
              document.getElementById('hwSocSub').textContent = `Mã SoC: ${rawSoc} · ${data.cores || 8} nhân xử lý`;
              document.getElementById('hwGpuRenderer').textContent = gpuInfo.renderer;
              document.getElementById('hwGpuVendor').textContent = `${gpuInfo.vendor} · Phần cứng thật`;
              document.getElementById('hwCustomOs').textContent = data.customOs || 'Android OS';
              document.getElementById('hwAndroidApi').textContent = `${data.android} · ${data.arch || 'arm64-v8a'}`;
              document.getElementById('hwScreenSpec').textContent = `${nativeWidth}x${nativeHeight} · ${nativeDpi} DPI`;
              document.getElementById('hwRefreshSpec').textContent = `Đang chạy ${data.hz || 90}Hz / Tối đa ${data.maxHz || 120}Hz`;
              document.getElementById('hwRamDetail').textContent = `${usedMb} / ${totalMb} MB (${ramPct}%)`;
              document.getElementById('hwStoDetail').textContent = `Đã dùng ${data.usedStorageGb || '--'} / ${data.totalStorageGb || '--'} GB (Trống ${data.freeStorageGb || '--'} GB)`;
              document.getElementById('detectedHzTag').textContent = `${data.hz || 90}Hz / Max ${data.maxHz || 120}Hz`;

              if (data.batteryGauge) {
                const bg = data.batteryGauge;
                const dMah = bg.designMah || 5000;
                const cMah = bg.currentChargedMah || 0;
                const fMah = bg.estimatedFullMah || 0;

                document.getElementById('batDesignMahSub').textContent = `Thiết kế NSX: ${dMah.toLocaleString('vi-VN')} mAh`;
                document.getElementById('batHwHealthBadge').textContent = bg.hwHealthStatus || 'Tốt (Good)';
                document.getElementById('batGaugeSourceText').textContent = `Nguồn đo: ${bg.gaugeSource || 'IC Fuel Gauge'} (Thực tế 100%)`;

                if (cMah > 100) {
                  document.getElementById('batChargedNowMah').textContent = `${cMah.toLocaleString('vi-VN')} mAh (${batPct}%)`;
                } else {
                  const calcNow = Math.round((batPct / 100) * dMah);
                  document.getElementById('batChargedNowMah').textContent = `~${calcNow.toLocaleString('vi-VN')} mAh (${batPct}%)`;
                }

                if (fMah > 1000) {
                  const realRatio = Math.min(100, Math.round((fMah / dMah) * 100));
                  document.getElementById('batEstimatedFullMah').textContent = `${fMah.toLocaleString('vi-VN')} mAh (~${realRatio}%)`;
                  document.getElementById('batHealthRealNote').textContent = bg.cycleCount > 0
                    ? `Chu kỳ sạc: ${bg.cycleCount} lần · Đo từ IC nguồn`
                    : `Ước tính từ lượng điện nạp thực tế của IC nguồn`;
                } else {
                  document.getElementById('batEstimatedFullMah').textContent = `Cần sạc > 20% để IC chốt số mAh`;
                }
              }

              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              const swGs = document.getElementById('swFloatingSidebar');
              const stGs = document.getElementById('gameSpaceStatusLine');
              if (swGs) {
                swGs.classList.toggle('on', !!data.gameWatcherActive);
                if (stGs && data.gameWatcherActive) {
                  stGs.className = 'tweak-status-line ok';
                  stGs.textContent = '✓ Đang canh gác 24/7! Mở Game từ màn hình chính vẫn tự động bật Tối ưu & Cục tròn thu nhỏ.';
                }
              }

              const mfr = (data.manufacturer || '').toUpperCase();
              if (mfr.includes('VIVO') || mfr.includes('IQOO')) currentSelectedBrand = 'ORIGINOS';
              else if (mfr.includes('OPPO') || mfr.includes('REALME') || mfr.includes('ONEPLUS')) currentSelectedBrand = 'COLOROS';
              else if (mfr.includes('SAMSUNG')) currentSelectedBrand = 'ONEUI';
              else currentSelectedBrand = 'HYPEROS';

              updateShizukuStatusUI(!!data.shizukuReady, !!data.shizukuRunning, !!data.shizukuAuthorized, data.shizukuLabel);

              if (data.scannedStates) {
                syncScannedStatesFromDevice(data.scannedStates);
              } else {
                renderAllTweakLists(currentSelectedBrand);
              }

              if (data.isColdStart) {
                setTimeout(() => rescanDeviceGamesNow(), 350);
              }
            };

            (function initStartup() {
              const g = detectHardwareGpu();
              document.getElementById('hwGpuRenderer').textContent = g.renderer;
              document.getElementById('hwGpuVendor').textContent = `${g.vendor} · Đọc trực tiếp phần cứng`;
              const slider = document.getElementById('ramSlider');
              if (slider) {
                slider.value = savedRamThreshold;
                onRamSliderChange(savedRamThreshold);
              }
              renderAllTweakLists('HYPEROS');
              renderDnsGrid();
              renderGameHubList();
              renderWhitelistApps();
              renderSavedLogsToBox();
              updateRealtimeBatteryOscilloscope();
            })();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize v19.0 OriginOS7 Fire APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v19.0-OriginOS7-Fire
          path: app/build/outputs/apk/debug/app-debug.apk
