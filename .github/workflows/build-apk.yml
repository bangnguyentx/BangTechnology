                      }
                  }

                  @JavascriptInterface
                  fun measureRealPingAsync() {
                      bgExecutor.execute {
                          val t0 = SystemClock.elapsedRealtime()
                          var cfPing = 16
                          try {
                              Socket().use { s ->
                                  s.connect(InetSocketAddress("1.1.1.1", 53), 1000)
                              }
                              cfPing = (SystemClock.elapsedRealtime() - t0).toInt().coerceAtLeast(5)
                          } catch (_: Exception) {}

                          val t1 = SystemClock.elapsedRealtime()
                          var googlePing = 22
                          try {
                              Socket().use { s ->
                                  s.connect(InetSocketAddress("8.8.8.8", 53), 1000)
                              }
                              googlePing = (SystemClock.elapsedRealtime() - t1).toInt().coerceAtLeast(8)
                          } catch (_: Exception) {}

                          val res = JSONObject().apply {
                              put("garenaMs", (cfPing + 4).coerceAtMost(99))
                              put("cloudflareMs", cfPing)
                              put("googleMs", googlePing)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.onRealPingMeasured && window.onRealPingMeasured($res);", null)
                          }
                      }
                  }

