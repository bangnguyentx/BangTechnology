                      currentPts.forEachIndexed { index, pair ->
                          val pinSize = fixedDp(34)
                          val pin = TextView(this).apply {
                              text = "${index + 1}"
                              setTextSize(android.util.TypedValue.COMPLEX_UNIT_PX, fixedDp(12).toFloat())
                              gravity = Gravity.CENTER
                              setTypeface(typeface, Typeface.BOLD)
                              setTextColor(Color.parseColor("#0A0302"))
                              background = GradientDrawable().apply {
                                  shape = GradientDrawable.OVAL
                                  setColor(Color.parseColor("#B3F50B"))
                                  setStroke(fixedDp(2), Color.parseColor("#E20A21"))
                              }
                          }
                          val pinLp = FrameLayout.LayoutParams(pinSize, pinSize).apply {
                              leftMargin = pair.first - pinSize / 2
                              topMargin = pair.second - pinSize / 2
                          }
                          var sx = 0
                          var sy = 0
                          var tx = 0f
                          var ty = 0f
                          pin.setOnTouchListener { v, ev ->
                              when (ev.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      sx = pinLp.leftMargin
                                      sy = pinLp.topMargin
                                      tx = ev.rawX
                                      ty = ev.rawY
                                      true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      val nx = (sx + (ev.rawX - tx).toInt()).coerceAtLeast(0)
                                      val ny = (sy + (ev.rawY - ty).toInt()).coerceAtLeast(0)
                                      pinLp.leftMargin = nx
                                      pinLp.topMargin = ny
                                      v.layoutParams = pinLp
                                      currentPts[index] = Pair(nx + pinSize / 2, ny + pinSize / 2)
                                      true
                                  }
                                  else -> false
                              }
