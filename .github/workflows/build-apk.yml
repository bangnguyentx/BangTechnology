            function hapticTick() {
              if (window.BangBridge && window.BangBridge.triggerHaptic) {
                window.BangBridge.triggerHaptic();
              }
            }

            // ================= VIDEO 2: ANIMATED NUMBER COUNTER (CHẠY SỐ MƯỢT 120FPS) =================
            function animateNumber(elId, endVal, duration = 420) {
              const el = document.getElementById(elId);
              if (!el) return;
              const startVal = parseInt(String(el.textContent).replace(/,/g, ''), 10) || 0;
              if (startVal === endVal) return;
              const startTime = performance.now();
              function step(now) {
                const p = Math.min(1, (now - startTime) / duration);
                const ease = 1 - Math.pow(1 - p, 3);
                const cur = Math.round(startVal + (endVal - startVal) * ease);
                el.textContent = cur.toLocaleString('en-US');
                if (p < 1) requestAnimationFrame(step);
              }
              requestAnimationFrame(step);
            }

            // ================= VIDEO 4: INTERACTIVE METABALL LIQUID GLASS DROPLET PHYSICS =================
            (function initMetaballDroplet() {
              const stage = document.getElementById('metaballStage');
              const orb = document.getElementById('liquidOrb');
              const proxy = document.getElementById('gooDropProxy');
              if (!stage || !orb || !proxy) return;

              let homeX = 0, homeY = 58;
              let curX = 0, curY = 58;
              let dragging = false;
              let startPtrX = 0, startPtrY = 0;
              let grabStartX = 0, grabStartY = 0;

              function layoutHome() {
                const rect = stage.getBoundingClientRect();
                homeX = Math.round(rect.width * 0.72);
                homeY = 54;
                if (!dragging) setOrbPos(homeX, homeY, 1, 1);
              }

              function setOrbPos(x, y, sx, sy) {
                curX = x; curY = y;
                const tf = `translate3d(${x}px, ${y}px, 0) scale(${sx}, ${sy})`;
                orb.style.transform = tf;
                proxy.style.transform = tf;
              }

              orb.addEventListener('pointerdown', (e) => {
                dragging = true;
                hapticTick();
                orb.setPointerCapture(e.pointerId);
                startPtrX = e.clientX;
                startPtrY = e.clientY;
                grabStartX = curX;
                grabStartY = curY;
                orb.style.transition = 'none';
                proxy.style.transition = 'none';
              });

              orb.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const dx = e.clientX - startPtrX;
                const dy = e.clientY - startPtrY;
                const rect = stage.getBoundingClientRect();
                const nx = Math.max(8, Math.min(rect.width - 58, grabStartX + dx));
                const ny = Math.max(4, Math.min(rect.height - 54, grabStartY + dy));
                // Biến dạng giọt chất lỏng nhẹ theo lực kéo
                const distFromBar = Math.abs(ny - 20);
                const stretchY = (distFromBar > 18 && distFromBar < 48) ? 1.14 : 1.0;
                const stretchX = stretchY > 1 ? 0.91 : 1.0;
                setOrbPos(nx, ny, stretchX, stretchY);
              });

              function endOrbDrag() {
                if (!dragging) return;
                dragging = false;
                hapticTick();
                const spring = 'transform 420ms cubic-bezier(0.22, 1.35, 0.36, 1)';
                orb.style.transition = spring;
                proxy.style.transition = spring;
                setOrbPos(homeX, homeY, 1, 1);
                cleanRamNow();
              }

              orb.addEventListener('pointerup', endOrbDrag);
              orb.addEventListener('pointercancel', endOrbDrag);
              window.addEventListener('resize', layoutHome);
              setTimeout(layoutHome, 60);
            })();

            // ================= VIDEO 3: DRAGGABLE LIQUID GLASS NAVBAR LENS =================
            (function initGlassNavBarPhysics() {
              const bar = document.getElementById('glassNavBar');
              const lens = document.getElementById('navLiquidLens');
              if (!bar || !lens) return;

              let isDraggingNav = false;

              function updateLensPosition(tabIdx, stretch = 1.0) {
                const slotWidth = (bar.clientWidth - 12) / 4;
                const tx = tabIdx * slotWidth;
                lens.style.transform = `translate3d(${tx}px, 0, 0) scaleX(${stretch})`;
              }

              window.moveNavLensToTab = function(idx) {
                updateLensPosition(idx, 1.08);
                setTimeout(() => updateLensPosition(idx, 1.0), 160);
              };

              bar.addEventListener('pointerdown', (e) => {
                isDraggingNav = true;
                bar.setPointerCapture(e.pointerId);
              });

              bar.addEventListener('pointermove', (e) => {
                if (!isDraggingNav) return;
                const rect = bar.getBoundingClientRect();
                const relX = Math.max(0, Math.min(rect.width - 12, e.clientX - rect.left - 6));
                const slotWidth = (rect.width - 12) / 4;
                const maxTx = slotWidth * 3;
                const clampedTx = Math.max(0, Math.min(maxTx, relX - slotWidth / 2));
                lens.classList.add('dragging');
                lens.style.transform = `translate3d(${clampedTx}px, 0, 0) scaleX(1.12) scaleY(1.04)`;
              });

              function finishNavDrag(e) {
                if (!isDraggingNav) return;
                isDraggingNav = false;
                lens.classList.remove('dragging');
                const rect = bar.getBoundingClientRect();
                const relX = e.clientX - rect.left;
                const targetTab = Math.max(0, Math.min(3, Math.floor((relX / rect.width) * 4)));
                switchTab(targetTab);
              }

              bar.addEventListener('pointerup', finishNavDrag);
              bar.addEventListener('pointercancel', () => {
                isDraggingNav = false;
                lens.classList.remove('dragging');
                updateLensPosition(currentTabIndex, 1.0);
              });
              window.addEventListener('resize', () => updateLensPosition(currentTabIndex, 1.0));
            })();

            // ================= KHỞI TẠO & CẬP NHẬT CÔNG TẮC (0MS LAG) =================
            function buildSwitchHTML(item) {
              return `
                <div id="card_${item.id}" class="tweak-item-v14" data-search="${(item.name + ' ' + item.desc + ' ' + item.tag).toLowerCase()}">
                  <div class="tweak-row-main">
                    <div style="flex:1;">
                      <div class="tweak-title">${item.name} <span class="tag-pill">${item.tag}</span></div>
                      <div class="tweak-sub">${item.desc}</div>
                    </div>
                    <div id="sw_${item.id}" class="v14-switch" onclick="onUserToggleSwitch('${item.id}')"></div>
                  </div>
                  <div id="st_${item.id}" class="verify-line idle">Trạng thái: Chưa bật</div>
                </div>
              `;
            }

            function initAllSwitchDOM() {
              document.getElementById('glToolList').innerHTML = glToolItems.map(buildSwitchHTML).join('');
              document.getElementById('group1List').innerHTML = featGroup1.map(buildSwitchHTML).join('');
              document.getElementById('group2List').innerHTML = featGroup2.map(buildSwitchHTML).join('');
              updateCountersAndMasterBar();
            }

            function updateSingleSwitchDOM(id) {
              const item = allSwitchMap.get(id);
              if (!item) return;
              const card = document.getElementById('card_' + id);
              const sw = document.getElementById('sw_' + id);
              const st = document.getElementById('st_' + id);
              if (!card || !sw || !st) return;

              sw.classList.toggle('on', !!item.on);
              card.classList.toggle('verified-on', !!item.on && item.statusType === 'ok');
              card.classList.toggle('verified-err', !item.on && item.statusType === 'err');
              st.className = 'verify-line ' + (item.statusType || 'idle');
              st.textContent = item.statusText || (item.on ? 'Đang hoạt động' : 'Trạng thái: Chưa bật');
            }

            function filterTweakDOM() {
              const q = (document.getElementById('tweakSearchInput')?.value || '').toLowerCase().trim();
              document.querySelectorAll('#group1List .tweak-item-v14, #group2List .tweak-item-v14').forEach(el => {
                const txt = el.getAttribute('data-search') || '';
                el.style.display = (!q || txt.includes(q)) ? 'block' : 'none';
              });
            }

            function onUserToggleSwitch(id) {
              const item = allSwitchMap.get(id);
              if (!item) return;
              hapticTick();

              const targetOn = !item.on;
              item.on = targetOn;
              item.statusType = 'pending';
              item.statusText = targetOn ? 'Đang thực thi & xác thực trên thiết bị...' : 'Đang tắt...';
              updateSingleSwitchDOM(id);

              const cmdToRun = targetOn ? item.cmdOn : item.cmdOff;
              if (window.BangBridge && window.BangBridge.execVerifiedAsync) {
                window.BangBridge.execVerifiedAsync(
                  id,
                  targetOn,
                  cmdToRun,
                  item.verifyCmd || '',
                  item.expectVal || '',
                  item.minHz || 0
                );
              } else {
                setTimeout(() => {
                  window.onSwitchVerifiedResult({
                    itemId: id,
                    targetOn: targetOn,
                    ok: false,
                    reason: 'Chưa kết nối Shizuku UID 2000',
                    needAuth: true
                  });
                }, 140);
              }
            }

            let customCallbacks = {};
            window.onSwitchVerifiedResult = function(res) {
              if (!res) return;
              if (res.itemId && customCallbacks[res.itemId]) {
                const fn = customCallbacks[res.itemId];
                delete customCallbacks[res.itemId];
                if (res.cmd) appendLog(res.cmd, res.ok ? 'OK' : ('TỪ CHỐI: ' + res.reason));
                if (res.needAuth) openShizukuModal(res.reason);
                fn(res.ok, res.reason || 'Thiết bị không hỗ trợ');
                return;
              }

              const item = allSwitchMap.get(res.itemId);
              if (!item) return;

              if (res.ok) {
                item.on = res.targetOn;
                if (res.targetOn) {
                  item.statusType = 'ok';
                  const v = res.verifiedValue ? ` (${res.verifiedValue})` : '';
                  item.statusText = `Đã kích hoạt & xác nhận trên hệ thống${v}`;
                  showToast(`Đã bật: ${item.name}`);
                } else {
                  item.statusType = 'idle';
                  item.statusText = 'Trạng thái: Đã tắt';
                  showToast(`Đã tắt: ${item.name}`);
                }
                if (res.cmd) appendLog(res.cmd, 'OK');
              } else {
                item.on = false;
                item.statusType = 'err';
                item.statusText = `Không khả dụng: ${res.reason || 'Thiết bị không hỗ trợ'}`;
                showToast(`Không thể bật: ${res.reason}`);
                if (res.cmd) appendLog(res.cmd, `TỪ CHỐI: ${res.reason}`);
                if (res.needAuth) openShizukuModal(res.reason);
              }

              updateSingleSwitchDOM(res.itemId);
              updateCountersAndMasterBar();
            };

            function runCustomVerifiedCommand(cmd, verifyCmd, expectVal, cb) {
              const cid = 'custom_' + Date.now();
              customCallbacks[cid] = cb;
              if (window.BangBridge && window.BangBridge.execVerifiedAsync) {
                window.BangBridge.execVerifiedAsync(cid, true, cmd, verifyCmd, expectVal, 0);
              } else {
                cb(false, 'Chưa kết nối Shizuku UID 2000');
                openShizukuModal('Hãy cấp quyền Shizuku để thực thi tính năng này.');
              }
            }

            function updateCountersAndMasterBar() {
              const glOn = glToolItems.filter(x => x.on).length;
              const f1On = featGroup1.filter(x => x.on).length;
              const f2On = featGroup2.filter(x => x.on).length;
              const featOn = f1On + f2On;
              const totalActive = glOn + featOn + (floEnabled ? 1 : 0) + (xiaomiPlanEnabled ? 1 : 0) + (selectedOptLevel >= 0 ? 1 : 0);

              document.getElementById('glActiveCount').textContent = `${glOn}/${glToolItems.length}`;
              document.getElementById('featActiveCount').textContent = `${featOn}/12`;
              document.getElementById('activeCountBadge').textContent = totalActive > 0 ? `Đang bật ${totalActive} tính năng` : 'Chưa kích hoạt';
            }

            // ================= ĐIỀU HƯỚNG TAB & QUÉT TRẠNG THÁI =================
            function switchTab(idx) {
              currentTabIndex = idx;
              hapticTick();
              document.querySelectorAll('.tab-pane').forEach((el, i) => el.classList.toggle('active', i === idx));
              document.querySelectorAll('.v14-pill-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
              document.querySelectorAll('.ios27-nav-item').forEach((el, i) => el.classList.toggle('active', i === idx));
              if (window.moveNavLensToTab) window.moveNavLensToTab(idx);
              window.scrollTo({ top: 0, behavior: 'instant' });
            }

            window.onShizukuDiagnostic = function(info) {
              if (!info) return;
              const dot = document.getElementById('shizukuDot');
              const lbl = document.getElementById('shizukuTopLabel');
              if (info.state === 'READY') {
                dot.style.background = '#10B981';
                dot.style.boxShadow = '0 0 8px #10B981';
                lbl.textContent = 'Shizuku UID 2000';
                closeShizukuModal();
                syncRealSystemState(false);
              } else {
                dot.style.background = '#F43F5E';
                dot.style.boxShadow = 'none';
                lbl.textContent = info.state === 'NOT_RUNNING' ? 'Shizuku Tắt' : 'Cấp quyền';
                openShizukuModal(info.detail);
              }
            };

            function openShizukuModal(reason) {
              if (reason) document.getElementById('shizukuModalDesc').textContent = reason;
              document.getElementById('shizukuAlertModal').classList.add('open');
            }
            function closeShizukuModal() {
              document.getElementById('shizukuAlertModal').classList.remove('open');
            }
            function triggerShizukuAuthFromModal() {
              closeShizukuModal();
              requestShizukuPermission();
            }
            function openExternalShizukuApp() {
              if (window.BangBridge && window.BangBridge.openShizukuApp) window.BangBridge.openShizukuApp();
            }
            function requestShizukuPermission() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.requestShizuku) window.BangBridge.requestShizuku();
              else openShizukuModal('Không tìm thấy cầu nối Shizuku.');
            }

            function syncRealSystemState(notifyUser) {
              hapticTick();
              if (window.BangBridge && window.BangBridge.refreshHardware) window.BangBridge.refreshHardware();
              if (window.BangBridge && window.BangBridge.syncSystemStatesAsync) window.BangBridge.syncSystemStatesAsync();
              if (notifyUser) showToast('Đang đồng bộ thông số thực tế...');
            }

            window.onSystemStatesSynced = function(state) {
              if (!state || !state.connected) {
                updateCountersAndMasterBar();
                return;
              }
              const checks = [
                { id: 'gl_zero_lag', key: 'anim', val: '0.5' },
                { id: 'gl_120hz', key: 'peak_hz', val: '120' },
                { id: 'f1_ping', key: 'speed', val: '1' },
                { id: 'f1_touch', key: 'long_press', val: '150' },
                { id: 'f2_tier', key: 'tier', val: 'v:1,c:3,g:3' }
              ];
              checks.forEach(c => {
                const it = allSwitchMap.get(c.id);
                if (it && state[c.key] !== undefined) {
                  const actual = String(state[c.key]);
                  const matched = actual.includes(c.val);
                  it.on = matched;
                  it.statusType = matched ? 'ok' : 'idle';
                  it.statusText = matched ? `Đang bật trên máy (${actual})` : 'Trạng thái: Chưa bật';
                  updateSingleSwitchDOM(c.id);
                }
              });
              floEnabled = String(state.long_press) === '150';
              updateCountersAndMasterBar();
            };

            function selectOptLevel(idx, scale, label) {
              hapticTick();
              const items = document.querySelectorAll('#levelGrid .vibe-mode-item');
              if (selectedOptLevel === idx) {
                selectedOptLevel = -1;
                items.forEach(el => el.classList.remove('active'));
                document.getElementById('animLabel').textContent = 'Mặc định (Chưa bật)';
                runCustomVerifiedCommand('settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0 && settings put global animator_duration_scale 1.0', '', '', () => {});
                updateCountersAndMasterBar();
                return;
              }
              const cmd = `settings put global window_animation_scale ${scale} && settings put global transition_animation_scale ${scale} && settings put global animator_duration_scale ${scale}`;
              runCustomVerifiedCommand(cmd, 'settings get global window_animation_scale', scale, (ok, reason) => {
                if (ok) {
                  selectedOptLevel = idx;
                  items.forEach((el, i) => el.classList.toggle('active', i === idx));
                  document.getElementById('animLabel').textContent = label;
                  updateCountersAndMasterBar();
                  showToast('Đã kích hoạt: ' + label);
                } else {
                  showToast('Không thể bật: ' + reason);
                }
              });
            }

            function toggleFlorentino() {
              hapticTick();
              const target = !floEnabled;
              const cmd = target
                ? 'settings put secure long_press_timeout 150 && settings put secure multi_press_timeout 150 && settings put system pointer_speed 7'
                : 'settings put secure long_press_timeout 400 && settings put system pointer_speed 0';
              runCustomVerifiedCommand(cmd, 'settings get secure long_press_timeout', target ? '150' : '', (ok, reason) => {
                const btn = document.getElementById('btnFlo');
                const lbl = document.getElementById('floDelayText');
                if (ok) {
                  floEnabled = target;
                  btn.textContent = target ? 'Đã bật Profile Độ nhạy 0ms (Chạm để tắt)' : 'Kích hoạt Profile Độ nhạy 0ms (Pointer +7 · 150ms)';
                  lbl.textContent = target ? '0ms (150ms Polling)' : 'Mặc định';
                  lbl.style.color = target ? '#10B981' : '#FFFFFF';
                  updateCountersAndMasterBar();
                  showToast(target ? 'Đã kích hoạt độ nhạy 0ms' : 'Đã tắt độ nhạy 0ms');
                } else {
                  showToast('Lỗi: ' + reason);
                }
              });
            }

            function applyUniversalSpecialPlan() {
              hapticTick();
              const target = !xiaomiPlanEnabled;
              const cmd = target
                ? 'settings put system deviceLevelList v:1,c:3,g:3 && settings put global low_power 0 && settings put secure speed_mode 1'
                : 'settings put system deviceLevelList v:1,c:1,g:1';
              runCustomVerifiedCommand(cmd, 'settings get system deviceLevelList', target ? 'v:1,c:3,g:3' : '', (ok, reason) => {
                const btn = document.getElementById('btnXiaomiSpecial');
                if (ok) {
                  xiaomiPlanEnabled = target;
                  btn.textContent = target ? 'Đã mở khóa hiệu ứng & tối ưu xung nhịp (Chạm để tắt)' : 'Mở khóa hiệu ứng bị cắt giảm & Chặn bóp xung nhiệt';
                  updateCountersAndMasterBar();
                  showToast(target ? 'Đã mở khóa v:1,c:3,g:3' : 'Đã đưa về mặc định');
                } else {
                  showToast('Không thể áp dụng: ' + reason);
                }
              });
            }

            // ================= ĐỘ PHÂN GIẢI & RAM =================
            function setPresetRes(idx, w, h, dpi) {
              document.getElementById('inpW').value = w;
              document.getElementById('inpH').value = h;
              document.getElementById('inpDpi').value = dpi;
              applyResolution(true);
            }

            function applyResolution(isTest15s) {
              hapticTick();
              const w = document.getElementById('inpW').value;
              const h = document.getElementById('inpH').value;
              const dpi = document.getElementById('inpDpi').value;
              runCustomVerifiedCommand(`wm size ${w}x${h} && wm density ${dpi}`, 'wm size', `${w}x${h}`, (ok, reason) => {
                if (!ok) {
                  showToast('Không thể đổi độ phân giải: ' + reason);
                  return;
                }
                document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
                showToast(`Đã áp dụng ${w}x${h} @ ${dpi} DPI`);
                clearInterval(revertTimer);
                const btn = document.getElementById('btnTest15s');
                if (isTest15s) {
                  let sec = 15;
                  btn.textContent = `Hoàn tác (${sec}s)`;
                  revertTimer = setInterval(() => {
                    sec--;
                    btn.textContent = `Hoàn tác (${sec}s)`;
                    if (sec <= 0) {
                      clearInterval(revertTimer);
                      resetResolution();
                    }
                  }, 1000);
                } else {
                  btn.textContent = 'Thử 15s';
                }
              });
            }

            function resetResolution() {
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = 'Thử 15s';
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              runCustomVerifiedCommand('wm size reset && wm density reset', '', '', () => {
                showToast('Đã khôi phục màn hình gốc');
              });
            }

            function onRamSliderChange(val) {
              currentThreshold = parseInt(val, 10);
              const dau = 'Đầu ' + (currentThreshold / 1000).toFixed(1) + 'x';
              const pct = Math.round((currentRamUsed / Math.max(1, currentRamTotal)) * 100);
              const freeMb = Math.max(256, currentRamTotal - currentRamUsed);

              document.getElementById('sliderValText').textContent = `${currentThreshold} MB (${dau})`;
              document.getElementById('ramHeaderStat').textContent = `RAM: ${currentRamUsed}/${currentRamTotal} MB (${pct}%)`;
              document.getElementById('notifRamText').textContent = `Đang dùng ${currentRamUsed}/${currentRamTotal} MB · Mốc ${currentThreshold} MB`;
              document.getElementById('ramProgressFill').style.width = `${Math.min(100, Math.max(12, 100 - pct))}%`;
              animateNumber('animFreeRam', freeMb);

              if (window.BangBridge && window.BangBridge.setRamThreshold) {
                window.BangBridge.setRamThreshold(currentThreshold);
              }
            }

            function cleanRamNow() {
              hapticTick();
              const unprotected = allAppsList.filter(a => !a.protected).slice(0, 10).map(a => `am force-stop ${a.pkg}`).join(' && ');
              const fullCmd = unprotected ? `${unprotected} && am kill-all && pm trim-caches 999G` : 'am kill-all && pm trim-caches 999G';
              runCustomVerifiedCommand(fullCmd, '', '', (ok, reason) => {
                if (ok) {
                  currentRamUsed = Math.max(1950, currentRamUsed - 420);
                  onRamSliderChange(currentThreshold);
                  if (window.BangBridge && window.BangBridge.refreshHardware) window.BangBridge.refreshHardware();
                  showToast('Đã giải phóng RAM & làm mới bộ nhớ đệm');
                } else {
                  showToast('Cần cấp quyền Shizuku để dọn sâu: ' + reason);
                }
              });
            }

            function scanInstalledApps(notify) {
              if (window.BangBridge && window.BangBridge.scanAppsAsync) {
                window.BangBridge.scanAppsAsync();
                if (notify) showToast('Đang quét danh sách ứng dụng...');
              } else {
                renderWhitelistApps();
              }
            }

            window.onAppsScanned = function(realApps) {
              if (Array.isArray(realApps) && realApps.length > 0) {
                const map = new Map();
                allAppsList.forEach(a => map.set(a.pkg, a));
                realApps.forEach(ra => {
                  if (!map.has(ra.pkg)) {
                    const safe = ra.pkg.includes('zalo') || ra.pkg.includes('orca') || ra.pkg.includes('youtube') || ra.pkg.includes('camera') || ra.pkg.includes('garena');
                    map.set(ra.pkg, { name: ra.name, pkg: ra.pkg, running: !!ra.running, protected: safe });
                  } else {
                    map.get(ra.pkg).running = !!ra.running;
                  }
                });
                allAppsList = Array.from(map.values());
              }
              renderWhitelistApps();
            };

            function renderWhitelistApps() {
              const q = (document.getElementById('appSearchInput')?.value || '').toLowerCase().trim();
              document.getElementById('wlTotalCount').textContent = allAppsList.length;
              document.getElementById('wlRunningCount').textContent = allAppsList.filter(a => a.running).length;
              document.getElementById('wlProtectedCount').textContent = allAppsList.filter(a => a.protected).length;

              const filtered = allAppsList.filter(app => !q || app.name.toLowerCase().includes(q) || app.pkg.toLowerCase().includes(q));
              const box = document.getElementById('whitelistContainer');
              box.innerHTML = filtered.slice(0, 60).map(app => `
                <div class="tweak-item-v14" style="padding:10px 12px; margin-bottom:7px;">
                  <div class="tweak-row-main">
                    <div style="flex:1; min-width:0;">
                      <div style="font-size:12.5px; font-weight:700; color:#FFFFFF; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${app.name}</div>
                      <div style="font-size:10px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${app.pkg} · <span style="color:${app.running ? '#10B981' : '#64748B'};">${app.running ? 'Đang chạy' : 'Nền'}</span>
                      </div>
                    </div>
                    <div class="v14-switch emerald ${app.protected ? 'on' : ''}" onclick="toggleAppWhitelist('${app.pkg}', this)"></div>
                  </div>
                </div>
              `).join('');
            }

            function toggleAppWhitelist(pkg, el) {
              hapticTick();
              const target = allAppsList.find(a => a.pkg === pkg);
              if (!target) return;
              target.protected = !target.protected;
              el.classList.toggle('on', target.protected);
              document.getElementById('wlProtectedCount').textContent = allAppsList.filter(a => a.protected).length;
            }

            function onMasterButtonClick() {
              hapticTick();
              const totalActive = glToolItems.filter(x => x.on).length + featGroup1.filter(x => x.on).length + featGroup2.filter(x => x.on).length;
              if (totalActive === 0 && selectedOptLevel === -1) {
                selectOptLevel(1, '0.5', 'Medium · Khuyên dùng');
              } else {
                cleanRamNow();
              }
            }

            function restoreAllDefaults() {
              hapticTick();
              runCustomVerifiedCommand(
                'settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0 && settings put global animator_duration_scale 1.0 && settings put secure long_press_timeout 400 && settings delete system peak_refresh_rate && settings delete system min_refresh_rate && settings delete global angle_gl_driver_all_angle && settings delete global cached_apps_freezer',
                '',
                '',
                (ok, reason) => {
                  [...glToolItems, ...featGroup1, ...featGroup2].forEach(it => {
                    it.on = false;
                    it.statusType = 'idle';
                    it.statusText = 'Trạng thái: Mặc định NSX';
                    updateSingleSwitchDOM(it.id);
                  });
                  floEnabled = false;
                  xiaomiPlanEnabled = false;
                  selectedOptLevel = -1;
                  document.querySelectorAll('#levelGrid .vibe-mode-item').forEach(el => el.classList.remove('active'));
                  document.getElementById('animLabel').textContent = 'Mặc định (Chưa bật)';
                  updateCountersAndMasterBar();
                  showToast(ok ? 'Đã khôi phục toàn bộ cài đặt về mặc định NSX' : ('Đã đặt lại giao diện (' + reason + ')'));
                }
              );
            }

            function appendLog(cmd, status) {
              cmdCount++;
              document.getElementById('cmdCountBadge').textContent = cmdCount + ' lệnh';
              const box = document.getElementById('consoleBox');
              const div = document.createElement('div');
              div.textContent = `[${status}] $ ${cmd}`;
              box.prepend(div);
            }

            function showToast(msg) {
              const t = document.getElementById('toastPill');
              t.textContent = msg;
              t.classList.add('show');
              clearTimeout(window._toastTimer);
              window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
            }

            function exportBangConfig() {
              const code = `BANG-V9.0-UNIVERSAL-${currentThreshold}MB`;
              if (navigator.clipboard) navigator.clipboard.writeText(code);
              showToast('Đã sao chép: ' + code);
            }

            function openTelegram() {
              window.open('https://t.me/BangTechnology', '_blank');
            }

            // Nhận thông số phần cứng thật từ Kotlin
            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              currentRamTotal = data.totalRamMb || 5606;
              currentRamUsed = data.usedRamMb || 3600;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              nativeHz = data.hz || 60;
              maxSupportedHz = data.maxHz || nativeHz;

              const pct = Math.round((currentRamUsed / Math.max(1, currentRamTotal)) * 100);
              animateNumber('animHzVal', nativeHz);
              animateNumber('animTempVal', Math.round(data.tempC || 34));

              document.getElementById('deviceModelText').textContent = `${data.model} (${data.android})`;
              document.getElementById('diagModel').textContent = data.rawModel || data.model;
              document.getElementById('diagSoc').textContent = data.soc || 'Snapdragon / MediaTek';
              document.getElementById('diagScreen').textContent = `${nativeWidth}x${nativeHeight} · ${nativeHz}Hz`;
              document.getElementById('maxHzBadge').textContent = `Max: ${maxSupportedHz}Hz`;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              document.getElementById('hudFps').textContent = `${nativeHz} FPS`;
              document.getElementById('hudRamTop').textContent = `RAM ${pct}%`;
              document.getElementById('hudTempTop').textContent = `${data.tempC}°C`;

              const dot = document.getElementById('shizukuDot');
              const lbl = document.getElementById('shizukuTopLabel');
              if (data.shizukuState === 'READY') {
                dot.style.background = '#10B981';
                dot.style.boxShadow = '0 0 8px #10B981';
                lbl.textContent = 'Shizuku UID 2000';
              } else {
                dot.style.background = '#F43F5E';
                lbl.textContent = 'Cấp quyền Shizuku';
              }

              onRamSliderChange(currentThreshold);
              if (data.isColdStart) {
                scanInstalledApps(false);
                syncRealSystemState(false);
              }
            };

            initAllSwitchDOM();
            renderWhitelistApps();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v9.0-Universal-LiquidGlass
          path: app/build/outputs/apk/debug/app-debug.apk
