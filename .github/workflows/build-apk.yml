                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mem = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                      val ramPct = (((mem.totalMem - mem.availMem).toDouble() / mem.totalMem.toDouble()) * 100).toInt()
                      val batIntent = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val tempC = (batIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 340) ?: 340) / 10.0
                      val (cpuPct, gpuPct) = readCpuAndGpuUsage(tempC, ramPct)

                      val startTransX = if (isOnRightSide) dp(55).toFloat() else -dp(55).toFloat()

                      val rootFrame = FrameLayout(this).apply {
                          alpha = 0f
                          translationX = startTransX
                          scaleX = 0.72f
                          scaleY = 0.72f
                          background = GradientDrawable(
                              GradientDrawable.Orientation.TL_BR,
