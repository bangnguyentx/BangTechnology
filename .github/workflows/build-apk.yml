                              put("watt", String.format("%.1f", watt))
                              put("batteryGauge", batGaugeObj)
                              put("isCharging", plugged > 0)
                              put("widthPx", dm.widthPixels)
                              put("heightPx", dm.heightPixels)
                              put("dpi", dm.densityDpi)
                              put("hz", currentHz)
