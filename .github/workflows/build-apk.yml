                <button class="oem-chip tap-spring" onclick="selectOemBrand('VIVO', this)">Vivo X / iQOO</button>
                <button class="oem-chip tap-spring" onclick="selectOemBrand('OPPO', this)">OPPO / Realme</button>
                <button class="oem-chip tap-spring" onclick="selectOemBrand('SAMSUNG', this)">Samsung One UI</button>
                <button class="oem-chip tap-spring" onclick="selectOemBrand('XIAOMI_FLAG', this)">Xiaomi Flagship</button>
              </div>

              <div id="oemSpecificTweakList" class="hairline-list"></div>
            </div>
          </div>

          <!-- ================= TAB 2: BIỂU ĐỒ NHIỆT ĐỘ & DÒNG SẠC 1 GIÂY + MẠNG (GIỮ BLUETOOTH) ================= -->
          <div id="tab-2" class="tab-pane">
            <!-- Biểu đồ Nhiệt độ & Dòng sạc Thực tế chạy theo từng giây (1.0s Live Oscilloscope) -->
            <div class="bento-glass-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div>
                  <div style="font-size:13.5px; font-weight:800;">Biểu đồ Nhiệt độ & Dòng sạc Thực tế</div>
                  <div style="font-size:10.5px; color:var(--text-secondary);">Cập nhật mỗi 1.0 giây từ cảm biến BatteryManager</div>
                </div>
                <span class="tag-pill" id="liveChargeStateBadge" style="color:#34D399;">● 1.0s Live</span>
              </div>

              <div class="grid-4" style="margin-bottom:10px;">
                <div class="stat-well">
                  <div class="stat-well-label">Nhiệt độ</div>
                  <div class="stat-well-val" id="liveTempBox" style="color:#F97316;">35.0°C</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Dòng điện</div>
                  <div class="stat-well-val" id="liveMaBox" style="color:#34D399;">-420 mA</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Công suất</div>
                  <div class="stat-well-val" id="liveWattBox" style="color:#38BDF8;">1.6 W</div>
                </div>
                <div class="stat-well">
                  <div class="stat-well-label">Điện áp</div>
                  <div class="stat-well-val" id="liveMvBox">3920 mV</div>
                </div>
              </div>

              <!-- Live SVG Oscilloscope -->
              <div style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:10px;">
                <svg width="100%" height="90" viewBox="0 0 300 90" fill="none">
                  <line x1="0" y1="22" x2="300" y2="22" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>
                  <line x1="0" y1="45" x2="300" y2="45" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/>
                  <line x1="0" y1="68" x2="300" y2="68" stroke="rgba(255,255,255,0.06)"/>
                  <polyline id="polyTempLine" fill="none" stroke="#F97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="0,50 300,50"/>
                  <polyline id="polyCurrentLine" fill="none" stroke="#38BDF8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" points="0,65 300,65"/>
                </svg>
                <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px;">
                  <span style="color:#F97316;">━ Nhiệt độ Pin (°C)</span>
                  <span style="color:#38BDF8;">━ Công suất & Dòng điện (mA / W)</span>
                </div>
              </div>

              <button class="btn-emerald-rescue tap-spring" onclick="runEmergencyCoolDown()">
                ❄️ Hạ Nhiệt Khẩn Cấp 1-Chạm (Đóng băng đồng bộ nền · Giảm 3-5°C)
              </button>
            </div>

            <!-- Mạng, Ping & Tắt Vị Trí GPS nhưng giữ nguyên 100% Bluetooth -->
            <div class="bento-glass-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:13.5px; font-weight:800;">Mạng eSports & Tắt Vị Trí (Giữ Bluetooth)</span>
                <span class="tag-pill" style="color:#38BDF8;">Bluetooth Safe</span>
              </div>

              <div class="hairline-list">
                <div class="hairline-row">
                  <div>
                    <div style="font-size:12.5px; font-weight:700;">Tắt Định vị GPS & Quét vị trí ngầm</div>
                    <div style="font-size:10.5px; color:var(--text-secondary);">Tắt <code>location_mode 0</code> để giảm nhiệt & chống vọt ping, <b>giữ nguyên Bluetooth 100%</b> cho tai nghe</div>
                  </div>
                  <div class="v14-switch" onclick="toggleCmdSwitch(this, 'settings put secure location_mode 0 && settings put global wifi_scan_always_enabled 0', 'settings put secure location_mode 3', 'Đã tắt Vị trí GPS (Giữ nguyên Bluetooth 100%)')"></div>
                </div>

                <div class="hairline-row">
                  <div>
                    <div style="font-size:12.5px; font-weight:700;">Khóa Ping 5GHz & Ưu tiên gói tin Game</div>
                    <div style="font-size:10.5px; color:var(--text-secondary);">Tắt tiết kiệm điện Wi-Fi (<code>wifi_sleep_policy 2</code>) & bật <code>speed_mode 1</code></div>
                  </div>
                  <div class="v14-switch" onclick="toggleCmdSwitch(this, 'settings put global wifi_sleep_policy 2 && settings put secure speed_mode 1', 'settings put secure speed_mode 0', 'Đã bật Khóa Ping 5GHz')"></div>
                </div>

                <div class="hairline-row">
                  <div>
                    <div style="font-size:12.5px; font-weight:700;">Đổi DNS Cloudflare Gaming (1.1.1.1)</div>
                    <div style="font-size:10.5px; color:var(--text-secondary);">Giảm độ trễ phân giải tên miền máy chủ game</div>
                  </div>
                  <div class="v14-switch" onclick="toggleCmdSwitch(this, 'settings put global private_dns_mode hostname && settings put global private_dns_specifier one.one.one.one', 'settings put global private_dns_mode opportunistic', 'Đã bật DNS 1.1.1.1')"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- ================= TAB 3: 2-IN-1 ADB & WHITELIST RAM ================= -->
          <div id="tab-3" class="tab-pane">
            <div class="bento-glass-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:13.5px; font-weight:800;">Trung tâm Ghép nối Lõi ADB 2-in-1</span>
                <span class="tag-pill" id="tab3PairBadge">Chưa ghép nối</span>
              </div>
              <button class="btn-solid-white tap-spring" onclick="openPairModal()">🔢 Mở Bàn Phím Ghép Nối 6 Số Liquid Glass</button>
              <button class="btn-emerald-rescue tap-spring" onclick="launchDevOptionsWithNotification()">🔔 Mở Tùy Chọn Nhà Phát Triển & Nhập Mã Trên Thông Báo</button>
            </div>

            <div class="bento-glass-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:13.5px; font-weight:800;">Nhật ký thực thi Lõi ADB 2-in-1</span>
                <span class="tag-pill" id="cmdCountBadge">0 lệnh</span>
              </div>
              <div id="consoleBox" style="font-family:monospace; font-size:11px; background:#05070B; border:1px solid var(--border-hairline); border-radius:13px; padding:11px; color:#CBD5E1; max-height:190px; overflow-y:auto; line-height:1.5;">
                [BangOptimize v12.0] Đã kích hoạt Lá chắn Anti-OTG & Bảo vệ Bluetooth.<br>
                [Realtime Sensor] Đang đọc dòng sạc mA / Watt / mV mỗi 1.0 giây.
              </div>
              <button class="btn-glass-subtle tap-spring" style="color:#FDA4AF;" onclick="restoreAllDefaults()">Khôi phục toàn bộ cài đặt về mặc định NSX</button>
            </div>
          </div>

          <!-- BOTTOM LIQUID GLASS NAVBAR -->
          <div class="ios27-bottom-dock-wrap">
            <div id="glassNavBar" class="ios27-glass-navbar liquid-glass-v2">
              <div id="navLiquidLens" class="ios27-liquid-lens"></div>
              <button class="ios27-nav-item active" onclick="switchTab(0)"><span>Tổng quan</span></button>
              <button class="ios27-nav-item" onclick="switchTab(1)"><span>Game & OEM</span></button>
              <button class="ios27-nav-item" onclick="switchTab(2)"><span>Pin & Mạng</span></button>
              <button class="ios27-nav-item" onclick="switchTab(3)"><span>2-in-1 ADB</span></button>
            </div>
            <button class="ios27-fab-orb tap-spring" onclick="cleanRamNow()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </button>
          </div>

          <script>
            // ================= 1. DANH SÁCH 6 TỰA GAME LỚN TỰ ĐỘNG NHẬN DIỆN =================
            const majorGames = [
              { name: 'Liên Quân Mobile', pkg: 'com.garena.game.kgvn', res: '720x1600', dpi: 293, mode: '120FPS · 0ms Touch' },
              { name: 'Free Fire MAX / TH', pkg: 'com.dts.freefiremax', res: '720x1600', dpi: 280, mode: 'Pointer +7 · High Sensitivity' },
              { name: 'PUBG Mobile VNG', pkg: 'com.vng.pubgmobile', res: '720x1600', dpi: 300, mode: '90Hz/120Hz Smooth Combat' },
              { name: 'Roblox', pkg: 'com.roblox.client', res: '540x1200', dpi: 220, mode: 'Ultra Smooth Low-Lag' },
              { name: 'Genshin Impact', pkg: 'com.miHoYo.GenshinImpact', res: '720x1600', dpi: 300, mode: 'Thermal Guard + AOT Compile' },
              { name: 'Delta Force Mobile', pkg: 'com.proxima.dfm', res: '720x1600', dpi: 293, mode: '120Hz Tactile Response' }
            ];

            function renderGameHub() {
              const box = document.getElementById('gameHubContainer');
              box.innerHTML = majorGames.map((g, idx) => `
                <div class="hairline-row">
                  <div style="flex:1;">
                    <div style="font-size:12.5px; font-weight:700; color:#FFFFFF;">${g.name}</div>
                    <div style="font-size:10px; color:var(--text-secondary);">${g.pkg} · <span style="color:#38BDF8;">${g.mode}</span></div>
                  </div>
                  <button class="tag-pill tap-spring" style="padding:7px 11px; background:rgba(16,185,129,0.18); border-color:#10B981; color:#34D399; font-size:10.5px;" onclick="boostAndLaunchGame(${idx})">
                    ⚡ Tối ưu & Mở
                  </button>
                </div>
              `).join('');
            }

            function boostAndLaunchGame(idx) {
              const g = majorGames[idx];
              hapticTick();
              const boostCmd = `cmd game mode performance ${g.pkg} && cmd package compile -m speed-profile -f ${g.pkg} && settings put secure long_press_timeout 150 && settings put system pointer_speed 7 && am kill-all`;
              if (window.BangBridge && window.BangBridge.launchAndBoostGame) {
                const opened = window.BangBridge.launchAndBoostGame(g.pkg, boostCmd);
                appendLog(boostCmd, opened ? 'GAME LAUNCHED' : 'BOOST APPLIED');
                showToast(opened ? `Đã tối ưu & đang mở ${g.name}!` : `Đã áp dụng cấu hình ${g.name} (Chưa cài gói ${g.pkg})`);
              } else {
                appendLog(boostCmd, 'SIMULATED');
                showToast(`Đã kích hoạt cấu hình eSports cho ${g.name}!`);
              }
            }

            function toggleAutoRestoreGame(el) {
              hapticTick();
              el.classList.toggle('on');
              const isOn = el.classList.contains('on');
              if (window.BangBridge && window.BangBridge.setAutoRestoreGameOnExit) {
                window.BangBridge.setAutoRestoreGameOnExit(isOn);
              }
              showToast(isOn ? 'Đã bật Tự hoàn trả 1080p khi thoát Game' : 'Đã tắt Tự hoàn trả khi thoát Game');
            }

            // ================= 2. BỘ LỆNH ĐẶC TRỊ THEO TỪNG HÃNG MÁY (MULTI-BRAND OEM ENGINE) =================
            const oemProfiles = {
              REDMI: [
                { name: 'Mở khóa hiệu ứng bị cắt giảm (Redmi số / Redmi Note số)', desc: 'Nâng deviceLevelList từ v:1,c:1,g:1 lên v:1,c:3,g:3 mượt chuẩn Flagship', cmdOn: 'settings put system deviceLevelList v:1,c:3,g:3', cmdOff: 'settings put system deviceLevelList v:1,c:1,g:1' },
                { name: 'Chặn dịch vụ Joyose bóp xung GPU ở 38°C', desc: 'Ngăn com.xiaomi.joyose chạy nền gây tụt FPS trên HyperOS/MIUI', cmdOn: 'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND ignore && am force-stop com.xiaomi.joyose', cmdOff: 'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND allow' },
                { name: 'Kích hoạt Xiaomi PowerKeeper High Performance', desc: 'Mở khóa POWER_PERFORMANCE_MODE_OPEN 1 & tắt quảng cáo MSA', cmdOn: 'settings put system POWER_PERFORMANCE_MODE_OPEN 1 && am force-stop com.miui.msa.global', cmdOff: 'settings put system POWER_PERFORMANCE_MODE_OPEN 0' }
              ],
              VIVO: [
                { name: 'Kích hoạt Vivo / iQOO Monster+ Performance Mode', desc: 'Ghi cờ monster_mode = 1 và pem_performance_mode = 1 cho OriginOS/FuntouchOS', cmdOn: 'settings put system monster_mode 1 && settings put system pem_performance_mode 1', cmdOff: 'settings put system monster_mode 0' },
                { name: 'Khóa tần số quét cao Vivo LTPO / 120Hz', desc: 'Cố định vivo_screen_refresh_rate_mode = 120 chống tụt về 60Hz', cmdOn: 'settings put global vivo_screen_refresh_rate_mode 120 && settings put system peak_refresh_rate 120.0', cmdOff: 'settings delete system peak_refresh_rate' }
              ],
              OPPO: [
                { name: 'Kích hoạt ColorOS / RealmeUI High Performance Mode', desc: 'Bật high_performance_mode_on = 1 và oplus_customize_high_performance', cmdOn: 'settings put system high_performance_mode_on 1 && settings put secure high_performance_mode_on 1', cmdOff: 'settings put system high_performance_mode_on 0' },
                { name: 'Dừng dịch vụ quảng cáo HeyTap & Giám sát nền', desc: 'Tắt chạy ngầm com.heytap.mcs để giải phóng RAM cho OPPO/Realme', cmdOn: 'am force-stop com.heytap.mcs && pm trim-caches 999G', cmdOff: 'echo ok' }
              ],
              SAMSUNG: [
                { name: 'Tắt giới hạn nhiệt Samsung GOS (Game Optimizing Service)', desc: 'Đặt game_auto_temperature_control = 0 & bật CPU Responsiveness', cmdOn: 'settings put secure game_auto_temperature_control 0 && settings put global sem_enhanced_cpu_responsiveness 1', cmdOff: 'settings put global sem_enhanced_cpu_responsiveness 0' },
                { name: 'Gỡ giới hạn hiệu năng One UI (Unrestricted Performance)', desc: 'Đặt restricted_device_performance = 0,0 trên dòng Galaxy', cmdOn: 'settings put global restricted_device_performance 0,0', cmdOff: 'echo ok' }
              ],
              XIAOMI_FLAG: [
                { name: 'Khóa cứng 120Hz LTPO & Tối ưu độ nhạy chạm 0ms', desc: 'Dành cho dòng Xiaomi 13 / 14 / Ultra đã mở sẵn hiệu ứng', cmdOn: 'settings put system peak_refresh_rate 120.0 && settings put secure long_press_timeout 150', cmdOff: 'settings delete system peak_refresh_rate' }
              ]
            };

            function selectOemBrand(brandKey, btnEl) {
              hapticTick();
              if (btnEl) {
                document.querySelectorAll('#oemChipRow .oem-chip').forEach(el => el.classList.remove('active'));
                btnEl.classList.add('active');
              }
              const list = oemProfiles[brandKey] || oemProfiles.REDMI;
              const box = document.getElementById('oemSpecificTweakList');
              box.innerHTML = list.map(item => `
                <div class="hairline-row">
                  <div style="flex:1;">
                    <div style="font-size:12.5px; font-weight:700; color:#FFFFFF;">${item.name}</div>
                    <div style="font-size:10.5px; color:var(--text-secondary);">${item.desc}</div>
                  </div>
                  <div class="v14-switch" onclick="toggleCmdSwitch(this, '${item.cmdOn}', '${item.cmdOff}', '${item.name}')"></div>
                </div>
              `).join('');
            }

            // ================= 3. BIỂU ĐỒ NHIỆT ĐỘ & DÒNG SẠC THỰC TẾ MỖI 1.0 GIÂY =================
            const tempHistory = new Array(20).fill(35.0);
            const wattHistory = new Array(20).fill(2.0);

            function updateRealtimeBatteryOscilloscope() {
              if (window.BangBridge && window.BangBridge.getLiveBatteryTelemetryJson) {
                try {
                  const d = JSON.parse(window.BangBridge.getLiveBatteryTelemetryJson());
                  pushTelemetrySample(d.tempC || 35.0, d.currentMa || -420, d.watt || 1.6, d.voltageMv || 3920, !!d.charging);
                  return;
                } catch (e) {}
              }
              // Mô phỏng dao động cảm biến nhẹ khi xem trước
              const simTemp = +(35.2 + Math.sin(Date.now() / 2000) * 0.6).toFixed(1);
              const simMa = Math.round(-410 + Math.cos(Date.now() / 1300) * 35);
              const simMv = 3940;
              const simW = +((Math.abs(simMa) * simMv) / 1000000).toFixed(1);
              pushTelemetrySample(simTemp, simMa, simW, simMv, false);
            }

            function pushTelemetrySample(tempC, currentMa, watt, voltageMv, charging) {
              document.getElementById('liveTempBox').textContent = `${tempC.toFixed(1)}°C`;
              document.getElementById('liveMaBox').textContent = `${currentMa > 0 ? '+' : ''}${currentMa} mA`;
              document.getElementById('liveMaBox').style.color = charging ? '#34D399' : '#38BDF8';
              document.getElementById('liveWattBox').textContent = `${Number(watt).toFixed(1)} W`;
              document.getElementById('liveMvBox').textContent = `${voltageMv} mV`;
              document.getElementById('hudTempTop').textContent = `${tempC.toFixed(1)}°C · ${Number(watt).toFixed(1)}W`;
              document.getElementById('animTempVal').textContent = Math.round(tempC);

              tempHistory.push(tempC);
              if (tempHistory.length > 20) tempHistory.shift();
              wattHistory.push(Number(watt));
              if (wattHistory.length > 20) wattHistory.shift();

              const tempPts = tempHistory.map((t, i) => {
                const x = Math.round((i / 19) * 300);
                const y = Math.max(8, Math.min(82, Math.round(80 - ((t - 28) / 22) * 70)));
                return `${x},${y}`;
              }).join(' ');

              const wattPts = wattHistory.map((w, i) => {
                const x = Math.round((i / 19) * 300);
                const y = Math.max(10, Math.min(84, Math.round(82 - (Math.min(35, w) / 35) * 68)));
                return `${x},${y}`;
              }).join(' ');

              document.getElementById('polyTempLine').setAttribute('points', tempPts);
              document.getElementById('polyCurrentLine').setAttribute('points', wattPts);
            }

            setInterval(updateRealtimeBatteryOscilloscope, 1000);

            // ================= 4. LÁ CHẮN ANTI-OTG RESCUE & ĐIỀU KHIỂN CHUNG =================
            let cmdCount = 0;
            let currentSixDigits = "";
            let currentTabIndex = 0;
            let nativeWidth = 1080, nativeHeight = 2400, nativeDpi = 410;
            let revertTimer = null;

            function hapticTick() {
              if (window.BangBridge && window.BangBridge.triggerHaptic) window.BangBridge.triggerHaptic();
            }

            function triggerAntiOtgRescueNow() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.runAntiOtgRescue) {
                const msg = window.BangBridge.runAntiOtgRescue();
                appendLog('settings delete global angle_gl_driver_all_angle && settings delete global cached_apps_freezer && wm size reset', 'RESCUED');
                showToast('🛡️ ' + msg);
              } else {
                showToast('🛡️ Đã gỡ sạch lệnh gây treo ANGLE & Cached Freezer!');
              }
            }

            function runEmergencyCoolDown() {
              hapticTick();
              toggleCmdSwitch(null, 'am kill-all && pm trim-caches 999G && settings put global wifi_scan_always_enabled 0', '', 'Đã kích hoạt Hạ nhiệt khẩn cấp 1-Chạm!');
            }

            function toggleCmdSwitch(el, cmdOn, cmdOff, label) {
              hapticTick();
              const targetOn = el ? !el.classList.contains('on') : true;
              if (el) el.classList.toggle('on', targetOn);
              const cmd = targetOn ? cmdOn : (cmdOff || 'echo ok');

              if (window.BangBridge && window.BangBridge.execVerifiedAsync) {
                const cid = 'sw_' + Date.now();
                window._lastSwitchEl = el;
                window._lastSwitchLabel = label;
                window.BangBridge.execVerifiedAsync(cid, targetOn, cmd, '', '', 0);
              } else {
                if (el) el.classList.remove('on');
                openPairModal();
              }
            }

            window.onSwitchVerifiedResult = function(res) {
              if (!res) return;
              if (res.ok) {
                appendLog(res.cmd || 'cmd', 'OK');
                showToast(window._lastSwitchLabel || 'Đã áp dụng thành công!');
              } else {
                if (window._lastSwitchEl) window._lastSwitchEl.classList.remove('on');
                appendLog(res.cmd || 'cmd', 'TỪ CHỐI: ' + res.reason);
                showToast(res.reason || 'Chưa ghép nối 6 số');
                if (res.needPair) openPairModal();
              }
            };

            function selectOptLevel(scale, label) {
              hapticTick();
              document.getElementById('animLabel').textContent = label;
              toggleCmdSwitch(null, `settings put global window_animation_scale ${scale} && settings put global transition_animation_scale ${scale} && settings put global animator_duration_scale ${scale}`, '', 'Đã bật: ' + label);
            }

            function applyResolution(isTest15s) {
              hapticTick();
              const w = document.getElementById('inpW').value;
              const h = document.getElementById('inpH').value;
              const dpi = document.getElementById('inpDpi').value;
              document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
              toggleCmdSwitch(null, `wm size ${w}x${h} && wm density ${dpi}`, '', `Đã áp dụng ${w}x${h} @ ${dpi} DPI`);
              clearInterval(revertTimer);
              const btn = document.getElementById('btnTest15s');
              if (isTest15s) {
                let sec = 15;
                btn.textContent = `Hoàn tác (${sec}s)`;
                revertTimer = setInterval(() => {
                  sec--;
                  btn.textContent = `Hoàn tác (${sec}s)`;
                  if (sec <= 0) {
                    clearInterval(revertTimer);
                    resetResolution();
                  }
                }, 1000);
              } else {
                btn.textContent = 'Thử 15s';
              }
            }

            function resetResolution() {
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = 'Thử 15s';
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              toggleCmdSwitch(null, 'wm size reset && wm density reset', '', 'Đã khôi phục màn hình gốc 100%');
            }

            function cleanRamNow() {
              hapticTick();
              toggleCmdSwitch(null, 'am kill-all && pm trim-caches 999G', '', 'Đã giải phóng RAM & bảo toàn Bluetooth/Whitelist!');
            }

            function restoreAllDefaults() {
              hapticTick();
              triggerAntiOtgRescueNow();
              document.querySelectorAll('.v14-switch.on').forEach(el => {
                if (el.id !== 'swAutoRestoreGame') el.classList.remove('on');
              });
              showToast('Đã khôi phục toàn bộ cài đặt về mặc định an toàn!');
            }

            // ================= MÀN HÌNH GHÉP NỐI 6 SỐ =================
            function openPairModal() {
              hapticTick();
              document.getElementById('pairSheetModal').classList.add('open');
              renderSixDigitSlots();
            }
            function closePairModal() {
              document.getElementById('pairSheetModal').classList.remove('open');
            }
            function pressDigit(d) {
              hapticTick();
              if (currentSixDigits.length >= 6) return;
              currentSixDigits += d;
              renderSixDigitSlots();
              if (currentSixDigits.length === 6) setTimeout(submitSixDigitPairing, 140);
            }
            function backspaceDigit() {
              hapticTick();
              currentSixDigits = currentSixDigits.slice(0, -1);
              renderSixDigitSlots();
            }
            function clearDigits() {
              hapticTick();
              currentSixDigits = "";
              renderSixDigitSlots();
            }
            function renderSixDigitSlots() {
              document.querySelectorAll('#sixDigitGrid .digit-glass-slot').forEach((slot, idx) => {
                const ch = currentSixDigits[idx];
                slot.textContent = ch ? ch : '-';
                slot.classList.toggle('filled', !!ch);
              });
            }
            function submitSixDigitPairing() {
              if (currentSixDigits.length !== 6) {
                showToast('Hãy nhập đủ 6 chữ số!');
                return;
              }
              const portVal = parseInt(document.getElementById('inpPairPort').value, 10) || 37845;
              if (window.BangBridge && window.BangBridge.pairSixDigitCode) {
                const res = JSON.parse(window.BangBridge.pairSixDigitCode(portVal, currentSixDigits));
                if (res.ok) {
                  closePairModal();
                  updateAdbStatusUI(true, res.mode);
                  showToast(res.msg);
                  currentSixDigits = "";
                }
              }
            }
            function launchDevOptionsWithNotification() {
              hapticTick();
              if (window.BangBridge && window.BangBridge.openDeveloperOptionsWithNotification) {
                window.BangBridge.openDeveloperOptionsWithNotification();
              }
            }
            function updateAdbStatusUI(paired, modeText) {
              const led = document.getElementById('adbLed');
              const topTxt = document.getElementById('adbTopStatusText');
              const sub = document.getElementById('cardAdbSub');
              const b3 = document.getElementById('tab3PairBadge');
              if (paired) {
                led.className = 'status-led paired';
                topTxt.textContent = 'v12.0 Đã kết nối';
                sub.textContent = '▲ ' + (modeText || 'Lõi ADB 2-in-1 Sẵn sàng');
                b3.textContent = 'Đã kết nối';
              } else {
                led.className = 'status-led';
                topTxt.textContent = 'Ghép nối 6 số';
                sub.textContent = '▲ Chạm để ghép nối 6 số';
                b3.textContent = 'Chưa ghép nối';
              }
            }

            // ================= ĐIỀU HƯỚNG TAB & METABALL ORB =================
            function switchTab(idx) {
              currentTabIndex = idx;
              hapticTick();
              document.querySelectorAll('.tab-pane').forEach((el, i) => el.classList.toggle('active', i === idx));
              document.querySelectorAll('.v14-pill-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
              document.querySelectorAll('.ios27-nav-item').forEach((el, i) => el.classList.toggle('active', i === idx));
              const bar = document.getElementById('glassNavBar');
              const lens = document.getElementById('navLiquidLens');
              if (bar && lens) {
                const slotW = (bar.clientWidth - 12) / 4;
                lens.style.transform = `translate3d(${idx * slotW}px, 0, 0)`;
              }
              window.scrollTo({ top: 0, behavior: 'instant' });
            }

            (function initOrbAndNav() {
              const stage = document.getElementById('metaballStage');
              const orb = document.getElementById('liquidOrb');
              const proxy = document.getElementById('gooDropProxy');
              if (!stage || !orb || !proxy) return;
              let homeX = 220, homeY = 46, curX = 220, curY = 46, dragging = false, sx = 0, sy = 0, gx = 0, gy = 0;
              function setPos(x, y) {
                curX = x; curY = y;
                const tf = `translate3d(${x}px, ${y}px, 0)`;
                orb.style.transform = tf;
                proxy.style.transform = tf;
              }
              setTimeout(() => {
                homeX = Math.round(stage.clientWidth * 0.72);
                setPos(homeX, homeY);
              }, 60);
              orb.addEventListener('pointerdown', e => {
                dragging = true; hapticTick(); orb.setPointerCapture(e.pointerId);
                sx = e.clientX; sy = e.clientY; gx = curX; gy = curY;
                orb.style.transition = 'none'; proxy.style.transition = 'none';
              });
              orb.addEventListener('pointermove', e => {
                if (!dragging) return;
                setPos(gx + (e.clientX - sx), gy + (e.clientY - sy));
              });
              orb.addEventListener('pointerup', () => {
                if (!dragging) return;
                dragging = false;
                const sp = 'transform 400ms cubic-bezier(0.22, 1.35, 0.36, 1)';
                orb.style.transition = sp; proxy.style.transition = sp;
                setPos(homeX, homeY);
                cleanRamNow();
              });
            })();

            function appendLog(cmd, status) {
              cmdCount++;
              document.getElementById('cmdCountBadge').textContent = cmdCount + ' lệnh';
              const box = document.getElementById('consoleBox');
              const div = document.createElement('div');
              div.textContent = `[${status}] $ ${cmd}`;
              box.prepend(div);
            }

            function showToast(msg) {
              const t = document.getElementById('toastPill');
              t.textContent = msg;
              t.classList.add('show');
              clearTimeout(window._toastTimer);
              window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
            }

            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              nativeWidth = data.widthPx || 1080;
              nativeHeight = data.heightPx || 2400;
              nativeDpi = data.dpi || 410;
              const totalMb = data.totalRamMb || 5606;
              const usedMb = data.usedRamMb || 3414;
              const freeMb = Math.max(256, totalMb - usedMb);
              const pct = Math.round((usedMb / Math.max(1, totalMb)) * 100);

              document.getElementById('animFreeRam').textContent = freeMb.toLocaleString('en-US');
              document.getElementById('notifRamText').textContent = `Đang dùng ${usedMb}/${totalMb} MB`;
              document.getElementById('animHzVal').textContent = data.hz || 90;
              document.getElementById('deviceModelText').textContent = `${data.model} (${data.android})`;
              document.getElementById('socMatrixBadge').textContent = data.soc || 'Snapdragon / Dimensity';
              document.getElementById('hudFps').textContent = `${data.hz || 90} FPS`;
              document.getElementById('hudRamTop').textContent = `RAM ${pct}%`;
              document.getElementById('resCurrentBadge').textContent = `${nativeWidth}x${nativeHeight} @ ${nativeDpi}`;
              document.getElementById('inpW').value = nativeWidth;
              document.getElementById('inpH').value = nativeHeight;
              document.getElementById('inpDpi').value = nativeDpi;

              if (data.pairingPort && data.pairingPort > 0) {
                document.getElementById('inpPairPort').value = data.pairingPort;
                document.getElementById('mdnsStatusText').textContent = `Đã tự dò thấy Port: ${data.pairingPort}`;
              }

              // Tự động chọn tab hãng máy phù hợp
              const mfr = (data.manufacturer || '').toUpperCase();
              if (mfr.includes('VIVO') || mfr.includes('IQOO')) selectOemBrand('VIVO');
              else if (mfr.includes('OPPO') || mfr.includes('REALME') || mfr.includes('ONEPLUS')) selectOemBrand('OPPO');
              else if (mfr.includes('SAMSUNG')) selectOemBrand('SAMSUNG');
              else selectOemBrand('REDMI');

              updateAdbStatusUI(!!data.adbPaired, data.adbMode);
            };

            renderGameHub();
            selectOemBrand('REDMI');
            updateRealtimeBatteryOscilloscope();
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize v12.0 Ultimate APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v12.0-Ultimate-2in1
          path: app/build/outputs/apk/debug/app-debug.apk
