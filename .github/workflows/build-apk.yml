                          } catch (_: Throwable) {
                              startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                  }

                  @JavascriptInterface
                  fun execVerifiedAsync(itemId: String, targetOn: Boolean, cmd: String, verifyCmd: String, expectedVal: String, minRequiredHz: Int) {
                      bgExecutor.execute {
                          val res = JSONObject().apply {
                              put("itemId", itemId)
                              put("targetOn", targetOn)
                          }

                          if (!EmbeddedAdbEngine.isPairedAndConnected) {
                              res.put("ok", false)
                              res.put("reason", "Chưa kích hoạt kết nối hệ thống (Bấm Quản lý kết nối)")
                              res.put("needPair", true)
                              postResult(res)
                              return@execute
                          }

                          if (targetOn && minRequiredHz > 0 && maxSupportedHz < minRequiredHz) {
                              res.put("ok", false)
                              res.put("reason", "Màn hình máy hỗ trợ tối đa ${maxSupportedHz}Hz")
                              postResult(res)
                              return@execute
                          }

                          val execJson = JSONObject(EmbeddedAdbEngine.executeShell(cmd))
                          val exitCode = execJson.optInt("exitCode", -1)
                          val err = execJson.optString("err", "")

                          if (exitCode != 0) {
                              res.put("ok", false)
                              res.put("reason", if (err.isNotEmpty()) err else "Không tương thích trên dòng máy này")
                              res.put("cmd", cmd)
                              postResult(res)
                              return@execute
                          }

                          res.put("ok", true)
                          res.put("cmd", cmd)
                          res.put("verifiedValue", expectedVal.ifEmpty { "Đã áp dụng" })
                          postResult(res)
                      }
                  }

                  private fun postResult(res: JSONObject) {
                      mainHandler.post {
                          webView.evaluateJavascript("window.onSwitchVerifiedResult && window.onSwitchVerifiedResult($res);", null)
                      }
                  }

                  @JavascriptInterface
                  fun scanAppsAndGamesAsync() {
                      bgExecutor.execute {
                          val gamesArr = JSONArray()
                          val appsArr = JSONArray()
                          try {
                              val pm = packageManager
                              val installed = pm.getInstalledApplications(0)
                              for (app in installed) {
                                  val pkg = app.packageName
                                  val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                                  val hasLauncher = pm.getLaunchIntentForPackage(pkg) != null
                                  if (isSystem && !hasLauncher) continue

                                  val label = pm.getApplicationLabel(app).toString()
                                  val isGame = isAppGame(app, label)
                                  val iconUrl = "https://bangoptimize.local/app-icon/$pkg"

                                  val itemObj = JSONObject().apply {
                                      put("name", label)
                                      put("pkg", pkg)
                                      put("system", isSystem)
                                      put("isGame", isGame)
                                      put("icon", iconUrl)
                                  }
                                  if (isGame) {
                                      gamesArr.put(itemObj)
                                  }
                                  if (!isSystem || hasLauncher) {
                                      appsArr.put(itemObj)
                                  }
                              }
                          } catch (_: Throwable) {}

                          val payload = JSONObject().apply {
                              put("games", gamesArr)
                              put("apps", appsArr)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.onDeviceGamesAndAppsScanned && window.onDeviceGamesAndAppsScanned($payload);", null)
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  EmbeddedAdbEngine.stopMdnsScanner()
                  bgExecutor.shutdownNow()
                  super.onDestroy()
              }
          }
