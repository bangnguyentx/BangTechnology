              top: 2px;
              left: 2px;
              width: 20px;
              height: 20px;
              border-radius: 50%;
              background: #FFFFFF;
              box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
              transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
            }
            .hallmark-switch.on {
              background: var(--accent-emerald);
              border-color: transparent;
            }
            .hallmark-switch.on::after {
              transform: translate3d(20px, 0, 0);
            }

            /* Nút thao tác chuẩn */
            .btn-primary-light {
              width: 100%;
              min-height: 44px;
              padding: 11px 14px;
              border-radius: 12px;
              background: #F8FAFC;
              color: #07090E;
              font-size: 12px;
              font-weight: 800;
              text-align: center;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 6px;
              margin-top: 8px;
            }
            .btn-shield-emerald {
              width: 100%;
              min-height: 44px;
              padding: 11px 14px;
              border-radius: 12px;
              background: rgba(16, 185, 129, 0.14);
              border: 1px solid rgba(16, 185, 129, 0.45);
              color: #34D399;
              font-size: 12px;
              font-weight: 700;
              text-align: center;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 6px;
              margin-top: 8px;
            }
            .btn-secondary-glass {
              width: 100%;
              min-height: 42px;
              padding: 10px 12px;
              border-radius: 12px;
              background: rgba(255, 255, 255, 0.05);
              border: 1px solid rgba(255, 255, 255, 0.12);
              color: #E2E8F0;
              font-size: 11.5px;
              font-weight: 700;
              text-align: center;
              margin-top: 8px;
            }

            /* Thanh chọn hãng OEM */
            .oem-selector-bar {
              display: flex;
              gap: 6px;
              overflow-x: auto;
              padding-bottom: 10px;
              margin-bottom: 6px;
              scrollbar-width: none;
            }
            .oem-selector-bar::-webkit-scrollbar { display: none; }
            .oem-tab-pill {
              padding: 7px 12px;
              border-radius: 10px;
              font-size: 11.5px;
              font-weight: 700;
              white-space: nowrap;
              background: rgba(255, 255, 255, 0.04);
              border: 1px solid var(--border-hairline);
              color: var(--text-secondary);
            }
            .oem-tab-pill.active {
              background: rgba(56, 189, 248, 0.16);
              border-color: var(--accent-cyan);
              color: #FFFFFF;
            }

            /* Thanh điều hướng 5 Tab Kính Lỏng dưới đáy (Không có nút tròn đỏ đè lên chữ!) */
            .bottom-nav-dock {
              position: fixed;
              bottom: 10px;
              left: 12px;
              right: 12px;
              max-width: 500px;
              margin: 0 auto;
              z-index: 120;
            }
            .glass-dock-track {
              position: relative;
              height: 58px;
              border-radius: 99px;
              padding: 5px;
              display: grid;
              grid-template-columns: repeat(5, 1fr);
              align-items: center;
              background: rgba(10, 14, 22, 0.86);
              backdrop-filter: blur(28px) saturate(200%);
              -webkit-backdrop-filter: blur(28px) saturate(200%);
              border: 1px solid rgba(255, 255, 255, 0.18);
              box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                0 12px 30px rgba(0, 0, 0, 0.75);
              touch-action: none;
            }
            .dock-sliding-lens {
              position: absolute;
              top: 5px;
              bottom: 5px;
              left: 5px;
              width: calc((100% - 10px) / 5);
              border-radius: 99px;
              background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.32), rgba(56, 189, 248, 0.18));
              border: 1px solid rgba(255, 255, 255, 0.45);
              box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
              pointer-events: none;
              z-index: 1;
              will-change: transform;
              transition: transform 240ms cubic-bezier(0.22, 1.2, 0.36, 1);
            }
            .dock-tab-btn {
              position: relative;
              z-index: 2;
              height: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 2px;
              font-size: 10px;
              font-weight: 700;
              color: var(--text-secondary);
            }
            .dock-tab-btn.active {
              color: #FFFFFF;
            }

            /* Modal Bàn phím Ghép nối 6 số Liquid Glass */
            .modal-overlay {
              position: fixed;
              inset: 0;
              background: rgba(3, 5, 9, 0.8);
              backdrop-filter: blur(18px);
              -webkit-backdrop-filter: blur(18px);
              z-index: 250;
              display: none;
              align-items: center;
              justify-content: center;
              padding: 14px;
            }
            .modal-overlay.open { display: flex; }
            .modal-glass-sheet {
              width: 100%;
              max-width: 390px;
              border-radius: 24px;
              padding: 18px;
            }
            .digit-slots-6 {
              display: grid;
              grid-template-columns: repeat(6, 1fr);
              gap: 7px;
              margin: 12px 0;
            }
            .digit-cell {
              height: 48px;
              border-radius: 12px;
              background: var(--bg-well);
              border: 1px solid rgba(255, 255, 255, 0.18);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 20px;
              font-weight: 800;
              font-variant-numeric: tabular-nums;
            }
            .digit-cell.filled {
              background: rgba(56, 189, 248, 0.22);
              border-color: var(--accent-cyan);
            }
            .keypad-grid {
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              gap: 8px;
              margin-bottom: 10px;
            }
            .keypad-btn {
              height: 44px;
              border-radius: 12px;
              background: rgba(255, 255, 255, 0.07);
              border: 1px solid rgba(255, 255, 255, 0.14);
              font-size: 17px;
              font-weight: 700;
              color: #FFFFFF;
            }

            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
            .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
            .input-well {
              width: 100%;
              background: var(--bg-well);
              border: 1px solid var(--border-hairline);
              border-radius: 10px;
              padding: 9px;
              text-align: center;
              font-size: 12.5px;
              font-weight: 700;
              color: #FFFFFF;
              font-variant-numeric: tabular-nums;
            }
            .tab-view { display: none; }
            .tab-view.active { display: block; }
            #toastBanner {
              position: fixed;
              top: 14px;
              left: 50%;
              transform: translate3d(-50%, -20px, 0);
              z-index: 320;
              padding: 9px 16px;
              border-radius: 99px;
              background: rgba(15, 21, 32, 0.95);
              border: 1px solid rgba(56, 189, 248, 0.45);
              font-size: 11.5px;
              font-weight: 700;
              color: #FFFFFF;
              opacity: 0;
              pointer-events: none;
              transition: opacity 150ms ease, transform 150ms ease;
              white-space: nowrap;
            }
            #toastBanner.show { opacity: 1; transform: translate3d(-50%, 0, 0); }
          </style>
          </head>
          <body>

          <div id="toastBanner">BangOptimize v12.5 Hallmark sẵn sàng</div>

          <!-- MODAL BÀN PHÍM GHÉP NỐI 6 SỐ LIQUID GLASS -->
          <div id="pairSheetModal" class="modal-overlay" onclick="closePairModal()">
            <div class="modal-glass-sheet obsidian-glass" onclick="event.stopPropagation()">
