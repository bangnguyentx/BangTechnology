          <script>
            let cmdCount = 45;
            let currentRamUsed = 3963;
            let currentRamTotal = 5606;
            let currentThreshold = 4800;
            let isSimulatedFlagship = false;
            let revertTimer = null;

            function showToast(msg) {
              const t = document.getElementById('toast');
              t.textContent = msg;
              t.classList.add('show');
              clearTimeout(window._toastTimer);
              window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
            }

            function logCmd(cmd, status) {
              cmdCount++;
              document.getElementById('cmdCountBadge').textContent = cmdCount + ' lệnh';
              const box = document.getElementById('consoleBox');
              const line = document.createElement('div');
              line.textContent = `(exit 0) ${cmd} ${status || '✓'}`;
              box.prepend(line);
            }

            function execShizuku(cmd, toastMsg) {
              if (window.BangBridge && window.BangBridge.exec) {
                try {
                  const res = JSON.parse(window.BangBridge.exec(cmd));
                  logCmd(cmd, res.exitCode === 0 ? '✓' : `(code ${res.exitCode})`);
                } catch (e) {
                  logCmd(cmd, '✓');
                }
              } else {
                logCmd(cmd, '✓');
              }
              if (toastMsg) showToast(toastMsg);
            }

            function switchTab(idx) {
              document.querySelectorAll('.tab-pane').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.querySelectorAll('.tab-btn').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function toggleIsland() {
              document.getElementById('dynamicIsland').classList.toggle('expanded');
            }

            function toggleGhostLock() {
              const isl = document.getElementById('dynamicIsland');
              isl.classList.toggle('ghost-locked');
              isl.classList.remove('expanded');
              showToast(isl.classList.contains('ghost-locked')
                ? '👻 Đã bật Ghost Combat Lock (Mờ xuyên thấu HUD)'
                : '👻 Đã tắt Ghost Combat Lock');
            }

            function selectPrism(idx, accent, glow) {
              document.documentElement.style.setProperty('--accent', accent);
              document.documentElement.style.setProperty('--accent-glow', glow);
              document.querySelectorAll('#prismPills .pill-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              showToast('💎 Đã kích hoạt lăng kính Liquid Glass #' + (idx + 1));
            }

            function scrollPrism(idx, accent, glow) {
              const deck = document.getElementById('prismDeck');
              const card = deck.children[idx];
              if (card) {
                deck.scrollTo({ left: card.offsetLeft - 14, behavior: 'smooth' });
              }
              selectPrism(idx, accent, glow);
            }

            function selectBrand(btn, brand) {
              btn.parentElement.querySelectorAll('.pill-item').forEach(el => el.classList.remove('active'));
              btn.classList.add('active');
              showToast('📱 Đã chọn cấu hình: ' + brand);
            }

            function selectOptLevel(idx, scale, label) {
              document.querySelectorAll('#levelGrid .mode-card').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
              });
              document.getElementById('animLabel').textContent = 'Animation: ' + label;
              execShizuku(
                `settings put global window_animation_scale ${scale} && settings put global transition_animation_scale ${scale} && settings put global animator_duration_scale ${scale}`,
                '⚡ Đã áp dụng cấp độ: ' + label
              );
            }

            function toggleSwitch(el, cmd) {
              el.classList.toggle('on');
              const isOn = el.classList.contains('on');
              execShizuku(cmd, isOn ? '✅ Đã bật tính năng qua Shizuku' : '⚪ Đã tắt tính năng');
            }

            function togglePerfLite(el) {
              el.classList.toggle('on');
              document.body.classList.toggle('perf-lite', el.classList.contains('on'));
              showToast(el.classList.contains('on')
                ? '⚡ Đã tắt hiệu ứng kính mờ (0MB GPU cho Game)'
                : '💎 Đã bật lại khúc xạ Liquid Glass iOS 27');
            }

            function toggleFlorentino() {
              const btn = document.getElementById('btnFlo');
              const active = btn.textContent.includes('ĐÃ BẬT');
              if (active) {
                btn.textContent = '🌹 BẬT PROFILE MÚA FLORENTINO (0MS DELAY)';
                btn.className = 'btn-full btn-pink pressable';
                execShizuku('settings put secure long_press_timeout 400', '⚪ Đã tắt Profile Florentino');
              } else {
                btn.textContent = '🌸 ĐÃ BẬT PROFILE FLORENTINO (CHẠM ĐỂ TẮT)';
                btn.className = 'btn-full btn-green pressable';
                execShizuku(
                  'settings put secure long_press_timeout 150 && settings put secure multi_press_timeout 150 && settings put system pointer_speed 7 && settings put global block_untrusted_touches 0',
                  '🌹 Đã kích hoạt Múa Florentino 0ms (Chuẩn iPhone 17)!'
                );
              }
            }

            function fixCameraAndApps() {
              execShizuku(
                'pm enable com.android.camera && cmd appops reset',
                '🛠️ Đã khôi phục Camera & toàn bộ ứng dụng bị tắt!'
              );
            }

            function enableTurboTouch() {
              execShizuku(
                'settings put secure tap_duration_threshold 0.0 && settings put secure touch_blocking_period 0.0 && settings put system pointer_speed 7',
                '⚡ Đã kích hoạt Turbo 360Hz Touch 0ms!'
              );
            }

            function unlockCutDownFeatures() {
              execShizuku(
                'settings put system deviceLevelList v:1,c:3,g:3 && cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND ignore && am force-stop com.xiaomi.joyose && settings put secure speed_mode 1',
                '👑 Đã mở khóa Full tính năng Flagship (v:1,c:3,g:3) & chặn Joyose!'
              );
            }

            function toggleSimulatedDevice() {
              isSimulatedFlagship = !isSimulatedFlagship;
              const panel = document.getElementById('cutDownPanel');
              if (isSimulatedFlagship) {
                document.getElementById('deviceModelText').textContent = '📱 Thiết bị: XIAOMI 13 Flagship (Snapdragon 8 Gen 2)';
                document.getElementById('diagModel').textContent = 'Xiaomi 13 (Flagship)';
                document.getElementById('diagSoc').textContent = 'Snapdragon 8 Gen 2 (v:1,c:3,g:3)';
                panel.innerHTML = '<div style="font-size:12.5px; font-weight:800; color:#34d399;">✅ THIẾT BỊ FLAGSHIP (KHÔNG BỊ CẮT GIẢM HIỆU ỨNG)</div><div style="font-size:11.5px; color:#cbd5e1; margin-top:4px;">Máy đã mở sẵn 100% hoạt ảnh cấp cao. Khuyên dùng bật ANGLE Vulkan & khóa 120Hz LTPO.</div>';
                showToast('👑 Đang mô phỏng máy Flagship Xiaomi 13');
              } else {
                document.getElementById('deviceModelText').textContent = '📱 Thiết bị: XIAOMI Redmi Note 13 (Android 15)';
                document.getElementById('diagModel').textContent = 'Xiaomi Redmi Note 13';
                document.getElementById('diagSoc').textContent = 'Snapdragon 680 (Tier Cắt Giảm)';
                location.reload();
              }
            }

            function setPresetRes(w, h, dpi) {
              document.getElementById('inpW').value = w;
              document.getElementById('inpH').value = h;
              document.getElementById('inpDpi').value = dpi;
              applyResolution(true);
            }

            function applyResolution(isTest15s) {
              const w = document.getElementById('inpW').value;
              const h = document.getElementById('inpH').value;
              const dpi = document.getElementById('inpDpi').value;
              document.getElementById('resCurrentBadge').textContent = `${w}x${h} @ ${dpi}`;
              execShizuku(`wm size ${w}x${h} && wm density ${dpi}`, `🖥️ Đã áp dụng ${w}x${h} @ ${dpi} DPI`);

              clearInterval(revertTimer);
              const btn = document.getElementById('btnTest15s');
              if (isTest15s) {
                let sec = 15;
                btn.textContent = `⏳ Hoàn tác (${sec}s)`;
                revertTimer = setInterval(() => {
                  sec--;
                  btn.textContent = `⏳ Hoàn tác (${sec}s)`;
                  if (sec <= 0) {
                    clearInterval(revertTimer);
                    resetResolution();
                  }
                }, 1000);
              } else {
                btn.textContent = '⏱️ THỬ 15S';
              }
            }

            function resetResolution() {
              clearInterval(revertTimer);
              document.getElementById('btnTest15s').textContent = '⏱️ THỬ 15S';
              document.getElementById('inpW').value = 1080;
              document.getElementById('inpH').value = 2400;
              document.getElementById('inpDpi').value = 410;
              document.getElementById('resCurrentBadge').textContent = '1080x2400 @ 410';
              execShizuku('wm size reset && wm density reset', '🔄 Đã đưa màn hình về độ phân giải gốc 100%!');
            }

            function setRamPreset(mb, label) {
              document.getElementById('ramSlider').value = mb;
              onRamSliderChange(mb, label);
            }

            function onRamSliderChange(val, customLabel) {
              currentThreshold = parseInt(val, 10);
              const dau = customLabel || ('Đầu ' + (currentThreshold / 1000).toFixed(1) + 'x');
              document.getElementById('sliderValText').textContent = `${currentThreshold} MB (${dau})`;
              document.getElementById('ramBadgeText').textContent = `${currentThreshold} MB (${dau})`;
              document.getElementById('notifRamText').textContent = `RAM: ${currentRamUsed} MB / ${currentRamTotal} MB (Mốc: ${currentThreshold} MB • ${dau})`;
              if (window.BangBridge && window.BangBridge.setRamThreshold) {
                window.BangBridge.setRamThreshold(currentThreshold);
              }
            }

            function cleanRamNow() {
              currentRamUsed = Math.max(2450, currentRamUsed - 680);
              const dau = 'Đầu ' + (currentThreshold / 1000).toFixed(1) + 'x';
              document.getElementById('notifRamText').textContent = `RAM: ${currentRamUsed} MB / ${currentRamTotal} MB (Mốc: ${currentThreshold} MB • ${dau})`;
              document.getElementById('hudRamTop').textContent = `RAM: ${currentRamUsed}/${currentRamTotal}MB`;
              execShizuku('am kill-all && pm trim-caches 999G', `🚀 Đã giải phóng RAM về ${currentRamUsed} MB!`);
            }

            function runFullOptimization() {
              cleanRamNow();
              execShizuku(
                'cmd appops set com.xiaomi.joyose RUN_IN_BACKGROUND ignore && settings put system POWER_PERFORMANCE_MODE_OPEN 1 && settings put secure speed_mode 1',
                '🟢 BangOptimize Pro: Đã kích hoạt toàn bộ cấu hình chiến Game!'
              );
            }

            function restoreAllDefaults() {
              resetResolution();
              execShizuku(
                'settings put global window_animation_scale 1.0 && settings put global transition_animation_scale 1.0 && settings put global animator_duration_scale 1.0 && settings delete system peak_refresh_rate && settings delete system min_refresh_rate',
                '↺ Đã khôi phục toàn bộ cài đặt về Mặc định gốc NSX!'
              );
            }

            function requestShizukuPermission() {
              if (window.BangBridge && window.BangBridge.requestShizuku) {
                window.BangBridge.requestShizuku();
              }
              showToast('⚡ Đang kiểm tra kết nối Shizuku UID 2000...');
            }

            function scanHardwareNow() {
              if (window.BangBridge && window.BangBridge.refreshHardware) {
                window.BangBridge.refreshHardware();
              }
              showToast('🔍 Đã quét lại phần cứng & thông số thực tế!');
            }

            function exportBangConfig() {
              const code = `BANG-V8.1-PRO-${currentThreshold}MB-0MS`;
              if (navigator.clipboard) navigator.clipboard.writeText(code);
              showToast('📋 Đã sao chép mã: ' + code);
            }

            function openTelegram() {
              window.open('https://t.me/BangTechnology', '_blank');
            }

            window.receiveNativeDeviceInfo = function(data) {
              if (!data) return;
              currentRamTotal = data.totalRamMb || 5606;
              currentRamUsed = data.usedRamMb || 3963;
              document.getElementById('deviceModelText').textContent = `📱 Thiết bị: ${data.model} (${data.android})`;
              document.getElementById('diagModel').textContent = data.model;
              document.getElementById('diagRam').textContent = `${currentRamUsed}MB / ${currentRamTotal}MB`;
              document.getElementById('diagScreen').textContent = `1080x2400 • ${data.tempC}°C`;
              document.getElementById('glBat').textContent = `🔋 ${data.battery}%`;
              document.getElementById('glTemp').textContent = `🌡️ ${data.tempC}°C`;
              document.getElementById('hudTempTop').textContent = `${data.tempC}°C ▾`;
              document.getElementById('hudRamTop').textContent = `RAM: ${currentRamUsed}/${currentRamTotal}MB`;
              onRamSliderChange(currentThreshold);
              document.getElementById('shizukuText').textContent = data.shizukuReady
                ? '✅ Shizuku: Đã kết nối thật (UID 2000 Shell)'
                : '⚠️ Shizuku: Chạm vào đây để cấp quyền Shizuku';
            };
          </script>
          </body>
          </html>
          EOF

      - name: 4. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload BangOptimize APK
        uses: actions/upload-artifact@v4
        with:
          name: BangOptimize-v8.1-Pro-All-New
          path: app/build/outputs/apk/debug/app-debug.apk
