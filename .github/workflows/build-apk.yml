              const pIdx = presetPopularGames.findIndex(g => g.pkg === pkg);
              if (pIdx >= 0) presetPopularGames.splice(pIdx, 1);
              saveCustomGamesToStorage();
              renderGameHubList();
              showToast('Đã xóa khỏi Game Hub');
