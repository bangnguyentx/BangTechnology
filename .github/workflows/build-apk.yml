            // Đọc tên GPU Đồ họa thật trực tiếp từ phần cứng WebGL
            function detectHardwareGpu() {
              try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return { renderer: 'Adreno / Mali GPU', vendor: 'OpenGL ES 3.2' };
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) {
                  const renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || 'Hardware GPU';
                  const vendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || 'OpenGL ES 3.2';
                  return { renderer, vendor };
                }
              } catch (e) {}
              return { renderer: 'Qualcomm Adreno / ARM Mali', vendor: 'OpenGL ES 3.2' };
            }

            function hapticTick() {
              if (window.BangBridge && window.BangBridge.triggerHaptic) window.BangBridge.triggerHaptic();
            }

            function toggleLightDarkTheme() {
              hapticTick();
              document.body.classList.toggle('light-mode');
              showToast(document.body.classList.contains('light-mode') ? '☀️ Đã chuyển sang Giao diện Sáng' : '🌙 Đã chuyển sang Giao diện Tối');
            }

            // ================= 2. THANH VUỐT NGANG GAME SPACE NỔI (FLOATING SIDEBAR) =================
            function toggleNativeFloatingGameSidebar(el) {
              hapticTick();
              const targetOn = !el.classList.contains('on');
              el.classList.toggle('on', targetOn);
              if (window.BangBridge && window.BangBridge.toggleFloatingGameSidebar) {
                const msg = window.BangBridge.toggleFloatingGameSidebar(targetOn);
                appendLog(msg, 'GAME SPACE');
                showToast('🎮 ' + msg);
              } else {
                showToast(targetOn ? '🎮 Đã bật Thanh Vuốt Ngang Game Space Nổi!' : 'Đã tắt Thanh Game Space Nổi');
              }
            }

            // ================= 3. KHO 12 CÔNG CỤ CHIẾN GAME CHUYÊN SÂU =================
            const proGameTools = [
              { name: 'Tự động hoàn trả độ phân giải gốc khi thoát Game', desc: 'Khi đóng game quay về màn hình chính, tự trả lại độ phân giải 1080p và tốc độ con trỏ chuẩn', cmdOn: 'echo ok', cmdOff: 'echo ok', defaultOn: true, isAutoRestore: true },
              { name: 'Khóa cứng tần số quét tối đa trong Game', desc: 'Giữ màn hình ở mức 90Hz/120Hz liên tục khi giao tranh, chống tự tụt về 60Hz', cmdOn: 'settings put system peak_refresh_rate 120.0 && settings put system min_refresh_rate 90.0', cmdOff: 'settings delete system peak_refresh_rate && settings delete system min_refresh_rate' },
              { name: 'Giảm độ trễ chạm đa điểm (150ms Polling)', desc: 'Tăng tốc độ nhận diện thao tác vuốt chiêu và di chuyển tâm ngắm tức thì', cmdOn: 'settings put secure long_press_timeout 150 && settings put secure multi_press_timeout 150', cmdOff: 'settings put secure long_press_timeout 400' },
              { name: 'Tăng tốc độ vuốt tâm cực đại (Pointer +7)', desc: 'Đưa độ nhạy phản hồi con trỏ cảm ứng lên ngưỡng cao nhất cho game MOBA & FPS', cmdOn: 'settings put system pointer_speed 7', cmdOff: 'settings put system pointer_speed 0' },
              { name: 'Chặn thông báo nổi làm phiền khi đang Combat', desc: 'Tắt biểu ngữ thông báo thả xuống che mất bản đồ nhỏ khi đang trong trận đấu', cmdOn: 'settings put global heads_up_notifications_enabled 0', cmdOff: 'settings put global heads_up_notifications_enabled 1' },
              { name: 'Khóa độ sáng màn hình cố định khi chơi Game', desc: 'Ngăn cảm biến tự động giảm độ sáng đột ngột khi ngón tay che cảm biến hoặc khi máy ấm', cmdOn: 'settings put system screen_brightness_mode 0', cmdOff: 'settings put system screen_brightness_mode 1' },
              { name: 'Biên dịch mã thực thi Game tốc độ cao (AOT)', desc: 'Tối ưu hóa trước các gói dữ liệu Liên Quân, Free Fire, PUBG giúp vào trận nhanh hơn', cmdOn: 'cmd package compile -m speed-profile -f com.garena.game.kgvn', cmdOff: 'echo ok' },
              { name: 'Kích hoạt Android Game Mode Performance API', desc: 'Bật giao thức ưu tiên phần cứng trò chơi chính chủ trên Android 12 đến Android 16', cmdOn: 'cmd game mode performance com.garena.game.kgvn', cmdOff: 'cmd game mode standard com.garena.game.kgvn' },
              { name: 'Giải phóng bộ đệm đồ họa (Shader Cache Trim)', desc: 'Dọn sạch rác bộ nhớ đệm đồ họa trước khi vào trận để tránh giật khựng khung hình', cmdOn: 'pm trim-caches 999G', cmdOff: 'echo ok' },
              { name: 'Tắt thao tác vuốt nhầm 3 ngón chụp màn hình', desc: 'Tránh bị đứng hình do vô tình vuốt 3 ngón tay khi đang múa kỹ năng liên tục', cmdOn: 'settings put system three_gesture_screenshot 0', cmdOff: 'settings put system three_gesture_screenshot 1' },
              { name: 'Ưu tiên luồng âm thanh độ trễ thấp', desc: 'Giảm độ trễ tiếng bước chân và hiệu ứng kỹ năng qua tai nghe Bluetooth & loa ngoài', cmdOn: 'settings put system sound_effects_enabled 0', cmdOff: 'settings put system sound_effects_enabled 1' },
              { name: 'Thu hồi tiến trình nền trước khi vào trận', desc: 'Đóng các ứng dụng ngầm ngốn RAM mà vẫn giữ nguyên Zalo, Messenger và kết nối Bluetooth', cmdOn: 'am kill-all', cmdOff: 'echo ok' }
            ];

            function renderProGameTools() {
              const box = document.getElementById('proGameToolsList');
              box.innerHTML = proGameTools.map(item => `
                <div class="tweak-item ${item.defaultOn ? 'active-on' : ''}">
