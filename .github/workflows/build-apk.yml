                  }?.start()

                  Thread {
                      // Ghép chuỗi lệnh tap cách nhau 45ms trong 1 phiên shell duy nhất để đạt tốc độ cực đại và không làm khựng cảm ứng
                      val cmdBuilder = StringBuilder()
                      pts.forEachIndexed { idx, (x, y) ->
                          if (idx > 0) cmdBuilder.append(" && sleep 0.045 && ")
                          cmdBuilder.append("input tap $x $y")
                      }
                      ShizukuEngine.executeShizukuStrict(cmdBuilder.toString())
                  }.start()
              }

