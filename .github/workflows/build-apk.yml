              private fun executeDoubleTapMacroNonBlocking() {
                  val pts = getSavedMacroPoints()
                  Toast.makeText(this, "⚡ Đang chạy Macro Bán Đồ Nhanh (${pts.size} chạm)...", Toast.LENGTH_SHORT).show()
                  floatingOrbView?.animate()?.scaleX(1.26f)?.scaleY(1.26f)?.setDuration(110)?.withEndAction {
