                </p>
                <button class="btn-shield-emerald press-phys" onclick="triggerAntiOtgRescueNow()">
                  Quét & Gỡ sạch lệnh gây treo ngay (Anti-OTG Rescue)
                </button>
              </section>

              <!-- Cấp độ tối ưu hóa -->
              <section class="obsidian-glass">
                <div class="section-head-row">
                  <span class="section-title">Cấp độ tối ưu hóa hệ thống</span>
                  <span class="section-caption" id="animLabel">Mặc định (Chưa bật)</span>
                </div>
                <div class="flat-list">
                  <div class="flat-row press-phys" onclick="selectOptLevel('1.0', 'Smooth · 1.0x Mát máy')">
                    <div>
                      <div class="row-main-title">Smooth · Cân bằng và mát máy</div>
                      <div class="row-sub-desc">Hoạt ảnh 1.0x chuẩn, giải phóng bộ nhớ đệm nhẹ</div>
                    </div>
                    <span class="spec-badge">1.0x</span>
                  </div>
                  <div class="flat-row press-phys" onclick="selectOptLevel('0.5', 'Medium · 0.5x Khuyên dùng')">
                    <div>
                      <div class="row-main-title">Medium · Tối ưu tốc độ phản hồi</div>
                      <div class="row-sub-desc">Hoạt ảnh 0.5x mượt nhanh, bảo toàn ứng dụng Whitelist</div>
                    </div>
                    <span class="spec-badge">0.5x</span>
                  </div>
                  <div class="flat-row press-phys" onclick="selectOptLevel('0.0', 'Performance · 0x eSports')">
                    <div>
                      <div class="row-main-title">Performance · Ưu tiên FPS tối đa</div>
