                      Pair((w * 0.28f).toInt(), (h * 0.32f).toInt()),
                      Pair((w * 0.88f).toInt(), (h * 0.14f).toInt())
                  )
              }

              private fun saveMacroPoints(pts: List<Pair<Int, Int>>) {
                  val arr = JSONArray()
