                      <div class="tweak-title">${item.name}</div>
                      <div class="tweak-desc">${item.desc}</div>
                    </div>
                    <div class="v14-switch ${item.defaultOn ? 'on' : ''}" onclick="${item.isAutoRestore ? 'toggleAutoRestoreGame(this)' : `toggleCleanSwitch(this, '${item.cmdOn}', '${item.cmdOff}', '${item.name}')`}"></div>
                  </div>
                </div>
              `).join('');
            }

            // ================= 4. CHUYÊN MỤC ĐA HÃNG OS CAO (HYPEROS 3-4, COLOROS 16-17, ORIGINOS 6-7, ONEUI 7-8) =================
            const oemProfiles = {
