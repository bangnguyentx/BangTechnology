              private fun getSavedMacroPoints(): List<Pair<Int, Int>> {
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels
                  val h = dm.heightPixels
                  val prefs = getSharedPreferences("bang_macro_v19", Context.MODE_PRIVATE)
                  val raw = prefs.getString("points_json", "") ?: ""
                  if (raw.isNotEmpty()) {
                      try {
                          val arr = JSONArray(raw)
                          val list = ArrayList<Pair<Int, Int>>()
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              list.add(Pair(o.getInt("x"), o.getInt("y")))
                          }
                          if (list.isNotEmpty()) return list
                      } catch (_: Throwable) {}
                  }
                  // Tọa độ mặc định chuẩn cho Bán đồ / Mua nhanh MOBA (Mở Shop -> Chọn món -> Bán -> Mua món đầu -> Đóng Shop)
                  return listOf(
