              // Animation Thu Nhỏ Bảng Kính Lỏng Ngược Về Lại Logo Tròn Nhỏ (380ms)
              private fun closeGamePanel(animated: Boolean = true, onClosed: (() -> Unit)? = null) {
                  val target = panelView ?: run {
                      onClosed?.invoke()
                      return
                  }
                  if (!animated) {
                      try { windowManager?.removeView(target) } catch (_: Throwable) {}
                      panelView = null
                      isClosingPanel = false
                      onClosed?.invoke()
                      return
                  }
                  if (isClosingPanel) return
                  isClosingPanel = true

                  val screenW = resources.displayMetrics.widthPixels
                  val orbX = orbParams?.x ?: (screenW - dp(50))
                  val exitTransX = if (orbX > screenW / 2) dp(55).toFloat() else -dp(55).toFloat()

                  target.animate()
                      .alpha(0f)
                      .translationX(exitTransX)
                      .scaleX(0.68f)
                      .scaleY(0.68f)
                      .setInterpolator(AccelerateDecelerateInterpolator())
                      .setDuration(380)
                      .withEndAction {
                          try { windowManager?.removeView(target) } catch (_: Throwable) {}
                          if (panelView === target) panelView = null
                          isClosingPanel = false
                          // Hiện lại Logo tròn nhỏ với hiệu ứng nảy đàn hồi
                          floatingOrbView?.animate()
                              ?.alpha(0.95f)
                              ?.scaleX(1f)
                              ?.scaleY(1f)
                              ?.setInterpolator(OvershootInterpolator(1.18f))
                              ?.setDuration(360)
                              ?.withEndAction {
                                  handler.removeCallbacks(idleDimRunnable)
                                  handler.postDelayed(idleDimRunnable, 3200L)
                              }
                              ?.start()
                          onClosed?.invoke()
                      }
                      .start()
              }

