                      <option value="120Hz · 0ms Touch + AOT">120Hz · 0ms Touch + AOT</option>
                      <option value="90Hz · Pointer +7 Nhạy tâm">90Hz · Pointer +7 Nhạy tâm</option>
                      <option value="Hạ nhiệt · Ổn định FPS">Hạ nhiệt · Ổn định FPS</option>
