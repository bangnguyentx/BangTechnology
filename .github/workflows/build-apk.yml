name: Build BangOptimize v19.0 OriginOS7 Fire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Clean & Generate BangOptimize v19.0 OriginOS 7 + Apple Liquid Glass Project
        shell: bash
        run: |
          set -e
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/aidl/com/bangtech/optimize
          mkdir -p app/src/main/java/com/bangtech/optimize
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-anydpi-v26

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "BangOptimize"
          include(":app")
          EOF

          # 3. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bangtech.optimize"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bangtech.optimize"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = 190
                  versionName = "19.0 OriginOS7 Fire"
              }

              buildFeatures {
                  aidl = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          # 5. Icon "Bình Công Nghệ" (Phiên bản Mệnh Hỏa Đỏ Anh Túc & Xanh Băng)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0302" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#140706" android:pathData="M8,8h92v92h-92z"/>
              <path android:strokeColor="#2A1210" android:strokeWidth="1" android:pathData="M0,27L108,27M0,54L108,54M0,81L108,81M27,0L27,108M54,0L54,108M81,0L81,108"/>
              <path android:strokeColor="#E20A21" android:strokeAlpha="0.45" android:strokeWidth="2" android:pathData="M18,18h72v72h-72z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#B3F50B" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M34,42 H25 V66 H34" />
              <path android:fillColor="#00000000" android:strokeColor="#E20A21" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M74,42 H83 V66 H74" />
              <path android:fillColor="#1E1414" android:strokeColor="#94A3B8" android:strokeWidth="1.5"
                  android:pathData="M36,74 H72 L75,82 H33 Z" />
              <path android:fillColor="#1C0A0C" android:strokeColor="#F42902" android:strokeWidth="2.4"
                  android:pathData="M36,38 H72 V74 H36 Z" />
              <path android:fillColor="#E20A21" android:fillAlpha="0.28"
                  android:pathData="M40,42 H68 V70 H40 Z" />
              <path android:fillColor="#0A0302" android:strokeColor="#B3F50B" android:strokeWidth="2.2"
                  android:pathData="M44,56 A10,10 0 1,0 64,56 A10,10 0 1,0 44,56 Z" />
              <path android:fillColor="#FDFDFC"
                  android:pathData="M55.5,48 L49,56.5 H54 L52.5,64 L59.5,55 H54.5 Z" />
              <path android:fillColor="#331A1A" android:strokeColor="#CBE7FC" android:strokeWidth="1.6"
                  android:pathData="M34,38 C34,31 74,31 74,38 Z" />
              <path android:fillColor="#1E1212" android:strokeColor="#E20A21" android:strokeWidth="1.8"
                  android:pathData="M44,24 H64 V32 H44 Z" />
              <path android:fillColor="#B3F50B" android:pathData="M48,27 h3 v2.5 h-3 z M57,27 h3 v2.5 h-3 z" />
          </vector>
          EOF

          cp app/src/main/res/drawable/ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher.xml

          cat << 'EOF' > app/src/main/res/drawable-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="BangOptimize"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BangGameSidebarService"
                      android:exported="false" />

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # 7. IShellService.aidl
          cat << 'EOF' > app/src/main/aidl/com/bangtech/optimize/IShellService.aidl
          package com.bangtech.optimize;

          interface IShellService {
              void destroy();
              String runCommand(String cmd);
          }
          EOF

          # 8. ShellUserService.kt
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/ShellUserService.kt
          package com.bangtech.optimize

          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit
          import kotlin.system.exitProcess

          class ShellUserService : IShellService.Stub() {
              override fun destroy() {
                  exitProcess(0)
              }

              override fun runCommand(cmd: String): String {
                  if (cmd.contains("angle_gl_driver_all_angle 1") ||
                      cmd.contains("cached_apps_freezer enabled") ||
                      cmd.contains("bluetooth_on 0") ||
                      cmd.contains("service call bluetooth_manager 8")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Đã chặn tự động bởi Lá chắn Anti-OTG & Bảo vệ Bluetooth")
                      }.toString()
                  }
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", cmd))
                      process.waitFor(3500, TimeUnit.MILLISECONDS)
                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText().trim()
                      val code = try { process.exitValue() } catch (_: Throwable) { 0 }
                      JSONObject().apply {
                          put("exitCode", code)
                          put("out", out)
                          put("err", err)
                      }.toString()
                  } catch (e: Throwable) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", e.message ?: "Unknown Shizuku error")
                      }.toString()
                  }
              }
          }
          EOF

          # 9. ShizukuEngine.kt (Sửa triệt để lỗi HyperOS 3 báo "Shizuku chưa chạy" + Ẩn ADB 5 Lớp Siêu Khó Phát Hiện)
          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/ShizukuEngine.kt
          package com.bangtech.optimize

          import android.content.ComponentName
          import android.content.Context
          import android.content.ServiceConnection
          import android.content.pm.PackageManager
          import android.os.IBinder
          import android.os.SystemClock
          import android.provider.Settings
          import org.json.JSONObject
          import rikka.shizuku.Shizuku
          import rikka.shizuku.ShizukuRemoteProcess
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit

          object ShizukuEngine {
              @Volatile
              var shellService: IShellService? = null
              @Volatile
              var isStealthVneidActive: Boolean = false

              private val userServiceArgs = Shizuku.UserServiceArgs(
                  ComponentName("com.bangtech.optimize", ShellUserService::class.java.name)
              ).daemon(false).processNameSuffix("bang_shizuku_shell").debuggable(false).version(190)

              private val serviceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      shellService = IShellService.Stub.asInterface(binder)
                      MainActivity.notifyShizukuUpdated()
                  }

                  override fun onServiceDisconnected(name: ComponentName?) {
                      shellService = null
                      MainActivity.notifyShizukuUpdated()
                  }
              }

              fun isShizukuRunning(): Boolean {
                  return try { Shizuku.pingBinder() } catch (_: Throwable) { false }
              }

              fun isShizukuAuthorized(): Boolean {
                  return try {
                      isShizukuRunning() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (_: Throwable) { false }
              }

              // SỬA LỖI HYPEROS 3: Ngay khi Shizuku đang chạy và đã cấp quyền thì báo Sẵn sàng 100% (Không bị kẹt trạng thái chờ bindUserService)
              fun isReady(): Boolean = isShizukuAuthorized()

              fun statusLabel(): String {
                  return when {
                      !isShizukuRunning() -> "Shizuku chưa chạy"
                      !isShizukuAuthorized() -> "Chưa cấp quyền Shizuku"
                      else -> "Đã kết nối Shizuku (UID 2000)"
                  }
              }

              fun bindServiceIfPossible() {
                  try {
                      if (isShizukuAuthorized() && shellService == null) {
                          Shizuku.bindUserService(userServiceArgs, serviceConnection)
                      }
                  } catch (_: Throwable) {}
              }

              // Thực thi trực tiếp qua Shizuku.newProcess khi UserService trên HyperOS 3 chưa kịp bind
              private fun runViaShizukuNewProcess(cmd: String): String? {
                  return try {
                      val m = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      m.isAccessible = true
                      val proc = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as? ShizukuRemoteProcess ?: return null
                      proc.waitFor(3500, TimeUnit.MILLISECONDS)
                      val out = BufferedReader(InputStreamReader(proc.inputStream)).readText().trim()
                      val err = BufferedReader(InputStreamReader(proc.errorStream)).readText().trim()
                      val code = try { proc.exitValue() } catch (_: Throwable) { 0 }
                      JSONObject().apply {
                          put("exitCode", code)
                          put("out", out)
                          put("err", err)
                      }.toString()
                  } catch (_: Throwable) {
                      null
                  }
              }

              fun readSettingFromOs(context: Context, namespace: String, key: String): String {
                  try {
                      val cr = context.contentResolver
                      val v = when (namespace.lowercase()) {
                          "system" -> Settings.System.getString(cr, key)
                          "secure" -> Settings.Secure.getString(cr, key)
                          "global" -> Settings.Global.getString(cr, key)
                          else -> null
                      }
                      if (!v.isNullOrEmpty() && v != "null") return v.trim()
                  } catch (_: Throwable) {}

                  if (isShizukuAuthorized()) {
                      try {
                          val raw = shellService?.runCommand("settings get $namespace $key")
                              ?: runViaShizukuNewProcess("settings get $namespace $key")
                              ?: ""
                          if (raw.isNotEmpty()) {
                              val j = JSONObject(raw)
                              val out = j.optString("out", "").trim()
                              if (out.isNotEmpty() && out != "null") return out
                          }
                      } catch (_: Throwable) {}
                  }
                  return ""
              }

              fun saveOriginalValueIfAbsent(context: Context, stateKey: String, currentVal: String) {
                  if (stateKey.isEmpty()) return
                  val prefs = context.getSharedPreferences("bang_orig_backup_v19", Context.MODE_PRIVATE)
                  if (!prefs.contains(stateKey) && currentVal.isNotEmpty()) {
                      prefs.edit().putString(stateKey, currentVal).apply()
                  }
              }

              fun getBackedUpOriginalValue(context: Context, stateKey: String, defaultFallback: String): String {
                  if (stateKey.isEmpty()) return defaultFallback
                  val prefs = context.getSharedPreferences("bang_orig_backup_v19", Context.MODE_PRIVATE)
                  return prefs.getString(stateKey, defaultFallback) ?: defaultFallback
              }

              fun saveToggleMemory(context: Context, itemId: String, isOn: Boolean) {
                  context.getSharedPreferences("bang_toggle_mem_v19", Context.MODE_PRIVATE)
                      .edit().putBoolean(itemId, isOn).apply()
              }

              fun getToggleMemory(context: Context, itemId: String, defVal: Boolean = false): Boolean {
                  return context.getSharedPreferences("bang_toggle_mem_v19", Context.MODE_PRIVATE)
                      .getBoolean(itemId, defVal)
              }

              fun executeShizukuStrict(cmd: String): JSONObject {
                  if (cmd.contains("angle_gl_driver_all_angle 1") ||
                      cmd.contains("cached_apps_freezer enabled") ||
                      cmd.contains("bluetooth_on 0") ||
                      cmd.contains("service call bluetooth_manager 8")) {
                      return JSONObject().apply {
                          put("exitCode", -99)
                          put("out", "")
                          put("err", "Đã chặn tự động bởi Lá chắn Anti-OTG & Bảo vệ Bluetooth")
                      }
                  }
                  if (!isShizukuRunning()) {
                      return JSONObject().apply {
                          put("exitCode", -2)
                          put("out", "")
                          put("err", "Ứng dụng Shizuku chưa chạy! Hãy mở Shizuku và bấm Start trước.")
                          put("needShizuku", true)
                      }
                  }
                  if (!isShizukuAuthorized()) {
                      return JSONObject().apply {
                          put("exitCode", -3)
                          put("out", "")
                          put("err", "Chưa cấp quyền Shizuku cho BangOptimize! Hãy bấm 'Cấp quyền Shizuku'.")
                          put("needShizuku", true)
                      }
                  }

                  if (shellService == null) {
                      bindServiceIfPossible()
                  }

                  return try {
                      // Ưu tiên 1: Chạy qua UserService; Ưu tiên 2 (Cho HyperOS 3-4): Chạy trực tiếp qua Shizuku.newProcess
                      val rawStr = shellService?.runCommand(cmd)
                          ?: runViaShizukuNewProcess(cmd)
                          ?: run {
                              SystemClock.sleep(250)
                              shellService?.runCommand(cmd) ?: """{"exitCode":-1,"out":"","err":"Đang đồng bộ Shizuku binder"}"""
                          }

                      val j = JSONObject(rawStr)
                      val code = j.optInt("exitCode", -1)
                      val out = j.optString("out", "")
                      val err = j.optString("err", "")

                      val hasPermError = code != 0 ||
                              err.contains("SecurityException", true) ||
                              err.contains("Permission denial", true) ||
                              err.contains("does not have permission", true) ||
                              err.contains("Failure", true) ||
                              out.contains("SecurityException", true)

                      if (hasPermError) {
                          val cleanReason = when {
                              err.contains("WRITE_SECURE_SETTINGS", true) || err.contains("SecurityException", true) ->
                                  "ROM chặn quyền ghi! Trên máy Xiaomi/Redmi hãy bật thêm 'Gỡ lỗi USB (Cài đặt bảo mật)' trong Tùy chọn nhà phát triển."
                              err.contains("Unknown package", true) || err.contains("not found", true) ->
                                  "Dòng máy này không có gói dịch vụ trên (Không hỗ trợ)."
                              err.isNotEmpty() ->
                                  "Hệ thống từ chối: " + err.lines().firstOrNull()?.take(90)
                              else ->
                                  "Không thể ghi vào hệ thống (Mã trả về: $code)"
                          }
                          JSONObject().apply {
                              put("exitCode", if (code == 0) -1 else code)
                              put("out", out)
                              put("err", cleanReason)
                          }
                      } else {
                          JSONObject().apply {
                              put("exitCode", 0)
                              put("out", out)
                              put("err", "")
                          }
                      }
                  } catch (e: Throwable) {
                      JSONObject().apply {
                          put("exitCode", -1)
                          put("out", "")
                          put("err", "Lỗi Shizuku IPC: ${e.message}")
                      }
                  }
              }

              fun scanFullDeviceStateJson(context: Context): JSONObject {
                  val states = JSONObject()
                  val keysToScan = listOf(
                      "global:window_animation_scale",
                      "global:transition_animation_scale",
                      "global:animator_duration_scale",
                      "system:peak_refresh_rate",
                      "system:min_refresh_rate",
                      "secure:long_press_timeout",
                      "secure:multi_press_timeout",
                      "system:pointer_speed",
                      "global:heads_up_notifications_enabled",
                      "system:screen_brightness_mode",
                      "system:three_gesture_screenshot",
                      "system:sound_effects_enabled",
                      "system:haptic_feedback_enabled",
                      "system:lockscreen_sounds_enabled",
                      "system:accelerometer_rotation",
                      "system:screen_off_timeout",
                      "system:status_bar_show_battery_percent",
                      "system:deviceLevelList",
                      "system:POWER_PERFORMANCE_MODE_OPEN",
                      "secure:speed_mode",
                      "system:monster_mode",
                      "system:pem_performance_mode",
                      "global:vivo_screen_refresh_rate_mode",
                      "system:high_performance_mode_on",
                      "secure:game_auto_temperature_control",
                      "global:sem_enhanced_cpu_responsiveness",
                      "global:restricted_device_performance",
                      "global:private_dns_mode",
                      "global:private_dns_specifier",
                      "secure:location_mode",
                      "global:wifi_scan_always_enabled",
                      "global:ble_scan_always_enabled",
                      "global:wifi_sleep_policy",
                      "global:mobile_data_always_on",
                      "secure:wake_gesture_enabled",
                      "secure:doze_enabled",
                      "secure:doze_always_on",
                      "global:send_action_app_error",
                      "global:power_button_long_press",
                      "global:ota_disable_automatic_update",
                      "global:disable_window_blurs",
                      "global:low_power",
                      "global:cached_apps_freezer",
                      "global:adb_enabled",
                      "global:development_settings_enabled",
                      "secure:double_tap_to_wake",
                      "secure:contrast_level",
                      "system:vibrate_when_ringing",
                      "global:wifi_wakeup_available",
                      "global:adb_allowed_connection_time",
                      "global:charging_sounds_enabled",
                      "global:charging_vibration_enabled",
                      "secure:accessibility_display_magnification_enabled",
                      "system:dtmf_tone",
                      "global:emergency_tone",
                      "global:stay_on_while_plugged_in",
                      "system:font_scale",
                      "secure:notification_badging",
                      "secure:spell_checker_enabled",
                      "secure:autofill_service",
                      "global:wifi_watchdog_poor_network_test_enabled",
                      "global:wifi_networks_available_notification_on",
                      "global:assisted_gps_enabled",
                      "secure:anr_show_background",
                      "global:always_finish_activities"
                  )
                  for (entry in keysToScan) {
                      val parts = entry.split(":")
                      if (parts.size == 2) {
                          val v = readSettingFromOs(context, parts[0], parts[1])
                          states.put(entry, v)
                      }
                  }

                  val memObj = JSONObject()
                  val memPrefs = context.getSharedPreferences("bang_toggle_mem_v19", Context.MODE_PRIVATE)
                  for ((k, v) in memPrefs.all) {
                      if (v is Boolean) memObj.put(k, v)
                  }
                  states.put("_savedMemory", memObj)
                  return states
              }

              fun runSafeGraphicRescue(): String {
                  val rescueScript = "settings delete global angle_gl_driver_all_angle; settings delete global angle_gl_driver_selection_pkgs; settings delete global angle_gl_driver_selection_values; settings put global cached_apps_freezer disabled; settings put global bluetooth_on 1; wm size reset; wm density reset"
                  executeShizukuStrict(rescueScript)
                  return "Đã gỡ sạch lệnh gây treo & khôi phục màn hình gốc qua Shizuku!"
              }

              // ẨN ADB 5 LỚP SIÊU KHÓ PHÁT HIỆN MỚI NHẤT CHO VNeID & NGÂN HÀNG
              fun setStealthHideAdbForVneid(context: Context, enableStealth: Boolean): JSONObject {
                  val cmd = if (enableStealth) {
                      "settings put global adb_enabled 0 && settings put global development_settings_enabled 0 && settings put global verifier_verify_adb_installs 0 && settings put global adb_wifi_enabled 0 && settings put global send_action_app_error 0"
                  } else {
                      "settings put global development_settings_enabled 1 && settings put global adb_enabled 1 && settings put global verifier_verify_adb_installs 1"
                  }
                  val res = executeShizukuStrict(cmd)
                  val actualAfter = readSettingFromOs(context, "global", "adb_enabled")
                  val targetVal = if (enableStealth) "0" else "1"

                  return if (res.optInt("exitCode", -1) == 0 && (actualAfter == targetVal || actualAfter.isEmpty())) {
                      isStealthVneidActive = enableStealth
                      saveToggleMemory(context, "deep_stealth_vneid", enableStealth)
                      JSONObject().apply {
                          put("ok", true)
                          put("msg", if (enableStealth) "Đã kích hoạt Ẩn ADB 5 Lớp Siêu Cấp (Vào VNeID & Ngân hàng tuyệt đối không bị phát hiện)" else "Đã bật lại hiển thị ADB & Tùy chọn nhà phát triển")
                      }
                  } else {
                      JSONObject().apply {
                          put("ok", false)
