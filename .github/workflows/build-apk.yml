          cat << 'EOF' > app/src/main/java/com/bangtech/optimize/BangGameSidebarService.kt
          package com.bangtech.optimize

          import android.app.ActivityManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit

          class BangGameSidebarService : Service() {
              private var windowManager: WindowManager? = null
              private var edgeHandleView: View? = null
              private var panelView: View? = null
              private var crosshairView: View? = null
              private var miniHudView: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isOverlayVisible = false
              private var isCrosshairEnabled = false
              private var isMiniHudEnabled = false
              private var isRes720p = false

              companion object {
                  val watchedGamePackages = HashSet<String>(
                      listOf(
                          "com.garena.game.kgvn", "com.dts.freefiremax", "com.dts.freefireth",
                          "com.vng.pubgmobile", "com.tencent.ig", "com.roblox.client",
                          "com.miHoYo.GenshinImpact", "com.proxima.dfm", "com.riotgames.league.wildrift",
                          "com.mobile.legends", "com.supercell.clashofclans", "com.supercell.brawlstars",
                          "com.garena.game.codm", "com.ea.gp.fifamobile", "jp.konami.pesam"
                      )
                  )
              }

              // Tự động kiểm tra ứng dụng đang mở trên màn hình để hiện Game Space khi mở game từ bên ngoài
              private val foregroundWatcherRunnable = object : Runnable {
                  override fun run() {
                      checkForegroundAppAndToggleSidebar()
                      if (isMiniHudEnabled) updateMiniHudText()
                      handler.postDelayed(this, 2500L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  handler.postDelayed(foregroundWatcherRunnable, 1500L)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action ?: "ACTION_WATCHER"
                  when (action) {
                      "ACTION_WATCHER" -> {
                          // Khi mới bật công tắc trong BangOptimize: ẩn thanh nổi, chỉ chạy ngầm chờ vào Game!
                          hideGameSpaceHandle()
                      }
                      "ACTION_GAME_LAUNCHED" -> {
                          val pkg = intent?.getStringExtra("game_pkg") ?: ""
                          if (pkg.isNotEmpty()) watchedGamePackages.add(pkg)
                          // Hiện ngay thanh vuốt ngang Game Space khi người dùng bấm mở game!
                          handler.postDelayed({ showGameSpaceHandle() }, 600L)
                      }
                      "ACTION_HIDE_IN_APP" -> {
                          // Khi người dùng quay lại trong ứng dụng BangOptimize thì tạm ẩn đi
                          hideGameSpaceHandle()
                      }
                  }
                  return START_STICKY
              }

              private fun checkForegroundAppAndToggleSidebar() {
                  Thread {
                      var fgPkg = ""
                      try {
                          val p = Runtime.getRuntime().exec(arrayOf("sh", "-c", "dumpsys window displays | grep -E 'mCurrentFocus|mFocusedApp'"))
                          p.waitFor(700, TimeUnit.MILLISECONDS)
                          val out = BufferedReader(InputStreamReader(p.inputStream)).readText()
                          for (gamePkg in watchedGamePackages) {
                              if (out.contains(gamePkg)) {
                                  fgPkg = gamePkg
                                  break
                              }
                          }
                          if (out.contains("com.bangtech.optimize")) {
                              fgPkg = "BANG_APP"
                          }
                      } catch (_: Throwable) {}

                      handler.post {
                          if (fgPkg == "BANG_APP") {
                              hideGameSpaceHandle()
                          } else if (fgPkg.isNotEmpty()) {
                              showGameSpaceHandle()
                          }
                      }
                  }.start()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun overlayType(): Int {
                  return if (Build.VERSION.SDK_INT >= 26) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }
              }

              private fun showGameSpaceHandle() {
                  if (isOverlayVisible || edgeHandleView != null) return
                  try {
                      val params = WindowManager.LayoutParams(
                          dp(28),
                          dp(116),
                          overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.END or Gravity.CENTER_VERTICAL
                          x = 0
                          y = -dp(35)
                      }

                      val handle = TextView(this).apply {
                          text = "🎮\n⚡"
                          textSize = 11.5f
                          gravity = Gravity.CENTER
                          setTextColor(Color.WHITE)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#DD0B111E"))
                              setStroke(dp(1), Color.parseColor("#CC38BDF8"))
                              cornerRadii = floatArrayOf(
                                  dp(14).toFloat(), dp(14).toFloat(),
                                  0f, 0f,
                                  0f, 0f,
                                  dp(14).toFloat(), dp(14).toFloat()
                              )
                          }
                      }

                      var initialY = 0
                      var touchY = 0f
                      var moved = false

                      handle.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialY = params.y
                                  touchY = ev.rawY
                                  moved = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dy = (ev.rawY - touchY).toInt()
                                  if (kotlin.math.abs(dy) > dp(8)) moved = true
                                  params.y = initialY + dy
                                  try { windowManager?.updateViewLayout(handle, params) } catch (_: Throwable) {}
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) toggleGamePanel()
                                  true
                              }
                              else -> false
                          }
                      }

                      edgeHandleView = handle
                      windowManager?.addView(handle, params)
                      isOverlayVisible = true
                  } catch (_: Throwable) {}
              }

              private fun hideGameSpaceHandle() {
                  closeGamePanel()
                  edgeHandleView?.let {
                      try { windowManager?.removeView(it) } catch (_: Throwable) {}
                      edgeHandleView = null
                  }
                  isOverlayVisible = false
              }

              // Tính năng Tâm ngắm ảo (Crosshair Overlay giữa màn hình cho PUBG / Free Fire / Delta Force)
